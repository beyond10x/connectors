[workspace]
resolver = "2"
# Specification-only adapters have no Cargo package until implemented.
members = ["crates/*", "adapters/catalog", "adapters/kubernetes", "adapters/sql", "apps/connectors"]
exclude = ["apps/connectors-cli-contract"]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
connectors_cli_contract = { package = "connectors-cli-contract", path = "apps/connectors-cli-contract" }
connectors-core = { path = "crates/connectors-core" }
connectors-contracts = { path = "crates/connectors-contracts" }
connectors-sdk = { path = "crates/connectors-sdk" }
connectors-client = { path = "crates/connectors-client" }
connectors-host = { path = "crates/connectors-host" }
entity-core = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.19.0" }
entity-eventlog = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.19.0", features = ["sqlite", "sync-bridge"] }
entity-executor = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.19.0" }
entity-store = { git = "https://github.com/beyond10x/entity-runtime", tag = "0.19.0" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", rev = "ac6b1731654329d32f1e3c9cf164fefad6a5b46a" }
ess-compiler = { git = "https://github.com/beyond10x/ess", rev = "308a6d10273e074621f2bd797be0853fe9b94580" }
ess-domain = { git = "https://github.com/beyond10x/ess", rev = "308a6d10273e074621f2bd797be0853fe9b94580" }
ess-entity-runtime = { git = "https://github.com/beyond10x/ess", rev = "308a6d10273e074621f2bd797be0853fe9b94580" }
ess-service-contract = { git = "https://github.com/beyond10x/ess", rev = "308a6d10273e074621f2bd797be0853fe9b94580" }
ess-synth = { git = "https://github.com/beyond10x/ess", rev = "308a6d10273e074621f2bd797be0853fe9b94580" }
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonschema = { version = "0.33", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[profile.dev]
opt-level = 1
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false

[profile.test]
opt-level = 1
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false
