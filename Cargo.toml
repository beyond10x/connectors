[workspace]
# **MSRV-aware dependency resolution.** Carried from the predecessor (its C-213), and design 02 §7
# item 7 states it as a fence: under `resolver = "2"` cargo picked the newest semver-compatible
# release of every requirement and never read what Rust version it declared, so a caret requirement
# could resolve to a release above this workspace's MSRV with nothing saying so. `resolver = "3"`
# prefers the newest version whose declared `rust-version` this workspace satisfies.
#
# It is a *preference*, not a constraint: if a requirement's whole range declares too high an MSRV,
# cargo resolves it anyway and only warns. `crates/catalog-build/tests/main/msrv_fence.rs` is what
# **fails** on that, and it also names the gap between the declared MSRV and the toolchain anything
# is actually built on, rather than letting the resolver imply coverage that does not exist.
resolver = "3"
members = [
    # The catalog family (design 02 §2). Engine-free by construction: no `codewandler-flux-*` crate
    # appears anywhere in this workspace's resolved graph, and
    # `crates/catalog-build/tests/main/engine_free.rs` asserts that over the whole graph rather than
    # over this comment.
    "crates/connector-address",
    "crates/connector-spec",
    "crates/catalog-reader",
    "crates/catalog",
    "crates/connector-resolve",
    "crates/connector-oauth",
    "crates/connector-secrets",
    "crates/connector-state",
    "crates/connectors-client",
    "crates/subscription-custody",
    "crates/catalog-build",
    # The repository-maintenance CLI. Workspace-internal: it is how the catalogue is rebuilt and
    # reviewed here, and it is never a release artifact. The product's own binary, `connectors`, is
    # an excluded nested workspace because it composes the isolated SIP/RTVBP runtime closure.
    "crates/catalog-cli",
    # The M2 platform family. These crates hold protocol-neutral proof types and the one closed
    # driver composition path; none opens a socket while planning.
    "crates/domain",
    "crates/protocol",
    "crates/service",
    "crates/server",
]
# Runtime adapter and product dependency closures are intentionally isolated from the deterministic
# compiler workspace. RTVBP enables `serde_json/preserve_order`; feature-unifying it here changes
# OpenAPI and JSON object ordering and therefore canonical artifacts. CI builds every nested
# workspace directly.
exclude = [
    "crates/driver-audio",
    "crates/driver-speech",
    "crates/driver-cdp",
    "crates/driver-sip",
    "crates/rtvbp-voice-endpoint",
    "crates/state-sqlite",
    "crates/voice-local-audio",
    "crates/voice-runtime",
    "crates/hosted-state",
    "crates/connectors-config",
    "crates/connectors-console",
    "crates/connect-session-transport",
    "crates/connectors-runtime",
    "crates/hosted-vault",
    "crates/hosted-secrets",
    "crates/identity-http",
    "crates/integration-kubernetes",
    "crates/integration-catalog",
    "crates/integration-platform",
    "crates/integration-gitlab",
    "crates/integration-jira",
    "crates/integration-monitoring",
    "crates/integration-mcp",
    "crates/integration-sip",
    "crates/integration-slack",
    "crates/monitoring-model",
    "crates/connectors-cli",
]

[workspace.package]
edition = "2021"
# The predecessor differential has passed and its 0.26 line is retired. `0.1.0` is the first
# beyond10x/connectors artifact identity; generator, lock rows and wire User-Agent move together.
version = "0.5.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
# Raised for the exact sipx/RTVBP baselines and built/tested by the CI MSRV job.
rust-version = "1.88"
# **Nothing publishes** (design 02 §2). Every crate is an internal workspace member with a
# path-local name; the predecessor's `codewandler-connector-*` registry identities are left behind
# with the registry.
publish = false

[workspace.dependencies]
schemars = "1"
# Internal crates. Path-local names: the package name, the library name and the workspace key are
# the same word, so there is no `package = "…"` alias to keep in step with anything.
connector-address = { version = "0.5.3", path = "crates/connector-address" }
connector-spec = { version = "0.5.3", path = "crates/connector-spec" }
catalog-reader = { version = "0.5.3", path = "crates/catalog-reader" }
catalog = { version = "0.5.3", path = "crates/catalog" }
connector-resolve = { version = "0.5.3", path = "crates/connector-resolve" }
connector-oauth = { version = "0.5.3", path = "crates/connector-oauth" }
connector-secrets = { version = "0.5.3", path = "crates/connector-secrets" }
connector-state = { version = "0.5.3", path = "crates/connector-state" }
connectors-client = { version = "0.5.3", path = "crates/connectors-client" }
subscription-custody = { version = "0.5.3", path = "crates/subscription-custody" }
catalog-build = { version = "0.5.3", path = "crates/catalog-build" }
domain = { version = "0.5.3", path = "crates/domain" }
protocol = { version = "0.5.3", path = "crates/protocol" }
service = { version = "0.5.3", path = "crates/service" }
server = { version = "0.5.3", path = "crates/server" }

# Shared third-party.
anyhow = "1"
# Argument parsing, derive API. Hand-rolled argv parsing is banned in this repository: the
# predecessor's binary hand-rolled it and the surface grew flags whose interactions were documented
# in prose rather than in types. `derive` is the whole point — the verb surface is a data
# declaration, and `--help` is generated from it rather than maintained beside it.
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio"] }
base64 = "0.22"
ed25519-dalek = "2"
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
fs2 = "0.4"
hex = "0.4"
getrandom = "0.3"
keyring = "4.1.5"
indexmap = { version = "2", features = ["serde"] }
# YAML, for OpenAPI ingest: vendor specs are published as both JSON and YAML and the spec cache is
# extension-agnostic. `serde_norway` rather than `serde_yaml`, which is unmaintained.
serde_norway = "0.9"
jsonschema = { version = "0.49.2", default-features = false }

# Host-library only, reached exclusively from `connector-secrets` and never from the build path.
# `reqwest` is optional there and off by default; `default-features = false` keeps the tree to
# rustls and HTTP/1.1, which is all a Vault KV v2 call needs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "process"] }
url = "2"
identity-client = { git = "https://github.com/beyond10x/identity", rev = "bb3fdab4f5cfd64774a9df121d438e488431bbb8" }
# Dependencies at opt-level 2 even in dev: the test suites' cost is parse-dominated (21 MB of
# vendored specs through serde per whole-catalogue sweep), and debug-mode serde made one
# conformance test alone take 200 s. Workspace members stay at opt-level 0 for fast incremental
# compiles; this section only optimizes the (cached, rarely recompiled) dependency graph.
[profile.dev.package."*"]
opt-level = 2
