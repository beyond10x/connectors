[package]
name = "server"
description = "Inbound hosted HTTP and personal-local Unix transports for Connector application ports."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
catalog.workspace = true
connector-state.workspace = true
domain.workspace = true
protocol.workspace = true
fs2.workspace = true
sha2.workspace = true
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
service.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
