[package]
name = "integration-kubernetes"
description = "Hosted status and personal discovery Kubernetes Connector Integration adapters."
edition = "2021"
version = "0.4.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
async-trait = "0.1"
connector-resolve = { version = "0.4.3", path = "../connector-resolve" }
connectors-config = { version = "0.4.3", path = "../connectors-config" }
domain = { version = "0.4.3", path = "../domain" }
futures-util = "0.3"
hex = "0.4"
http = "1"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
monitoring-model = { version = "0.4.3", path = "../monitoring-model" }
protocol = { version = "0.4.3", path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service = { version = "0.4.3", path = "../service" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
