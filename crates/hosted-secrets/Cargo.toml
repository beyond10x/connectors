[package]
name = "hosted-secrets"
description = "Projected-token remote adapter for the shared Secrets service."
edition = "2021"
version = "0.5.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
connector-secrets = { version = "0.5.3", path = "../connector-secrets" }
connectors-config = { version = "0.5.3", path = "../connectors-config" }
hosted-vault = { version = "0.5.3", path = "../hosted-vault" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[[bin]]
name = "connectors-secrets-migrate"
path = "src/bin/migrate.rs"
