[package]
name = "connectors-client"
description = "Reusable typed clients for platform Connector control protocols."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
identity-client.workspace = true
jsonschema.workspace = true
keyring.workspace = true
protocol.workspace = true
# Hosted development and private deployments use the operator's normal CA trust, including
# SSL_CERT_FILE. Certificate and hostname verification remain enabled.
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "time"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
rcgen = "0.13.2"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
