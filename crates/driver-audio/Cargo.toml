[package]
name = "driver-audio"
description = "Closed built-in audio_v1 driver: this machine's sound device, in both directions."
edition = "2021"
version = "0.6.5"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = ["."]

[dependencies]
domain = { version = "0.6.5", path = "../domain" }

[dev-dependencies]
tempfile = "3"
