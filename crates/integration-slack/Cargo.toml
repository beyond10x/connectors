[package]
name = "integration-slack"
description = "Slack Socket Mode Connector Integration adapter."
edition = "2021"
version = "0.6.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
catalog = { version = "0.6.4", path = "../catalog" }
connect-session-transport = { version = "0.6.4", path = "../connect-session-transport" }
connector-oauth = { version = "0.6.4", path = "../connector-oauth" }
connector-secrets = { version = "0.6.4", path = "../connector-secrets" }
connector-resolve = { version = "0.6.4", path = "../connector-resolve" }
connectors-config = { version = "0.6.4", path = "../connectors-config" }
getrandom = "0.3"
hex = "0.4"
connector-state = { version = "0.6.4", path = "../connector-state" }
jsonschema = { version = "0.33", default-features = false }
protocol = { version = "0.6.4", path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service = { version = "0.6.4", path = "../service" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
