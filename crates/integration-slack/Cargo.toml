[package]
name = "integration-slack"
description = "Slack Socket Mode Connector Integration adapter."
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/b10x/connectors"
homepage = "https://github.com/b10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
async-trait = "0.1"
connect-session-transport = { version = "0.1.0", path = "../connect-session-transport" }
connector-secrets = { version = "0.1.0", path = "../connector-secrets" }
connectors-config = { version = "0.1.0", path = "../connectors-config" }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
protocol = { version = "0.1.0", path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service = { version = "0.1.0", path = "../service" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
