[package]
name = "driver-speech"
description = "Local speech synthesis and recognition: transformations over PCM, never a device."
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/b10x/b10x"
homepage = "https://github.com/b10x/b10x"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = ["."]

[dependencies]
domain = { version = "0.1.0", path = "../domain" }
driver-audio = { version = "0.1.0", path = "../driver-audio" }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service = { version = "0.1.0", path = "../service" }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
