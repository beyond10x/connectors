[package]
name = "identity-http"
description = "HTTP adapter for Identity-issued Connector access authority."
edition = "2021"
version = "0.6.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[features]
# A loopback-only plaintext Identity origin for the local process stack, so the hosted surface —
# token introspection, principal context, description leases, scope checks — can be exercised
# against an Identity with no certificate any webpki root chain would accept. It is never a default
# feature, and `src/lib.rs` turns it into a compile error whenever `debug_assertions` is off, which
# is every release build including the one in `../../Dockerfile`.
# `../../scripts/check-local-identity-refused.sh` proves that refusal.
local-identity = []

[dependencies]
async-trait = "0.1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server = { version = "0.6.0", path = "../server" }
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"
