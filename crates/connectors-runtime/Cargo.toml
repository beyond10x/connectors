[package]
name = "connectors-runtime"
description = "Reusable Connectors daemon composition and explicit Integration dispatch."
edition = "2021"
version = "0.2.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = [
    ".",
    "../connect-session-transport",
    "../connectors-config",
    "../hosted-state",
    "../hosted-vault",
    "../identity-http",
    "../integration-kubernetes",
    "../integration-gitlab",
    "../integration-jira",
    "../integration-catalog",
    "../integration-platform",
    "../integration-monitoring",
    "../integration-sip",
    "../integration-slack",
    "../monitoring-model",
    "../state-sqlite",
]

[features]
# Passes the loopback Identity exception through to the verifier adapter that owns it. Enabling it
# in a release build is a compile error raised by `identity-http`; see that crate's
# `src/local_identity.rs` for the three refusals this feature is held under.
local-identity = ["identity-http/local-identity"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio"] }
connector-secrets = { version = "0.2.1", path = "../connector-secrets" }
connector-state = { version = "0.2.1", path = "../connector-state" }
connectors-config = { version = "0.2.1", path = "../connectors-config" }
futures-util = "0.3"
hosted-vault = { version = "0.2.1", path = "../hosted-vault" }
hosted-state = { version = "0.2.1", path = "../hosted-state" }
identity-http = { version = "0.2.1", path = "../identity-http" }
integration-kubernetes = { version = "0.2.1", path = "../integration-kubernetes" }
integration-gitlab = { version = "0.2.1", path = "../integration-gitlab" }
integration-jira = { version = "0.2.1", path = "../integration-jira" }
integration-catalog = { version = "0.2.1", path = "../integration-catalog" }
integration-platform = { version = "0.2.1", path = "../integration-platform" }
integration-monitoring = { version = "0.2.1", path = "../integration-monitoring" }
integration-sip = { version = "0.2.1", path = "../integration-sip" }
integration-slack = { version = "0.2.1", path = "../integration-slack" }
hex = "0.4"
protocol = { version = "0.2.1", path = "../protocol" }
rustix = { version = "1.1.4", features = ["process"] }
serde_json = "1"
server = { version = "0.2.1", path = "../server" }
service = { version = "0.2.1", path = "../service" }
sha2 = "0.10"
state-sqlite = { version = "0.2.1", path = "../state-sqlite" }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["net", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
