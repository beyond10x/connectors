[package]
name = "connectors-runtime"
description = "Reusable Connectors daemon composition and explicit Integration dispatch."
edition = "2021"
version = "0.5.11"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = [
    ".",
    "../connect-session-transport",
    "../connectors-config",
    "../hosted-state",
    "../hosted-vault",
    "../hosted-secrets",
    "../identity-http",
    "../integration-kubernetes",
    "../integration-gitlab",
    "../integration-jira",
    "../integration-catalog",
    "../integration-platform",
    "../integration-monitoring",
    "../integration-mcp",
    "../integration-sip",
    "../integration-slack",
    "../monitoring-model",
    "../state-sqlite",
]

[features]
default = ["sip"]
# Passes the loopback Identity exception through to the verifier adapter that owns it. Enabling it
# in a release build is a compile error raised by `identity-http`; see that crate's
# `src/local_identity.rs` for the three refusals this feature is held under.
local-identity = ["identity-http/local-identity"]
# Voice is an ordinary runtime capability, not a prerequisite for products that compose only
# generated services or HTTP-backed Integrations. Existing Connector binaries keep it by default;
# embedding products may omit it only when their strict configuration also leaves SIP disabled.
sip = ["dep:integration-sip"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio"] }
connector-secrets = { version = "0.5.11", path = "../connector-secrets" }
connector-state = { version = "0.5.11", path = "../connector-state" }
connectors-config = { version = "0.5.11", path = "../connectors-config" }
domain = { version = "0.5.11", path = "../domain" }
futures-util = "0.3"
hosted-vault = { version = "0.5.11", path = "../hosted-vault" }
hosted-secrets = { version = "0.5.11", path = "../hosted-secrets" }
hosted-state = { version = "0.5.11", path = "../hosted-state" }
identity-http = { version = "0.5.11", path = "../identity-http" }
integration-kubernetes = { version = "0.5.11", path = "../integration-kubernetes" }
integration-gitlab = { version = "0.5.11", path = "../integration-gitlab" }
integration-jira = { version = "0.5.11", path = "../integration-jira" }
integration-catalog = { version = "0.5.11", path = "../integration-catalog" }
integration-platform = { version = "0.5.11", path = "../integration-platform" }
integration-monitoring = { version = "0.5.11", path = "../integration-monitoring" }
integration-mcp = { version = "0.5.11", path = "../integration-mcp" }
integration-sip = { version = "0.5.11", path = "../integration-sip", optional = true }
integration-slack = { version = "0.5.11", path = "../integration-slack" }
hex = "0.4"
protocol = { version = "0.5.11", path = "../protocol" }
rustix = { version = "1.1.4", features = ["process"] }
serde_json = "1"
server = { version = "0.5.11", path = "../server" }
service = { version = "0.5.11", path = "../service" }
sha2 = "0.10"
state-sqlite = { version = "0.5.11", path = "../state-sqlite" }
subscription-custody = { version = "0.5.11", path = "../subscription-custody" }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["net", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
