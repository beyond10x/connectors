[package]
name = "integration-catalog"
description = "Executes any catalogued HTTP operation from its declared request template. One adapter for every declared provider, instead of one crate each."
edition = "2021"
version = "0.3.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
# Excluded from the root workspace like every sibling Integration — it links a transport and the
# deterministic compiler workspace must not feature-unify with one — and pointed at the composition
# root that owns them all. A `[workspace]` of its own would make `connectors-runtime` two roots in
# one graph; this is how a member outside the root's directory tree names its root instead.
workspace = "../connectors-runtime"

[dependencies]
# The reviewed facts: operations, credentials, configuration fields, risk, direction, verify probe.
catalog = { version = "0.3.3", path = "../catalog" }
# The engine-free half: credential assembly, endpoint resolution, and the request plan. This crate
# adds a socket to that and nothing else.
connector-resolve = { version = "0.3.3", path = "../connector-resolve" }
connector-address = { version = "0.3.3", path = "../connector-address" }
connector-secrets = { version = "0.3.3", path = "../connector-secrets" }
connectors-config = { version = "0.3.3", path = "../connectors-config" }
domain = { version = "0.3.3", path = "../domain" }
protocol = { version = "0.3.3", path = "../protocol" }
service = { version = "0.3.3", path = "../service" }

async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
