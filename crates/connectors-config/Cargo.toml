[package]
name = "connectors-config"
description = "Strict value-free personal and hosted Connector deployment configuration."
edition = "2021"
version = "0.4.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
connector-address = { version = "0.4.4", path = "../connector-address" }
domain = { version = "0.4.4", path = "../domain" }
protocol = { version = "0.4.4", path = "../protocol" }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
service = { version = "0.4.4", path = "../service" }
thiserror = "2"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
