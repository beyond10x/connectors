# A release workflow reduced to what the release-binaries check reads.
name: Release binaries
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-gnu
      BINARIES: connectors connectors-catalog-provider
    steps:
      - name: Build the release binaries
        run: |
          packages=()
          for binary in $BINARIES; do packages+=(-p "$binary"); done
          cargo build --locked --release "${packages[@]}" --target "$TARGET"
      - name: Package
        run: |
          for binary in $BINARIES; do cp "target/${TARGET}/release/${binary}" dist/; done
