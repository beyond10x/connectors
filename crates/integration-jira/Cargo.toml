[package]
name = "integration-jira"
description = "Jira Cloud organization-read and delegated-user Connector Integration adapter."
edition = "2021"
version = "0.3.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
catalog = { version = "0.3.2", path = "../catalog" }
connector-oauth = { version = "0.3.2", path = "../connector-oauth" }
connector-resolve = { version = "0.3.2", path = "../connector-resolve" }
connector-secrets = { version = "0.3.2", path = "../connector-secrets" }
connectors-config = { version = "0.3.2", path = "../connectors-config" }
getrandom = "0.3"
hex = "0.4"
connector-state = { version = "0.3.2", path = "../connector-state" }
jsonschema = { version = "0.33", default-features = false }
protocol = { version = "0.3.2", path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service = { version = "0.3.2", path = "../service" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
url = "2"
zeroize = "1"

[dev-dependencies]
connector-secrets = { version = "0.3.2", path = "../connector-secrets" }
