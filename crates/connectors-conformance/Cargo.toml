[package]
name = "connectors-conformance"
description = "Live acceptance runner against independently started adapter services."
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license.workspace = true

[dependencies]
connectors-core.workspace = true
connectors-sdk.workspace = true
connectors-host.workspace = true
connectors-client.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
tempfile.workspace = true
connectors_cli_contract.workspace = true
jsonschema.workspace = true
# Composition, not a library edge: the incident call join pairs two concrete adapters in a
# test, which no adapter library may do (adapters/README.md).
connectors-loki = { path = "../../adapters/loki", default-features = false }
connectors-sql = { path = "../../adapters/sql", default-features = false }
sha2.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
