[package]
name = "voice-runtime"
description = "Supervised composition of admitted sipx telephony and authenticated RTVBP voice sessions."
edition = "2021"
version = "0.6.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = ["."]

[dependencies]
async-trait = "0.1"
domain = { version = "0.6.4", path = "../domain" }
driver-sip = { version = "0.6.4", path = "../driver-sip" }
getrandom = "0.3"
protocol = { version = "0.6.4", path = "../protocol" }
rtvbp = { git = "https://github.com/babelforce/rtvbp", rev = "dc0a60f7425b4899885f372152028457791b1e72" }
rtvbp-voice-endpoint = { version = "0.6.4", path = "../rtvbp-voice-endpoint" }
service = { version = "0.6.4", path = "../service" }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
connector-resolve = { version = "0.6.4", path = "../connector-resolve" }
ed25519-dalek = "2"
futures-util = "0.3"
serde_json = "1"
sipx-call = { git = "https://github.com/codewandler/sipx", rev = "004ac534b8b222060ad2d2308763efe6e1dedc10" }
sipx-media = { git = "https://github.com/codewandler/sipx", rev = "004ac534b8b222060ad2d2308763efe6e1dedc10" }
sipx-transport = { git = "https://github.com/codewandler/sipx", rev = "004ac534b8b222060ad2d2308763efe6e1dedc10" }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
