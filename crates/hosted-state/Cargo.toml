[package]
name = "hosted-state"
description = "Bounded PostgreSQL state cells for hosted Connector runtimes."
edition = "2021"
version = "0.6.5"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
connector-state = { version = "0.6.5", path = "../connector-state" }
postgres = "0.19"
thiserror = "2"

[dev-dependencies]
# The grant-evaluation exercise (`domain::grant_conformance`): the same Grant records evaluated
# through this backend must produce the same admissions and neutral refusals as every other.
domain = { version = "0.6.5", path = "../domain" }
