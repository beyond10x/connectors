    scheme: bearer
    label: Private app access token
    identity: {path: account-info/2026-09/details, kind: hubspot.portal, subject: /portalId}
operations:
  objects.list:
    op: get-/crm/objects/2026-09/{objectType}_/crm/objects/2026-03/{objectType}
    description: List one object type's records (contacts, companies, deals, tickets or any other type the account has), one page per call; the walk sends paging.next.after as after and ends on a page without paging.next
  object.get:
    op: get-/crm/objects/2026-09/{objectType}/{objectId}_/crm/objects/2026-03/{objectType}/{objectId}
    description: Read one record by objectType and objectId; properties and associations are comma-separated lists
