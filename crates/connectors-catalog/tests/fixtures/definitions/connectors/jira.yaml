schema: urn:beyond10x:connectors-definition:1
source:
  openapi: upstream/jira/jira-platform-v3.json.gz
  sha256: 655b4790a5c8543c81755c8250c6a8b8f58ee62712168a39d628d6d927549709
base_url: https://{domain}.atlassian.net/rest/api/3
config: {domain: {type: string}}
auth:
  atlassian.basic: {use: atlassian, identity: {path: myself}}
paging:
  token: {request: nextPageToken, next: /nextPageToken, limit: maxResults, last: /isLast}
  offset: {request: startAt, limit: maxResults, total: /total}
  offset-last: {request: startAt, limit: maxResults, last: /isLast}
  offset-empty: {request: startAt, limit: maxResults}
operations:
  issues.search:
    op: searchAndReconsileIssuesUsingJql
    description: Search issues by JQL, one page per call; a JQL `updated >=` clause filters by time, and the walk ends on a page without nextPageToken
  issue.comments:
    op: getComments
    paging: offset
    description: List one issue's comments, one page per call; the walk ends when startAt plus the page's comments reaches total
  issue.changelog:
    op: getChangeLogs
    paging: offset-last
    description: List one issue's changelog, one page per call; the walk ends on a page with isLast true
  issue.get:
    op: getIssue
    description: Read one issue by id or key, with the fields named in fields (default all fields, attachment among them) and the expansions named in expand, such as renderedFields,names
  issue.transitions:
    op: getTransitions
    description: List the transitions the account may run on one issue by id or key, each with its target status in to; transitionId narrows to one, expand=transitions.fields adds the transition screen's fields, includeUnavailableTransitions=true adds those that fail a condition
  issue.create_meta:
    op: getCreateIssueMetaIssueTypes
    paging: offset
    description: List the issue types the account can create in one project, by id or key, one page per call; the walk ends when startAt plus the page's issueTypes reaches total
  issue.create_meta.fields:
    op: getCreateIssueMetaIssueTypeId
    paging: offset
    description: List the fields one issue type takes when an issue is created in one project, by project id or key and the issue type's id from issue.create_meta, one page per call of at most 200; each field carries fieldId, name, required, schema and allowedValues, and the walk ends when startAt plus the page's fields reaches total
  users.search:
    op: findUsers
    paging: offset-empty
    description: Find active users whose display name or email address starts with query, or by exact accountId, one page per call of the first 1,000 matches; the walk ends on an empty page
  attachment.content:
    op: getAttachmentContent
    response: binary
    binary: {max_bytes: 2097152, hosts: ["https://api.media.atlassian.com"]}
    description: Read one attachment's content by its id, as issue.get lists it under fields.attachment. Answers the bytes in base64 with their media_type, length and sha256, refused above 2 MiB. With redirect false Jira answers the content itself; otherwise it answers 303 to a download URL, which is followed only to api.media.atlassian.com, and only when the connection admits that host, without the connection's credential
  issue.transition.run:
    op: doTransition
    effect: write
    body: {transition: any, fields: any, update: any}
    guard:
      before: {read: issue.get, expect: {/fields/status/id: current_status}}
      also:
        - read: issue.transitions
          with: {transitionId: body.transition.id}
          expect:
            /transitions/0/id: body.transition.id
            /transitions/0/isAvailable: =true
            /transitions/0/to/id: target_status
      after: {expect: {/fields/status/id: target_status}, read: {read: issue.get}}
    description: "Run one transition on one issue by id or key: body.transition.id names it, and fields and update set the transition screen's fields. Refused before the write unless the issue's status id is current_status and the transition is open on it with target status id target_status; Jira answers 204, and the issue read again after the write must be in target_status"
  issue.create:
    op: createIssue
    effect: write
    body:
      /fields/project/key: string+
      /fields/issuetype/id: string+!
      /fields/summary: string+!
      /fields/description: any
      /fields/labels: string_list
      /fields/priority/id: string
      /fields/assignee/accountId: string
      /fields/parent/key: string+
    guard:
      before: {read: getProject, with: {projectIdOrKey: body.fields.project.key}, expect: {/key: body.fields.project.key}}
      after: {expect: {/id: "?", /key: "?"}}
    description: "Create one issue in the project body.fields.project.key, of the issue type body.fields.issuetype.id, with body.fields.summary; body.fields.description is an Atlassian Document Format document sent as given, and body.fields.labels, body.fields.priority.id, body.fields.assignee.accountId and body.fields.parent.key are optional (issue.create_meta.fields lists what an issue type takes). The provider reads the project first and refuses before any write when it is absent or has another key. Nothing is compared before a create: the same input approved and sent twice creates two issues. Jira answers 201 with the new issue's id, key and self; an answer without the id or the key leaves the outcome unknown"
  issue.comment.add:
    op: addComment
    effect: write
    body:
      /body/type: =doc
      /body/version: =1
      /body/content: any!
      /visibility/type: string
      /visibility/value: string
    body_enums: {/visibility/type: [group, role]}
    guard:
      before: {read: issue.get, expect: {/key: issueIdOrKey}}
      after: {expect: {/body/type: =doc, /id: "?"}}
    description: "Add one comment to one issue by key: body.body.content is the content of an Atlassian Document Format document, sent as given, whose type doc and version 1 are fixed; body.visibility.type (group or role) and body.visibility.value restrict who sees it. The provider reads the issue first and refuses before any write when it is absent or its key is not issueIdOrKey. A comment sent twice is two comments. Jira answers 201 with the comment, whose id must be present and whose body must be a doc; an answer without them leaves the outcome unknown"
  issue.edit:
    op: editIssue
    effect: write
    withhold: [overrideScreenSecurity, overrideEditableFlag, returnIssue, expand]
    body:
      /fields/summary: string+
      /fields/description: any
      /fields/labels: string_list
      /fields/priority: any
      /fields/assignee: any
    body_any_of: [/fields/summary, /fields/description, /fields/labels, /fields/priority, /fields/assignee]
    conflict_status: 409
    guard:
      before:
        read: issue.get
        expect: {/key: issueIdOrKey, /fields/updated: updated_stamp}
        mismatch: conflict
      after: {expect: {/key: issueIdOrKey}, read: {read: issue.get}}
    description: "Change one issue by key: body.fields.summary, body.fields.description (an Atlassian Document Format document sent as given), body.fields.labels (replacing the issue's labels), body.fields.priority and body.fields.assignee, at least one of them. Send the issue's fields.updated from issue.get as updated_stamp: the edit is refused as conflict before it is sent when the issue changed since, and Jira's 409 is conflict. Jira answers 204, and the issue read again after the write must have the same key; the changed fields are not compared"
  issue.link.add:
    op: linkIssues
    effect: write
    body:
      /type/name: string+!
      /inwardIssue/key: string+
      /outwardIssue/key: string+
    guard:
      before: {read: issue.get, with: {issueIdOrKey: body.inwardIssue.key}, expect: {/key: body.inwardIssue.key}}
      also:
        - {read: issue.get, with: {issueIdOrKey: body.outwardIssue.key}, expect: {/key: body.outwardIssue.key}}
    description: "Link two issues by key with the link type named body.type.name, such as Blocks: body.inwardIssue.key and body.outwardIssue.key. The provider reads both issues first and refuses before any write when either is absent or has another key. Jira answers 201 with no body, also for a link that already exists, and the link is not read after the write: issue.get with fields issuelinks shows it"
  issue.delete:
    op: deleteIssue
    effect: write
    withhold: [deleteSubtasks]
    guard:
      before:
        read: issue.get
        expect: {/key: issueIdOrKey, /fields/updated: updated_stamp}
        mismatch: conflict
      after: {read: {read: issue.get}, absent: true}
    description: "Delete one issue by key while its fields.updated is updated_stamp, read from issue.get. The provider reads the issue first and refuses before any write when it is absent, and as conflict when its key or fields.updated differs; it reads the issue again after Jira's 204: only a 404 there proves it gone, so an issue still found or a read that fails leaves the effect unknown. deleteSubtasks is withheld, so Jira refuses an issue with subtasks (400)"
references:
  issue:
    match:
      - url: "https://{domain}.atlassian.net/browse/{key}"
      - pattern: "\\b(?P<key>[A-Z][A-Z0-9_]+-[0-9]+)\\b"
    resolve: {operation: issue.get, with: {issueIdOrKey: "{key}"}}
    outputs:
      summary: "{key} {/fields/issuetype/name} {/fields/status/name}: {/fields/summary}"
views:
  issue.card:
    of: issue
    fields:
      - {label: Summary, pointer: /fields/summary}
      - {label: Status, pointer: /fields/status/name}
      - {label: Assignee, pointer: /fields/assignee/displayName}
      - {label: Description, pointer: /fields/description, renderer: adf}
