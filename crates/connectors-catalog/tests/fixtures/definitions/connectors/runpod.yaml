schema: urn:beyond10x:connectors-definition:1
source:
  openapi: upstream/runpod/runpod-rest-v1.json.gz
  sha256: 9500a8989878d53d8731f27bf8dbbd57801b328c760bdb32c38ba36d5cb580db
base_url: https://rest.runpod.io/v1
auth:
  runpod.api-key:
    scheme: bearer
    label: Runpod API key
    identity: {source: configuration, path: pods, kind: runpod.connection}
operations:
  pod.create:
    op: CreatePod
    effect: write
    refusal_texts:
      - pointers: [/message, /detail]
        contains:
          - no longer any instances available
          - resources to deploy your pod
          - insufficient capacity
          - no available machine
          - out of stock
        code: capacity
    body:
      name: any
      imageName: any
      gpuTypeIds: any
      gpuCount: any
      containerDiskInGb: any
      volumeInGb: any
      volumeMountPath: any
      ports: any
      env: any
      cloudType: any
      dataCenterIds: any
      interruptible: any
      dockerStartCmd: any
      dockerEntrypoint: any
      networkVolumeId: any
    description: Create and deploy one pod from body; a definite 4xx refusal created nothing, and one naming a lack of capacity is refused as capacity, so the workload may be placed elsewhere, while a lost connection or a 5xx after the request was sent leaves the pod possibly created, so check pods.list by name before creating again
  pods.list:
    op: ListPods
    description: List the account's pods in one answer, filtered by the declared query parameters such as name, desiredStatus or id
  billing.pods:
    op: PodBilling
    description: Read the account's pod billing records in one answer, aggregated by bucketSize and filtered by the declared query parameters such as podId, gpuTypeId or startTime
  pod.terminate:
    op: DeletePod
    effect: write
    description: Terminate one pod by podId; Runpod answers 204, and a 404 means no pod with that id exists, so this call terminated nothing
