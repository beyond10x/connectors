# A mechanism naming a credential no [[auth]] block declares. Codegen must never invent one: that
# would be connectors deciding on its own how to spend a credential.
id = "zendesk"
base_url = "https://acme.zendesk.com"

[[auth]]
name = "zendesk.api_token"
scheme = "bearer"
env = ["ZENDESK_API_TOKEN"]

[[operations]]
id = "zendesk.test"
method = "GET"
direction = "read"
path = "/api/v2/users/me.json"
risk = "low"
idempotency = "idempotent"
effects = ["read", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
auth = [{ credentials = ["zendesk.oauth"] }]
