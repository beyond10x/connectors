# A degenerate second spelling of "no auth": an empty mechanism inside a non-empty alternatives
# list. It is trivially satisfiable, so C-10 would pick it and the operation would go out
# unauthenticated even though an alternative naming a real credential sits right beside it.
id = "zendesk"
base_url = "https://acme.zendesk.com"

[[auth]]
name = "zendesk.api_token"
scheme = "bearer"
env = ["ZENDESK_API_TOKEN"]

[[operations]]
id = "zendesk.test"
description = "Fixture operation"
method = "GET"
direction = "read"
path = "/api/v2/users/me.json"
risk = "low"
idempotency = "idempotent"
effects = ["read", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
auth = [{ credentials = [] }, { credentials = ["zendesk.api_token"] }]
