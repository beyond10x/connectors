# Patches with nothing to apply to.
id = "babelforce"
base_url = "https://services.babelforce.com"

[[operations]]
id = "babelforce.agent.list"
method = "GET"
direction = "read"
path = "/api/v2/agents"
risk = "low"
idempotency = "idempotent"
effects = ["read", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
auth = []

[[patch.operations]]
select = "getAgent"
rename = "babelforce.agent.get"
