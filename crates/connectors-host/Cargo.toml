[package]
name = "connectors-host"
description = "Adapter service host: HTTP serving, credential references, one-hop federation, and the local owner, custody and metadata runtime."
version.workspace = true
edition.workspace = true
rust-version = "1.91"
license.workspace = true

[features]
# Compatibility feature: runtime descriptors now always need config reflection.
schema = []
# Test-only seams: never enabled by a released binary (`apps/connectors` enables it
# for its integration tests only).
test-support = []

[dependencies]
connectors-custody.workspace = true
schemars = "1.2"
connectors-core.workspace = true
connectors-sdk.workspace = true
connectors-client.workspace = true
entity-core.workspace = true
entity-eventlog.workspace = true
entity-executor.workspace = true
entity-store.workspace = true
eventlog-core.workspace = true
async-trait.workspace = true
base64.workspace = true
axum.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
libc = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ring = "=0.17.14"
toml = "1.1"
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
time.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
connectors-custody = { workspace = true, features = ["test-support"] }
zbus = "=5.19.0"
rcgen = "0.14"
tempfile.workspace = true
tokio-rustls = { version="0.26", default-features=false, features=["ring", "tls12"] }
tokio = { workspace = true, features = ["test-util"] }
