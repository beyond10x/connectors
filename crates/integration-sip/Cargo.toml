[package]
name = "integration-sip"
description = "SIP operation projection and isolated voice-runtime composition adapter."
edition = "2021"
version = "0.5.11"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false
workspace = "../connectors-runtime"

[dependencies]
async-trait = "0.1"
catalog = { version = "0.5.11", path = "../catalog" }
connector-secrets = { version = "0.5.11", path = "../connector-secrets" }
connector-resolve = { version = "0.5.11", path = "../connector-resolve" }
connectors-config = { version = "0.5.11", path = "../connectors-config" }
domain = { version = "0.5.11", path = "../domain" }
driver-audio = { version = "0.5.11", path = "../driver-audio" }
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
connector-state = { version = "0.5.11", path = "../connector-state" }
hosted-state = { version = "0.5.11", path = "../hosted-state" }
protocol = { version = "0.5.11", path = "../protocol" }
rustls = "0.23"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service = { version = "0.5.11", path = "../service" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = "0.26"
driver-sip = { version = "0.5.11", path = "../driver-sip" }
tokio-util = "0.7"
voice-local-audio = { version = "0.5.11", path = "../voice-local-audio" }
voice-runtime = { version = "0.5.11", path = "../voice-runtime" }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
