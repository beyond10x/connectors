[package]
name = "connectors-cli"
description = "Thin command-line frontend for reusable Connector client and runtime libraries."
edition = "2021"
version = "0.4.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beyond10x/connectors"
homepage = "https://github.com/beyond10x/connectors"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = ["."]

[lib]
name = "connectors_cli"
path = "src/lib.rs"

[[bin]]
name = "connectors"
path = "src/main.rs"

[features]
# The loopback Identity exception, passed through to the adapter that owns it. `serve-hosted` may
# then resolve access tokens against a plaintext loopback Identity — the local process stack's own.
# A release build enabling this does not start, it fails to compile: see
# `../identity-http/src/local_identity.rs` and `../../scripts/check-local-identity-refused.sh`.
local-identity = ["connectors-runtime/local-identity"]

[dependencies]
clap = { version = "4", features = ["derive"] }
connectors-client = { version = "0.4.4", path = "../connectors-client" }
# The operator-facing behaviour this frontend delegates to: writing a configuration, diagnosing an
# installation, reading the catalogue, rendering a result. Kept out of the binary because the
# architecture fence caps what a thin frontend may contain, and it is right to.
connectors-console = { version = "0.4.4", path = "../connectors-console" }
connectors-runtime = { version = "0.4.4", path = "../connectors-runtime" }
protocol = { version = "0.4.4", path = "../protocol" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "time"] }
