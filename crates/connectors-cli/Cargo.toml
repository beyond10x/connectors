[package]
name = "connectors-cli"
description = "Personal-local Connectors daemon and isolated runtime composition leaf."
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/b10x/connectors"
homepage = "https://github.com/b10x/connectors"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"
members = ["."]

[[bin]]
name = "connectors"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
catalog = { version = "0.1.0", path = "../catalog" }
clap = { version = "4", features = ["derive"] }
connector-resolve = { version = "0.1.0", path = "../connector-resolve" }
connector-secrets = { version = "0.1.0", path = "../connector-secrets" }
domain = { version = "0.1.0", path = "../domain" }
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
futures-util = "0.3"
protocol = { version = "0.1.0", path = "../protocol" }
rustls = "0.23"
rustix = { version = "1.1.4", features = ["fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server = { version = "0.1.0", path = "../server" }
service = { version = "0.1.0", path = "../service" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
url = "2"
voice-runtime = { version = "0.1.0", path = "../voice-runtime" }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
