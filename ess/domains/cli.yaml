  # switch source, so the confirming flag carries its value: `--confirm one-way`.
  - name: connectors.cli.SetupCheckpointsEnableInput
    kind: struct
    fields:
      - {name: confirm, type: "Optional<connectors.cli.CheckpointsChange>"}
  # already_enabled is a success: the store already carried checkpoints and
  # nothing was changed. Both dispositions state the one-way change.
  - name: connectors.cli.SetupCheckpointsEnableResult
    kind: struct
    fields:
      - {name: disposition, type: "connectors.cli.CheckpointsDisposition"}
      - {name: state_path, type: "String"}
