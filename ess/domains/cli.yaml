  # exactly when reason is selection_changes: runtime obligations, as for
  # AcquisitionObservation.
  - name: connectors.cli.MigrateEntry
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connector, type: "String"}
      - {name: instance, type: "String"}
      - {name: disposition, type: "connectors.cli.MigrateEntryDisposition"}
      - {name: reason, type: "Optional<connectors.cli.MigrateKeptReason>"}
      - {name: differing_field, type: "Optional<connectors.cli.MigrateField>"}
      - {name: before, type: "connectors.cli.MigrateSelection"}
      - {name: after, type: "connectors.cli.MigrateSelection"}
  # configuration is the file the migration writes, the unchanged file when
  # unchanged. backup_path is present exactly when applied.
  - name: connectors.cli.SetupMigrateResult
    kind: struct
    fields:
      - {name: mode, type: "connectors.cli.MigrateMode"}
      - {name: disposition, type: "connectors.cli.MigrateDisposition"}
      - {name: config_path, type: "String"}
      - {name: format_before, type: "String"}
      - {name: format_after, type: "String"}
      - {name: backup_path, type: "Optional<String>"}
      - {name: configuration, type: "String"}
      - {name: entries, type: "List<connectors.cli.MigrateEntry>"}
