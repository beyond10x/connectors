  # Safe error data inside the ess-cli/1 process error envelope. No freeform exception or protected reference.
  - name: connectors.cli.Failure
    kind: struct
    fields:
      - {name: kind, type: "connectors.cli.FailureKind"}
      - {name: code, type: "connectors.cli.FailureCode"}
      # ESS-LIMIT: a read's `timeout` is at `stage = dispatch` once its
      # connectors.credential_evidence.ReadUse took `dispatch` (DispatchReadUse), and at
      # `stage = admission` before; a host that stops waiting first dispatches nothing more.
      # A sent read whose answer never arrives is `outcome_unknown`
      # (contracts/cli/v1alpha1/semantics.md). ESS 0.56 `specify cli` refuses any invariant
      # on a CLI type ("unsupported invariants or union semantics"), and this type carries no
      # dispatch fact to guard on, so the host enforces the rule and tests pin it.
      - {name: stage, type: "connectors.cli.FailureStage"}
      - {name: next_action, type: "connectors.cli.NextAction"}
      - {name: service_code, type: "Optional<connectors.service_wire.ErrorCode>"}
      # ESS-LIMIT: service_reason is at most 256 bytes of admitted provider text, present only
      # beside service_code, on a provider forbidden, or beside not_granted from a validation
      # whose bindings were all refused (contracts/cli/v1alpha1/semantics.md).
      # As for instance_id below, ESS declares no invariant on a CLI type, so the bound, the
      # redaction and the presence rule are enforced by the host and pinned by tests.
      - {name: service_reason, type: "Optional<String>"}
      # ESS-LIMIT: retry_after_seconds is the provider's Retry-After delay in whole seconds
      # (0 to 4294967295), present only beside service_code = rate_limited
      # (contracts/cli/v1alpha1/semantics.md). ESS declares no invariant on a CLI type, so the
      # range and the presence rule are enforced by the host and pinned by tests.
      - {name: retry_after_seconds, type: "Optional<Integer>"}
      - {name: connection, type: "Optional<String>"}
      - {name: acquisition, type: "Optional<String>"}
      - {name: request_id, type: "Optional<String>"}
      - {name: mutation, type: "Optional<connectors.cli.MutationObservation>"}
      - {name: source_audit, type: "Optional<connectors.service_wire.SourceAudit>"}
      - {name: configuration_format, type: "Optional<connectors.cli.ConfigurationFormat>"}
      # ESS-LIMIT: instance_id is an admitted selector (connectors_core::valid_id, at most
      # 128 bytes) and appears only with configuration_format on invalid_configuration.
      # ESS 0.52 `specify cli` refuses any invariant on a CLI type (see ApprovalClockCheckResult),
      # so both rules are enforced by the host and pinned by tests, not declared here.
      - {name: instance_id, type: "Optional<String>"}
      # ESS-LIMIT: configuration_rule appears only on invalid_configuration at stage
      # configuration. As for instance_id above, ESS declares no invariant on a CLI type,
      # so the presence rule is enforced by the host and pinned by tests.
      - {name: configuration_rule, type: "Optional<connectors.cli.ConfigurationRule>"}
      # ESS-LIMIT: configuration_bytes and configuration_limit appear together, only
      # beside configuration_rule config_too_large: the size in bytes of the text that
      # was refused and the most bytes a configuration read admits. As for instance_id
      # above, ESS declares no invariant on a CLI type, so the presence rule is
      # enforced by the host and pinned by tests.
      - {name: configuration_bytes, type: "Optional<Integer>"}
      - {name: configuration_limit, type: "Optional<Integer>"}
      # ESS-LIMIT: store_version and binary_version appear together, only on
      # metadata_schema_newer (contracts/cli/v1alpha1/semantics.md). binary_version is
      # the refusing binary's release version; store_version is the release version the
      # store's StoreWriter marker names, or `unrecorded` when no marker names a newer
      # writer this binary can order: the Entity Runtime refused a record field this
      # binary's schema does not declare, the marker's version cannot be ordered, or
      # the store's level is above this binary's highest (its marker is then not read
      # through a schema this binary does not know). As for instance_id above, ESS
      # declares no invariant on a CLI type, so
      # the presence rule and the `unrecorded` value are enforced by the host and pinned
      # by tests.
      - {name: store_version, type: "Optional<String>"}
      - {name: binary_version, type: "Optional<String>"}
      # ESS-LIMIT: custody and created appear together, only on `custody_unavailable` after
      # a write that created a credential and applied (connectors.mutations.CredentialCustody):
      # custody is `failed` and created holds the public members the selection returns, such
      # as a key's hash, so the operator can revoke the credential at the provider. Never the
      # credential. As for instance_id above, the presence rule is enforced by the host and
      # pinned by tests.
      - {name: custody, type: "Optional<connectors.mutations.CustodyOutcome>"}
      - {name: created, type: "Optional<Map<String, String>>"}
      # ESS-LIMIT: clock_refusal and clock_sources appear together, only on an approval
      # clock's `unavailable` (`stage = observation`) when the quorum formed no answer
      # (contracts/service/clock.md, "Refusals"): clock_refusal is the combined
      # connectors.clock.Refusal with its next action, clock_sources one line per
      # configured source in configuration order. A local timer, continuity, overflow
      # or UTC-midnight refusal carries neither. As for instance_id above, ESS declares
      # no invariant on a CLI type, so the presence rules are enforced by the host and
      # pinned by tests.
      - {name: clock_refusal, type: "Optional<connectors.clock.Refusal>"}
      - {name: clock_sources, type: "Optional<List<connectors.clock.SourceReport>>"}
      - {name: field, type: "Optional<String>"}
      # ESS-LIMIT: cause and attempts appear only on a `connections revalidate` failure at
      # stage dispatch that the owner classified as transient (contracts/cli/v1alpha1/semantics.md
      # §6, "Revalidation retries"): cause names the class of the last attempt, attempts the
      # number of validations the owner sent (1 to 3), when it sent any. A credential,
      # permission or scope refusal is never retried and carries neither. As for instance_id
      # above, ESS declares no invariant on a CLI type, so the presence rule and the range are
      # enforced by the host and pinned by tests.
      - {name: cause, type: "Optional<connectors.cli.FailureCause>"}
      - {name: attempts, type: "Optional<Integer>"}
      # ESS-LIMIT: revision_expected, revision_given and read_with appear only beside
      # field = expected_revision on `connections revalidate` and `connections revoke`
      # (story:connectors-do-short-invocation; contracts/cli/v1alpha1/semantics.md, "The
      # refused argument"): revision_expected is the kind of revision the command
      # expects, revision_given the kind the given value is when it is another one the
      # instance holds, and read_with the command that reads the expected one. As for
      # instance_id above, ESS declares no invariant on a CLI type, so the presence rule
      # is enforced by the host and pinned by tests.
      - {name: revision_expected, type: "Optional<connectors.cli.RevisionKind>"}
      - {name: revision_given, type: "Optional<connectors.cli.RevisionKind>"}
      - {name: read_with, type: "Optional<String>"}
