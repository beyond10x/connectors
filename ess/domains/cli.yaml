domain: connectors.cli
summary: Selected local CLI presentation values and the existing local configuration owner's durable runtime facts.

# Owner: contracts/cli/v1alpha1/semantics.md. Process globals live in ess-cli/1
# Context, not these payloads. Existing auth/declaration identities retain their
# String representations; these value references establish no entity relations.
# Vocabulary (docs/design/connector-vocabulary.md § What changes): every
# `adapter` field below is the `--adapter <alias>` value, which becomes
# `--connector <name> --instance <name>` (connectors.declarations.Connector
# and its instance, ServiceConfiguration). The fields keep their names in this
# pass; the migration plan carries `adapter` beside `connector` and `instance`
# for a deprecation window. A new instance's instance_id is
# `<connector>.<instance>` (`mail.personal`); a migrated alias keeps its
# instance_id (story:ess-connector-vocabulary-model decision 10). An instance
# holds at most one published non-revoked connection (decision 11,
# connectors.auth_bindings.AllocateConnection); the `connection` selectors
# below keep their shape in this pass.
types:
  # Instance selectors (contracts/cli/v1alpha1/semantics.md §3, "Selecting an
  # instance"). Every input below that carries `adapter` carries `connector`
  # and `instance` too, all three Optional. Exactly one of `adapter` or
  # `connector`+`instance` selects; with none, the configuration's
  # default_instance, else its default_adapter. Optional alone does not enforce
  # that exclusivity, so it is a runtime obligation, as for
  # ConnectionStatusInput. Every result type that carries `adapter` carries
  # `connector` and `instance` beside it, all three required; `adapter` is the
  # selected instance's legacy alias for the deprecation window.
  # Local approval commands project existing policy/subject owners. A preparation
  # is metadata, not a lease or proof; issuance returns no protected proof bytes.
  - name: connectors.cli.ApprovalPolicyView
    kind: struct
    fields:
      - {name: policy_id, type: String}
      - {name: instance_id, type: String}
      - {name: issuer_id, type: String}
      - {name: revision, type: Integer}
      - {name: owner_uid, type: Integer}
      - {name: selection, type: connectors.local_approval_policy.Selection}
      - {name: operations, type: "List<String>"}
  - name: connectors.cli.ApprovalPolicyStatusInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
  - name: connectors.cli.ApprovalPolicySetInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: expected_revision, type: "Optional<Integer>"}
      - {name: input_file, type: String}
  - name: connectors.cli.ApprovalPolicyResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connector, type: String}
      - {name: instance, type: String}
      - {name: policy, type: "Optional<connectors.cli.ApprovalPolicyView>"}
  - name: connectors.cli.ApprovalPrepareInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: connection, type: String}
      - {name: operation, type: String}
      - {name: schema, type: String}
      - {name: revision, type: String}
      - {name: input, type: String}
  - name: connectors.cli.ApprovalPrepareResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connector, type: String}
      - {name: instance, type: String}
      - {name: preparation, type: connectors.delegation.ApprovalPreparation}
  - name: connectors.cli.ApprovalIssueInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: connection, type: String}
      - {name: operation, type: String}
      - {name: schema, type: String}
      - {name: revision, type: String}
      - {name: input, type: String}
      - {name: approve_subject, type: String}
      - {name: proof_output, type: String}
  - name: connectors.cli.ApprovalIssueDisposition
    kind: enum
    variants: [published]
  - name: connectors.cli.ApprovalIssueResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connector, type: String}
      - {name: instance, type: String}
      - {name: reference, type: String}
      - {name: subject_sha256, type: String}
      - {name: disposition, type: connectors.cli.ApprovalIssueDisposition}
  - name: connectors.cli.ApprovalClockCheckInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
  - name: connectors.cli.ApprovalClockCheckResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connector, type: String}
      - {name: instance, type: String}
      - {name: observation, type: connectors.clock.Observation}
    # ESS-LIMIT: clock.md:163 orders an observation (upper >= lower). The comparison
    # is writable here, but ESS 0.52 `specify cli` refuses any invariant on a CLI
    # type ("unsupported invariants or union semantics"), so it is not declared.
  - name: connectors.cli.ApprovalKeyState
    kind: enum
    variants: [candidate, active, retired, retiring, deleted]
  - name: connectors.cli.ApprovalKeyView
    kind: struct
    fields:
      - {name: key_id, type: String}
      - {name: public_key, type: String}
      - {name: state, type: connectors.cli.ApprovalKeyState}
  - name: connectors.cli.ApprovalIssuerView
    kind: struct
    fields:
      - {name: issuer, type: String}
      - {name: audience, type: String}
      - {name: revision, type: String}
      - {name: keys, type: "List<connectors.cli.ApprovalKeyView>"}
  - name: connectors.cli.ApprovalKeysResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connector, type: String}
      - {name: instance, type: String}
      - {name: issuer, type: "Optional<connectors.cli.ApprovalIssuerView>"}
  - name: connectors.cli.ApprovalKeyStatusInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
  - name: connectors.cli.ApprovalKeyInitInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: expected_revision, type: "Optional<String>"}
  - name: connectors.cli.ApprovalKeyRotateInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: expected_revision, type: "String"}
      - {name: expected_key, type: "String"}
  - name: connectors.cli.ApprovalKeyRecoverInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: expected_revision, type: "String"}
      - {name: candidate, type: "String"}
  - name: connectors.cli.ApprovalKeyRevokeInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: expected_revision, type: "String"}
      - {name: expected_key, type: "String"}
  - name: connectors.cli.ApprovalKeyRetireInput
    kind: struct
    fields:
      - {name: adapter, type: "Optional<String>"}
      - {name: connector, type: "Optional<String>"}
      - {name: instance, type: "Optional<String>"}
      - {name: expected_revision, type: "String"}
      - {name: key, type: "String"}
  # Local configuration-owner bindings, not independent identities or grants.
  - name: connectors.cli.LocalOperationPolicy
    kind: struct
    fields:
      - {name: profiles, type: "List<String>"}
      - {name: operations, type: "List<String>"}
  # secret_service_socket selects the Secret Service bus on Linux only; the macOS and
  # Windows backends take no binding and refuse one.
  # binding and directory are the `[custody]` table of a `connectors-local/4`
  # configuration (contracts/cli/v1alpha1/semantics.md §3). Absent, custody is the
  # platform binding. binding names one the build supports; mounted_secret, Linux
  # only, is the explicit read-only binding over a mounted directory
  # (contracts/auth/custody/v1alpha1/semantics.md §5.2). directory is an
  # infrastructure binding of the owner configuration, like secret_service_socket,
  # never a per-credential locator; no request selects a binding, directory or item.
  - name: connectors.cli.LocalCustodyBinding
    kind: struct
    fields:
      - {name: secret_service_socket, type: "Optional<String>"}
      - {name: binding, type: "Optional<connectors.cli.CustodyBackend>"}
      - {name: directory, type: "Optional<String>"}
    invariants:
      # directory is defined exactly when the binding is mounted_secret.
      - any:
          - {binding: mounted_secret}
          - {directory: {exists: false}}
      - any:
          - not: {binding: mounted_secret}
          - {directory: {exists: true}}
      # The Secret Service bus is never named beside the mounted binding.
      - any:
          - not: {binding: mounted_secret}
          - {secret_service_socket: {exists: false}}
  # Lowercase hex SHA-256 of an executable, as owner/transport.rs writes it (hex::encode)
  # in own_build.
  - name: connectors.cli.BuildDigest
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
    invariants:
      - value.count == 64
  # Owner frames are serde `kind`-tagged (Request and Reply in local/owner.rs); each
  # frame declares its tag as a `kind` field. Request::Hello and Reply::Hello both
  # serialize as "hello".
  - name: connectors.cli.LocalOwnerHelloKind
    kind: enum
    variants: [hello]
  # Request::Hello, the greeting the CLI sends; build is absent only from callers
  # built before the build handshake.
  - name: connectors.cli.LocalOwnerHello
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerHelloKind}
      - {name: version, type: String}
      - {name: challenge, type: Uuid}
      - {name: configuration, type: String}
      - {name: authority, type: Uuid}
      - {name: build, type: "Optional<connectors.cli.BuildDigest>"}
  - name: connectors.cli.LocalOwnerGreeting
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerHelloKind}
      - {name: version, type: String}
      - {name: challenge, type: Uuid}
      - {name: host_incarnation, type: Uuid}
      - {name: authority, type: Uuid}
      - {name: build, type: "Optional<connectors.cli.BuildDigest>"}
    # build is returned only to a caller whose LocalOwnerHello carried its own; a
    # caller that omitted it may send LocalOwnerBuildRequest, answered with LocalOwnerBuild.
  # Request::Build is a unit variant: its whole frame is {"kind": "build"}. ESS refuses
  # a struct with no fields (ESS-TYPE-007).
  - name: connectors.cli.LocalOwnerBuildKind
    kind: enum
    variants: [build]
  - name: connectors.cli.LocalOwnerBuildRequest
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerBuildKind}
  - name: connectors.cli.LocalOwnerBuild
    kind: struct
    fields:
      - {name: build, type: connectors.cli.BuildDigest}
  # Request::Cached: a CLI's read of an adapter's cached description through the
  # running owner, answered from the owner's held metadata handle instead of a
  # direct open of the store (contracts/cli/v1alpha1/owner.md). Sent only to an
  # owner of the CLI's own build; without a reachable owner, or after an exchange that
  # failed past the greeting, the CLI reads directly.
  - name: connectors.cli.LocalOwnerCachedKind
    kind: enum
    variants: [cached]
  - name: connectors.cli.LocalOwnerCachedRequest
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerCachedKind}
      - {name: adapter, type: String}
      # launch: when nothing is cached for the configured selection, the owner
      # starts the configured, digest-pinned adapter to cache it, without any
      # credential, if the instance holds a connection (connection, when named)
      # current under the configured entry (contracts/cli/v1alpha1/semantics.md,
      # "Launching for a description"). Omitted when false.
      - {name: launch, type: "Optional<Boolean>"}
      - {name: connection, type: "Optional<String>"}
  # The answer: the cached bootstrap the owner holds for the adapter's configured
  # instance and selection. Refusals keep the codes of a direct read
  # (not_found, description_unavailable, metadata_unavailable).
  - name: connectors.cli.LocalOwnerCached
    kind: struct
    fields:
      - {name: bootstrap, type: connectors.cli.PrivateAdapterBootstrap}
  # Request::Reuse (story:invoke-definition-reuse-credential): the reuse answer of
  # `operations invoke --definition` (contracts/cli/v1alpha1/semantics.md, "Invoking a
  # definition file"; owner.md). adapter is the definition's instance to connect, source
  # another instance of the same connector, connection the source connection and
  # expected_revision the revision it was offered under, profile the target's profile. It
  # carries no document and no material: the owner reads the source's current custody
  # version under a read use, validates it through the target's adapter and publishes a new
  # connection holding it as its own version only when the validated identity is the
  # source's. The answer is the published connection, as a completed capture's.
  - name: connectors.cli.LocalOwnerReuseKind
    kind: enum
    variants: [reuse]
  - name: connectors.cli.LocalOwnerReuseRequest
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerReuseKind}
      - {name: adapter, type: String}
      - {name: source, type: String}
      - {name: connection, type: String}
      - {name: expected_revision, type: String}
      - {name: profile, type: String}
  - name: connectors.cli.LocalCaptureAdmission
    kind: struct
    fields:
      - {name: acquisition, type: String}
      - {name: expires_at_ms, type: Timestamp}
      - {name: profile, type: connectors.cli.PrivateStaticProfile}
  # What admitted a revalidation (contracts/cli/v1alpha1/semantics.md, owner.md):
  # an explicit `connections revalidate`, or the one recollection a read on
  # `operations invoke` runs, first in its own worker job and within its own deadline,
  # when only its connection's evidence lapsed, or would lapse before the read could use
  # it (under half its own lifetime, collected_at to valid_until, and under the read's
  # own deadline left), while the credential
  # is intact. A read recollection never re-pins changed mounted material and never
  # follows a configuration upgrade; only an explicit revalidation does.
  - name: connectors.cli.LocalRevalidationCause
    kind: enum
    variants: [explicit, read_recollection]
  # Transient admitted use of the existing immutable generation/custody version.
  # No public handle, new generation, or independently owned evidence entity.
  - name: connectors.cli.LocalRevalidationAdmission
    kind: struct
    fields:
      - {name: connection, type: String}
      - {name: generation, type: String}
      - {name: custody_version, type: String}
      - {name: publication_fence, type: String}
      - {name: captured_at_ms, type: Timestamp}
      - {name: expires_at_ms, type: Timestamp}
      - {name: cause, type: connectors.cli.LocalRevalidationCause}
  # Private local transport values, owned by contracts/cli/v1alpha1/private-adapter.md.
  # They bind existing owners and are not public CLI results or persisted entities.
  - name: connectors.cli.PrivateEntryField
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: label, type: String}
      - {name: max_bytes, type: Integer}
  # A connection's identity is its instance, adapter, provider authority and this
  # profile's authentication: every field but evidence_lifetime_ms
  # (connectors.auth_bindings.LocalStaticProfile). A configuration revision that
  # leaves the identity unchanged is upgraded by `connections revalidate` when the
  # profile is unchanged; when only evidence_lifetime_ms changed, revalidate, repair
  # and a read name create_connection, which connect under the same instance id
  # admits; a saved connection whose profile id the configured adapter no longer
  # declares is refused the same way, never as `unsupported`. Revalidate, connect,
  # repair, a read and a write first replace an adapter process still running an
  # earlier adapter entry. One that changes the identity refuses revalidate,
  # repair, a read and connect under the same instance id with
  # `lifecycle_conflict` and next_action check_configuration: only a new instance
  # id helps, and `connections revoke` through the moved entry still reaches the
  # connections left under an instance id no entry configures any longer.
  # ESS-LIMIT: no construct relates two revisions' values field by field, so the
  # host enforces the classification and tests pin it.
  - name: connectors.cli.PrivateStaticProfile
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: revision, type: String}
      - {name: purpose, type: connectors.auth_access.Purpose}
      - {name: subject, type: connectors.auth_access.Subject}
      - {name: scheme, type: connectors.auth_access.Scheme}
      - {name: capability, type: connectors.auth_access.CapabilityName}
      - {name: minimum_scopes, type: "List<String>"}
      - {name: evidence_lifetime_ms, type: Integer}
      - {name: fields, type: "List<connectors.cli.PrivateEntryField>"}
      - {name: acquisition, type: "Optional<connectors.cli.PrivateProfileAcquisition>"}
  # Present only for a profile whose entry is acquired by OAuth, in exactly one of
  # two forms, all nonsecret: OAuth consent for a static entry names the authorize
  # and token endpoints and the requested scopes; an oauth2_grant profile names only
  # oauth2, the authorization server it declares, without its absent members
  # (story:connect-runs-an-oauth2-grant).
  - name: connectors.cli.PrivateProfileAcquisition
    kind: struct
    fields:
      - {name: authorize_url, type: "Optional<String>"}
      - {name: token_url, type: "Optional<String>"}
      - {name: scopes, type: "Optional<List<String>>"}
      - {name: oauth2, type: "Optional<connectors.oauth2.ServerDeclaration>"}
  - name: connectors.cli.PrivateOperationEffect
    kind: enum
    variants: [read, write, unknown]
  - name: connectors.cli.PrivateOperationRequirement
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: profile, type: String}
      - {name: scopes, type: "List<String>"}
      - {name: effect, type: connectors.cli.PrivateOperationEffect}
      # Present and true only for a write whose answer carries a credential it
      # created (connectors.mutations.CredentialCustody); absent otherwise.
      - {name: custody, type: "Optional<Boolean>"}
  - name: connectors.cli.PrivateAdapterBootstrap
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: adapter, type: String}
      - {name: protocol, type: String}
      - {name: configuration_revision, type: String}
      # The credential-side digest of the configuration the configured entry
      # states (architecture-decision-record:provider-definitions-and-runtimes
      # D12); absent when it states none.
      - {name: credential_revision, type: "Optional<String>"}
      - {name: provider_authority, type: String}
      - {name: descriptor, type: String}
      - {name: profiles, type: "List<connectors.cli.PrivateStaticProfile>"}
      - {name: requirements, type: "List<connectors.cli.PrivateOperationRequirement>"}
      # Present only for an instance whose operations bind, at validation, to one of
      # several alternative descriptions (contracts/cli/v1alpha1/private-adapter.md,
      # "Alternative bindings"); absent otherwise, so a bootstrap without it keeps
      # its bytes.
      - {name: bindings, type: "Optional<connectors.cli.PrivateBindings>"}
    # descriptor is one bounded JSON document, decoded as the existing Descriptor.
  # ESS-LIMIT: id names the binding the bootstrap's own descriptor and requirements
  # describe, the first one validation tries; the alternatives follow in the order
  # validation tries them. Ids are unique, the descriptors' revisions are distinct,
  # and a bootstrap with bindings declares no write. ESS declares no invariant on a
  # CLI type, so the host enforces these and tests pin them.
  - name: connectors.cli.PrivateBindings
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: alternatives, type: "List<connectors.cli.PrivateAlternativeBinding>"}
  # One alternative description of the same instance: same profiles, configuration and
  # credential, its own descriptor and requirements.
  - name: connectors.cli.PrivateAlternativeBinding
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: descriptor, type: String}
      - {name: requirements, type: "List<connectors.cli.PrivateOperationRequirement>"}
  - name: connectors.cli.PrivateBaseline
    kind: struct
    fields:
      - {name: identity, type: connectors.credentials.ExternalIdentity}
      - {name: granted_scopes, type: "Optional<List<String>>"}
      - {name: credential_expires_at_ms, type: "Optional<Timestamp>"}
      - {name: collected_at_ms, type: Timestamp}
      - {name: valid_until_ms, type: Timestamp}
      # ESS-LIMIT: the binding this validation's answers selected; present exactly
      # when the bootstrap declares bindings, and then one of their ids. The host
      # refuses any other reply as a protocol violation.
      - {name: binding, type: "Optional<String>"}
  - name: connectors.cli.StartupMode
    kind: enum
    variants: [on-demand, automatic]
  - name: connectors.cli.RestartPolicy
    kind: enum
    variants: [never]
  - name: connectors.cli.OperatingSystem
    kind: enum
    variants: [linux, macos, windows]
  # The protected store custody uses, fixed by the platform the binary was built for:
  # the freedesktop Secret Service on Linux, the login keychain on macOS, the
  # Credential Manager on Windows (contracts/auth/custody/v1alpha1/semantics.md §5.1),
  # or mounted_secret, the read-only binding over a mounted directory that only an
  # explicit `[custody]` selection in the owner configuration chooses (§5.2).
  # There is no fallback variant: mounted_secret is explicit and read-only, and
  # nothing selects it when the platform binding is unusable.
  - name: connectors.cli.CustodyBackend
    kind: enum
    variants: [secret_service, macos_keychain, windows_credential_manager, mounted_secret]
  # The operating-system guarantees the local host builds on, each fixed by the
  # platform the binary was built for (contracts/cli/v1alpha1/semantics.md §7,
  # "macOS platform guarantees" and "Windows platform guarantees"):
  # - sealed_executable: an admitted adapter or consumer image cannot change
  #   between its digest check and exec (private-adapter.md, consumer-launch.md §3).
  # - parent_death_kill: a launched child is ended when the process that
  #   launched it dies.
  # - exact_process_signal: stop and cleanup signal only the exact owned child,
  #   never a reused process id.
  # - own_image_build_measure: the owner build digest is the image running,
  #   not the file at its launch path (owner.md).
  # - atomic_no_replace_rename: a durable publication rename refuses an existing
  #   destination in the same call.
  # - atomic_close_on_exec: a descriptor received over the owner socket is
  #   close-on-exec from the moment it is received.
  # - peer_credential_snapshot: a socket peer's uid and pid are read together, as
  #   the kernel recorded them at connect.
  - name: connectors.cli.PlatformGuarantee
    kind: enum
    variants: [sealed_executable, parent_death_kill, exact_process_signal, own_image_build_measure, atomic_no_replace_rename, atomic_close_on_exec, peer_credential_snapshot]
  - name: connectors.cli.GuaranteeSupport
    kind: enum
    variants: [holds, weaker, absent]
  # The named form a guarantee takes where it holds only weaker:
  # - owner_private_copy: the image is a mode 0500 copy in a mode 0700 directory,
  #   digest-checked before exec; other users cannot change it, the same user can.
  #   A copy that is refused or never launched is removed with its directory;
  #   a launched copy is removed once, by the launch, after the exec it serves.
  # - adapter_channel_close: an adapter exits when its inherited channel closes;
  #   a consumer has no such channel and outlives a dead launcher.
  # - child_reap_lock: a child is signalled by process id, under the same lock
  #   that reaps it, so the id cannot be reused between the check and the signal.
  # - launch_path_read: the digest is read from the executable's path; a file
  #   replaced there is measured as a new build (owner_build_mismatch).
  # - set_after_receive: close-on-exec is set right after the receive returns; a
  #   concurrent exec in the same process in between inherits the descriptor.
  # - separate_pid_query: the uid and gid are the connect-time snapshot; the pid
  #   is a separate query, used by the owner and supervisor only for its sign;
  #   an adapter also requires it to equal its parent's process id. A peer that
  #   has already closed has no pid: the owner and supervisor admit it by its
  #   uid, an adapter refuses it.
  # - deny_write_copy: the image is a copy in a fresh owner-only directory inside
  #   the state directory's owner-only run directory, opened for reading without
  #   write or delete sharing before its digest check and held, with its
  #   directory, until the child is created; from that open no process can open it
  #   for writing, rename or delete it or its directory. A writable mapping a
  #   process of the same user made before that open is not excluded.
  # - client_token_query: the pipe's access control admits the current user alone
  #   at connect; the client's process id is the connect-time record, and its user
  #   is read afterwards from that process's token, a separate query that reads
  #   another process if the client exited and its id was reused. Besides the user,
  #   that token's integrity level must equal this process's and it must not be
  #   restricted, on both ends: a peer of the same user at another integrity level,
  #   or with a restricted token, is refused as lifecycle_conflict, by an owner with
  #   that reply rather than a closed stream.
  - name: connectors.cli.PlatformGuaranteeWeakerForm
    kind: enum
    variants: [owner_private_copy, adapter_channel_close, child_reap_lock, launch_path_read, set_after_receive, separate_pid_query, deny_write_copy, client_token_query]
  # One row of the platform guarantee table. Linux holds every guarantee. macOS
  # holds atomic_no_replace_rename (renamex_np RENAME_EXCL on a filesystem that
  # reports VOL_CAP_INT_RENAME_EXCL, APFS) and holds each other one only in its
  # named weaker form. Windows holds parent_death_kill (every child created in a
  # job object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE through
  # PROC_THREAD_ATTRIBUTE_JOB_LIST; an adapter's job permits no breakaway, a
  # consumer's permits breakaway on request, JOB_OBJECT_LIMIT_BREAKAWAY_OK and
  # never the silent form, so an owner a consumer starts can leave it, while the
  # consumer itself stays in it), exact_process_signal (the held process
  # handle), atomic_no_replace_rename (MoveFileExW without
  # MOVEFILE_REPLACE_EXISTING, on NTFS) and atomic_close_on_exec (handles
  # duplicated non-inheritable, children given an explicit handle list), and holds
  # each other one only in its named weaker form. The invariants are the table.
  # ESS-LIMIT: the type states what a row must say, not that the table has one
  # row per (os, guarantee); the contracts list them.
  - name: connectors.cli.PlatformGuaranteeStatement
    kind: struct
    fields:
      - {name: os, type: "connectors.cli.OperatingSystem"}
      - {name: guarantee, type: "connectors.cli.PlatformGuarantee"}
      - {name: support, type: "connectors.cli.GuaranteeSupport"}
      - {name: weaker_form, type: "Optional<connectors.cli.PlatformGuaranteeWeakerForm>"}
    invariants:
      # A weaker form is named exactly when the guarantee holds weaker.
      - any:
          - {support: weaker}
          - {weaker_form: {exists: false}}
      - any:
          - not: {support: weaker}
          - {weaker_form: {exists: true}}
      - any:
          - not: {os: linux}
          - {support: holds}
      - any:
          - not: {os: macos}
          - not: {guarantee: sealed_executable}
          - all: [{support: weaker}, {weaker_form: owner_private_copy}]
      - any:
          - not: {os: macos}
          - not: {guarantee: parent_death_kill}
          - all: [{support: weaker}, {weaker_form: adapter_channel_close}]
      - any:
          - not: {os: macos}
          - not: {guarantee: exact_process_signal}
          - all: [{support: weaker}, {weaker_form: child_reap_lock}]
      - any:
          - not: {os: macos}
          - not: {guarantee: own_image_build_measure}
          - all: [{support: weaker}, {weaker_form: launch_path_read}]
      - any:
          - not: {os: macos}
          - not: {guarantee: atomic_no_replace_rename}
          - {support: holds}
      - any:
          - not: {os: macos}
          - not: {guarantee: atomic_close_on_exec}
          - all: [{support: weaker}, {weaker_form: set_after_receive}]
      - any:
          - not: {os: macos}
          - not: {guarantee: peer_credential_snapshot}
          - all: [{support: weaker}, {weaker_form: separate_pid_query}]
      - any:
          - not: {os: windows}
          - not: {guarantee: sealed_executable}
          - all: [{support: weaker}, {weaker_form: deny_write_copy}]
      - any:
          - not: {os: windows}
          - not: {guarantee: parent_death_kill}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: exact_process_signal}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: own_image_build_measure}
          - all: [{support: weaker}, {weaker_form: launch_path_read}]
      - any:
          - not: {os: windows}
          - not: {guarantee: atomic_no_replace_rename}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: atomic_close_on_exec}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: peer_credential_snapshot}
          - all: [{support: weaker}, {weaker_form: client_token_query}]
  # How `connections launch` hands the consumer its credential, fixed by the
  # platform the binary was built for (contracts/cli/v1alpha1/consumer-launch.md
  # §3 and §8):
  # - descriptor_3: the credential is a read-only descriptor at 3 (Linux, macOS).
  # - inherited_handle: the credential is one read-only handle the consumer
  #   inherits, the only handle besides its standard ones in the
  #   PROC_THREAD_ATTRIBUTE_HANDLE_LIST it is created with; the environment
  #   variable CONNECTORS_CREDENTIAL_HANDLE holds the handle's value in decimal
  #   (Windows). The variable carries the handle value, never the document. The
  #   consumer's environment is otherwise the caller's variables its entry's
  #   pass_env prefixes select, names matched in any letter case, and SystemRoot.
  - name: connectors.cli.ConsumerCredentialDelivery
    kind: enum
    variants: [descriptor_3, inherited_handle]
  # One row of the consumer delivery table. The invariants are the table.
  # ESS-LIMIT: as for PlatformGuaranteeStatement, the type states what a row must
  # say, not that the table has one row per os; consumer-launch.md lists them.
  - name: connectors.cli.ConsumerCredentialDeliveryStatement
    kind: struct
    fields:
      - {name: os, type: "connectors.cli.OperatingSystem"}
      - {name: delivery, type: "connectors.cli.ConsumerCredentialDelivery"}
      - {name: handle_variable, type: "Optional<String>"}
    invariants:
      # A handle variable is named exactly when the credential is an inherited handle.
      - any:
          - {delivery: inherited_handle}
          - {handle_variable: {exists: false}}
      - any:
          - not: {delivery: inherited_handle}
          - handle_variable == "CONNECTORS_CREDENTIAL_HANDLE"
      - any:
          - {os: windows}
          - {delivery: descriptor_3}
      - any:
          - not: {os: windows}
          - {delivery: inherited_handle}
