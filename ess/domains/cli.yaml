# ESS-LIMIT executable obligations (ESS 0.40 has no file-system, process, terminal
# or OS-permission construct, no TOML/JSON reader-closure or codec construct, no
# redaction construct, no count over the records of an entity, and no guard that
# compares a subject field with a field of a related record; its only
# multi-record effect, `affects:` (ess/16), sets fields and cannot take a
# transition, and the Entity Runtime lowering refuses it (SetEffectUnsupported)):
# context/path and selector resolution, bounds,
# closed TOML decoding/defaults, JSON carrier parsing/duplicate-key/depth checks,
# dynamic input/result schema resolution, status one-of, acquisition state/reason
# and yielded-connection projection, cached/stale and page validity reduction,
# and error/code/exit
# combinations, current owner/management/business admission, private source
# permission and no-symlink checks, terminal echo restoration, secret redaction,
# immutable durable keyring versions, publication/revoke/final-dispatch fences,
# same-identity repair and restart recovery, launch coalescing, exact owned
# incarnation stop and durable suppression, readiness/deadlines/autostart isolation,
# durable open checkpoints on every store setup init creates and through
# `setup checkpoints-enable` (its confirmation refusal, owner lifetime-lock refusal,
# idempotent already_enabled answer and one-way statement). Checkpoint installation
# is Eventlog provider bookkeeping, like local_authority (docs/local-er-metadata.md),
# so it is no entity, command or lifecycle state here.
# All are required by the contract; this model does not claim to execute them.
# Safe management request values omit credential_document. Only the separately
# bound local protected action receives that ephemeral document, and it must
# never reach logs, persistent state, ordinary provider invocation or outputs.
# ESS structural schema projection proves none of the Linux/process/custody rules.

entities:
  - name: connectors.cli.LocalRuntimeRecord
    identity: {name: instance_id, type: String}
    fields:
      - {name: suppressed, type: Boolean}
      - {name: selection, type: "Optional<String>"}
      - {name: bootstrap, type: "Optional<connectors.cli.PrivateAdapterBootstrap>"}
      - {name: observed_at, type: "Optional<Timestamp>"}
      - {name: build_version, type: "Optional<String>"}
    lifecycle:
      initial: Retained
      states: [Retained]
      terminal: [Retained]
      transitions:
        - {name: set_suppression, from: [Retained], to: Retained}
        - {name: remember_bootstrap, from: [Retained], to: Retained}
    # Durable stop suppression and the bounded cached bootstrap owned by local
    # configuration. A cached bootstrap never establishes live readiness.
    # build_version is the release version of the build that wrote the cached
    # bootstrap, so a refusal can be traced to the build that produced it. A record
    # written before it was recorded has none, and the next bootstrap a build
    # remembers records that build's; a suppression change keeps it. Remembering a
    # bootstrap always records one.

  - name: connectors.cli.StoreWriter
    identity: {name: store, type: String}
    fields:
      - {name: binary_version, type: String}
      - {name: model_digest, type: String}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
      transitions:
        - {name: raise, from: [Recorded], to: Recorded}
    # The metadata store's writer marker: the newest binary that wrote the store
    # (its release version) and the digest of the record model it persists. One per
    # store, identity `store`. A binary records it in the batch of its first write
    # when it is absent, and raises it in the batch of its first write when its own
    # release version is newer; it never lowers it, and an equal version keeps it.
    # Before any command reads the store's records it compares the marker with its
    # own: a different model digest under a newer version refuses
    # metadata_schema_newer; the same digest under a newer version is admitted. A
    # binary_version this binary cannot order under a different model digest refuses
    # metadata_schema_newer with store_version `unrecorded`; under the same digest
    # it is admitted and kept, since it is never known to be lower.
    # The model digest is SHA-256 over the persisted record shapes of the Entity
    # Runtime definitions: per entity its name, identity field, lifecycle states,
    # field schema (names, types, required-ness, bounds, enumerations) and the
    # assertions of its invariants, without invariant names or messages, which
    # the generator chooses. A release that changes only generated text keeps it.
    # ESS-LIMIT: binary_version is a SemVer 2.0.0 version and "newer" is SemVer
    # precedence (a pre-release orders below its release; build metadata is
    # ignored; a pre-release longer than 40 bytes is not ordered), and "never
    # lowered" compares the input with the current field. ESS has no version type,
    # no version order, no string pattern and no guard comparing a command input
    # with a subject field, so the host enforces all three and tests pin them; the
    # field stays a String. Every store written before the marker existed has none
    # and is admitted; it gets one on its next write.

  - name: connectors.cli.ConnectionListCursor
    identity: {name: cursor_id, type: Uuid}
    fields:
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: configuration_revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: last_connection_ref, type: String}
      - {name: page_limit, type: Integer}
      - {name: expires_at, type: Timestamp}
    # contracts/cli/v1alpha1/semantics.md:998, docs/local-connection-registry.md:222-223;
    # the host refuses any other limit before recording (registry/observation.rs `list`).
    invariants:
      - page_limit >= 1
      - page_limit <= 500
    relations:
      - {name: instance, kind: references, target: connectors.declarations.ServiceConfiguration, cardinality: one, via: instance_id}
    lifecycle:
      initial: Active
      states: [Active, Expired]
      terminal: [Expired]
      transitions:
        - {name: expire, from: [Active], to: Expired}
    # This is the opaque cross-process stale-page fence. It grants no provider,
    # connection or dispatch authority and is retained after logical expiry.
    # ESS-LIMIT: a cursor is stale when its registry_epoch differs from the
    # ServiceConfiguration's, which publication, revoke and known invalidity advance
    # (docs/local-connection-registry.md:224-225); the 300 s expiry and the 10,000
    # live-cursor cap (:188) are host rules. The guard over the related
    # configuration's field is `when_related:`, added in ESS 0.41 at source format
    # ess/18; this specification is ess/15, which refuses it
    # (unsupported_format_version), and the ESS 0.52 Entity Runtime lowering
    # refuses it at any format (RelatedGuardUnsupported). ESS 0.52 has no count
    # over an entity's records and no trusted time.

errors:
  - name: connectors.cli.CursorStateConflict
    fields: [{name: state, type: connectors.cli.ConnectionListCursor.State}]

commands:
  - name: connectors.cli.RecordLocalRuntime
    input:
      - {name: instance_id, type: String}
      - {name: suppressed, type: Boolean}
      - {name: selection, type: "Optional<String>"}
      - {name: bootstrap, type: "Optional<connectors.cli.PrivateAdapterBootstrap>"}
      - {name: observed_at, type: "Optional<Timestamp>"}
      - {name: build_version, type: "Optional<String>"}
    outcomes:
      - name: recorded
        creates: connectors.cli.LocalRuntimeRecord
        instance: instance_id
        emits: [connectors.cli.LocalRuntimeRecorded]
        payload:
          connectors.cli.LocalRuntimeRecorded:
            instance_id: input.instance_id
        sets:
          suppressed: input.suppressed
          selection: input.selection
          bootstrap: input.bootstrap
          observed_at: input.observed_at
          build_version: input.build_version
  - name: connectors.cli.SetLocalRuntimeSuppression
    input:
      - {name: instance_id, type: String}
      - {name: suppressed, type: Boolean}
    outcomes:
      - name: updated
        moves: connectors.cli.LocalRuntimeRecord.set_suppression
        instance: instance_id
        emits: [connectors.cli.LocalRuntimeSuppressionSet]
        payload:
          connectors.cli.LocalRuntimeSuppressionSet:
            instance_id: input.instance_id
            suppressed: input.suppressed
        sets: {suppressed: input.suppressed}
  - name: connectors.cli.RememberLocalRuntimeBootstrap
    input:
      - {name: instance_id, type: String}
      - {name: selection, type: String}
      - {name: bootstrap, type: connectors.cli.PrivateAdapterBootstrap}
      - {name: observed_at, type: Timestamp}
      - {name: build_version, type: String}
    outcomes:
      - name: remembered
        moves: connectors.cli.LocalRuntimeRecord.remember_bootstrap
        instance: instance_id
        emits: [connectors.cli.LocalRuntimeBootstrapRemembered]
        payload:
          connectors.cli.LocalRuntimeBootstrapRemembered:
            instance_id: input.instance_id
        sets:
          selection: input.selection
          bootstrap: input.bootstrap
          observed_at: input.observed_at
          build_version: input.build_version
  - name: connectors.cli.RecordStoreWriter
    input:
      - {name: store, type: String}
      - {name: binary_version, type: String}
      - {name: model_digest, type: String}
    outcomes:
      - name: recorded
        creates: connectors.cli.StoreWriter
        instance: store
        emits: [connectors.cli.StoreWriterRecorded]
        payload:
          connectors.cli.StoreWriterRecorded:
            store: input.store
            binary_version: input.binary_version
        sets:
          binary_version: input.binary_version
          model_digest: input.model_digest
  - name: connectors.cli.RaiseStoreWriter
    input:
      - {name: store, type: String}
      - {name: binary_version, type: String}
      - {name: model_digest, type: String}
    outcomes:
      - name: raised
        moves: connectors.cli.StoreWriter.raise
        instance: store
        emits: [connectors.cli.StoreWriterRaised]
        payload:
          connectors.cli.StoreWriterRaised:
            store: input.store
            binary_version: input.binary_version
        sets:
          binary_version: input.binary_version
          model_digest: input.model_digest
  - name: connectors.cli.RecordConnectionListCursor
    input:
      - {name: cursor_id, type: Uuid}
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: configuration_revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: last_connection_ref, type: String}
      - {name: page_limit, type: Integer}
      - {name: expires_at, type: Timestamp}
    outcomes:
      - name: recorded
        creates: connectors.cli.ConnectionListCursor
        instance: cursor_id
        emits: [connectors.cli.ConnectionListCursorRecorded]
        payload:
          connectors.cli.ConnectionListCursorRecorded:
            cursor_id: input.cursor_id
        sets:
          instance_id: input.instance_id
          adapter_id: input.adapter_id
          configuration_revision: input.configuration_revision
          registry_epoch: input.registry_epoch
          last_connection_ref: input.last_connection_ref
          page_limit: input.page_limit
          expires_at: input.expires_at
  - name: connectors.cli.ExpireConnectionListCursor
    input: [{name: cursor_id, type: Uuid}]
    outcomes:
      - name: expired
        moves: connectors.cli.ConnectionListCursor.expire
        instance: cursor_id
        emits: [connectors.cli.ConnectionListCursorExpired]
        payload:
          connectors.cli.ConnectionListCursorExpired:
            cursor_id: input.cursor_id
      - name: wrong-state
        wrong_state: true
        error: connectors.cli.CursorStateConflict
    # DECIDED 2026-09-27: expiring an Expired cursor refuses with CursorStateConflict;
    # stale cursors refuse (contracts/cli/v1alpha1/semantics.md:1002) and the host
    # removal path (er.rs:4538-4540) only expires Active cursors. The error name is
    # the decision; no source names one.

events:
  - name: connectors.cli.LocalRuntimeRecorded
    fields: [{name: instance_id, type: String}]
  - name: connectors.cli.LocalRuntimeSuppressionSet
    fields:
      - {name: instance_id, type: String}
      - {name: suppressed, type: Boolean}
  - name: connectors.cli.LocalRuntimeBootstrapRemembered
    fields: [{name: instance_id, type: String}]
  - name: connectors.cli.StoreWriterRecorded
    fields:
      - {name: store, type: String}
      - {name: binary_version, type: String}
  - name: connectors.cli.StoreWriterRaised
    fields:
      - {name: store, type: String}
      - {name: binary_version, type: String}
  - name: connectors.cli.ConnectionListCursorRecorded
    fields: [{name: cursor_id, type: Uuid}]
  - name: connectors.cli.ConnectionListCursorExpired
    fields: [{name: cursor_id, type: Uuid}]

views:
  - name: connectors.cli.ConnectionListCursors
    source: connectors.cli.ConnectionListCursor
    consistency: read_your_writes
    fields:
      - {name: cursor_id, type: Uuid}
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: configuration_revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: last_connection_ref, type: String}
      - {name: page_limit, type: Integer}
      - {name: state, type: connectors.cli.ConnectionListCursor.State}
  - name: connectors.cli.LocalRuntimeRecords
    source: connectors.cli.LocalRuntimeRecord
    consistency: read_your_writes
    fields:
      - {name: instance_id, type: String}
      - {name: selection, type: "Optional<String>"}
      - {name: state, type: connectors.cli.LocalRuntimeRecord.State}

actors:
  - name: connectors.cli.LocalHost
    may:
      - connectors.cli.ExpireConnectionListCursor
      - connectors.cli.RecordConnectionListCursor
      - connectors.cli.RaiseStoreWriter
      - connectors.cli.RecordLocalRuntime
      - connectors.cli.RecordStoreWriter
      - connectors.cli.RememberLocalRuntimeBootstrap
      - connectors.cli.SetLocalRuntimeSuppression
