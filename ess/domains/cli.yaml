  # no_owner is a success: no owner ran, and nothing was started or created.
  - name: connectors.cli.OwnerStopDisposition
    kind: enum
    variants: [stopped, no_owner]
  # host_incarnation is the incarnation that greeted and exited, present exactly
  # when stopped; that cross-field requirement is a runtime obligation, as for
