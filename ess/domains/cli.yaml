  # is both the caller's confirmation and the result's statement of that change.
  # UNMAPPED: Entity Runtime 0.29.0 also offers disable_durable_open_checkpoints,
  # which makes the store openable by older releases again. The decision names no
  # disable command for connectors; none is modelled. Open question for the owner.
