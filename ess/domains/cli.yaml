  # Which transient class a `connections revalidate` failure at stage dispatch ended on,
  # after the owner's bounded retries within the revalidation deadline
  # (contracts/cli/v1alpha1/semantics.md §6, "Revalidation retries"). provider_unavailable:
  # the adapter's validation answered unavailable (a provider connection refused, reset or
  # closed, a name that does not resolve; an adapter whose identity or scope probe maps
  # an HTTP 429 or 5xx to unavailable). provider_timeout: the probe's deadline passed.
  # provider_rate_limited and provider_internal: an adapter that reports the provider's 429
  # or internal error itself. provider_capacity: a marked upstream capacity answer.
  # adapter_exited: the adapter process was no longer running after the failed attempt.
  # owner_stopping: the owner began to stop during the revalidation.
  - name: connectors.cli.FailureCause
    kind: enum
    variants: [provider_unavailable, provider_timeout, provider_rate_limited, provider_internal, provider_capacity, adapter_exited, owner_stopping]
  # Which revision an `--expected-revision` names (story:connectors-do-short-invocation):
  # a connection's public revision, which `connections describe` reads, or an instance's
  # configuration_revision.
  - name: connectors.cli.RevisionKind
    kind: enum
    variants: [connection, configuration]
  - name: connectors.cli.ConfigurationFormat
    kind: enum
    variants: [connectors-local/1, connectors-local/2, connectors-local/3, connectors-local/4, connectors-local/5]
  # Which rule of the configuration stage refused (contracts/cli/v1alpha1/semantics.md
  # §3): no absolute configuration path resolves (config_path_unresolved), no file is
  # at the resolved path (config_missing), the file or a directory above it is not
  # owner-only (config_not_private), or owner_uid is not the effective user
  # (owner_uid_mismatch). approval_clock_format_retired is a clock use's refusal, not a
  # whole-configuration one: the [approval_clock] table is the retired single-source
  # roughtime-clock/1 shape, which loads but answers no clock use until it is rewritten
  # as roughtime-quorum/1 (docs/local-clock.md). config_too_large: a configuration
  # text is larger than the most a read admits; `setup migrate` refuses a rewritten
  # file past that bound and writes nothing. definition_instance_configured: an
  # `operations invoke --definition` whose connector already has an instance named
  # `definition`, or the moved `definition-<16 hex>` the file resolves to, in the
  # configuration, or whose instance id an entry there already uses; the configured
  # one is never replaced. It names the rule only, never a path
  # or OS text.
  - name: connectors.cli.ConfigurationRule
    kind: enum
    variants: [config_path_unresolved, config_missing, config_not_private, owner_uid_mismatch, approval_clock_format_retired, config_too_large, definition_instance_configured]
