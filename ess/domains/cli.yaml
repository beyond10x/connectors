domain: connectors.cli
summary: Selected local CLI presentation values and the existing local configuration owner's durable runtime facts.

# Owner: contracts/cli/v1alpha1/semantics.md. Process globals live in ess-cli/1
# Context, not these payloads. Existing auth/declaration identities retain their
# String representations; these value references establish no entity relations.
types:
  # Local approval commands project existing policy/subject owners. A preparation
  # is metadata, not a lease or proof; issuance returns no protected proof bytes.
  - name: connectors.cli.ApprovalPolicyView
    kind: struct
    fields:
      - {name: policy_id, type: String}
      - {name: instance_id, type: String}
      - {name: issuer_id, type: String}
      - {name: revision, type: Integer}
      - {name: owner_uid, type: Integer}
      - {name: selection, type: connectors.local_approval_policy.Selection}
      - {name: operations, type: "List<String>"}
  - name: connectors.cli.ApprovalPolicyStatusInput
    kind: struct
    fields:
      - {name: adapter, type: String}
  - name: connectors.cli.ApprovalPolicySetInput
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: expected_revision, type: "Optional<Integer>"}
      - {name: input_file, type: String}
  - name: connectors.cli.ApprovalPolicyResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: policy, type: "Optional<connectors.cli.ApprovalPolicyView>"}
  - name: connectors.cli.ApprovalPrepareInput
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connection, type: String}
      - {name: operation, type: String}
      - {name: schema, type: String}
      - {name: revision, type: String}
      - {name: input, type: String}
  - name: connectors.cli.ApprovalPrepareResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: preparation, type: connectors.delegation.ApprovalPreparation}
  - name: connectors.cli.ApprovalIssueInput
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connection, type: String}
      - {name: operation, type: String}
      - {name: schema, type: String}
      - {name: revision, type: String}
      - {name: input, type: String}
      - {name: approve_subject, type: String}
      - {name: proof_output, type: String}
  - name: connectors.cli.ApprovalIssueDisposition
    kind: enum
    variants: [published]
  - name: connectors.cli.ApprovalIssueResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: reference, type: String}
      - {name: subject_sha256, type: String}
      - {name: disposition, type: connectors.cli.ApprovalIssueDisposition}
  - name: connectors.cli.ApprovalClockCheckInput
    kind: struct
    fields:
      - {name: adapter, type: String}
  - name: connectors.cli.ApprovalClockCheckResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: observation, type: connectors.clock.Observation}
    # ESS-LIMIT: clock.md:84 orders an observation (upper >= lower). The comparison
    # is writable here, but ESS 0.52 `specify cli` refuses any invariant on a CLI
    # type ("unsupported invariants or union semantics"), so it is not declared.
  - name: connectors.cli.ApprovalKeyState
    kind: enum
    variants: [candidate, active, retired, retiring, deleted]
  - name: connectors.cli.ApprovalKeyView
    kind: struct
    fields:
      - {name: key_id, type: String}
      - {name: public_key, type: String}
      - {name: state, type: connectors.cli.ApprovalKeyState}
  - name: connectors.cli.ApprovalIssuerView
    kind: struct
    fields:
      - {name: issuer, type: String}
      - {name: audience, type: String}
      - {name: revision, type: String}
      - {name: keys, type: "List<connectors.cli.ApprovalKeyView>"}
  - name: connectors.cli.ApprovalKeysResult
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: issuer, type: "Optional<connectors.cli.ApprovalIssuerView>"}
  - name: connectors.cli.ApprovalKeyStatusInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
  - name: connectors.cli.ApprovalKeyInitInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: expected_revision, type: "Optional<String>"}
  - name: connectors.cli.ApprovalKeyRotateInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: expected_revision, type: "String"}
      - {name: expected_key, type: "String"}
  - name: connectors.cli.ApprovalKeyRecoverInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: expected_revision, type: "String"}
      - {name: candidate, type: "String"}
  - name: connectors.cli.ApprovalKeyRevokeInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: expected_revision, type: "String"}
      - {name: expected_key, type: "String"}
  - name: connectors.cli.ApprovalKeyRetireInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: expected_revision, type: "String"}
      - {name: key, type: "String"}
  # Local configuration-owner bindings, not independent identities or grants.
  - name: connectors.cli.LocalOperationPolicy
    kind: struct
    fields:
      - {name: profiles, type: "List<String>"}
      - {name: operations, type: "List<String>"}
  # secret_service_socket selects the Secret Service bus on Linux only; the macOS and
  # Windows backends take no binding and refuse one.
  # binding and directory are the `[custody]` table of a `connectors-local/4`
  # configuration (contracts/cli/v1alpha1/semantics.md §3). Absent, custody is the
  # platform binding. binding names one the build supports; mounted_secret, Linux
  # only, is the explicit read-only binding over a mounted directory
  # (contracts/auth/custody/v1alpha1/semantics.md §5.2). directory is an
  # infrastructure binding of the owner configuration, like secret_service_socket,
  # never a per-credential locator; no request selects a binding, directory or item.
  - name: connectors.cli.LocalCustodyBinding
    kind: struct
    fields:
      - {name: secret_service_socket, type: "Optional<String>"}
      - {name: binding, type: "Optional<connectors.cli.CustodyBackend>"}
      - {name: directory, type: "Optional<String>"}
    invariants:
      # directory is defined exactly when the binding is mounted_secret.
      - any:
          - {binding: mounted_secret}
          - {directory: {exists: false}}
      - any:
          - not: {binding: mounted_secret}
          - {directory: {exists: true}}
      # The Secret Service bus is never named beside the mounted binding.
      - any:
          - not: {binding: mounted_secret}
          - {secret_service_socket: {exists: false}}
  # Lowercase hex SHA-256 of an executable, as owner/transport.rs writes it (hex::encode)
  # in own_build.
  - name: connectors.cli.BuildDigest
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
    invariants:
      - value.count == 64
  # Owner frames are serde `kind`-tagged (Request and Reply in local/owner.rs); each
  # frame declares its tag as a `kind` field. Request::Hello and Reply::Hello both
  # serialize as "hello".
  - name: connectors.cli.LocalOwnerHelloKind
    kind: enum
    variants: [hello]
  # Request::Hello, the greeting the CLI sends; build is absent only from callers
  # built before the build handshake.
  - name: connectors.cli.LocalOwnerHello
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerHelloKind}
      - {name: version, type: String}
      - {name: challenge, type: Uuid}
      - {name: configuration, type: String}
      - {name: authority, type: Uuid}
      - {name: build, type: "Optional<connectors.cli.BuildDigest>"}
  - name: connectors.cli.LocalOwnerGreeting
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerHelloKind}
      - {name: version, type: String}
      - {name: challenge, type: Uuid}
      - {name: host_incarnation, type: Uuid}
      - {name: authority, type: Uuid}
      - {name: build, type: "Optional<connectors.cli.BuildDigest>"}
    # build is returned only to a caller whose LocalOwnerHello carried its own; a
    # caller that omitted it may send LocalOwnerBuildRequest, answered with LocalOwnerBuild.
  # Request::Build is a unit variant: its whole frame is {"kind": "build"}. ESS refuses
  # a struct with no fields (ESS-TYPE-007).
  - name: connectors.cli.LocalOwnerBuildKind
    kind: enum
    variants: [build]
  - name: connectors.cli.LocalOwnerBuildRequest
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerBuildKind}
  - name: connectors.cli.LocalOwnerBuild
    kind: struct
    fields:
      - {name: build, type: connectors.cli.BuildDigest}
  # Request::Cached: a CLI's read of an adapter's cached description through the
  # running owner, answered from the owner's held metadata handle instead of a
  # direct open of the store (contracts/cli/v1alpha1/owner.md). Sent only to an
  # owner of the CLI's own build; without a reachable owner, or after an exchange that
  # failed past the greeting, the CLI reads directly.
  - name: connectors.cli.LocalOwnerCachedKind
    kind: enum
    variants: [cached]
  - name: connectors.cli.LocalOwnerCachedRequest
    kind: struct
    fields:
      - {name: kind, type: connectors.cli.LocalOwnerCachedKind}
      - {name: adapter, type: String}
  # The answer: the cached bootstrap the owner holds for the adapter's configured
  # instance and selection. Refusals keep the codes of a direct read
  # (not_found, description_unavailable, metadata_unavailable).
  - name: connectors.cli.LocalOwnerCached
    kind: struct
    fields:
      - {name: bootstrap, type: connectors.cli.PrivateAdapterBootstrap}
  - name: connectors.cli.LocalCaptureAdmission
    kind: struct
    fields:
      - {name: acquisition, type: String}
      - {name: expires_at_ms, type: Timestamp}
      - {name: profile, type: connectors.cli.PrivateStaticProfile}
  # Transient admitted use of the existing immutable generation/custody version.
  # No public handle, new generation, or independently owned evidence entity.
  - name: connectors.cli.LocalRevalidationAdmission
    kind: struct
    fields:
      - {name: connection, type: String}
      - {name: generation, type: String}
      - {name: custody_version, type: String}
      - {name: publication_fence, type: String}
      - {name: captured_at_ms, type: Timestamp}
      - {name: expires_at_ms, type: Timestamp}
  # Private local transport values, owned by contracts/cli/v1alpha1/private-adapter.md.
  # They bind existing owners and are not public CLI results or persisted entities.
  - name: connectors.cli.PrivateEntryField
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: label, type: String}
      - {name: max_bytes, type: Integer}
  - name: connectors.cli.PrivateStaticProfile
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: revision, type: String}
      - {name: purpose, type: connectors.auth_access.Purpose}
      - {name: subject, type: connectors.auth_access.Subject}
      - {name: scheme, type: connectors.auth_access.Scheme}
      - {name: capability, type: connectors.auth_access.CapabilityName}
      - {name: minimum_scopes, type: "List<String>"}
      - {name: evidence_lifetime_ms, type: Integer}
      - {name: fields, type: "List<connectors.cli.PrivateEntryField>"}
      - {name: acquisition, type: "Optional<connectors.cli.PrivateProfileAcquisition>"}
  # Present only for a profile whose entry is acquired by OAuth consent; the
  # authorize and token endpoints and the requested scopes, all nonsecret.
  - name: connectors.cli.PrivateProfileAcquisition
    kind: struct
    fields:
      - {name: authorize_url, type: String}
      - {name: token_url, type: String}
      - {name: scopes, type: "List<String>"}
  - name: connectors.cli.PrivateOperationEffect
    kind: enum
    variants: [read, write, unknown]
  - name: connectors.cli.PrivateOperationRequirement
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: profile, type: String}
      - {name: scopes, type: "List<String>"}
      - {name: effect, type: connectors.cli.PrivateOperationEffect}
  - name: connectors.cli.PrivateAdapterBootstrap
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: adapter, type: String}
      - {name: protocol, type: String}
      - {name: configuration_revision, type: String}
      - {name: provider_authority, type: String}
      - {name: descriptor, type: String}
      - {name: profiles, type: "List<connectors.cli.PrivateStaticProfile>"}
      - {name: requirements, type: "List<connectors.cli.PrivateOperationRequirement>"}
    # descriptor is one bounded JSON document, decoded as the existing Descriptor.
  - name: connectors.cli.PrivateBaseline
    kind: struct
    fields:
      - {name: identity, type: connectors.credentials.ExternalIdentity}
      - {name: granted_scopes, type: "Optional<List<String>>"}
      - {name: credential_expires_at_ms, type: "Optional<Timestamp>"}
      - {name: collected_at_ms, type: Timestamp}
      - {name: valid_until_ms, type: Timestamp}
  - name: connectors.cli.StartupMode
    kind: enum
    variants: [on-demand, automatic]
  - name: connectors.cli.RestartPolicy
    kind: enum
    variants: [never]
  - name: connectors.cli.OperatingSystem
    kind: enum
    variants: [linux, macos, windows]
  # The protected store custody uses, fixed by the platform the binary was built for:
  # the freedesktop Secret Service on Linux, the login keychain on macOS, the
  # Credential Manager on Windows (contracts/auth/custody/v1alpha1/semantics.md §5.1),
  # or mounted_secret, the read-only binding over a mounted directory that only an
  # explicit `[custody]` selection in the owner configuration chooses (§5.2).
  # There is no fallback variant: mounted_secret is explicit and read-only, and
  # nothing selects it when the platform binding is unusable.
  - name: connectors.cli.CustodyBackend
    kind: enum
    variants: [secret_service, macos_keychain, windows_credential_manager, mounted_secret]
  # The operating-system guarantees the local host builds on, each fixed by the
  # platform the binary was built for (contracts/cli/v1alpha1/semantics.md §7,
  # "macOS platform guarantees" and "Windows platform guarantees"):
  # - sealed_executable: an admitted adapter or consumer image cannot change
  #   between its digest check and exec (private-adapter.md, consumer-launch.md §3).
  # - parent_death_kill: a launched child is ended when the process that
  #   launched it dies.
  # - exact_process_signal: stop and cleanup signal only the exact owned child,
  #   never a reused process id.
  # - own_image_build_measure: the owner build digest is the image running,
  #   not the file at its launch path (owner.md).
  # - atomic_no_replace_rename: a durable publication rename refuses an existing
  #   destination in the same call.
  # - atomic_close_on_exec: a descriptor received over the owner socket is
  #   close-on-exec from the moment it is received.
  # - peer_credential_snapshot: a socket peer's uid and pid are read together, as
  #   the kernel recorded them at connect.
  - name: connectors.cli.PlatformGuarantee
    kind: enum
    variants: [sealed_executable, parent_death_kill, exact_process_signal, own_image_build_measure, atomic_no_replace_rename, atomic_close_on_exec, peer_credential_snapshot]
  - name: connectors.cli.GuaranteeSupport
    kind: enum
    variants: [holds, weaker, absent]
  # The named form a guarantee takes where it holds only weaker:
  # - owner_private_copy: the image is a mode 0500 copy in a mode 0700 directory,
  #   digest-checked before exec; other users cannot change it, the same user can.
  #   A copy that is refused or never launched is removed with its directory;
  #   a launched copy is removed once, by the launch, after the exec it serves.
  # - adapter_channel_close: an adapter exits when its inherited channel closes;
  #   a consumer has no such channel and outlives a dead launcher.
  # - child_reap_lock: a child is signalled by process id, under the same lock
  #   that reaps it, so the id cannot be reused between the check and the signal.
  # - launch_path_read: the digest is read from the executable's path; a file
  #   replaced there is measured as a new build (owner_build_mismatch).
  # - set_after_receive: close-on-exec is set right after the receive returns; a
  #   concurrent exec in the same process in between inherits the descriptor.
  # - separate_pid_query: the uid and gid are the connect-time snapshot; the pid
  #   is a separate query, used by the owner and supervisor only for its sign;
  #   an adapter also requires it to equal its parent's process id. A peer that
  #   has already closed has no pid: the owner and supervisor admit it by its
  #   uid, an adapter refuses it.
  # - deny_write_copy: the image is a copy in a fresh owner-only directory inside
  #   the state directory's owner-only run directory, opened for reading without
  #   write or delete sharing before its digest check and held, with its
  #   directory, until the child is created; from that open no process can open it
  #   for writing, rename or delete it or its directory. A writable mapping a
  #   process of the same user made before that open is not excluded.
  # - client_token_query: the pipe's access control admits the current user alone
  #   at connect; the client's process id is the connect-time record, and its user
  #   is read afterwards from that process's token, a separate query that reads
  #   another process if the client exited and its id was reused. Besides the user,
  #   that token's integrity level must equal this process's and it must not be
  #   restricted, on both ends: a peer of the same user at another integrity level,
  #   or with a restricted token, is refused as lifecycle_conflict, by an owner with
  #   that reply rather than a closed stream.
  - name: connectors.cli.PlatformGuaranteeWeakerForm
    kind: enum
    variants: [owner_private_copy, adapter_channel_close, child_reap_lock, launch_path_read, set_after_receive, separate_pid_query, deny_write_copy, client_token_query]
  # One row of the platform guarantee table. Linux holds every guarantee. macOS
  # holds atomic_no_replace_rename (renamex_np RENAME_EXCL on a filesystem that
  # reports VOL_CAP_INT_RENAME_EXCL, APFS) and holds each other one only in its
  # named weaker form. Windows holds parent_death_kill (every child created in a
  # job object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE through
  # PROC_THREAD_ATTRIBUTE_JOB_LIST; an adapter's job permits no breakaway, a
  # consumer's permits breakaway on request, JOB_OBJECT_LIMIT_BREAKAWAY_OK and
  # never the silent form, so an owner a consumer starts can leave it, while the
  # consumer itself stays in it), exact_process_signal (the held process
  # handle), atomic_no_replace_rename (MoveFileExW without
  # MOVEFILE_REPLACE_EXISTING, on NTFS) and atomic_close_on_exec (handles
  # duplicated non-inheritable, children given an explicit handle list), and holds
  # each other one only in its named weaker form. The invariants are the table.
  # ESS-LIMIT: the type states what a row must say, not that the table has one
  # row per (os, guarantee); the contracts list them.
  - name: connectors.cli.PlatformGuaranteeStatement
    kind: struct
    fields:
      - {name: os, type: "connectors.cli.OperatingSystem"}
      - {name: guarantee, type: "connectors.cli.PlatformGuarantee"}
      - {name: support, type: "connectors.cli.GuaranteeSupport"}
      - {name: weaker_form, type: "Optional<connectors.cli.PlatformGuaranteeWeakerForm>"}
    invariants:
      # A weaker form is named exactly when the guarantee holds weaker.
      - any:
          - {support: weaker}
          - {weaker_form: {exists: false}}
      - any:
          - not: {support: weaker}
          - {weaker_form: {exists: true}}
      - any:
          - not: {os: linux}
          - {support: holds}
      - any:
          - not: {os: macos}
          - not: {guarantee: sealed_executable}
          - all: [{support: weaker}, {weaker_form: owner_private_copy}]
      - any:
          - not: {os: macos}
          - not: {guarantee: parent_death_kill}
          - all: [{support: weaker}, {weaker_form: adapter_channel_close}]
      - any:
          - not: {os: macos}
          - not: {guarantee: exact_process_signal}
          - all: [{support: weaker}, {weaker_form: child_reap_lock}]
      - any:
          - not: {os: macos}
          - not: {guarantee: own_image_build_measure}
          - all: [{support: weaker}, {weaker_form: launch_path_read}]
      - any:
          - not: {os: macos}
          - not: {guarantee: atomic_no_replace_rename}
          - {support: holds}
      - any:
          - not: {os: macos}
          - not: {guarantee: atomic_close_on_exec}
          - all: [{support: weaker}, {weaker_form: set_after_receive}]
      - any:
          - not: {os: macos}
          - not: {guarantee: peer_credential_snapshot}
          - all: [{support: weaker}, {weaker_form: separate_pid_query}]
      - any:
          - not: {os: windows}
          - not: {guarantee: sealed_executable}
          - all: [{support: weaker}, {weaker_form: deny_write_copy}]
      - any:
          - not: {os: windows}
          - not: {guarantee: parent_death_kill}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: exact_process_signal}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: own_image_build_measure}
          - all: [{support: weaker}, {weaker_form: launch_path_read}]
      - any:
          - not: {os: windows}
          - not: {guarantee: atomic_no_replace_rename}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: atomic_close_on_exec}
          - {support: holds}
      - any:
          - not: {os: windows}
          - not: {guarantee: peer_credential_snapshot}
          - all: [{support: weaker}, {weaker_form: client_token_query}]
  # How `connections launch` hands the consumer its credential, fixed by the
  # platform the binary was built for (contracts/cli/v1alpha1/consumer-launch.md
  # §3 and §8):
  # - descriptor_3: the credential is a read-only descriptor at 3 (Linux, macOS).
  # - inherited_handle: the credential is one read-only handle the consumer
  #   inherits, the only handle besides its standard ones in the
  #   PROC_THREAD_ATTRIBUTE_HANDLE_LIST it is created with; the environment
  #   variable CONNECTORS_CREDENTIAL_HANDLE holds the handle's value in decimal
  #   (Windows). The variable carries the handle value, never the document. The
  #   consumer's environment is otherwise the caller's variables its entry's
  #   pass_env prefixes select, names matched in any letter case, and SystemRoot.
  - name: connectors.cli.ConsumerCredentialDelivery
    kind: enum
    variants: [descriptor_3, inherited_handle]
  # One row of the consumer delivery table. The invariants are the table.
  # ESS-LIMIT: as for PlatformGuaranteeStatement, the type states what a row must
  # say, not that the table has one row per os; consumer-launch.md lists them.
  - name: connectors.cli.ConsumerCredentialDeliveryStatement
    kind: struct
    fields:
      - {name: os, type: "connectors.cli.OperatingSystem"}
      - {name: delivery, type: "connectors.cli.ConsumerCredentialDelivery"}
      - {name: handle_variable, type: "Optional<String>"}
    invariants:
      # A handle variable is named exactly when the credential is an inherited handle.
      - any:
          - {delivery: inherited_handle}
          - {handle_variable: {exists: false}}
      - any:
          - not: {delivery: inherited_handle}
          - handle_variable == "CONNECTORS_CREDENTIAL_HANDLE"
      - any:
          - {os: windows}
          - {delivery: descriptor_3}
      - any:
          - not: {os: windows}
          - {delivery: inherited_handle}
  - name: connectors.cli.KeyringState
    kind: enum
    variants: [available, locked, unavailable]
  - name: connectors.cli.PrerequisiteState
    kind: enum
    variants: [ready, failed, unknown]
  - name: connectors.cli.LifecycleState
    kind: enum
    variants: [not_running, starting, ready, stopping, stopped, failed, owner_unavailable, suppressed]
  - name: connectors.cli.MetadataSource
    kind: enum
    variants: [configuration, cached, authority]
  - name: connectors.cli.FailureKind
    kind: enum
    variants: [usage, operational, interrupted]
  - name: connectors.cli.FailureCode
    kind: enum
    variants: [invalid_input, invalid_configuration, configuration_exists, protected_entry_unavailable, custody_unavailable, custody_read_only, metadata_unavailable, revision_conflict, outcome_unknown, identity_mismatch, lifecycle_conflict, incarnation_mismatch, readiness_mismatch, description_unavailable, stale_description, not_found, revoked, forbidden, not_granted, unavailable, timeout, capacity, stale_cursor, unsupported, interrupted, service_failure, approval_required, approval_refused, approval_replayed, idempotency_conflict, owner_build_mismatch, confirmation_required, metadata_schema_newer]
  - name: connectors.cli.FailureStage
    kind: enum
    variants: [arguments, configuration, protected_entry, admission, launch, readiness, custody, publication, dispatch, observation, stop]
  - name: connectors.cli.NextAction
    kind: enum
    variants: [check_configuration, select_protected_source, unlock_keyring, retry_status, repair_connection, revalidate_connection, create_connection, refresh_description, request_permission, retry_explicitly, stop_owner, upgrade, none]
  - name: connectors.cli.ConfigurationFormat
    kind: enum
    variants: [connectors-local/1, connectors-local/2, connectors-local/3, connectors-local/4]
  # Which rule of the configuration stage refused (contracts/cli/v1alpha1/semantics.md
  # §3): no absolute configuration path resolves (config_path_unresolved), no file is
  # at the resolved path (config_missing), the file or a directory above it is not
  # owner-only (config_not_private), or owner_uid is not the effective user
  # (owner_uid_mismatch). It names the rule only, never a path or OS text.
  - name: connectors.cli.ConfigurationRule
    kind: enum
    variants: [config_path_unresolved, config_missing, config_not_private, owner_uid_mismatch]
  - name: connectors.cli.InitDisposition
    kind: enum
    variants: [created, state_initialized]
  - name: connectors.cli.AcquisitionState
    kind: enum
    variants: [pending, completed, failed]
  - name: connectors.cli.RevocationState
    kind: enum
    variants: [revoked]
  - name: connectors.cli.ProviderRevocationOutcome
    kind: enum
    variants: [not_requested]
  # Safe error data inside the ess-cli/1 process error envelope. No freeform exception or protected reference.
  - name: connectors.cli.Failure
    kind: struct
    fields:
      - {name: kind, type: "connectors.cli.FailureKind"}
      - {name: code, type: "connectors.cli.FailureCode"}
      # ESS-LIMIT: a read's `timeout` is at `stage = dispatch` once its
      # connectors.credential_evidence.ReadUse took `dispatch` (DispatchReadUse), and at
      # `stage = admission` before; a host that stops waiting first dispatches nothing more.
      # A sent read whose answer never arrives is `outcome_unknown`
      # (contracts/cli/v1alpha1/semantics.md). ESS 0.56 `specify cli` refuses any invariant
      # on a CLI type ("unsupported invariants or union semantics"), and this type carries no
      # dispatch fact to guard on, so the host enforces the rule and tests pin it.
      - {name: stage, type: "connectors.cli.FailureStage"}
      - {name: next_action, type: "connectors.cli.NextAction"}
      - {name: service_code, type: "Optional<connectors.service_wire.ErrorCode>"}
      # ESS-LIMIT: service_reason is at most 256 bytes of admitted provider text, present only
      # beside service_code or on a provider forbidden (contracts/cli/v1alpha1/semantics.md).
      # As for instance_id below, ESS declares no invariant on a CLI type, so the bound, the
      # redaction and the presence rule are enforced by the host and pinned by tests.
      - {name: service_reason, type: "Optional<String>"}
      # ESS-LIMIT: retry_after_seconds is the provider's Retry-After delay in whole seconds
      # (0 to 4294967295), present only beside service_code = rate_limited
      # (contracts/cli/v1alpha1/semantics.md). ESS declares no invariant on a CLI type, so the
      # range and the presence rule are enforced by the host and pinned by tests.
      - {name: retry_after_seconds, type: "Optional<Integer>"}
      - {name: connection, type: "Optional<String>"}
      - {name: acquisition, type: "Optional<String>"}
      - {name: request_id, type: "Optional<String>"}
      - {name: mutation, type: "Optional<connectors.cli.MutationObservation>"}
      - {name: source_audit, type: "Optional<connectors.service_wire.SourceAudit>"}
      - {name: configuration_format, type: "Optional<connectors.cli.ConfigurationFormat>"}
      # ESS-LIMIT: instance_id is an admitted selector (connectors_core::valid_id, at most
      # 128 bytes) and appears only with configuration_format on invalid_configuration.
      # ESS 0.52 `specify cli` refuses any invariant on a CLI type (see ApprovalClockCheckResult),
      # so both rules are enforced by the host and pinned by tests, not declared here.
      - {name: instance_id, type: "Optional<String>"}
      # ESS-LIMIT: configuration_rule appears only on invalid_configuration at stage
      # configuration. As for instance_id above, ESS declares no invariant on a CLI type,
      # so the presence rule is enforced by the host and pinned by tests.
      - {name: configuration_rule, type: "Optional<connectors.cli.ConfigurationRule>"}
      # ESS-LIMIT: store_version and binary_version appear together, only on
      # metadata_schema_newer (contracts/cli/v1alpha1/semantics.md). binary_version is
      # the refusing binary's release version; store_version is the release version the
      # store's StoreWriter marker names, or `unrecorded` when no marker names a newer
      # writer this binary can order: the Entity Runtime refused a record field this
      # binary's schema does not declare, the marker's version cannot be ordered, or
      # the store's level is above this binary's highest (its marker is then not read
      # through a schema this binary does not know). As for instance_id above, ESS
      # declares no invariant on a CLI type, so
      # the presence rule and the `unrecorded` value are enforced by the host and pinned
      # by tests.
      - {name: store_version, type: "Optional<String>"}
      - {name: binary_version, type: "Optional<String>"}
  # setup check names its prerequisites: configuration, metadata, artifact:<alias>,
  # keyring and persistent_custody_qualification under a platform binding; under the
  # explicitly selected mounted_secret binding, mounted_custody (the configured
  # directory and its items pass the binding's checks) takes the place of keyring and
  # persistent_custody_qualification (contracts/auth/custody/v1alpha1/semantics.md §5.2).
  - name: connectors.cli.Prerequisite
    kind: struct
    fields:
      - {name: name, type: "String"}
      - {name: state, type: "connectors.cli.PrerequisiteState"}
      - {name: next_action, type: "connectors.cli.NextAction"}
  - name: connectors.cli.AdapterSummary
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: instance_id, type: "String"}
      - {name: adapter_id, type: "String"}
      - {name: startup, type: "connectors.cli.StartupMode"}
      - {name: restart, type: "connectors.cli.RestartPolicy"}
  - name: connectors.cli.ConfiguredExecutable
    kind: struct
    fields:
      - {name: path, type: "String"}
      - {name: sha256, type: "String"}
      - {name: args, type: "List<String>"}
  - name: connectors.cli.AdapterConfiguration
    kind: struct
    fields:
      - {name: summary, type: "connectors.cli.AdapterSummary"}
      - {name: configuration_revision, type: "String"}
      - {name: protocol, type: "String"}
      - {name: executable, type: "connectors.cli.ConfiguredExecutable"}
  # Incarnation coordinates are observations of the existing supervisor, never PID authority or a persisted CLI entity.
  - name: connectors.cli.AdapterObservation
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: configuration_revision, type: "String"}
      - {name: state, type: "connectors.cli.LifecycleState"}
      - {name: host_incarnation, type: "Optional<String>"}
      - {name: child_incarnation, type: "Optional<String>"}
      - {name: observed_at_ms, type: "Integer"}
      - {name: failure, type: "Optional<connectors.cli.Failure>"}
  # References existing qualified Connection and AuthProfile coordinates. revision is public semantic revision, never private generation/publication fence. State is an observation, not a second lifecycle.
  - name: connectors.cli.ConnectionSummary
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: instance_id, type: "String"}
      - {name: connection, type: "String"}
      - {name: profile, type: "String"}
      - {name: revision, type: "String"}
      - {name: state, type: "connectors.connection_admission.ConnectionState"}
  - name: connectors.cli.ConnectionDescription
    kind: struct
    fields:
      - {name: summary, type: "connectors.cli.ConnectionSummary"}
      - {name: external_identity, type: "Optional<connectors.credentials.ExternalIdentity>"}
      - {name: observed_at_ms, type: "Integer"}
      - {name: valid_until_ms, type: "Integer"}
      - {name: source, type: "connectors.cli.MetadataSource"}
      - {name: stale, type: "Boolean"}
  # Public projection of the existing acquisition owner: Pending/Completing -> pending,
  # Completed -> completed, Failed/Expired -> failed. The safe reason is present
  # exactly when failed; a yielded connection is present exactly when completed.
  # Those cross-field requirements remain runtime obligations, not Optional semantics.
  - name: connectors.cli.AcquisitionObservation
    kind: struct
    fields:
      - {name: instance_id, type: "String"}
      - {name: acquisition, type: "String"}
      - {name: state, type: "connectors.cli.AcquisitionState"}
      - {name: reason, type: "Optional<connectors.auth_bindings.AcquisitionFailure>"}
      - {name: connection, type: "Optional<String>"}
      - {name: expires_at_ms, type: "Integer"}
      - {name: observed_at_ms, type: "Integer"}
      - {name: next_action, type: "connectors.cli.NextAction"}
  - name: connectors.cli.OperationSummary
    kind: struct
    fields:
      - {name: id, type: "String"}
      - {name: description, type: "String"}
      - {name: contract, type: "String"}
      - {name: profile, type: "String"}
  - name: connectors.cli.OperationDescription
    kind: struct
    fields:
      - {name: id, type: "String"}
      - {name: description, type: "String"}
      - {name: contract, type: "String"}
      - {name: profile, type: "String"}
      - {name: input_schema, type: "Json"}
      - {name: output_schema, type: "Json"}
  # Complete legacy service descriptor value; configuration_schema is a JSON text carrier.
  - name: connectors.cli.ServiceDescriptor
    kind: struct
    fields:
      - {name: version, type: "String"}
      - {name: instance, type: "String"}
      - {name: adapter, type: "String"}
      - {name: revision, type: "String"}
      - {name: operations, type: "List<connectors.cli.OperationDescription>"}
      - {name: configuration_schema, type: "String"}
  # On both dispositions the metadata store setup init creates has Entity Runtime
  # durable open checkpoints enabled before it returns; a database that already
  # exists is never enabled by setup init (decision-blocker:store-checkpoints-one-way,
  # option C; contracts/cli/v1alpha1/semantics.md §3).
  - name: connectors.cli.SetupInitResult
    kind: struct
    fields:
      - {name: disposition, type: "connectors.cli.InitDisposition"}
      - {name: config_path, type: "String"}
      - {name: state_path, type: "String"}
      - {name: os, type: "connectors.cli.OperatingSystem"}
  - name: connectors.cli.SetupCheckResult
    kind: struct
    fields:
      - {name: config_path, type: "String"}
      - {name: state_path, type: "String"}
      - {name: os, type: "connectors.cli.OperatingSystem"}
      - {name: keyring, type: "connectors.cli.KeyringState"}
      - {name: custody_backend, type: "connectors.cli.CustodyBackend"}
      - {name: prerequisites, type: "List<connectors.cli.Prerequisite>"}
  # Enabling durable open checkpoints installs Eventlog's triggers and continuity
  # tables. Entity Runtime 0.28.0 and earlier, and so connectors 0.32.0 and earlier,
  # refuse to open a store carrying them (Entity Runtime 0.29.0 CHANGELOG). One value
  # is both the caller's confirmation and the result's statement of that change.
  # UNMAPPED: Entity Runtime 0.29.0 also offers disable_durable_open_checkpoints,
  # which makes the store openable by older releases again. The decision names no
  # disable command for connectors; none is modelled. Open question for the owner.
  - name: connectors.cli.CheckpointsChange
    kind: enum
    variants: [one-way]
  - name: connectors.cli.CheckpointsDisposition
    kind: enum
    variants: [enabled, already_enabled]
  # confirm is Optional so that its absence reaches the handler, which refuses it
  # as confirmation_required before the store is opened. ess-cli/1 has no valueless
  # switch source, so the confirming flag carries its value: `--confirm one-way`.
  - name: connectors.cli.SetupCheckpointsEnableInput
    kind: struct
    fields:
      - {name: confirm, type: "Optional<connectors.cli.CheckpointsChange>"}
  # already_enabled is a success: the store already carried checkpoints and
  # nothing was changed. Both dispositions state the one-way change.
  - name: connectors.cli.SetupCheckpointsEnableResult
    kind: struct
    fields:
      - {name: disposition, type: "connectors.cli.CheckpointsDisposition"}
      - {name: state_path, type: "String"}
      - {name: change, type: "connectors.cli.CheckpointsChange"}
      # ESS-LIMIT: always "0.32.0", the newest connectors release that cannot open a
      # store carrying checkpoints. As for Failure.instance_id, ESS declares no
      # invariant on a CLI type, so the host pins the value and tests hold it.
      - {name: newest_incompatible_release, type: "String"}
  - name: connectors.cli.AdapterListInput
    kind: struct
    fields:
      - {name: limit, type: "Optional<Integer>"}
      - {name: cursor, type: "Optional<String>"}
  - name: connectors.cli.AdapterListResult
    kind: struct
    fields:
      - {name: adapters, type: "List<connectors.cli.AdapterSummary>"}
      - {name: next_cursor, type: "Optional<String>"}
      - {name: source, type: "connectors.cli.MetadataSource"}
  - name: connectors.cli.AdapterDescribeInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
  - name: connectors.cli.AdapterDescribeResult
    kind: struct
    fields:
      - {name: configuration, type: "connectors.cli.AdapterConfiguration"}
      - {name: descriptor, type: "Optional<connectors.cli.ServiceDescriptor>"}
      - {name: source, type: "connectors.cli.MetadataSource"}
      - {name: stale, type: "Boolean"}
  - name: connectors.cli.AdapterStatusInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
  - name: connectors.cli.AdapterStatusResult
    kind: struct
    fields:
      - {name: observation, type: "connectors.cli.AdapterObservation"}
  - name: connectors.cli.AdapterStopInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: expected_revision, type: "String"}
      - {name: host_incarnation, type: "String"}
      - {name: child_incarnation, type: "String"}
  - name: connectors.cli.AdapterStopResult
    kind: struct
    fields:
      - {name: observation, type: "connectors.cli.AdapterObservation"}
  - name: connectors.cli.ConnectionListInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: limit, type: "Optional<Integer>"}
      - {name: cursor, type: "Optional<String>"}
  # Page metadata covers every member; cached facts are always stale. A missing
  # or expired page validity deadline cannot claim freshness. A known deadline
  # is no later than the earliest member deadline; these are runtime obligations.
  - name: connectors.cli.ConnectionListResult
    kind: struct
    fields:
      - {name: connections, type: "List<connectors.cli.ConnectionSummary>"}
      - {name: next_cursor, type: "Optional<String>"}
      - {name: observed_at_ms, type: "Integer"}
      - {name: valid_until_ms, type: "Optional<Integer>"}
      - {name: source, type: "connectors.cli.MetadataSource"}
      - {name: stale, type: "Boolean"}
  - name: connectors.cli.ConnectionDescribeInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
  - name: connectors.cli.ConnectionDescribeResult
    kind: struct
    fields:
      - {name: connection, type: "connectors.cli.ConnectionDescription"}
  # Safe management request projection. No credential payload or source path is an ordinary host management field.
  - name: connectors.cli.ConnectionCreateRequest
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: profile, type: "String"}
  # expected_revision is public semantic revision. The existing coordinator reconstructs its own private publication fence; caller revision never substitutes for it.
  - name: connectors.cli.ConnectionRepairRequest
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
      - {name: expected_revision, type: "String"}
  # EPHEMERAL LOCAL ACTION ONLY: protected source fills credential_document; never persist/log/serialize into public management, results or recording evidence.
  # Under the read-only mounted_secret binding connect and repair take no protected source: the
  # owner reads the item <adapter alias>/<profile> itself, and a source is invalid_input
  # at arguments. Under a platform binding a missing source is protected_entry_unavailable
  # (contracts/cli/v1alpha1/semantics.md §2).
  - name: connectors.cli.ConnectionConnectInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: profile, type: "String"}
      - {name: credential_document, type: "Optional<String>"}
  - name: connectors.cli.ConnectionConnectResult
    kind: struct
    fields:
      - {name: connection, type: "connectors.cli.ConnectionDescription"}
      - {name: acquisition, type: "Optional<String>"}
  # EPHEMERAL LOCAL ACTION ONLY: credential_document bypasses ordinary management projection and reaches separately bound trusted completion.
  - name: connectors.cli.ConnectionRepairInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
      - {name: expected_revision, type: "String"}
      - {name: credential_document, type: "Optional<String>"}
  - name: connectors.cli.ConnectionRepairResult
    kind: struct
    fields:
      - {name: connection, type: "connectors.cli.ConnectionDescription"}
      - {name: acquisition, type: "Optional<String>"}
  - name: connectors.cli.ConnectionRevalidateInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
      - {name: expected_revision, type: "String"}
  - name: connectors.cli.ConnectionRevalidateResult
    kind: struct
    fields:
      - {name: connection, type: "connectors.cli.ConnectionDescription"}
  # Selectors and the caller's arguments. args is one JSON array of strings, appended
  # verbatim after the consumer's pinned argv prefix; the handler refuses any other value,
  # or an element holding NUL, as invalid_input. The protected document reaches the consumer
  # on descriptor 3, never a field, response, argv, environment or file. On Windows it is an
  # inherited handle whose value, not the document, is in the environment
  # (connectors.cli.ConsumerCredentialDelivery).
  # See contracts/cli/v1alpha1/consumer-launch.md.
  - name: connectors.cli.ConnectionLaunchInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
      - {name: consumer, type: "String"}
      - {name: args, type: "Optional<String>"}
  # The handler seam's typed result. It is never written: stdout belongs to the consumer and
  # the process exits with exit_code.
  - name: connectors.cli.ConnectionLaunchResult
    kind: struct
    fields:
      - {name: consumer, type: "String"}
      - {name: exit_code, type: "Integer"}
  # Exactly one selector required by the binding; Optional alone does not enforce exclusivity.
  - name: connectors.cli.ConnectionStatusInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "Optional<String>"}
      - {name: acquisition, type: "Optional<String>"}
  # Exactly one branch matching the selected target. This is safe observation, not a protected continuation.
  - name: connectors.cli.ConnectionStatusResult
    kind: struct
    fields:
      - {name: connection, type: "Optional<connectors.cli.ConnectionDescription>"}
      - {name: acquisition, type: "Optional<connectors.cli.AcquisitionObservation>"}
  - name: connectors.cli.ConnectionRevokeInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
      - {name: expected_revision, type: "String"}
  - name: connectors.cli.ConnectionRevokeResult
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "String"}
      - {name: revision, type: "String"}
      - {name: local_state, type: "connectors.cli.RevocationState"}
      - {name: provider_outcome, type: "connectors.cli.ProviderRevocationOutcome"}
  - name: connectors.cli.OperationListInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: family, type: "Optional<String>"}
      - {name: limit, type: "Optional<Integer>"}
      - {name: cursor, type: "Optional<String>"}
  - name: connectors.cli.OperationListResult
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: revision, type: "String"}
      - {name: operations, type: "List<connectors.cli.OperationSummary>"}
      - {name: next_cursor, type: "Optional<String>"}
      - {name: source, type: "connectors.cli.MetadataSource"}
      - {name: stale, type: "Boolean"}
  - name: connectors.cli.OperationDescribeInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: operation, type: "String"}
  - name: connectors.cli.OperationDescribeResult
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: revision, type: "String"}
      - {name: schema, type: "String"}
      - {name: operation, type: "connectors.cli.OperationDescription"}
      - {name: source, type: "connectors.cli.MetadataSource"}
      - {name: stale, type: "Boolean"}
  # Dynamic schema identity and descriptor revision are distinct. input is bounded UTF-8 JSON TEXT; a provider schema validates its once-decoded JSON VALUE. Never treat the String schema as provider validation.
  - name: connectors.cli.OperationInvokeInput
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: connection, type: "Optional<String>"}
      - {name: operation, type: "String"}
      - {name: schema, type: "String"}
      - {name: revision, type: "String"}
      - {name: input, type: "String"}
      # Path metadata only. The trusted handler reads proof bytes into a protected
      # buffer after current admission and exact-key observation; never parser JSON.
      - {name: approval_file, type: "Optional<String>"}
      - {name: idempotency_key, type: "Optional<String>"}
  # result is the selected provider output as a JSON value; it must pass that operation's output schema.
  - name: connectors.cli.OperationInvokeResult
    kind: struct
    fields:
      - {name: adapter, type: "String"}
      - {name: operation, type: "String"}
      - {name: revision, type: "String"}
      - {name: result, type: "Json"}
      - {name: request_id, type: "Optional<String>"}
      - {name: mutation, type: "Optional<connectors.cli.MutationObservation>"}
      - {name: source_audit, type: "Optional<connectors.service_wire.SourceAudit>"}
  # Compatibility value only. Existing runtime arguments and codecs remain unchanged; token file metadata is sensitive.
  # Presentation projection of service_wire only: pinned ess-cli cannot emit
  # Uuid. Runtime validates id as canonical non-nil UUID text before projection.
  # This is correlation metadata, not a new attempt identity or lookup authority.
  - name: connectors.cli.AttemptReference
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: id, type: String}
  - name: connectors.cli.MutationObservation
    kind: struct
    fields:
      - {name: classification, type: connectors.mutations.EffectKnowledge}
      - {name: attempt, type: "Optional<connectors.cli.AttemptReference>"}
      - {name: original_request_id, type: "Optional<String>"}
      - {name: replayed, type: Boolean}
      - {name: cause, type: "Optional<connectors.service_wire.DiagnosticCause>"}
  - name: connectors.cli.LegacyDescribeInput
    kind: struct
    fields:
      - {name: endpoint, type: "String"}
      - {name: token_file, type: "String"}
      - {name: allow_plaintext, type: "Optional<Boolean>"}
  # The legacy renderer unwraps the descriptor and decodes its configuration_schema carrier into the complete original wire object.
  - name: connectors.cli.LegacyDescribeResult
    kind: struct
    fields:
      - {name: descriptor, type: "connectors.cli.ServiceDescriptor"}
  # input retains the legacy file-path argument, not the new dynamic carrier source binding.
  - name: connectors.cli.LegacyInvokeInput
    kind: struct
    fields:
      - {name: endpoint, type: "String"}
      - {name: token_file, type: "String"}
      - {name: allow_plaintext, type: "Optional<Boolean>"}
      - {name: operation, type: "String"}
      - {name: input, type: "String"}
  # The legacy renderer prints the once-decoded JSON carrier directly, preserving raw successful provider output.
  - name: connectors.cli.LegacyInvokeResult
    kind: struct
    fields:
      - {name: result, type: "String"}

# ESS-LIMIT executable obligations (ESS 0.40 has no file-system, process, terminal
# or OS-permission construct, no TOML/JSON reader-closure or codec construct, no
# redaction construct, no count over the records of an entity, and no guard that
# compares a subject field with a field of a related record; its only
# multi-record effect, `affects:` (ess/16), sets fields and cannot take a
# transition, and the Entity Runtime lowering refuses it (SetEffectUnsupported)):
# context/path and selector resolution, bounds,
# closed TOML decoding/defaults, JSON carrier parsing/duplicate-key/depth checks,
# dynamic input/result schema resolution, status one-of, acquisition state/reason
# and yielded-connection projection, cached/stale and page validity reduction,
# and error/code/exit
# combinations, current owner/management/business admission, private source
# permission and no-symlink checks, terminal echo restoration, secret redaction,
# immutable durable keyring versions, publication/revoke/final-dispatch fences,
# same-identity repair and restart recovery, launch coalescing, exact owned
# incarnation stop and durable suppression, readiness/deadlines/autostart isolation,
# durable open checkpoints on every store setup init creates and through
# `setup checkpoints-enable` (its confirmation refusal, owner lifetime-lock refusal,
# idempotent already_enabled answer and one-way statement). Checkpoint installation
# is Eventlog provider bookkeeping, like local_authority (docs/local-er-metadata.md),
# so it is no entity, command or lifecycle state here.
# All are required by the contract; this model does not claim to execute them.
# Safe management request values omit credential_document. Only the separately
# bound local protected action receives that ephemeral document, and it must
# never reach logs, persistent state, ordinary provider invocation or outputs.
# ESS structural schema projection proves none of the Linux/process/custody rules.

entities:
  - name: connectors.cli.LocalRuntimeRecord
    identity: {name: instance_id, type: String}
    fields:
      - {name: suppressed, type: Boolean}
      - {name: selection, type: "Optional<String>"}
      - {name: bootstrap, type: "Optional<connectors.cli.PrivateAdapterBootstrap>"}
      - {name: observed_at, type: "Optional<Timestamp>"}
      - {name: build_version, type: "Optional<String>"}
    lifecycle:
      initial: Retained
      states: [Retained]
      terminal: [Retained]
      transitions:
        - {name: set_suppression, from: [Retained], to: Retained}
        - {name: remember_bootstrap, from: [Retained], to: Retained}
    # Durable stop suppression and the bounded cached bootstrap owned by local
    # configuration. A cached bootstrap never establishes live readiness.
    # build_version is the release version of the build that wrote the cached
    # bootstrap, so a refusal can be traced to the build that produced it. A record
    # written before it was recorded has none, and the next bootstrap a build
    # remembers records that build's; a suppression change keeps it. Remembering a
    # bootstrap always records one.

  - name: connectors.cli.StoreWriter
    identity: {name: store, type: String}
    fields:
      - {name: binary_version, type: String}
      - {name: model_digest, type: String}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
      transitions:
        - {name: raise, from: [Recorded], to: Recorded}
    # The metadata store's writer marker: the newest binary that wrote the store
    # (its release version) and the digest of the record model it persists. One per
    # store, identity `store`. A binary records it in the batch of its first write
    # when it is absent, and raises it in the batch of its first write when its own
    # release version is newer; it never lowers it, and an equal version keeps it.
    # Before any command reads the store's records it compares the marker with its
    # own: a different model digest under a newer version refuses
    # metadata_schema_newer; the same digest under a newer version is admitted. A
    # binary_version this binary cannot order under a different model digest refuses
    # metadata_schema_newer with store_version `unrecorded`; under the same digest
    # it is admitted and kept, since it is never known to be lower.
    # The model digest is SHA-256 over the persisted record shapes of the Entity
    # Runtime definitions: per entity its name, identity field, lifecycle states,
    # field schema (names, types, required-ness, bounds, enumerations) and the
    # assertions of its invariants, without invariant names or messages, which
    # the generator chooses. A release that changes only generated text keeps it.
    # ESS-LIMIT: binary_version is a SemVer 2.0.0 version and "newer" is SemVer
    # precedence (a pre-release orders below its release; build metadata is
    # ignored; a pre-release longer than 40 bytes is not ordered), and "never
    # lowered" compares the input with the current field. ESS has no version type,
    # no version order, no string pattern and no guard comparing a command input
    # with a subject field, so the host enforces all three and tests pin them; the
    # field stays a String. Every store written before the marker existed has none
    # and is admitted; it gets one on its next write.

  - name: connectors.cli.ConnectionListCursor
    identity: {name: cursor_id, type: Uuid}
    fields:
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: configuration_revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: last_connection_ref, type: String}
      - {name: page_limit, type: Integer}
      - {name: expires_at, type: Timestamp}
    # contracts/cli/v1alpha1/semantics.md:452, docs/local-connection-registry.md:105-106;
    # the host refuses any other limit before recording (registry/observation.rs `list`).
    invariants:
      - page_limit >= 1
      - page_limit <= 500
    relations:
      - {name: instance, kind: references, target: connectors.declarations.ServiceConfiguration, cardinality: one, via: instance_id}
    lifecycle:
      initial: Active
      states: [Active, Expired]
      terminal: [Expired]
      transitions:
        - {name: expire, from: [Active], to: Expired}
    # This is the opaque cross-process stale-page fence. It grants no provider,
    # connection or dispatch authority and is retained after logical expiry.
    # ESS-LIMIT: a cursor is stale when its registry_epoch differs from the
    # ServiceConfiguration's, which publication, revoke and known invalidity advance
    # (docs/local-connection-registry.md:107-108); the 300 s expiry and the 10,000
    # live-cursor cap (:104) are host rules. The guard over the related
    # configuration's field is `when_related:`, added in ESS 0.41 at source format
    # ess/18; this specification is ess/15, which refuses it
    # (unsupported_format_version), and the ESS 0.52 Entity Runtime lowering
    # refuses it at any format (RelatedGuardUnsupported). ESS 0.52 has no count
    # over an entity's records and no trusted time.

errors:
  - name: connectors.cli.CursorStateConflict
    fields: [{name: state, type: connectors.cli.ConnectionListCursor.State}]

commands:
  - name: connectors.cli.RecordLocalRuntime
    input:
      - {name: instance_id, type: String}
      - {name: suppressed, type: Boolean}
      - {name: selection, type: "Optional<String>"}
      - {name: bootstrap, type: "Optional<connectors.cli.PrivateAdapterBootstrap>"}
      - {name: observed_at, type: "Optional<Timestamp>"}
      - {name: build_version, type: "Optional<String>"}
    outcomes:
      - name: recorded
        creates: connectors.cli.LocalRuntimeRecord
        instance: instance_id
        emits: [connectors.cli.LocalRuntimeRecorded]
        payload:
          connectors.cli.LocalRuntimeRecorded:
            instance_id: input.instance_id
        sets:
          suppressed: input.suppressed
          selection: input.selection
          bootstrap: input.bootstrap
          observed_at: input.observed_at
          build_version: input.build_version
  - name: connectors.cli.SetLocalRuntimeSuppression
    input:
      - {name: instance_id, type: String}
      - {name: suppressed, type: Boolean}
    outcomes:
      - name: updated
        moves: connectors.cli.LocalRuntimeRecord.set_suppression
        instance: instance_id
        emits: [connectors.cli.LocalRuntimeSuppressionSet]
        payload:
          connectors.cli.LocalRuntimeSuppressionSet:
            instance_id: input.instance_id
            suppressed: input.suppressed
        sets: {suppressed: input.suppressed}
  - name: connectors.cli.RememberLocalRuntimeBootstrap
    input:
      - {name: instance_id, type: String}
      - {name: selection, type: String}
      - {name: bootstrap, type: connectors.cli.PrivateAdapterBootstrap}
      - {name: observed_at, type: Timestamp}
      - {name: build_version, type: String}
    outcomes:
      - name: remembered
        moves: connectors.cli.LocalRuntimeRecord.remember_bootstrap
        instance: instance_id
        emits: [connectors.cli.LocalRuntimeBootstrapRemembered]
        payload:
          connectors.cli.LocalRuntimeBootstrapRemembered:
            instance_id: input.instance_id
        sets:
          selection: input.selection
          bootstrap: input.bootstrap
          observed_at: input.observed_at
          build_version: input.build_version
  - name: connectors.cli.RecordStoreWriter
    input:
      - {name: store, type: String}
      - {name: binary_version, type: String}
      - {name: model_digest, type: String}
    outcomes:
      - name: recorded
        creates: connectors.cli.StoreWriter
        instance: store
        emits: [connectors.cli.StoreWriterRecorded]
        payload:
          connectors.cli.StoreWriterRecorded:
            store: input.store
            binary_version: input.binary_version
        sets:
          binary_version: input.binary_version
          model_digest: input.model_digest
  - name: connectors.cli.RaiseStoreWriter
    input:
      - {name: store, type: String}
      - {name: binary_version, type: String}
      - {name: model_digest, type: String}
    outcomes:
      - name: raised
        moves: connectors.cli.StoreWriter.raise
        instance: store
        emits: [connectors.cli.StoreWriterRaised]
        payload:
          connectors.cli.StoreWriterRaised:
            store: input.store
            binary_version: input.binary_version
        sets:
          binary_version: input.binary_version
          model_digest: input.model_digest
  - name: connectors.cli.RecordConnectionListCursor
    input:
      - {name: cursor_id, type: Uuid}
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: configuration_revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: last_connection_ref, type: String}
      - {name: page_limit, type: Integer}
      - {name: expires_at, type: Timestamp}
    outcomes:
      - name: recorded
        creates: connectors.cli.ConnectionListCursor
        instance: cursor_id
        emits: [connectors.cli.ConnectionListCursorRecorded]
        payload:
          connectors.cli.ConnectionListCursorRecorded:
            cursor_id: input.cursor_id
        sets:
          instance_id: input.instance_id
          adapter_id: input.adapter_id
          configuration_revision: input.configuration_revision
          registry_epoch: input.registry_epoch
          last_connection_ref: input.last_connection_ref
          page_limit: input.page_limit
          expires_at: input.expires_at
  - name: connectors.cli.ExpireConnectionListCursor
    input: [{name: cursor_id, type: Uuid}]
    outcomes:
      - name: expired
        moves: connectors.cli.ConnectionListCursor.expire
        instance: cursor_id
        emits: [connectors.cli.ConnectionListCursorExpired]
        payload:
          connectors.cli.ConnectionListCursorExpired:
            cursor_id: input.cursor_id
      - name: wrong-state
        wrong_state: true
        error: connectors.cli.CursorStateConflict
    # DECIDED 2026-09-27: expiring an Expired cursor refuses with CursorStateConflict;
    # stale cursors refuse (contracts/cli/v1alpha1/semantics.md:456) and the host
    # removal path (er.rs:4081-4083) only expires Active cursors. The error name is
    # the decision; no source names one.

events:
  - name: connectors.cli.LocalRuntimeRecorded
    fields: [{name: instance_id, type: String}]
  - name: connectors.cli.LocalRuntimeSuppressionSet
    fields:
      - {name: instance_id, type: String}
      - {name: suppressed, type: Boolean}
  - name: connectors.cli.LocalRuntimeBootstrapRemembered
    fields: [{name: instance_id, type: String}]
  - name: connectors.cli.StoreWriterRecorded
    fields:
      - {name: store, type: String}
      - {name: binary_version, type: String}
  - name: connectors.cli.StoreWriterRaised
    fields:
      - {name: store, type: String}
      - {name: binary_version, type: String}
  - name: connectors.cli.ConnectionListCursorRecorded
    fields: [{name: cursor_id, type: Uuid}]
  - name: connectors.cli.ConnectionListCursorExpired
    fields: [{name: cursor_id, type: Uuid}]

views:
  - name: connectors.cli.ConnectionListCursors
    source: connectors.cli.ConnectionListCursor
    consistency: read_your_writes
    fields:
      - {name: cursor_id, type: Uuid}
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: configuration_revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: last_connection_ref, type: String}
      - {name: page_limit, type: Integer}
      - {name: state, type: connectors.cli.ConnectionListCursor.State}
  - name: connectors.cli.LocalRuntimeRecords
    source: connectors.cli.LocalRuntimeRecord
    consistency: read_your_writes
    fields:
      - {name: instance_id, type: String}
      - {name: selection, type: "Optional<String>"}
      - {name: state, type: connectors.cli.LocalRuntimeRecord.State}

actors:
  - name: connectors.cli.LocalHost
    may:
      - connectors.cli.ExpireConnectionListCursor
      - connectors.cli.RecordConnectionListCursor
      - connectors.cli.RaiseStoreWriter
      - connectors.cli.RecordLocalRuntime
      - connectors.cli.RecordStoreWriter
      - connectors.cli.RememberLocalRuntimeBootstrap
      - connectors.cli.SetLocalRuntimeSuppression
