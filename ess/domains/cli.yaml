      - {name: configuration_revision, type: "String"}
      - {name: executable_selection, type: "String"}
      - {name: custody_items, type: "List<String>"}
  # One `[adapters.<alias>]` entry of the file before the migration; entries
  # already under `[connectors]` are not listed. connector and instance select
