domain: connectors.credentials

summary: Host-private immutable credential snapshot identities shared by refresh and evidence.

# The UUID names a capture, never a digest, filename, secret-store version,
# connection-management revision or refresh fence. New material means a new ID,
# including same-account refresh. It must never be reused across process restarts.
types:
  - name: connectors.credentials.CredentialGenerationId
    kind: newtype
    of: Uuid
  - name: connectors.credentials.ConnectionBinding
    kind: struct
    fields:
      - {name: instance_id, type: String}
      - {name: connection_ref, type: String}
      - {name: profile_ref, type: String}
      - {name: provider_authority, type: String}
  - name: connectors.credentials.ExternalIdentity
    kind: struct
    fields:
      - {name: kind, type: String}
      - {name: subject, type: String}

entities:
  - name: connectors.credentials.CredentialGeneration
    identity:
      name: generation_id
      type: connectors.credentials.CredentialGenerationId
    fields:
      - {name: instance_id, type: String}
      - {name: connection_ref, type: String}
      - {name: profile_ref, type: String}
      - {name: provider_authority, type: String}
      # An immutable material capture, not a mutable path or exec invocation.
      # Private only: must not enter a public evidence projection or diagnostic.
      - {name: captured_snapshot_ref, type: String}
      # Intended binding, not evidence that these bytes authenticate that account.
      - {name: expected_external_identity, type: connectors.credentials.ExternalIdentity}
    relations:
      - name: instance
        kind: references
        target: connectors.declarations.ServiceConfiguration
        cardinality: one
        via: instance_id
    # Captured is the immutable identity record's state, not current usability.
    # Evidence, revocation, expiry and publication live outside this record.
    lifecycle:
      initial: Captured
      states: [Captured]
      terminal: [Captured]
    # UNMAPPED: Connection, AuthProfile, custody and provider-identity entities;
    # these opaque coordinates do not invent deletion ownership or cardinality.
    # UNMAPPED: unique capture allocation, actual byte pinning, expected/observed
    # identity comparison, cross-entity publication and revocation atomicity.
