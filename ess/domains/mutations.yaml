domain: connectors.mutations

summary: Host-owned mutation attempt ledger with a private local binding; not a public mutation API.

# These commands describe trusted ledger decisions. They grant no caller authority,
# perform no provider I/O, and do not model approval redemption. See the normative
# dispatch fence and evidence rules in contracts/operations/v1alpha1/semantics.md.
types:
  - name: connectors.mutations.SettlementClockInterval
    kind: struct
    fields:
      - {name: lower_unix_ms, type: Integer}
      - {name: upper_unix_ms, type: Integer}
    # Trusted host clock evidence sampled inside the ledger transaction, never
    # caller input or an unqualified wall-clock sample. Both bounds contain
    # actual current time; upper fixes settlement conservatively, and lower
    # proves retention expiry. Unavailable/invalid evidence permits no expiry.
    # UNMAPPED: a deployment must qualify its clock source; ESS does not prove
    # the interval's provenance or containment of actual time.
  - name: connectors.mutations.AttemptId
    kind: newtype
    of: Uuid
  - name: connectors.mutations.ApprovalMode
    kind: enum
    variants: [not_required, required, event_claim]
  - name: connectors.mutations.EffectKnowledge
    kind: enum
    variants: [not_attempted, refused, applied, unknown]
  - name: connectors.mutations.Observation
    kind: struct
    fields:
      - {name: attempt_id, type: "Optional<connectors.mutations.AttemptId>"}
      - {name: classification, type: connectors.mutations.EffectKnowledge}
      # Semantic cause, not a second public Error.code or an approved wire field.
      - {name: cause, type: "Optional<String>"}
  - name: connectors.mutations.ExecutableEffect
    kind: enum
    variants: [external_write, network, process, local_system, send_external, session_establishment]
  - name: connectors.mutations.SemanticEffect
    kind: enum
    variants: [human_visible, billable, irreversible]
  - name: connectors.mutations.EffectDeclaration
    kind: struct
    fields:
      - {name: profile, type: String}
      - {name: effects, type: "List<connectors.mutations.ExecutableEffect>"}
      - {name: semantic_effects, type: "List<connectors.mutations.SemanticEffect>"}
    # Private excerpt, not a public codec or new OperationDeclaration fields.
    # UNMAPPED: selected-profile support/completeness, distinct array members,
    # mutation iff external_write for business effects, and authority checks.
  - name: connectors.mutations.SessionEstablishmentObservation
    kind: struct
    fields:
      - {name: mutation, type: connectors.mutations.Observation}
      - {name: ready_session, type: "Optional<connectors.sessions.SessionId>"}
    # A ready-receipt reference is historical evidence, not current liveness or
    # authority. Optional omission here is not a public required-null encoding.
    # UNMAPPED: trusted protocol-specific effect evidence, publication
    # after full readiness, current disclosure, and serialized terminal races.
    # A ready receipt requires applied knowledge; applied need not have a receipt.
    # This value declares no persistent Session/Attempt ownership relation.

  - name: connectors.mutations.IdempotencyKind
    kind: enum
    variants: [none, natural, keyed]

entities:
  - name: connectors.mutations.AttemptRecord
    identity:
      name: attempt_id
      type: connectors.mutations.AttemptId
    fields:
      - {name: instance_id, type: String}
      - {name: request_id, type: String}
      - {name: operation_id, type: String}
      - {name: connection_ref, type: String}
      - {name: input_digest, type: String}
      # Exact admitted request coordinates retained for deterministic replay and
      # projection rebuild. This is the existing typed idempotency fingerprint.
      - {name: request_fingerprint, type: connectors.idempotency.RequestFingerprint}
      - {name: approval_mode, type: connectors.mutations.ApprovalMode}
      - {name: approval_ref, type: "Optional<String>"}
      # Immutable full subject captured by an approval-aware preparation. Old
      # attempts can lack it and remain observable/recoverable, but cannot gain
      # a new approval-spend receipt by reconstructing missing authority facts.
      - {name: approval_subject, type: "Optional<connectors.delegation.CanonicalApprovalSubject>"}
      - {name: idempotency_key, type: "Optional<String>"}
      # Private one-shot owner and current publication coordinates. They are
      # fixed by preparation and retained so restart recovery cannot recreate a
      # dispatch winner or use a connection after its publication fence moved.
      - {name: owner_nonce, type: Uuid}
      - {name: publication_fence, type: String}
      # Host fixes this with the first durable terminal outcome. Keyed retention
      # uses that instant even if reservation settlement is recovered later.
      - {name: settled_at, type: "Optional<Timestamp>"}
      # Canonical bounded JSON text for the already typed provider result. This
      # is retained replay evidence, never an arbitrary entity property bag.
      - {name: terminal_result_json, type: "Optional<String>"}
    relations:
      - name: instance
        kind: references
        target: connectors.declarations.ServiceConfiguration
        cardinality: one
        via: instance_id
      - name: connection
        kind: references
        target: connectors.auth_bindings.Connection
        cardinality: one
        via: connection_ref
    # UNMAPPED: the operation reference needs instance/adapter qualification;
    # OperationDeclaration.operation_id alone is not a runtime operation identity.
    # KeyReservation in connectors.idempotency explicitly references this attempt;
    # its lifecycle covers replay retention, separately from audit retention.
    # ApprovalRedemption in connectors.delegation references this attempt;
    # it is a spend receipt, not the dispatch fence.
    # AuditRecord in connectors.execution_audit may reference this attempt;
    # neither owner cascades deletion or lifecycle changes into the other.
    # The selected Connection is retained independently after local revocation;
    # the reference neither grants current use nor owns binding deletion.
    # UNMAPPED: admission principal/tenant entities remain outside this binding.
    lifecycle:
      initial: Prepared
      states: [Prepared, Dispatching, Aborted, Completed, Failed, Indeterminate]
      terminal: [Aborted, Completed, Failed, Indeterminate]
      transitions:
        - {name: open_dispatch, from: [Prepared], to: Dispatching}
        - {name: abort, from: [Prepared], to: Aborted}
        - {name: complete, from: [Dispatching], to: Completed}
        - {name: refuse, from: [Dispatching], to: Failed}
        - {name: lose_outcome, from: [Dispatching], to: Indeterminate}

errors:
  - name: connectors.mutations.AttemptStateConflict
    # The ledger state does not allow this transition; it remains unchanged.
    fields:
      - {name: state, type: connectors.mutations.AttemptRecord.State}

commands:
  - name: connectors.mutations.PrepareAttempt
    # Anchor an admitted attempt before opening its dispatch fence.
    input:
      - {name: instance_id, type: String}
      - {name: request_id, type: String}
      - {name: operation_id, type: String}
      - {name: connection_ref, type: String}
      - {name: input_digest, type: String}
      - {name: request_fingerprint, type: connectors.idempotency.RequestFingerprint}
      - {name: approval_mode, type: connectors.mutations.ApprovalMode}
      - {name: approval_ref, type: "Optional<String>"}
      - {name: approval_subject, type: "Optional<connectors.delegation.CanonicalApprovalSubject>"}
      - {name: idempotency_key, type: "Optional<String>"}
      - {name: owner_nonce, type: Uuid}
      - {name: publication_fence, type: String}
    outcomes:
      - name: prepared
        creates: connectors.mutations.AttemptRecord
        instance: attempt_id
        emits: [connectors.mutations.AttemptPrepared]
        sets:
          instance_id: input.instance_id
          request_id: input.request_id
          operation_id: input.operation_id
          connection_ref: input.connection_ref
          input_digest: input.input_digest
          request_fingerprint: input.request_fingerprint
          approval_mode: input.approval_mode
          approval_ref: input.approval_ref
          approval_subject: input.approval_subject
          idempotency_key: input.idempotency_key
          owner_nonce: input.owner_nonce
          publication_fence: input.publication_fence

  - name: connectors.mutations.OpenDispatch
    # Durably win the one-shot dispatch permission; not proof of a send.
    input:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
    outcomes:
      - name: opened
        moves: connectors.mutations.AttemptRecord.open_dispatch
        instance: attempt_id
        emits: [connectors.mutations.DispatchOpened]
      - name: wrong-state
        wrong_state: true
        error: connectors.mutations.AttemptStateConflict

  - name: connectors.mutations.AbortPrepared
    # Fence dispatch on cancellation, deadline or recovery while still Prepared.
    input:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: settled_at, type: Timestamp}
      - {name: terminal_result_json, type: String}
    outcomes:
      - name: aborted
        moves: connectors.mutations.AttemptRecord.abort
        instance: attempt_id
        emits: [connectors.mutations.AttemptAborted]
        sets:
          settled_at: input.settled_at
          terminal_result_json: input.terminal_result_json
      - name: wrong-state
        wrong_state: true
        error: connectors.mutations.AttemptStateConflict

  - name: connectors.mutations.RecordCompletion
    # Persist a definitive provider success; transport completion alone is insufficient.
    input:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: settled_at, type: Timestamp}
      - {name: terminal_result_json, type: String}
    outcomes:
      - name: completed
        moves: connectors.mutations.AttemptRecord.complete
        instance: attempt_id
        emits: [connectors.mutations.AttemptCompleted]
        sets:
          settled_at: input.settled_at
          terminal_result_json: input.terminal_result_json
      - name: wrong-state
        wrong_state: true
        error: connectors.mutations.AttemptStateConflict

  - name: connectors.mutations.RecordRefusal
    # Persist a definitive provider refusal with evidence that no business effect occurred.
    input:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: settled_at, type: Timestamp}
      - {name: terminal_result_json, type: String}
    outcomes:
      - name: refused
        moves: connectors.mutations.AttemptRecord.refuse
        instance: attempt_id
        emits: [connectors.mutations.AttemptRefused]
        sets:
          settled_at: input.settled_at
          terminal_result_json: input.terminal_result_json
      - name: wrong-state
        wrong_state: true
        error: connectors.mutations.AttemptStateConflict

  - name: connectors.mutations.RecordUncertainty
    # Persist uncertainty after dispatch permission, including recovery with no terminal evidence.
    input:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: terminal_result_json, type: String}
    outcomes:
      - name: indeterminate
        moves: connectors.mutations.AttemptRecord.lose_outcome
        instance: attempt_id
        emits: [connectors.mutations.AttemptIndeterminate]
        sets:
          terminal_result_json: input.terminal_result_json
      - name: wrong-state
        wrong_state: true
        error: connectors.mutations.AttemptStateConflict

events:
  - name: connectors.mutations.AttemptPrepared
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: approval_mode, type: connectors.mutations.ApprovalMode}
  - name: connectors.mutations.DispatchOpened
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
  - name: connectors.mutations.AttemptAborted
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
  - name: connectors.mutations.AttemptCompleted
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
  - name: connectors.mutations.AttemptRefused
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
  - name: connectors.mutations.AttemptIndeterminate
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}

views:
  - name: connectors.mutations.AttemptStates
    # Internal ledger observation for conformance; not public lookup authorization.
    source: connectors.mutations.AttemptRecord
    consistency: read_your_writes
    fields:
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: approval_mode, type: connectors.mutations.ApprovalMode}
      - {name: state, type: connectors.mutations.AttemptRecord.State}

# UNMAPPED: durable compare-and-set, evidence provenance, actual send cardinality,
# crash recovery, deadline races, and classification/cause projection require host
# port tests. ESS checks this state graph and scenario references, not those facts.
# UNMAPPED: Observation's classification mapping is the normative table in the
# contract. No executable expression here derives it from state or transport data.
