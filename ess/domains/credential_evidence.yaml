domain: connectors.credential_evidence

summary: Proposed generation-bound evidence values and transient dispatch admission decisions.

# Normative owner: contracts/auth/evidence/v1alpha1/semantics.md §4.1–4.3.
# These are trusted host observations/decisions, never caller assertions or
# public protocol fields. EvidenceSnapshot is a value embedded in Connection.
types:
  - name: connectors.credential_evidence.AdmissionId
    kind: newtype
    of: Uuid
  - name: connectors.credential_evidence.ReadUseId
    kind: newtype
    of: Uuid
  - name: connectors.credential_evidence.CheckKind
    kind: enum
    variants: [custody_reachable, credential_present, credential_valid, identity_check, scope_check, permission_check, verify_operation]
  - name: connectors.credential_evidence.CheckResult
    kind: enum
    variants: [ok, missing, invalid, insufficient, denied, unavailable, uncertain, not_run]
  - name: connectors.credential_evidence.EvidenceOrigin
    kind: enum
    variants: [local_metadata, provider_read, refresh_lineage]
  - name: connectors.credential_evidence.EvidenceCheck
    kind: struct
    fields:
      - {name: check, type: connectors.credential_evidence.CheckKind}
      - {name: result, type: connectors.credential_evidence.CheckResult}
      - {name: source, type: connectors.credential_evidence.EvidenceOrigin}
      - {name: source_generation_id, type: "Optional<connectors.credentials.CredentialGenerationId>"}
      - {name: subject_ref, type: "Optional<String>"}
      - {name: collected_at, type: Timestamp}
      - {name: valid_until, type: Timestamp}
  - name: connectors.credential_evidence.EvidenceSnapshot
    kind: struct
    fields:
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: binding, type: connectors.credentials.ConnectionBinding}
      - {name: observed_external_identity, type: "Optional<connectors.credentials.ExternalIdentity>"}
      - {name: granted_scopes, type: "Optional<List<String>>"}
      - {name: credential_expires_at, type: "Optional<Timestamp>"}
      - {name: checks, type: "List<connectors.credential_evidence.EvidenceCheck>"}
    # Optional means unknown, never an empty grant set or an immortal credential.
    # These are observations of this exact captured generation. Scope reuse is
    # bounded by its applicable scope_check, and known expiry is an immediate
    # cutoff. At most 64 distinct scope strings of 256 UTF-8 bytes; interpretation
    # and implications belong to the native profile. See auth/evidence §4.5.
  - name: connectors.credential_evidence.RefusalReason
    kind: enum
    variants: [identity_changed, generation_changed, validation_required, revoked, expired, stale_evidence, insufficient_scope, permission_denied, host_forbidden, binding_changed, snapshot_unavailable, refresh_uncertain]

entities:
  # Durable, bounded bookkeeping for one captured local read. This is not a
  # request-specific DispatchAdmission or evidence of permission to dispatch.
  - name: connectors.credential_evidence.ReadUse
    identity: {name: use_id, type: connectors.credential_evidence.ReadUseId}
    fields:
      - {name: connection_ref, type: String}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: custody_version_ref, type: String}
      - {name: publication_fence, type: String}
      - {name: expires_at, type: Timestamp}
      - {name: dispatch_opened, type: Boolean}
      - {name: released, type: Boolean}
    relations:
      - {name: connection, kind: references, target: connectors.auth_bindings.Connection, cardinality: one, via: connection_ref}
      - {name: captured_generation, kind: references, target: connectors.credentials.CredentialGeneration, cardinality: one, via: generation_id}
      - {name: custody_version, kind: references, target: connectors.auth_bindings.CustodyVersion, cardinality: one, via: custody_version_ref}
    lifecycle:
      initial: Captured
      states: [Captured, Dispatched, Released, Expired]
      terminal: [Expired]
      transitions:
        - {name: dispatch, from: [Captured], to: Dispatched}
        - {name: release, from: [Captured, Dispatched], to: Released}
        - {name: expire, from: [Captured, Dispatched, Released], to: Expired}
    # The owner checks readiness/scope before capture, and checks current
    # generation, fence, custody, readiness and expiry again at dispatch.
    # Released retains whether dispatch opened; expiry never extends the row.
  - name: connectors.credential_evidence.DispatchAdmission
    identity:
      name: admission_id
      type: connectors.credential_evidence.AdmissionId
    fields:
      - {name: request_id, type: String}
      - {name: operation_ref, type: String}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: binding, type: connectors.credentials.ConnectionBinding}
      - {name: expected_external_identity, type: connectors.credentials.ExternalIdentity}
      - {name: evidence, type: connectors.credential_evidence.EvidenceSnapshot}
    relations:
      - name: captured_generation
        kind: references
        target: connectors.credentials.CredentialGeneration
        cardinality: one
        via: generation_id
    # A transient decision for one invocation and one immutable material capture.
    # It does not own Connection evidence or impose durable admission storage.
    # Refused is terminal: revalidation/reassignment needs a NEW admission.
    lifecycle:
      initial: Inspected
      states: [Inspected, Admitted, Dispatched, Refused]
      terminal: [Dispatched, Refused]
      transitions:
        - {name: admit, from: [Inspected], to: Admitted}
        - {name: refuse, from: [Inspected, Admitted], to: Refused}
        - {name: dispatch, from: [Admitted], to: Dispatched}
    # Connection is reached through the captured generation relation; no duplicate
    # binding fields or independent evidence owner is introduced. Current profile,
    # request and exact permission-target equality remain admission predicates.

errors:
  - name: connectors.credential_evidence.ReadUseStateConflict
    fields:
      - {name: state, type: connectors.credential_evidence.ReadUse.State}
  - name: connectors.credential_evidence.AdmissionStateConflict
    fields:
      - {name: state, type: connectors.credential_evidence.DispatchAdmission.State}
  - name: connectors.credential_evidence.AdmissionGenerationChanged
    fields:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}

commands:
  - name: connectors.credential_evidence.CaptureReadUse
    input:
      - {name: use_id, type: connectors.credential_evidence.ReadUseId}
      - {name: connection_ref, type: String}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: custody_version_ref, type: String}
      - {name: publication_fence, type: String}
      - {name: expires_at, type: Timestamp}
    outcomes:
      - name: captured
        creates: connectors.credential_evidence.ReadUse
        instance: use_id
        emits: [connectors.credential_evidence.ReadUseCaptured]
        payload:
          connectors.credential_evidence.ReadUseCaptured:
            use_id: input.use_id
        # docs/local-er-metadata.md:74-76: the use retains its selected connection,
        # generation and custody version, the publication fence and the original expiry.
        sets:
          connection_ref: input.connection_ref
          generation_id: input.generation_id
          custody_version_ref: input.custody_version_ref
          publication_fence: input.publication_fence
          expires_at: input.expires_at
          dispatch_opened: "false"
          released: "false"
  - name: connectors.credential_evidence.DispatchReadUse
    input:
      - {name: use_id, type: connectors.credential_evidence.ReadUseId}
    outcomes:
      - name: dispatched
        moves: connectors.credential_evidence.ReadUse.dispatch
        instance: use_id
        emits: [connectors.credential_evidence.ReadUseDispatched]
        payload:
          connectors.credential_evidence.ReadUseDispatched:
            use_id: input.use_id
        sets: {dispatch_opened: "true"}
      - name: wrong-state
        wrong_state: true
        error: connectors.credential_evidence.ReadUseStateConflict
  - name: connectors.credential_evidence.ReleaseReadUse
    input:
      - {name: use_id, type: connectors.credential_evidence.ReadUseId}
    outcomes:
      - name: released
        moves: connectors.credential_evidence.ReadUse.release
        instance: use_id
        emits: [connectors.credential_evidence.ReadUseReleased]
        payload:
          connectors.credential_evidence.ReadUseReleased:
            use_id: input.use_id
        sets: {released: "true"}
      - name: wrong-state
        wrong_state: true
        error: connectors.credential_evidence.ReadUseStateConflict
  - name: connectors.credential_evidence.ExpireReadUse
    input: [{name: use_id, type: connectors.credential_evidence.ReadUseId}]
    outcomes:
      - name: expired
        moves: connectors.credential_evidence.ReadUse.expire
        instance: use_id
        emits: [connectors.credential_evidence.ReadUseExpired]
        payload:
          connectors.credential_evidence.ReadUseExpired:
            use_id: input.use_id
      - name: wrong-state
        wrong_state: true
        error: connectors.credential_evidence.ReadUseStateConflict
  - name: connectors.credential_evidence.InspectGeneration
    # Captures candidate evidence; creation is NOT successful validation.
    input:
      - {name: request_id, type: String}
      - {name: operation_ref, type: String}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: binding, type: connectors.credentials.ConnectionBinding}
      - {name: expected_external_identity, type: connectors.credentials.ExternalIdentity}
      - {name: evidence, type: connectors.credential_evidence.EvidenceSnapshot}
    outcomes:
      - name: inspected
        creates: connectors.credential_evidence.DispatchAdmission
        instance: admission_id
        emits: [connectors.credential_evidence.GenerationInspected]
        payload:
          connectors.credential_evidence.GenerationInspected:
            admission_id: {generated: true}
        # evidence/v1alpha1/semantics.md:94-96: the evidence is matched to this exact
        # generation and binding for this request and operation.
        sets:
          request_id: input.request_id
          operation_ref: input.operation_ref
          generation_id: input.generation_id
          binding: input.binding
          expected_external_identity: input.expected_external_identity
          evidence: input.evidence
  - name: connectors.credential_evidence.AdmitGeneration
    # Host must prove generation/binding equality, observed/expected identity
    # equality, required fresh checks and SaaS admission, and pin actual material.
    # ESS names that decision; it does NOT execute those predicates.
    input:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
    outcomes:
      - name: admitted
        moves: connectors.credential_evidence.DispatchAdmission.admit
        instance: admission_id
        emits: [connectors.credential_evidence.GenerationAdmitted]
        payload:
          connectors.credential_evidence.GenerationAdmitted:
            admission_id: input.admission_id
      - name: wrong-state
        wrong_state: true
        error: connectors.credential_evidence.AdmissionStateConflict
  - name: connectors.credential_evidence.RejectAdmission
    # Also invalidates a pinned admission if revocation, expiry, stale evidence,
    # identity reassignment, an unresolved possibly-consuming refresh, or inability
    # to use that exact snapshot is observed.
    input:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
      - {name: reason, type: connectors.credential_evidence.RefusalReason}
    outcomes:
      - name: refused
        moves: connectors.credential_evidence.DispatchAdmission.refuse
        instance: admission_id
        emits: [connectors.credential_evidence.AdmissionRefused]
        payload:
          connectors.credential_evidence.AdmissionRefused:
            admission_id: input.admission_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: connectors.credential_evidence.AdmissionStateConflict
  - name: connectors.credential_evidence.DispatchGeneration
    # The supplied generation must equal BOTH the admission and the immutable
    # snapshot actually installed in transport. Recheck live host authority,
    # known revocation, expiry and freshness at the atomic dispatch boundary.
    # First profile: successful publication or a detected unvalidated replacement
    # cuts off old admissions atomically. A raw file change never substitutes
    # bytes into a pin; the host must prove the pinned generation is still current.
    input:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
    outcomes:
      # evidence/v1alpha1/semantics.md:97: the selected generation must still be
      # the one this admission pinned.
      - name: generation-changed
        when_subject:
          predicate: generation_id != input.generation_id
        error: connectors.credential_evidence.AdmissionGenerationChanged
      - name: dispatched
        moves: connectors.credential_evidence.DispatchAdmission.dispatch
        instance: admission_id
        emits: [connectors.credential_evidence.GenerationDispatched]
        payload:
          connectors.credential_evidence.GenerationDispatched:
            admission_id: input.admission_id
            generation_id: input.generation_id
      - name: wrong-state
        wrong_state: true
        error: connectors.credential_evidence.AdmissionStateConflict

events:
  - name: connectors.credential_evidence.ReadUseCaptured
    fields: [{name: use_id, type: connectors.credential_evidence.ReadUseId}]
  - name: connectors.credential_evidence.ReadUseDispatched
    fields: [{name: use_id, type: connectors.credential_evidence.ReadUseId}]
  - name: connectors.credential_evidence.ReadUseReleased
    fields: [{name: use_id, type: connectors.credential_evidence.ReadUseId}]
  - name: connectors.credential_evidence.ReadUseExpired
    fields: [{name: use_id, type: connectors.credential_evidence.ReadUseId}]
  - name: connectors.credential_evidence.GenerationInspected
    fields:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
  - name: connectors.credential_evidence.GenerationAdmitted
    fields:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
  - name: connectors.credential_evidence.AdmissionRefused
    fields:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
      - {name: reason, type: connectors.credential_evidence.RefusalReason}
  - name: connectors.credential_evidence.GenerationDispatched
    fields:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}

views:
  - name: connectors.credential_evidence.AdmissionStates
    source: connectors.credential_evidence.DispatchAdmission
    consistency: read_your_writes
    fields:
      - {name: admission_id, type: connectors.credential_evidence.AdmissionId}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: binding, type: connectors.credentials.ConnectionBinding}
      - {name: evidence, type: connectors.credential_evidence.EvidenceSnapshot}
      - {name: state, type: connectors.credential_evidence.DispatchAdmission.State}
  - name: connectors.credential_evidence.ReadUseStates
    source: connectors.credential_evidence.ReadUse
    consistency: read_your_writes
    fields:
      - {name: use_id, type: connectors.credential_evidence.ReadUseId}
      - {name: state, type: connectors.credential_evidence.ReadUse.State}

# ESS-LIMIT (checked against ESS 0.40): runtime obligations. The generation
# equality with the admission's own pin is the `generation-changed` outcome above.
# - The pinned generation still being the Connection's active one (semantics.md:97):
#   no cross-record equality guard reading another entity's field.
# - Publication cutting off every pending old-generation admission (semantics.md:101):
#   no transition of other records atomic with the publishing command. ess/16
#   `affects:` sets fields only (no transition, no `where` on state), and the Entity
#   Runtime lowering refuses it (SetEffectUnsupported).
# - 1,000 concurrent read uses (docs/local-connection-registry.md:104): no
#   cross-record count.
# - At most 64 distinct nonempty scopes of at most 256 UTF-8 bytes (semantics.md:204;
#   the host's `scopes_valid` in crates/connectors-host/src/local/registry.rs):
#   `granted_scopes.count <= 64` and a `forall` nonempty invariant on
#   EvidenceSnapshot validate, but synthesis cannot assert a `.count` through a view
#   row (ESS-SYNTH-013) and then refuses every DispatchAdmission wrong-state
#   scenario. There is no distinctness predicate over a list and no byte-length
#   predicate (`.count` on text counts characters, and the lowering refuses it).
# - Known credential expiry as a cutoff at `now >= credential_expires_at`
#   (semantics.md:212): ess/16 `now` exists, and the lowering refuses it
#   (CurrentTimeUnsupported); the host enforces it (registry/observation.rs).
# - Unforgeable host observations, immutable snapshot capture/pinning including
#   coherent cert/key and exec output, identity comparison, provider validation
#   admission, per-check retention and freshness, permission target binding,
#   revocation linearization, transport placement and secret-free public projection:
#   no observation-provenance, byte-pinning or trusted-time construct. Compilation
#   validates names, types, references and causal lifecycle shapes, not these
#   algorithms.

actors:
  - name: connectors.credential_evidence.LocalHost
    may:
      - connectors.credential_evidence.CaptureReadUse
      - connectors.credential_evidence.DispatchReadUse
      - connectors.credential_evidence.ExpireReadUse
      - connectors.credential_evidence.ReleaseReadUse
