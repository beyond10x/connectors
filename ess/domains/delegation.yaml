domain: connectors.delegation
summary: One-hop approval subjects and immutable receiver receipts; private host approval binding, no delegated ingress runtime.

# Owner: contracts/service/delegation.md. These are canonical/admitted values,
# never trust derived from matching a caller-written string. Codec and policy
# predicates below remain explicit obligations, not simulated ESS commands.
types:
  # Canonical wire coordinates are required members whose absent value is null.
  # ESS Optional in field position means an omitted member; naming the optional
  # value preserves the required field and its nullable schema. Other uses of
  # idempotency.AuthorityScope retain their original omission-based projection.
  - name: connectors.delegation.NullableIdentifier
    kind: newtype
    of: "Optional<String>"
  - name: connectors.delegation.NullableInteger
    kind: newtype
    of: "Optional<Integer>"
  - name: connectors.delegation.NullableAuthoritySnapshot
    kind: newtype
    of: "Optional<connectors.delegation.AuthoritySnapshot>"
  - name: connectors.delegation.NullableExecutorBinding
    kind: newtype
    of: "Optional<connectors.delegation.ExecutorBinding>"
  - name: connectors.delegation.NullableRouteBinding
    kind: newtype
    of: "Optional<connectors.idempotency.RouteBinding>"
  - name: connectors.delegation.CanonicalAuthorityScope
    kind: struct
    fields:
      - {name: tenant, type: connectors.delegation.NullableIdentifier}
      - {name: realm, type: connectors.delegation.NullableIdentifier}
      - {name: caller, type: String}
      - {name: executor, type: connectors.delegation.NullableIdentifier}
  - name: connectors.delegation.ReceiptId
    kind: newtype
    of: Uuid
  # contracts/service/delegation.md:51,125,139: digests, jti and approval
  # references are 64 lowercase hexadecimal characters. Used only on proof
  # values; Entity Runtime refuses `alphabet:` and text `.count`, so the stored
  # subject and redemption fields keep String (see the ESS-LIMIT at the end).
  - name: connectors.delegation.LowercaseHex64
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
  - name: connectors.delegation.AuthoritySnapshot
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: sha256, type: String}
  - name: connectors.delegation.ExecutorBinding
    kind: struct
    fields:
      - {name: agent, type: String}
      - {name: revision, type: String}
      - {name: authority_snapshot, type: connectors.delegation.AuthoritySnapshot}
  - name: connectors.delegation.AdmittedAuthority
    kind: struct
    fields:
      - {name: scope, type: connectors.delegation.CanonicalAuthorityScope}
      - {name: current_authority, type: connectors.delegation.NullableAuthoritySnapshot}
      - {name: executor, type: connectors.delegation.NullableExecutorBinding}
  - name: connectors.delegation.ExecutionTarget
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: operation, type: String}
      - {name: connection, type: String}
      - {name: connection_revision, type: String}
      - {name: contract, type: String}
      - {name: profile, type: String}
      - {name: descriptor_revision, type: String}
      - {name: configuration_revision, type: String}
  - name: connectors.delegation.CanonicalApprovalSubject
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: target, type: connectors.delegation.ExecutionTarget}
      - {name: authority, type: connectors.delegation.AdmittedAuthority}
      - {name: origin, type: connectors.idempotency.Origin}
      - {name: route, type: connectors.delegation.NullableRouteBinding}
      - {name: canonicalization, type: String}
      - {name: input_sha256, type: String}
      - {name: approval_mode, type: connectors.mutations.ApprovalMode}
  - name: connectors.delegation.Presentation
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: operation, type: String}
      - {name: connection, type: connectors.delegation.NullableIdentifier}
      - {name: descriptor_revision, type: String}
  - name: connectors.delegation.ApprovalPolicy
    kind: struct
    fields:
      - {name: mode, type: connectors.mutations.ApprovalMode}
      - {name: issuer, type: connectors.delegation.NullableIdentifier}
      - {name: audience, type: connectors.delegation.NullableIdentifier}
      - {name: max_lifetime_seconds, type: connectors.delegation.NullableInteger}
  - name: connectors.delegation.ApprovalPreparation
    kind: struct
    fields:
      - {name: subject, type: connectors.delegation.CanonicalApprovalSubject}
      - {name: subject_sha256, type: String}
      - {name: presentation, type: connectors.delegation.Presentation}
      - {name: approval_policy, type: connectors.delegation.ApprovalPolicy}
  - name: connectors.delegation.ProofHeader
    kind: struct
    fields:
      - {name: alg, type: String}
      - {name: kid, type: String}
      - {name: typ, type: String}
    # contracts/service/delegation.md:95,101,139: fixed Ed25519 algorithm and the
    # two proof types.
    invariants:
      - alg == "Ed25519"
      - typ: {in: ["b10x.connectors-delegation.v1+jws", "b10x.connectors-approval.v1+jws"]}
  # Current trusted approval-key configuration value, not a discovered key or
  # a new issuer entity. The host's guarded policy binding supplies this value;
  # public_key is the canonical unpadded base64url encoding of 32 Ed25519 bytes.
  # Validity bounds are Unix milliseconds; current clock containment, revocation
  # serialization, issuer authority and protected signing custody remain owner
  # predicates. No key/issuer is admitted by deserializing this value.
  - name: connectors.delegation.ConfiguredApprovalKey
    kind: struct
    fields:
      - {name: issuer, type: String}
      - {name: audience, type: String}
      - {name: kid, type: String}
      - {name: public_key, type: String}
      - {name: not_before_unix_ms, type: Integer}
      - {name: not_after_unix_ms, type: Integer}
      - {name: revoked, type: Boolean}
  - name: connectors.delegation.Purpose
    kind: enum
    variants: [describe, prepare, invoke]
  - name: connectors.delegation.HttpMethod
    kind: enum
    variants: [GET, POST]
  - name: connectors.delegation.DeliveryClaims
    kind: struct
    fields:
      - {name: iss, type: String}
      - {name: aud, type: String}
      - {name: receiver, type: String}
      - {name: purpose, type: connectors.delegation.Purpose}
      - {name: method, type: connectors.delegation.HttpMethod}
      - {name: target, type: String}
      - {name: body_sha256, type: connectors.delegation.LowercaseHex64}
      - {name: authority, type: connectors.delegation.AdmittedAuthority}
      - {name: route, type: connectors.idempotency.RouteBinding}
      - {name: origin_request_id, type: "Optional<String>"}
      - {name: request_id, type: "Optional<String>"}
      - {name: operation, type: "Optional<String>"}
      - {name: connection, type: "Optional<String>"}
      - {name: descriptor_revision, type: "Optional<String>"}
      - {name: execution_deadline_unix_ms, type: Integer}
      - {name: iat, type: Integer}
      - {name: nbf, type: Integer}
      - {name: exp, type: Integer}
      - {name: jti, type: connectors.delegation.LowercaseHex64}
    # contracts/service/delegation.md:51,125: integers in [0, 9007199254740991];
    # jti and body_sha256 are 64 lowercase hex; iss is the route's gateway.
    # delegation.md:129-131: each purpose fixes its method, target and null
    # members; describe hashes the empty body.
    invariants:
      - execution_deadline_unix_ms: {gte: 0, lte: 9007199254740991}
      - iat: {gte: 0, lte: 9007199254740991}
      - nbf: {gte: 0, lte: 9007199254740991}
      - exp: {gte: 0, lte: 9007199254740991}
      - jti.count == 64
      - body_sha256.count == 64
      - iss == route.gateway_instance
      - any:
          - purpose != describe
          - all:
              - method == GET
              - target == "/v1alpha2/describe"
              - body_sha256 == "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              - missing(origin_request_id)
              - missing(request_id)
              - missing(operation)
              - missing(connection)
              - missing(descriptor_revision)
      - any:
          - purpose != prepare
          - all:
              - method == POST
              - target == "/v1alpha2/invoke"
              - operation == "host.approval.prepare"
              - defined(origin_request_id)
      - any:
          - purpose != invoke
          - all:
              - method == POST
              - target == "/v1alpha2/invoke"
              - defined(operation)
              - operation != "host.approval.prepare"
              - defined(origin_request_id)
  - name: connectors.delegation.ApprovalClaims
    kind: struct
    fields:
      - {name: iss, type: String}
      - {name: aud, type: String}
      - {name: reference, type: connectors.delegation.LowercaseHex64}
      - {name: subject, type: connectors.delegation.CanonicalApprovalSubject}
      - {name: iat, type: Integer}
      - {name: nbf, type: Integer}
      - {name: exp, type: Integer}
    # contracts/service/delegation.md:27,51,139,145: reference is 64 lowercase
    # hex; the subject is required-approval, carries the fixed format tag, and a
    # direct origin names the executing instance with no route while a federated
    # origin names the route's gateway; timestamps obey the §4.1 bounds.
    invariants:
      - reference.count == 64
      - subject.approval_mode == required
      - subject.format == "connectors.approval-subject/v1"
      - any: [subject.origin.kind != direct, {not: "defined(subject.route.gateway_instance)"}]
      - any: [subject.origin.kind != direct, subject.origin.authority_ref == subject.target.instance]
      - any: [subject.origin.kind != federated, "defined(subject.route.gateway_instance)"]
      - any: [subject.origin.kind != federated, subject.origin.authority_ref == subject.route.gateway_instance]
      - iat: {gte: 0, lte: 9007199254740991}
      - nbf: {gte: 0, lte: 9007199254740991}
      - exp: {gte: 0, lte: 9007199254740991}

# Receipts are immutable acknowledged facts. They do not authenticate a request,
# open a business gate, or prove atomicity simply by existing in this model.
entities:
  - name: connectors.delegation.DeliveryReceipt
    identity: {name: receipt_id, type: connectors.delegation.ReceiptId}
    fields:
      - {name: instance_id, type: String}
      - {name: issuer, type: String}
      - {name: nonce, type: String}
      - {name: expires_at, type: Timestamp}
    relations:
      - name: receiver
        kind: references
        target: connectors.declarations.ServiceConfiguration
        cardinality: one
        via: instance_id
    lifecycle:
      initial: Consumed
      states: [Consumed]
      terminal: [Consumed]
  - name: connectors.delegation.ApprovalRedemption
    identity: {name: receipt_id, type: connectors.delegation.ReceiptId}
    fields:
      - {name: instance_id, type: String}
      - {name: issuer, type: String}
      - {name: reference, type: String}
      - {name: subject, type: connectors.delegation.CanonicalApprovalSubject}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: spent_at, type: Timestamp}
    # The stored subject obeys the same rules as ApprovalClaims.subject; they are
    # stated here because synthesis cannot build a command input of a struct
    # type that carries its own invariants.
    invariants:
      - subject.format == "connectors.approval-subject/v1"
      - any: [subject.origin.kind != direct, {not: "defined(subject.route.gateway_instance)"}]
      - any: [subject.origin.kind != direct, subject.origin.authority_ref == subject.target.instance]
      - any: [subject.origin.kind != federated, "defined(subject.route.gateway_instance)"]
      - any: [subject.origin.kind != federated, subject.origin.authority_ref == subject.route.gateway_instance]
    relations:
      - name: receiver
        kind: references
        target: connectors.declarations.ServiceConfiguration
        cardinality: one
        via: instance_id
      - name: attempt
        kind: references
        target: connectors.mutations.AttemptRecord
        cardinality: one
        via: attempt_id
    lifecycle:
      initial: Spent
      states: [Spent]
      terminal: [Spent]

commands:
  - name: connectors.delegation.RecordApprovalRedemption
    input:
      - {name: receipt_id, type: connectors.delegation.ReceiptId}
      - {name: instance_id, type: String}
      - {name: issuer, type: String}
      - {name: reference, type: String}
      - {name: subject, type: connectors.delegation.CanonicalApprovalSubject}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: spent_at, type: Timestamp}
    fixture_inputs:
      subject: direct-approval-subject
    outcomes:
      - name: recorded
        creates: connectors.delegation.ApprovalRedemption
        instance: receipt_id
        emits: [connectors.delegation.ApprovalRedemptionRecorded]
        payload:
          connectors.delegation.ApprovalRedemptionRecorded:
            receipt_id: input.receipt_id
        sets:
          instance_id: input.instance_id
          issuer: input.issuer
          reference: input.reference
          subject: input.subject
          attempt_id: input.attempt_id
          spent_at: input.spent_at

events:
  - name: connectors.delegation.ApprovalRedemptionRecorded
    fields: [{name: receipt_id, type: connectors.delegation.ReceiptId}]

views:
  - name: connectors.delegation.ApprovalRedemptions
    source: connectors.delegation.ApprovalRedemption
    consistency: read_your_writes
    fields:
      - {name: receipt_id, type: connectors.delegation.ReceiptId}
      - {name: subject, type: connectors.delegation.CanonicalApprovalSubject}
      - {name: instance_id, type: String}
      - {name: issuer, type: String}
      - {name: reference, type: String}
      - {name: state, type: connectors.delegation.ApprovalRedemption.State}

# Declared above: the fixed header constants (ProofHeader), the integer bounds, the
# lowercase-hex jti/reference/digest values, iss = route gateway and the
# purpose table (DeliveryClaims, ApprovalClaims), and the subject's format and
# origin/route rules (ApprovalClaims, ApprovalRedemption).
# ESS-LIMIT (ESS 0.40): the window equalities nbf = iat - 5 and exp = iat + 25/295
# (delegation.md:145) need arithmetic in a predicate. IDs of at most 256 bytes
# without control characters (delegation.md:51) and the 8 KiB, 512 B, 12 KiB and
# 18 KiB sizes need a byte-length predicate and a character-class exclusion;
# `.count` counts characters and `alphabet:` lists admitted ones. The stored
# subject's digests and ApprovalRedemption.reference could take `alphabet:` and
# `.count == 64`, but Entity Runtime refuses both (AlphabetUnsupported,
# TextLengthUnsupported), so those host-run fields stay String and the host's
# digest check holds them. The required-approval policy (issuer, audience, 300 s,
# delegation.md:85) is a type invariant on a value no entity stores, which no
# view can publish (ESS-SYNTH-013). Mandatory-null emission, canonical
# JSON/base64url, signatures and reconstruction of the approved authority and
# target read data outside the value.
# Issuer, grant and principal CONFIGURATION entities remain with their owners.
# Connection is declared in connectors.auth_bindings; fixed mediated and gateway
# route bindings are values. Proof subjects here retain historical coordinates,
# not ownership or live foreign keys that grant current use.
# Known receipt->receiver and redemption->attempt links are modeled above;
# gateway and execution-hop AuditRecords are separate records in
# connectors.execution_audit. Neither receipt owns an audit record, and audit
# completion proves neither nonce consumption nor approval redemption.
# Atomic uniqueness of (issuer, receiver, nonce) and (issuer, reference), one
# redemption per Prepared attempt, and redemption only against a Prepared attempt
# need compound and cross-record uniqueness and a guard on another record's
# state. ESS 0.45 has no uniqueness constraint (`affects:` sets fields on other
# rows but does not select or refuse by them). `when_related:` (ESS 0.41, source
# format ess/18) reads another row's stored fields but not its lifecycle state
# (ESS 0.45 refuses `state` there as unobservable_fact); this specification is
# ess/15, which refuses the construct (unsupported_format_version), and the ESS
# 0.45 Entity Runtime lowering refuses it at any format (RelatedGuardUnsupported). Trusted clocks, revocation of live keys, durability
# or replicas and anti-rollback remain host obligations.
# Retiring a nonce INDEX after safe expiry does not erase this historical receipt;
# physical retention/compaction and all receipt creation are persistence bindings.
# No fake state transition/command simulates Ed25519 verification or a policy gate.
# ESS compilation validates declarations and references, not sequential execution.


actors:
  - name: connectors.delegation.LocalHost
    may:
      - connectors.delegation.RecordApprovalRedemption
