domain: connectors.clock
summary: Explicitly trusted local clock configuration, bounded observations and owner anti-regression floors.
# Normative owner: contracts/service/clock.md. Values convey no caller or approval authority.
types:
  - name: connectors.clock.Configuration
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: address, type: String}
      - {name: public_key, type: String}
      - {name: max_rate_error_ppm, type: Integer}
    # contracts/service/clock.md:11-13: format roughtime-clock/1, rate bound 1..10,000 ppm.
    invariants:
      - format == "roughtime-clock/1"
      - max_rate_error_ppm: {gte: 1, lte: 10000}
    # ESS-LIMIT: source correctness and the local timer's physical frequency bound
    # are deployment trust assumptions (clock.md:14-19); ESS 0.36 has no construct
    # for an environmental trust assumption, so they are never schema-proven facts.
  - name: connectors.clock.Observation
    kind: struct
    fields:
      - {name: configuration_sha256, type: String}
      - {name: lower_unix_ms, type: Integer}
      - {name: upper_unix_ms, type: Integer}
    # ESS-LIMIT: clock.md:84 bounds each value to 0..9007199254740991 Unix ms and
    # orders them; the bounds are writable as invariants, but this type is a CLI
    # output and ESS 0.36 `generate cli` refuses any invariant on a CLI type. The
    # 4,000 ms width is arithmetic over two sibling fields; raw signature/nonce
    # validation, process continuity,
    # elapsed-time bounds, suspend rejection, TTL and outward rounding are runtime
    # evidence. ESS 0.36 has no field-to-field arithmetic in a type invariant and no
    # signature, monotonic-clock or process-continuity construct.

entities:
  - name: connectors.clock.LocalClockFloor
    identity: {name: owner, type: String}
    fields:
      - {name: lower_unix_ms, type: Integer}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
      transitions:
        - {name: advance, from: [Recorded], to: Recorded}
    # The local registry and mutation owners use distinct identities. An
    # advance is recorded even when a separately proposed business action is
    # refused, so a restart cannot admit a regressed trusted observation.

commands:
  - name: connectors.clock.RecordLocalClockFloor
    input:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
    outcomes:
      - name: recorded
        creates: connectors.clock.LocalClockFloor
        instance: owner
        emits: [connectors.clock.LocalClockFloorRecorded]
        payload:
          connectors.clock.LocalClockFloorRecorded:
            owner: input.owner
        sets:
          lower_unix_ms: input.lower_unix_ms
  - name: connectors.clock.AdvanceLocalClockFloor
    input:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
    outcomes:
      - name: advanced
        moves: connectors.clock.LocalClockFloor.advance
        instance: owner
        emits: [connectors.clock.LocalClockFloorAdvanced]
        payload:
          connectors.clock.LocalClockFloorAdvanced:
            owner: input.owner
            lower_unix_ms: input.lower_unix_ms
        sets:
          lower_unix_ms: input.lower_unix_ms
    # ESS-LIMIT: docs/local-er-metadata.md:124-125 calls these floors owner
    # anti-regression observations, so an advance never lowers lower_unix_ms.
    # Declaring that needs `input.<field>` as an operand in a `when_subject`
    # predicate (ESS value-expressions E6, #157, ESS story
    # subject-guard-input-and-case-folding), not implemented in ESS 0.36.0; the
    # rule is held by the host owner.

events:
  - name: connectors.clock.LocalClockFloorRecorded
    fields: [{name: owner, type: String}]
  - name: connectors.clock.LocalClockFloorAdvanced
    fields:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
