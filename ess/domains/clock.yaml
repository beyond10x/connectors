domain: connectors.clock
summary: Explicitly trusted local clock configuration, bounded observations and owner anti-regression floors.
# Normative owner: contracts/service/clock.md. Values convey no caller or approval authority.
types:
  - name: connectors.clock.Configuration
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: address, type: String}
      - {name: public_key, type: String}
      - {name: max_rate_error_ppm, type: Integer}
    # contracts/service/clock.md:11-13: format roughtime-clock/1, rate bound 1..10,000 ppm.
    invariants:
      - format == "roughtime-clock/1"
      - max_rate_error_ppm: {gte: 1, lte: 10000}
    # ESS-LIMIT: source correctness and the local timer's physical frequency bound
    # are deployment trust assumptions (clock.md:14-19); ESS 0.40 has no construct
    # for an environmental trust assumption, so they are never schema-proven facts.
  - name: connectors.clock.Observation
    kind: struct
    fields:
      - {name: configuration_sha256, type: String}
      - {name: lower_unix_ms, type: Integer}
      - {name: upper_unix_ms, type: Integer}
    # ESS-LIMIT: clock.md:83-84 bounds each value to 0..9007199254740991 Unix ms,
    # orders them and caps the width at 4,000 ms. The bounds are writable as
    # invariants, but this type is a CLI output and ESS 0.40 `specify cli` refuses
    # any invariant on a CLI type. The order compares two sibling fields, which an
    # invariant cannot (ESS-ENTITY-002), and the width is arithmetic over them.
    # Raw signature/nonce validation, process continuity, elapsed-time bounds,
    # suspend rejection, TTL and outward rounding are runtime evidence: ESS 0.40
    # has no signature, monotonic-clock or process-continuity construct.
  - name: connectors.clock.RegistryClockFloorFile
    kind: struct
    fields:
      - {name: last_seen_ms, type: Integer}
    # contracts/service/clock.md "Registry clock floor": the content of the
    # registry's durable floor file, the last system-clock sample a registry
    # transaction admitted. A registry transaction refuses a sample below the
    # higher of this value and the recorded registry LocalClockFloor; a missing
    # or unreadable file counts as that recorded floor plus 60,000 ms.
    invariants:
      - last_seen_ms: {gte: 0}
    # ESS-LIMIT: ESS 0.53 has no file-system or storage construct. The file's
    # location beside the metadata lock, its read and write only under the
    # metadata lifecycle lock, and its write-temporary/fsync/rename replacement
    # are host facts (docs/local-er-metadata.md), not schema-proven ones.

entities:
  - name: connectors.clock.LocalClockFloor
    identity: {name: owner, type: String}
    fields:
      - {name: lower_unix_ms, type: Integer}
    # the host registry and mutation schemas check the floor >= 0. No upper bound is
    # shipped: the registry floor holds a system-clock sample, not a clock.md
    # observation.
    invariants:
      - lower_unix_ms >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
      transitions:
        - {name: advance, from: [Recorded], to: Recorded}
    # The local registry and mutation owners use distinct identities. The
    # mutation floor advances with every observation it admits, even when a
    # separately proposed business action is refused, so a restart cannot admit
    # a regressed trusted observation. The registry floor is a coarse bound on
    # connectors.clock.RegistryClockFloorFile: it advances only to a sample more
    # than 60,000 ms past its recorded value, so it is never more than that
    # below any admitted registry sample.
    # ESS-LIMIT: the 60,000 ms rule compares a subject field with an input plus
    # a constant; ESS 0.53 predicates take a bare fact path on each side
    # ("left-hand side must be a fact path"), so the host enforces it.

commands:
  - name: connectors.clock.RecordLocalClockFloor
    input:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
    outcomes:
      - name: recorded
        creates: connectors.clock.LocalClockFloor
        instance: owner
        emits: [connectors.clock.LocalClockFloorRecorded]
        payload:
          connectors.clock.LocalClockFloorRecorded:
            owner: input.owner
        sets:
          lower_unix_ms: input.lower_unix_ms
  - name: connectors.clock.AdvanceLocalClockFloor
    input:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
    outcomes:
      # docs/local-er-metadata.md: the floors are owner anti-regression
      # observations. The host records an advance only for a changed floor; an
      # equal floor stays accepted so stores recorded before that change, which
      # re-recorded equal values, replay unchanged. Only a lower one is refused.
      - name: regressed
        when_subject:
          predicate: lower_unix_ms > input.lower_unix_ms
        error: connectors.clock.ClockFloorRegressed
      - name: advanced
        moves: connectors.clock.LocalClockFloor.advance
        instance: owner
        emits: [connectors.clock.LocalClockFloorAdvanced]
        payload:
          connectors.clock.LocalClockFloorAdvanced:
            owner: input.owner
            lower_unix_ms: input.lower_unix_ms
        sets:
          lower_unix_ms: input.lower_unix_ms

events:
  - name: connectors.clock.LocalClockFloorRecorded
    fields: [{name: owner, type: String}]
  - name: connectors.clock.LocalClockFloorAdvanced
    fields:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}

errors:
  - name: connectors.clock.ClockFloorRegressed
    fields: [{name: owner, type: String}]

views:
  - name: connectors.clock.LocalClockFloors
    source: connectors.clock.LocalClockFloor
    consistency: read_your_writes
    fields:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
      - {name: state, type: connectors.clock.LocalClockFloor.State}

actors:
  - name: connectors.clock.LocalHost
    may:
      - connectors.clock.AdvanceLocalClockFloor
      - connectors.clock.RecordLocalClockFloor
