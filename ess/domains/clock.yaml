domain: connectors.clock
summary: Explicitly trusted local clock configuration, bounded observations and owner anti-regression floors.
# Normative owner: contracts/service/clock.md. Values convey no caller or approval authority.
types:
  - name: connectors.clock.Configuration
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: quorum, type: Integer}
      - {name: max_rate_error_ppm, type: Integer}
      - {name: sources, type: "List<connectors.clock.Source>"}
    # docs/design/approval-clock-quorum.md: format roughtime-quorum/1 replaces the
    # single-source roughtime-clock/1. The host still parses a roughtime-clock/1
    # table, so the rest of the configuration keeps loading, but every use of that
    # clock refuses invalid_configuration with an upgrade message; it is never read
    # as a one-source quorum. Two to eight sources; a quorum of two to eight
    # verified answers; rate bound 1..10,000 ppm. Sources are identified by their
    # zero-based position in `sources`, which the configuration digest covers.
    invariants:
      - format == "roughtime-quorum/1"
      - quorum: {gte: 2, lte: 8}
      - max_rate_error_ppm: {gte: 1, lte: 10000}
      - sources.count >= 2
      - sources.count <= 8
    # ESS-LIMIT: quorum <= sources.count has a fact path on the right-hand side;
    # ESS 0.59 validates it but keeps the predicate as text, and an earlier ESS
    # read a bare right-hand side as a literal
    # (connectors.mutations.SettlementClockInterval), so it is not declared. "No two
    # sources share an address or a public key" is uniqueness over list members,
    # which no ESS 0.59 invariant states. The host refuses both as invalid
    # configuration and tests pin them.
    # ESS-LIMIT: source correctness, the independence of the sources' operators
    # and the local timer's physical frequency bound are deployment trust
    # assumptions; ESS has no construct for an environmental trust assumption, so
    # they are never schema-proven facts.
  - name: connectors.clock.Source
    kind: struct
    fields:
      - {name: address, type: String}
      - {name: public_key, type: String}
      - {name: version, type: connectors.clock.RoughtimeVersion}
    # One configured Roughtime source: a numeric UDP socket address, its root
    # Ed25519 key in canonical base64 (44 characters, 32 bytes, not all zero) and
    # the one wire version the client sends to it and accepts from it. There is
    # no negotiation and no downgrade: a reply whose signed VER differs, or whose
    # VERS omits the configured version, is unverified.
    invariants:
      - public_key.count == 44
      - address.count <= 64
    # ESS-LIMIT: numeric-address parsing, canonical base64 and the non-zero key are
    # host checks (crates/connectors-host/src/local/clock.rs, Configuration::resolved).
  - name: connectors.clock.RoughtimeVersion
    kind: enum
    # The wire VER values a source may be configured to speak. roughtime-1 is
    # RFC 10049's version 0x00000001 (IANA Roughtime Version Registry), the version
    # the ecosystem list names for two of the sources in docs/design/approval-clock-quorum.md;
    # roughtime-0x8000000c is the draft-19 test version that
    # crates/connectors-host/src/local/clock/protocol.rs verifies today. Each variant
    # ships only together with its verifier and an independent signed fixture.
    variants: [roughtime-1, roughtime-0x8000000c]
  - name: connectors.clock.SourceResult
    kind: enum
    # What one configured source contributed to an acquisition
    # (docs/design/approval-clock-quorum.md, "Refusals"):
    #   agreed        verified within the cap, and its interval meets the answer;
    #   outlier       verified within the cap, and its interval is disjoint from the answer;
    #   verified      verified within the cap, and no answer was formed (a refusal);
    #   unreachable   no reply within the shared deadline, or a send or receive error;
    #   unverified    a reply that does not parse or verify against the source's key and version;
    #   too_imprecise verified, but its own interval is wider than the cap; not counted.
    variants: [agreed, outlier, verified, unreachable, unverified, too_imprecise]
  - name: connectors.clock.SourceReport
    kind: struct
    fields:
      - {name: index, type: Integer}
      - {name: address, type: String}
      - {name: result, type: connectors.clock.SourceResult}
      - {name: radius_ms, type: "Optional<Integer>"}
    # One line per configured source, in configuration order, on an observation
    # and on a quorum refusal. radius_ms is the source's signed radius in
    # milliseconds, present exactly when the reply verified (agreed, outlier,
    # verified, too_imprecise). Never the reply bytes, the nonce or the source's
    # own interval.
    # ESS-LIMIT: index is 0..7 and radius_ms is present exactly for the verified
    # results. The range is writable as an invariant, but this type is reached from
    # a CLI output (connectors.cli.ApprovalClockCheckResult) and ESS `specify cli`
    # refuses any invariant on a CLI type; the presence rule ties an optional field
    # to an enum value, which ESS 0.59 cannot state. The host enforces both and
    # tests pin them.
  - name: connectors.clock.Refusal
    kind: enum
    # Why a quorum acquisition formed no answer, each with its own next action
    # (docs/design/approval-clock-quorum.md, "Refusals"):
    #   below_quorum  fewer than `quorum` sources verified within the cap;
    #                 next action from the excluded sources: check_configuration
    #                 if any is unverified, else choose_clock_source if any is
    #                 too_imprecise, else retry_explicitly;
    #   split         no instant lies in the intervals of `quorum` counted sources;
    #                 choose_clock_source (a source is wrong; retire its key);
    #   too_imprecise the combined answer is wider than the cap; choose_clock_source.
    # A local timer, continuity, overflow or UTC-midnight refusal names none.
    variants: [below_quorum, split, too_imprecise]
  - name: connectors.clock.Observation
    kind: struct
    fields:
      - {name: configuration_sha256, type: String}
      - {name: lower_unix_ms, type: Integer}
      - {name: upper_unix_ms, type: Integer}
      - {name: sources, type: "List<connectors.clock.SourceReport>"}
    # ESS-LIMIT: clock.md bounds each value to 0..9007199254740991 Unix ms,
    # orders them and caps the width at 8,000 ms; the interval is the hull of the
    # instants that at least `quorum` counted sources' intervals contain
    # (docs/design/approval-clock-quorum.md, "Quorum rule"). The bounds are
    # writable as invariants, but this type is a CLI output and ESS `specify cli`
    # refuses any invariant on a CLI type. The order compares two sibling fields,
    # which an invariant cannot (ESS-ENTITY-002), and the width is arithmetic over
    # them. Raw signature/nonce validation, process continuity, elapsed-time
    # bounds, suspend rejection, TTL, outward rounding and the quorum combination
    # itself are runtime evidence: ESS 0.59 has no signature, monotonic-clock,
    # process-continuity or interval-arithmetic construct.
  - name: connectors.clock.RegistryClockFloorFile
    kind: struct
    fields:
      - {name: last_seen_ms, type: Integer}
    # contracts/service/clock.md "Registry clock floor": the content of the
    # registry's durable floor file, the last system-clock sample a registry
    # transaction admitted. A registry transaction refuses a sample below the
    # higher of this value and the recorded registry LocalClockFloor; a missing
    # or unreadable file counts as that recorded floor plus 60,000 ms.
    invariants:
      - last_seen_ms: {gte: 0}
    # ESS-LIMIT: ESS 0.53 has no file-system or storage construct. The file's
    # location beside the metadata lock, its read and write only under the
    # metadata lifecycle lock, and its write-temporary/fsync/rename replacement
    # are host facts (docs/local-er-metadata.md), not schema-proven ones.

entities:
  - name: connectors.clock.LocalClockFloor
    identity: {name: owner, type: String}
    fields:
      - {name: lower_unix_ms, type: Integer}
    # the host registry and mutation schemas check the floor >= 0. No upper bound is
    # shipped: the registry floor holds a system-clock sample, not a clock.md
    # observation.
    invariants:
      - lower_unix_ms >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
      transitions:
        - {name: advance, from: [Recorded], to: Recorded}
    # The local registry and mutation owners use distinct identities. The
    # mutation floor advances with every observation it admits, even when a
    # separately proposed business action is refused, so a restart cannot admit
    # a regressed trusted observation. The registry floor is a coarse bound on
    # connectors.clock.RegistryClockFloorFile: it advances only to a sample more
    # than 60,000 ms past its recorded value, so it is never more than that
    # below any admitted registry sample.
    # ESS-LIMIT: the 60,000 ms rule compares a subject field with an input plus
    # a constant; ESS 0.53 predicates take a bare fact path on each side
    # ("left-hand side must be a fact path"), so the host enforces it.

commands:
  - name: connectors.clock.RecordLocalClockFloor
    input:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
    outcomes:
      - name: recorded
        creates: connectors.clock.LocalClockFloor
        instance: owner
        emits: [connectors.clock.LocalClockFloorRecorded]
        payload:
          connectors.clock.LocalClockFloorRecorded:
            owner: input.owner
        sets:
          lower_unix_ms: input.lower_unix_ms
  - name: connectors.clock.AdvanceLocalClockFloor
    input:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
    outcomes:
      # docs/local-er-metadata.md: the floors are owner anti-regression
      # observations. The host records an advance only for a changed floor; an
      # equal floor stays accepted so stores recorded before that change, which
      # re-recorded equal values, replay unchanged. Only a lower one is refused.
      - name: regressed
        when_subject:
          predicate: lower_unix_ms > input.lower_unix_ms
        error: connectors.clock.ClockFloorRegressed
      - name: advanced
        moves: connectors.clock.LocalClockFloor.advance
        instance: owner
        emits: [connectors.clock.LocalClockFloorAdvanced]
        payload:
          connectors.clock.LocalClockFloorAdvanced:
            owner: input.owner
            lower_unix_ms: input.lower_unix_ms
        sets:
          lower_unix_ms: input.lower_unix_ms

events:
  - name: connectors.clock.LocalClockFloorRecorded
    fields: [{name: owner, type: String}]
  - name: connectors.clock.LocalClockFloorAdvanced
    fields:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}

errors:
  - name: connectors.clock.ClockFloorRegressed
    fields: [{name: owner, type: String}]

views:
  - name: connectors.clock.LocalClockFloors
    source: connectors.clock.LocalClockFloor
    consistency: read_your_writes
    fields:
      - {name: owner, type: String}
      - {name: lower_unix_ms, type: Integer}
      - {name: state, type: connectors.clock.LocalClockFloor.State}

actors:
  - name: connectors.clock.LocalHost
    may:
      - connectors.clock.AdvanceLocalClockFloor
      - connectors.clock.RecordLocalClockFloor
