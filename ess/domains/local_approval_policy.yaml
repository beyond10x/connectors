domain: connectors.local_approval_policy
summary: Proposed serialized local owner policy for approval issuance and write admission.
# Owner: contracts/service/local-mutations.md. Metadata alone grants no use;
# the authenticated owner, current policy/key leases and target checks are required.
types:
  - name: connectors.local_approval_policy.Selection
    kind: struct
    fields:
      - {name: configuration_revision, type: String}
      - {name: descriptor_revision, type: String}
      - {name: executable_selection, type: String}
      - {name: clock_configuration_sha256, type: String}
  - name: connectors.local_approval_policy.SetInput
    kind: struct
    fields:
      - {name: operations, type: List<String>}
  - name: connectors.local_approval_policy.NativePreparation
    kind: struct
    fields:
      - {name: preparation_id, type: Uuid}
      - {name: request_id, type: String}
      - {name: child_incarnation, type: Uuid}
      - {name: input_sha256, type: String}
      - {name: deadline_unix_ms, type: Integer}
    # A private control value, never a serializable write capability. Immutable
    # provider request/credential state remains in the same owned child process.
entities:
  - name: connectors.local_approval_policy.LocalApprovalPolicy
    identity: {name: policy_id, type: Uuid}
    fields:
      - {name: instance_id, type: String}
      - {name: issuer_id, type: Uuid}
      - {name: revision, type: Integer}
      - {name: owner_uid, type: Integer}
      - {name: selection, type: connectors.local_approval_policy.Selection}
      - {name: operations, type: List<String>}
    relations:
      - {name: instance, kind: references, target: connectors.declarations.ServiceConfiguration, cardinality: one, via: instance_id}
      - {name: issuer, kind: references, target: connectors.approval_issuers.ApprovalIssuer, cardinality: one, via: issuer_id}
    # local-mutations.md:22-23 and the host approval policy schema check 1..=9007199254740991.
    invariants:
      - revision: {gte: 1, lte: 9007199254740991}
    lifecycle:
      initial: Configured
      states: [Configured]
      terminal: [Configured]
      transitions:
        - {name: revise, from: [Configured], to: Configured}
    # Stable retained identity; mutable revisioned policy contents. Configured
    # does not assert admission: an empty operation set revokes every new use.
    # No record or reference cascades deletion of issuer/configuration/history.

commands:
  - name: connectors.local_approval_policy.ConfigureLocalApprovalPolicy
    input:
      - {name: policy_id, type: Uuid}
      - {name: instance_id, type: String}
      - {name: issuer_id, type: Uuid}
      - {name: revision, type: Integer}
      - {name: owner_uid, type: Integer}
      - {name: selection, type: connectors.local_approval_policy.Selection}
      - {name: operations, type: List<String>}
    outcomes:
      # local-mutations.md:22 "a random non-nil UUID" (approval_policy.rs validate).
      - name: nil-identity
        when: {policy_id: {in: ["00000000-0000-0000-0000-000000000000"]}}
        error: connectors.local_approval_policy.NilPolicyIdentity
      # local-mutations.md:26-27 "at most 256 write operation IDs" (MAX_OPERATIONS).
      - name: too-many-operations
        when: operations.count > 256
        error: connectors.local_approval_policy.TooManyOperations
      - name: configured
        creates: connectors.local_approval_policy.LocalApprovalPolicy
        instance: policy_id
        emits: [connectors.local_approval_policy.LocalApprovalPolicyConfigured]
        payload:
          connectors.local_approval_policy.LocalApprovalPolicyConfigured:
            policy_id: input.policy_id
        sets:
          instance_id: input.instance_id
          issuer_id: input.issuer_id
          revision: input.revision
          owner_uid: input.owner_uid
          selection: input.selection
          operations: input.operations
  - name: connectors.local_approval_policy.ReviseLocalApprovalPolicy
    input:
      - {name: policy_id, type: Uuid}
      - {name: expected_revision, type: Integer}
      - {name: revision, type: Integer}
      - {name: selection, type: connectors.local_approval_policy.Selection}
      - {name: operations, type: List<String>}
    outcomes:
      # local-mutations.md:32-33,43: a revision CAS. The caller's expected
      # revision must equal the stored one (approval_policy.rs publish, Conflict).
      - name: revision-conflict
        when_subject:
          predicate: revision != input.expected_revision
        error: connectors.local_approval_policy.RevisionConflict
      # local-mutations.md:23-24: exhaustion refuses without changing the policy
      # (approval_policy.rs publish, Capacity).
      # ESS-LIMIT: ESS 0.43 through 0.45 synthesize no scenario for this branch
      # (ESS-SYNTH-003, "stored revision selecting this branch", beyond10x/ess#251);
      # a host test in connectors-host drives it at the maximum stored revision.
      - name: exhausted
        when_subject:
          predicate: revision >= 9007199254740991
        error: connectors.local_approval_policy.RevisionExhausted
      - name: too-many-operations
        when: operations.count > 256
        error: connectors.local_approval_policy.TooManyOperations
      # The host writes the stored revision plus one (approval_policy.rs publish,
      # trigger local_approval_policy_revision). This guard refuses a revision
      # that does not advance; the exact +1 step stays host-held because
      # `{increment: 1}` does not lower to Entity Runtime.
      - name: stale-revision
        when_subject:
          predicate: revision >= input.revision
        error: connectors.local_approval_policy.RevisionNotAdvanced
      - name: revised
        moves: connectors.local_approval_policy.LocalApprovalPolicy.revise
        instance: policy_id
        emits: [connectors.local_approval_policy.LocalApprovalPolicyRevised]
        payload:
          connectors.local_approval_policy.LocalApprovalPolicyRevised:
            policy_id: input.policy_id
            revision: input.revision
        sets:
          revision: input.revision
          selection: input.selection
          operations: input.operations

events:
  - name: connectors.local_approval_policy.LocalApprovalPolicyConfigured
    fields: [{name: policy_id, type: Uuid}]
  - name: connectors.local_approval_policy.LocalApprovalPolicyRevised
    fields:
      - {name: policy_id, type: Uuid}
      - {name: revision, type: Integer}
# ESS-LIMIT: one policy per instance, issuer-instance equality, the exact +1
# revision step, a first set that requires absence, durable acknowledgement,
# current peer UID, shared/exclusive process leases, strict canonical snapshots,
# sorted distinct supported write operations, current descriptor/clock/connection
# checks and protected proof publication need the host runtime. ESS 0.40 has no
# uniqueness of a non-identity field (one policy per instance), no guard over
# list members against other records (supported operations) and no sorted or
# distinct list predicate. `{increment: 1}` states the +1 step,
# `{related: {via: input.issuer_id, field: instance_id}}` the issuer-instance
# equality and `existing_instance:` the absence, but Entity Runtime refuses all
# three when lowering. ESS has no process, OS-identity or trusted-time construct.
# The revision CAS, bounds, exhaustion and the 256-operation count are declared above.

errors:
  - name: connectors.local_approval_policy.RevisionConflict
    fields: [{name: policy_id, type: Uuid}]
  - name: connectors.local_approval_policy.RevisionExhausted
    fields: [{name: policy_id, type: Uuid}]
  - name: connectors.local_approval_policy.RevisionNotAdvanced
    fields: [{name: policy_id, type: Uuid}]
  - name: connectors.local_approval_policy.NilPolicyIdentity
    fields: [{name: policy_id, type: Uuid}]
  - name: connectors.local_approval_policy.TooManyOperations
    fields: [{name: policy_id, type: Uuid}]

views:
  - name: connectors.local_approval_policy.LocalApprovalPolicies
    source: connectors.local_approval_policy.LocalApprovalPolicy
    consistency: read_your_writes
    fields:
      - {name: policy_id, type: Uuid}
      - {name: revision, type: Integer}
      - {name: issuer_id, type: Uuid}
      - {name: owner_uid, type: Integer}
      - {name: state, type: connectors.local_approval_policy.LocalApprovalPolicy.State}

actors:
  - name: connectors.local_approval_policy.LocalHost
    may:
      - connectors.local_approval_policy.ConfigureLocalApprovalPolicy
      - connectors.local_approval_policy.ReviseLocalApprovalPolicy
