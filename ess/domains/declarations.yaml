domain: connectors.declarations

# Value declarations inside the Connectors-owned v2 adapter document. The v1
# declarations remain usable without these optional v2 fields.
types:
  - name: connectors.declarations.UpstreamSource
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: url, type: String}
      - {name: revision, type: String}
      - {name: sha256, type: String}
      - {name: base_path, type: String}
  - name: connectors.declarations.NamedParameter
    kind: struct
    fields:
      - {name: name, type: String}
  - name: connectors.declarations.ConstantParameter
    kind: struct
    fields:
      - {name: value, type: String}
  - name: connectors.declarations.Parameter
    kind: union
    tag: kind
    variants:
      input: connectors.declarations.NamedParameter
      binding: connectors.declarations.NamedParameter
      constant: connectors.declarations.ConstantParameter
  - name: connectors.declarations.RequestMapping
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: upstream_operation, type: String}
      - {name: path, type: String}
      - {name: method, type: String}
      - {name: path_parameters, type: "Map<String, connectors.declarations.Parameter>"}
      - {name: query_parameters, type: "Map<String, connectors.declarations.Parameter>"}
      - {name: obligations, type: "List<String>"}
      - {name: response_prefix_limit, type: "Optional<Integer>"}
    # Optional bounded HTTP prefix policy; absent retains the complete-body
    # transport and existing finish signature. No retry or provider authority.

  - name: connectors.declarations.OperationAvailability
    kind: struct
    fields:
      - {name: implemented, type: Boolean}
      - {name: binding_supported, type: Boolean}
      - {name: enabled, type: Boolean}
      - {name: metadata_admitted, type: Boolean}
      - {name: lookup_admitted, type: Boolean}
      - {name: dependency_ready, type: Boolean}
  - name: connectors.declarations.AvailabilityDecision
    kind: struct
    fields:
      - {name: advertised, type: Boolean}
      - {name: lookup_error, type: "Optional<connectors.service_wire.ErrorCode>"}
    # Private facts/decision values for service v1alpha2 §3.2.1, not public
    # descriptor flags, caller-supplied authority, or an implemented policy engine.
    # An absent lookup_error only allows subsequent checks, not business dispatch.
    # ESS-LIMIT: fact provenance, metadata/lookup/result scope, supported profile,
    # revision and refusal precedence, projection intersection, actual readiness,
    # candidate-only approval/preflight and dispatch-time authority fencing. The
    # §3.2.1 precedence (contracts/service/v1alpha2/semantics.md:78-92) reduces
    # OperationAvailability facts to this decision. ESS 0.40 has no derived value
    # (a value computed from other values by a declared function), no provenance
    # and no dispatch-fence construct.
    # No new entity, grant relation, lifecycle or declaration field is implied.

  # Proposed v3 write mapping; the existing v1/v2 readers remain unchanged.
  - name: connectors.declarations.BooleanBodyConstant
    kind: struct
    fields:
      - {name: value, type: Boolean}
  - name: connectors.declarations.IntegerBodyConstant
    kind: struct
    fields:
      - {name: value, type: Integer}
  - name: connectors.declarations.BodyParameter
    kind: union
    tag: kind
    variants:
      input: connectors.declarations.NamedParameter
      string: connectors.declarations.ConstantParameter
      boolean: connectors.declarations.BooleanBodyConstant
      integer: connectors.declarations.IntegerBodyConstant
  - name: connectors.declarations.WriteMapping
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: upstream_operation, type: String}
      - {name: path, type: String}
      - {name: method, type: String}
      - {name: path_parameters, type: "Map<String, connectors.declarations.Parameter>"}
      - {name: query_parameters, type: "Map<String, connectors.declarations.Parameter>"}
      - {name: body, type: "Map<String, connectors.declarations.BodyParameter>"}
    # ESS-LIMIT executable obligations: closed put-only reader, scalar schema
    # agreement, exact pinned upstream binding, immutable prepared request,
    # separate one-use write transport and legacy read-only projection. These are
    # reader/codec and transport rules; ESS 0.40 has no reader-closure, upstream-pin
    # or transport construct.

  # The HTTP service host's configuration (crates/connectors-host/src/server.rs
  # ServiceConfig), read as `urn:connectors:config:v2:service`. Revision v2 is
  # v1 plus the optional `state`; `urn:connectors:config:v1:service` stays
  # readable unchanged and has no `state` (contracts/service/compatibility.md
  # § 2.1, Service configuration). `listen` and `service_credential` keep their
  # v1 meaning; they are transport and credential-reference facts with no ESS
  # noun and are not modelled here. This is a configuration value, not the
  # recorded ServiceConfiguration entity: the state directory is where that
  # record lives, so it is not a field of it.
  - name: connectors.declarations.ServiceHostConfiguration
    kind: struct
    fields:
      # The service instance id; the ServiceConfiguration the host records at
      # start carries it as `instance_id`. Vocabulary: the instance (design
      # § Decision); the field keeps its name.
      - {name: instance, type: String}
      # A directory path. Required for a host that serves
      # POST /v1alpha2/invoke: the host keeps its execution-audit anchors and its
      # mutation attempt records in the local metadata authority (Entity
      # Runtime over Eventlog) in this directory, under the bounds and
      # retention of contracts/service/audit.md § 4. A host without it serves
      # only /v1/* and answers /v1alpha2/invoke with 503 `unavailable` before
      # decoding.
      - {name: state, type: "Optional<String>"}

# Immutable declarations, not the lifecycle of a running process or connection.
# Interaction and failure semantics are in contracts/service/v1alpha1/semantics.md.
entities:
  # Vocabulary: "adapter" is internal only (design § Decision): the
  # implementation of a contract (`adapter_id = "catalog"`) and its running
  # process. It is not a user-facing noun; the user configures a Connector and
  # its instances (ServiceConfiguration).
  - name: connectors.declarations.AdapterSpecification
    identity:
      name: adapter_id
      type: String
    fields:
      - name: kind_version
        type: String
      - name: implementation_version
        type: String
      - name: upstream
        type: Optional<connectors.declarations.UpstreamSource>
      # Proposed immutable provenance joins; current strict readers are unchanged.
      - name: source_refs
        type: List<String>
    relations:
      - name: sources
        kind: references
        target: connectors.artifact_provenance.Source
        cardinality: many
        via: source_refs
      - name: operations
        kind: owns
        target: connectors.declarations.OperationDeclaration
        cardinality: many
        via: adapter_id
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # User vocabulary (docs/design/connector-vocabulary.md § Decision): a
  # provider is the company or technology behind one or more connectors
  # (Google, GitLab). Not today's catalog `provider` value (`google-gmail`,
  # adapters/catalog/src/local.rs:173): that names one API, which is a
  # Connector below.
  # UNMAPPED: whether a provider appears in configuration at all or only in the
  # catalog that lists connectors (design § Open questions). Recorded here as a
  # declaration either way; the owner decides where it is read from.
  # UNMAPPED: the provider_id format (`google`? `Google`?). No code or document
  # fixes it.
  - name: connectors.declarations.Provider
    identity:
      name: provider_id
      type: String
    fields: []
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # User vocabulary (design § Decision; ADR connector-vocabulary decision 2): a
  # connector is one service or app of a provider with one API (Gmail, Drive,
  # GitLab), enabled in configuration (`[connectors.<connector>]`, design
  # § What changes, a sketch and not a schema). Many connectors per provider.
  # It replaces the user-facing "adapter" alias; "adapter" stays the internal
  # name of the implementation (AdapterSpecification) and of its process.
  # UNMAPPED: the connector_id format, and whether it equals today's catalog
  # `provider` value (`google-gmail`, adapters/catalog/src/local.rs:173), which
  # is inside the configuration-revision digest the migration must keep
  # (migration-plan connector-vocabulary § Invariant).
  # UNMAPPED: which AdapterSpecification implements a connector, and its
  # cardinality (one adapter_id such as `catalog` serves several connectors
  # today). The design says the executable is "resolved from the installed
  # connector" and names no relation. Open question for the owner.
  # UNMAPPED: an operation is "one callable tool of a connector" and an auth
  # profile is "one way to authenticate that a connector declares" (design
  # § Decision), but OperationDeclaration is owned by AdapterSpecification via
  # adapter_id and AuthProfile references AdapterSpecification via adapter_id.
  # No connector_id is carried on either; whether they gain one, or reach the
  # connector through the adapter, is open. Not modelled here.
  # UNMAPPED: enabling a connector is stated as configuration (`enabled =
  # true`), not as a command. Whether a connector that is not enabled is a
  # record at all (catalog) or only an enabled one is (configuration) is the
  # same open question as for Provider. No command is modelled.
  - name: connectors.declarations.Connector
    identity:
      name: connector_id
      type: String
    fields:
      - name: provider_id
        type: String
      - name: enabled
        type: Boolean
      # The endpoint an instance without `endpoint` uses (design § What
      # changes: "An instance without `endpoint` uses the connector's default
      # endpoint").
      # UNMAPPED: whether every connector has a default endpoint (a catalog
      # connector has `api_base`; a stdio MCP or credential-binary connector
      # may have none). Optional is the weaker claim, not a decision.
      - name: default_endpoint
        type: Optional<String>
    relations:
      - name: provider
        kind: references
        target: connectors.declarations.Provider
        cardinality: one
        via: provider_id
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Vocabulary: this is the operation, "one callable tool of a connector"
  # (design § Decision). Every operation of an enabled connector is available
  # on its instances; no grouping or per-instance filter. Its link to a
  # Connector is UNMAPPED (see Connector).
  - name: connectors.declarations.OperationDeclaration
    identity:
      name: operation_id
      type: String
    fields:
      - name: adapter_id
        type: String
      - name: contract
        type: String
      - name: profile
        type: String
      - name: input_schema_json
        type: String
      - name: output_schema_json
        type: String
      - name: request_mapping
        type: Optional<connectors.declarations.RequestMapping>
      - name: write_mapping
        type: Optional<connectors.declarations.WriteMapping>
      # Authored decision value; absent remains unresolved where required.
      - name: curation
        type: Optional<connectors.artifact_provenance.Curation>
      - name: requires_auth
        type: Optional<List<connectors.auth_bindings.AuthRequirement>>
    # Proposed authored alternatives; absent on existing declarations. This model
    # adds no field support to a current strict adapter or public reader.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # User vocabulary: this is the instance (design § Decision; ADR
  # connector-vocabulary decision 3), the user's name for one configured
  # connector. Reused, not a parallel entity: its identity is the
  # `instance_id` of an `[adapters.<alias>]` entry
  # (crates/connectors-host/src/local/config.rs:269), the host's
  # `registry_instances` row (registry/lifecycle.rs:451), and the key
  # Connection.instance_id references (auth_bindings.yaml). A migrated
  # instance keeps that value byte for byte (migration-plan
  # connector-vocabulary § Invariant, step 2). Old -> new: "adapter alias" /
  # `--adapter <alias>` -> connector + instance (`--connector <name>
  # --instance <name>`); ServiceConfiguration -> instance. The entity keeps its
  # name in this pass; the rename is a later story.
  # UNMAPPED: the instance_id format of a new (not migrated) instance, "derived
  # from connector and instance name" (migration-plan step 2), and whether `/`
  # passes the selector check (config.rs:530-533).
  # CONTRADICTION: the design says an instance "holds at most one connection";
  # the host admits up to 1000 connections per instance_id
  # (registry/lifecycle.rs:20-22), and Connection's notes (auth_bindings.yaml)
  # follow a lifetime-only profile change with a new Connection under the same
  # instance id. Not modelled as a cardinality until the owner decides whether
  # "at most one" counts revoked or superseded connections.
  - name: connectors.declarations.ServiceConfiguration
    identity:
      name: instance_id
      type: String
    fields:
      - name: adapter_id
        type: String
      - name: revision
        type: String
      - name: registry_epoch
        type: Integer
      # The connector this instance belongs to (design § Decision: "An
      # instance belongs to one connector and is never shared across
      # connectors"). Optional only because a legacy `[adapters.<alias>]`
      # entry names no connector while both formats are read (migration-plan
      # step 1).
      # UNMAPPED: whether it becomes required once `[adapters.*]` reading ends
      # (migration-plan step 9).
      - name: connector_id
        type: Optional<String>
      # The user's free instance name (`private`, `work`; design § Decision),
      # which addresses an instance within its connector. Absent on a legacy
      # alias, whose name is its `[adapters.<alias>]` key.
      # UNMAPPED: uniqueness of (connector_id, name) is implied by "the
      # instance name is what addresses the right one" and is not declared;
      # this format has no uniqueness construct used here.
      - name: name
        type: Optional<String>
      # Absent: the connector's default_endpoint (design § What changes).
      - name: endpoint
        type: Optional<String>
      - name: description
        type: Optional<String>
    relations:
      - name: adapter
        kind: references
        target: connectors.declarations.AdapterSpecification
        cardinality: one
        via: adapter_id
      - name: connector
        kind: references
        target: connectors.declarations.Connector
        cardinality: one
        via: connector_id
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
      transitions:
        - {name: advance_registry_epoch, from: [Declared], to: Declared}
        # A move to another configuration revision (UpgradeServiceConfiguration).
        - {name: upgrade_configuration, from: [Declared], to: Declared}

commands:
  # HTTP host start (compatibility.md § 2.1, Service configuration): a host with
  # `state` records its own instance before it serves /v1alpha2/invoke, so the
  # anchors' and attempts' `instance` relation names a recorded
  # ServiceConfiguration. Idempotent: it reads ServiceConfigurations for its
  # instance; absent, it sends RecordServiceConfiguration (adapter_id and
  # revision from its adapter's descriptor, registry_epoch 1); present with the
  # same adapter_id and revision, it sends nothing; present with the same
  # adapter_id and another revision, it sends UpgradeServiceConfiguration with
  # that revision and the next epoch, as a local configuration upgrade does;
  # present with another adapter_id, start is refused and nothing is served on
  # /v1alpha2/invoke.
  # ESS-LIMIT: the start sequence spans a view read and several commands; ESS
  # has no host-procedure construct, so the sequence is a host obligation.
  # UNMAPPED: no command sets ServiceConfiguration's connector_id, name,
  # endpoint or description. The design states adding an instance as
  # configuration (`[connectors.<c>.instances.<i>]`), not as a command, and
  # does not say whether the host records them through this command, a new
  # one, or reads them from configuration only.
  - name: connectors.declarations.RecordServiceConfiguration
    input:
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: revision, type: String}
      - {name: registry_epoch, type: Integer}
    outcomes:
      - name: recorded
        creates: connectors.declarations.ServiceConfiguration
        instance: instance_id
        emits: [connectors.declarations.ServiceConfigurationRecorded]
        payload:
          connectors.declarations.ServiceConfigurationRecorded:
            instance_id: input.instance_id
        sets:
          adapter_id: input.adapter_id
          revision: input.revision
          registry_epoch: input.registry_epoch
  - name: connectors.declarations.AdvanceRegistryEpoch
    input:
      - {name: instance_id, type: String}
      - {name: registry_epoch, type: Integer}
    outcomes:
      # The host only ever writes `epoch=epoch+1` (registry/lifecycle.rs `bump`),
      # so a lower epoch is refused. An equal one is accepted: a row whose other
      # columns change keeps its epoch and is recorded through this command.
      # It never moves `revision`: a change of revision is
      # UpgradeServiceConfiguration.
      - name: regressed
        when_subject:
          predicate: registry_epoch > input.registry_epoch
        error: connectors.declarations.RegistryEpochRegressed
      - name: advanced
        moves: connectors.declarations.ServiceConfiguration.advance_registry_epoch
        instance: instance_id
        emits: [connectors.declarations.RegistryEpochAdvanced]
        payload:
          connectors.declarations.RegistryEpochAdvanced:
            instance_id: input.instance_id
            registry_epoch: input.registry_epoch
        sets:
          registry_epoch: input.registry_epoch
  # Moves an instance to another configuration revision and its registry epoch
  # together. The local owner's configuration upgrade
  # (registry/revalidation.rs, registry/lifecycle.rs) and the HTTP host start
  # (above) both record a revision change through it; the same epoch rule as
  # AdvanceRegistryEpoch applies, so a lower epoch is refused.
  - name: connectors.declarations.UpgradeServiceConfiguration
    input:
      - {name: instance_id, type: String}
      - {name: revision, type: String}
      - {name: registry_epoch, type: Integer}
    outcomes:
      - name: regressed
        when_subject:
          predicate: registry_epoch > input.registry_epoch
        error: connectors.declarations.RegistryEpochRegressed
      - name: upgraded
        moves: connectors.declarations.ServiceConfiguration.upgrade_configuration
        instance: instance_id
        emits: [connectors.declarations.ServiceConfigurationUpgraded]
        payload:
          connectors.declarations.ServiceConfigurationUpgraded:
            instance_id: input.instance_id
            revision: input.revision
            registry_epoch: input.registry_epoch
        sets:
          revision: input.revision
          registry_epoch: input.registry_epoch

events:
  - name: connectors.declarations.ServiceConfigurationRecorded
    fields: [{name: instance_id, type: String}]
  - name: connectors.declarations.RegistryEpochAdvanced
    fields:
      - {name: instance_id, type: String}
      - {name: registry_epoch, type: Integer}
  - name: connectors.declarations.ServiceConfigurationUpgraded
    fields:
      - {name: instance_id, type: String}
      - {name: revision, type: String}
      - {name: registry_epoch, type: Integer}

errors:
  - name: connectors.declarations.RegistryEpochRegressed
    fields: [{name: instance_id, type: String}]

  # DEFERRED: multi-tenant SaaS ownership/assignment cardinality remains outside
  # this local, explicitly configured service slice. No tenant is caller-selected.
  # Owned by a story to be filed (story:multi-tenant-principal-assignment, not yet in
  # the store on 2026-09-27).

views:
  - name: connectors.declarations.ServiceConfigurations
    source: connectors.declarations.ServiceConfiguration
    consistency: read_your_writes
    fields:
      - {name: instance_id, type: String}
      - {name: adapter_id, type: String}
      - {name: revision, type: String}
      - {name: registry_epoch, type: Integer}
      - {name: state, type: connectors.declarations.ServiceConfiguration.State}

actors:
  - name: connectors.declarations.LocalHost
    may:
      - connectors.declarations.AdvanceRegistryEpoch
      - connectors.declarations.RecordServiceConfiguration
      - connectors.declarations.UpgradeServiceConfiguration
  # The HTTP service host (crates/connectors-host/src/server.rs) at start.
  - name: connectors.declarations.ServiceHost
    may:
      - connectors.declarations.RecordServiceConfiguration
      - connectors.declarations.UpgradeServiceConfiguration
