# ESS-LIMIT (checked against ESS 0.40.0, format ess/15, and its Entity Runtime
# lowering). Declared above: field assignment from command inputs, the private
# fence compare-and-set and advance on PublishBinding, Completed's result equal
# to its target, terminal reasons, the custody/generation and access-mode
# invariants and the byte-size bound. Still owner predicates:
# - clearing an Optional field (baseline on revocation, byte size and material
#   handle on deletion): `{cleared: true}` validates, but the lowering refuses it
#   (ClearedValueUnsupported); the host clears the column.
# - installing generation, custody version and identity from BindingPublication:
#   `sets:` cannot read a dotted input (ESS-COMMAND-001), and the lowering refuses
#   an Optional input copied on an update (OptionalBoundOutputUnsupported).
# - baseline presence and generation/binding equality, null identity on
#   material-free children, a result present only on Completed: `defined()` over
#   an Optional struct and state-conditioned invariants need format ess/16.
# - at most six distinct baseline checks without permission_check: a list
#   invariant validates, but synthesis cannot witness it through any view.
# - parent never itself or a mediated parent: no field-vs-identity comparison
#   (ESS-ENTITY-002) and no cross-record guard.
# - unique (adapter_id, profile_id, declaration_revision) and (scope_ref,
#   store_version): no compound uniqueness constraint.
# - capacity of connections, acquisitions and retained versions: no
#   cross-record count. superseded_custody_version_refs also lists deleted
#   versions, so the eight-version bound is not a bound on that list.
# - one winning completion per target, deactivation before retirement: no
#   cross-record guard.
# - acquisition ceilings and a deadline that never slides: no timestamp arithmetic.
# - current expiry at now >= expires_at and trusted retention clocks: ess/16 `now`
#   reads only inputs in `when:`, and the lowering refuses it (CurrentTimeUnsupported).
# - private key allocation, protected-correlation provenance, real atomic
#   consumption, coordinated publication/revoke/final dispatch, physical byte
#   pinning/deletion, payload erasure and safe projections: no multi-record
#   transaction or storage construct (`affects:` sets fields and takes no transition).
# No tenant/assignment entity, registration-secret owner, public management codec,
# provider-native rule, dynamic installation or storage backend is introduced.

  - name: connectors.auth_bindings.AcquisitionStates
    source: connectors.auth_bindings.Acquisition
    consistency: read_your_writes
    fields:
      - {name: acquisition_ref, type: String}
      - {name: state, type: connectors.auth_bindings.Acquisition.State}
  - name: connectors.auth_bindings.ConnectionStates
    source: connectors.auth_bindings.Connection
    consistency: read_your_writes
    fields:
      - {name: connection_ref, type: String}
      - {name: state, type: connectors.auth_bindings.Connection.State}
  - name: connectors.auth_bindings.CustodyVersionStates
    source: connectors.auth_bindings.CustodyVersion
    consistency: read_your_writes
    fields:
      - {name: version_ref, type: String}
      - {name: state, type: connectors.auth_bindings.CustodyVersion.State}

