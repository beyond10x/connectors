domain: connectors.auth_bindings
summary: Proposed host-private auth records and acknowledged lifecycle boundaries.

# Normative owners: auth/profile §4.3, connection §4.2, acquisition §4.3,
# custody §4.1. This is a private model, not a public codec or storage engine.
# Decision inputs below are trusted owner decisions taken inside the applicable
# atomic operation. They are not caller authority or reusable send permits.
types:
  - name: connectors.auth_bindings.Decision
    kind: enum
    variants: [allow, refuse, unknown]
  - name: connectors.auth_bindings.AcquisitionFailure
    kind: enum
    variants: [rejected, exchange_unknown, expired]
  - name: connectors.auth_bindings.ScopeRequirements
    kind: struct
    fields:
      - {name: requestable, type: "List<String>"}
      - {name: minimum, type: "List<String>"}
  - name: connectors.auth_bindings.AuthRequirement
    kind: struct
    fields:
      - {name: profile, type: String}
      - {name: scopes, type: "List<String>"}
    # Adapter-local authored profile id, resolved under that declaration owner;
    # not the private revision-qualified AuthProfile record key.
  - name: connectors.auth_bindings.ProfileDeclaration
    kind: struct
    fields:
      - {name: purpose, type: connectors.auth_access.Purpose}
      - {name: subject, type: connectors.auth_access.Subject}
      - {name: scheme, type: connectors.auth_access.Scheme}
      - {name: acquisition, type: connectors.auth_access.AcquisitionDeclaration}
      - {name: scopes, type: connectors.auth_bindings.ScopeRequirements}
      - {name: capabilities, type: "List<connectors.auth_access.CapabilityName>"}
      - {name: evidence, type: "List<connectors.credential_evidence.CheckKind>"}
      - {name: evidence_requirements, type: connectors.connection_admission.EvidenceRequirements}
      - {name: identity_mechanism_ref, type: "Optional<String>"}
      - {name: refresh_policy_ref, type: "Optional<String>"}
      - {name: revocation_binding_ref, type: "Optional<String>"}
      - {name: sources, type: "List<String>"}
    # Native mechanism/policy references identify reviewed adapter declarations;
    # they do not admit arbitrary payloads or implement reserved mechanisms.
  - name: connectors.auth_bindings.CredentialSet
    kind: struct
    fields:
      - {name: kind, type: String}
      - {name: material_handle, type: String}
      - {name: size_bytes, type: Integer}
    # One private coherent set; no secret bytes or public locator projection.
  - name: connectors.auth_bindings.BindingPublication
    kind: struct
    fields:
      - {name: connection_ref, type: String}
      - {name: expected_publication_fence, type: String}
      - {name: profile_record_ref, type: String}
      - {name: generation_id, type: "Optional<connectors.credentials.CredentialGenerationId>"}
      - {name: custody_version_ref, type: "Optional<String>"}
      - {name: external_identity, type: "Optional<connectors.credentials.ExternalIdentity>"}
    # Null material is selected only by an explicit non-material binding; it is
    # never a replacement credential when custody/evidence cannot be established.
  - name: connectors.auth_bindings.LocalStaticProfile
    kind: struct
    fields:
      - {name: profile_id, type: String}
      - {name: revision, type: String}
      - {name: purpose, type: connectors.auth_access.Purpose}
      - {name: subject, type: connectors.auth_access.Subject}
      - {name: minimum_scopes, type: "List<String>"}
      - {name: evidence_lifetime_ms, type: Integer}
    # Exact durable subset admitted by the production static-entry owner. It
    # cannot be inflated into a complete authored ProfileDeclaration on import.

entities:
  - name: connectors.auth_bindings.AuthProfile
    identity: {name: profile_record_ref, type: String}
    fields:
      - {name: adapter_id, type: String}
      - {name: profile_id, type: String}
      - {name: declaration_revision, type: String}
      - {name: declaration, type: "Optional<connectors.auth_bindings.ProfileDeclaration>"}
      - {name: local_static_profile, type: "Optional<connectors.auth_bindings.LocalStaticProfile>"}
    relations:
      - {name: adapter, kind: references, target: connectors.declarations.AdapterSpecification, cardinality: one, via: adapter_id}
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]
    # Exact immutable (adapter_id, profile_id, declaration_revision) key.
    # No delete command or cascade into referencing Connections is selected.

  - name: connectors.auth_bindings.Connection
    identity: {name: connection_ref, type: String}
    fields:
      - {name: instance_id, type: String}
      - {name: profile_record_ref, type: String}
      - {name: profile_ref, type: String}
      - {name: owner_scope, type: String}
      - {name: actor, type: String}
      - {name: provider_authority, type: String}
      - {name: access_mode, type: connectors.auth_access.AccessMode}
      - {name: semantic_revision, type: String}
      - {name: publication_fence, type: String}
      - {name: enabled, type: Boolean}
      - {name: published, type: Boolean}
      - {name: external_identity, type: "Optional<connectors.credentials.ExternalIdentity>"}
      - {name: parent_connection_ref, type: "Optional<String>"}
      - {name: mediated_route, type: "Optional<connectors.discovery.MediatedRouteBinding>"}
      - {name: active_generation_id, type: "Optional<connectors.credentials.CredentialGenerationId>"}
      - {name: baseline_evidence, type: "Optional<connectors.credential_evidence.EvidenceSnapshot>"}
      - {name: active_custody_version_ref, type: "Optional<String>"}
      - {name: superseded_custody_version_refs, type: "List<String>"}
      - {name: created_at, type: Timestamp}
      - {name: revoked_at, type: "Optional<Timestamp>"}
      - {name: configuration_revision, type: "Optional<String>"}
    relations:
      - {name: instance, kind: references, target: connectors.declarations.ServiceConfiguration, cardinality: one, via: instance_id}
      - {name: auth_profile, kind: references, target: connectors.auth_bindings.AuthProfile, cardinality: one, via: profile_record_ref}
      - {name: parent, kind: references, target: connectors.auth_bindings.Connection, cardinality: one, via: parent_connection_ref}
      - {name: active_generation, kind: references, target: connectors.credentials.CredentialGeneration, cardinality: one, via: active_generation_id}
      - {name: active_custody_version, kind: references, target: connectors.auth_bindings.CustodyVersion, cardinality: one, via: active_custody_version_ref}
      - {name: superseded_custody_versions, kind: references, target: connectors.auth_bindings.CustodyVersion, cardinality: many, via: superseded_custody_version_refs}
    # connection semantics.md:140-143: active custody requires an active
    # generation; a material-free access mode has neither.
    invariants:
      - any:
          - defined(active_generation_id)
          - not: defined(active_custody_version_ref)
      - any:
          - access_mode == credential
          - none: [defined(active_generation_id), defined(active_custody_version_ref)]
    lifecycle:
      initial: Live
      states: [Live, Revoked]
      terminal: [Revoked]
      transitions:
        - {name: publish, from: [Live], to: Live}
        - {name: revoke, from: [Live], to: Revoked}
    # Live is administrative non-revocation, not readiness/publication/permission.
    # Optional via carriers mean zero-or-one, as in RefreshAttempt's candidate.
    # baseline_evidence is one current-generation material baseline value, not a
    # history or operation-permission cache: at most six distinct baseline checks
    # under connection §4.2. No value before publication or for non-material modes.
    # Generation/binding equality, check subset/uniqueness, byte/freshness bounds,
    # invalidation and retention are owner predicates, not enforced by Optional.
    # configuration_revision is the instance configuration revision this
    # connection was admitted or last upgraded under, recorded only while it
    # differs from its instance's revision; absent, it is the instance's. An
    # upgrade (registry/revalidation.rs) moves the instance and the revalidated
    # connection to the configured revision and records every other connection
    # of the instance with the revision it keeps until it is revalidated itself.
    # A revoked connection is terminal: it records none and follows its instance.
    # Fixed mediated route and parent are present together only for a via binding;
    # parent identity is this field, not duplicated route authority. Historical
    # observation coordinates impose no live observation FK or retention pin.

  - name: connectors.auth_bindings.Acquisition
    identity: {name: acquisition_ref, type: String}
    fields:
      - {name: instance_id, type: String}
      - {name: profile_record_ref, type: String}
      - {name: owner_scope, type: String}
      - {name: admitted_origin_ref, type: String}
      - {name: registration_binding_ref, type: "Optional<String>"}
      - {name: protected_correlation_ref, type: String}
      - {name: expires_at, type: Timestamp}
      - {name: expected_publication_fence, type: String}
      - {name: target_connection_ref, type: String}
      - {name: repair_connection_ref, type: "Optional<String>"}
      - {name: result_connection_ref, type: "Optional<String>"}
      - {name: terminal_reason, type: "Optional<connectors.auth_bindings.AcquisitionFailure>"}
      - {name: owner_token, type: Uuid}
      - {name: created_at, type: Timestamp}
      - {name: consumed_at, type: "Optional<Timestamp>"}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: captured_snapshot_ref, type: String}
      - {name: candidate_custody_version_ref, type: "Optional<String>"}
    relations:
      - {name: instance, kind: references, target: connectors.declarations.ServiceConfiguration, cardinality: one, via: instance_id}
      - {name: auth_profile, kind: references, target: connectors.auth_bindings.AuthProfile, cardinality: one, via: profile_record_ref}
      - {name: target_connection, kind: references, target: connectors.auth_bindings.Connection, cardinality: one, via: target_connection_ref}
      - {name: repair_target, kind: references, target: connectors.auth_bindings.Connection, cardinality: one, via: repair_connection_ref}
      - {name: result_connection, kind: references, target: connectors.auth_bindings.Connection, cardinality: one, via: result_connection_ref}
    lifecycle:
      initial: Pending
      states: [Pending, Completing, Completed, Failed, Expired]
      terminal: [Completed, Failed, Expired]
      transitions:
        - {name: consume, from: [Pending], to: Completing}
        - {name: record_candidate, from: [Completing], to: Completing}
        - {name: complete, from: [Completing], to: Completed}
        - {name: fail, from: [Pending, Completing], to: Failed}
        - {name: expire, from: [Pending, Completing], to: Expired}
    # Completing is durable one-use consumption, publicly still pending.
    # No terminal handle/state is recycled. Safe callback payload erasure is an
    # owner obligation, not an implicit ESS update.

  - name: connectors.auth_bindings.CustodyVersion
    identity: {name: version_ref, type: String}
    fields:
      - {name: instance_id, type: String}
      - {name: scope_ref, type: String}
      - {name: store_version, type: String}
      - {name: credential_set, type: "Optional<connectors.auth_bindings.CredentialSet>"}
      - {name: retirement_fence, type: "Optional<String>"}
      - {name: retire_not_before, type: "Optional<Timestamp>"}
      - {name: connection_ref, type: String}
      - {name: acquisition_ref, type: String}
      - {name: generation_id, type: connectors.credentials.CredentialGenerationId}
      - {name: acknowledged_at, type: "Optional<Timestamp>"}
      - {name: invalid_reason, type: "Optional<String>"}
      - {name: byte_size, type: "Optional<Integer>"}
      - {name: retired_at, type: "Optional<Timestamp>"}
    relations:
      - {name: instance, kind: references, target: connectors.declarations.ServiceConfiguration, cardinality: one, via: instance_id}
    # docs/local-secret-service.md:94: a recorded byte size is 1–65536.
    invariants:
      - any:
          - not: defined(byte_size)
          - byte_size: {gte: 1, lte: 65536}
    lifecycle:
      initial: Candidate
      states: [Candidate, Stored, Invalid, Retiring, Deleted]
      terminal: [Deleted]
      transitions:
        - {name: acknowledge, from: [Candidate], to: Stored}
        - {name: invalidate, from: [Candidate, Stored], to: Invalid}
        - {name: retire, from: [Candidate, Stored, Invalid], to: Retiring}
        - {name: delete, from: [Retiring], to: Deleted}
    # Exact scoped version key; no live Connection owner is required for orphan
    # material. Stored records the last acknowledged write, not current availability.
    # Deletion retains this identity/fence, dropping the material handle and bytes.
    # Invalid is shipped host state: registry_materials.invalid_reason, set by
    # registry/revalidation.rs invalidate and use_and_retirement.rs invalidate_read;
    # custody semantics §4.1 names only Stored and Deleted.

errors:
  - name: connectors.auth_bindings.Refused
    fields: [{name: reason, type: String}]
  - name: connectors.auth_bindings.Unavailable
    fields: [{name: reason, type: String}]
  - name: connectors.auth_bindings.ConnectionStateConflict
    fields: [{name: state, type: connectors.auth_bindings.Connection.State}]
  - name: connectors.auth_bindings.AcquisitionStateConflict
    fields: [{name: state, type: connectors.auth_bindings.Acquisition.State}]
  - name: connectors.auth_bindings.CustodyStateConflict
    fields: [{name: state, type: connectors.auth_bindings.CustodyVersion.State}]
  - name: connectors.auth_bindings.PublicationFenceConflict
    fields: [{name: connection_ref, type: String}]
  - name: connectors.auth_bindings.AcquisitionResultMismatch
    fields: [{name: acquisition_ref, type: String}]

commands:
  - name: connectors.auth_bindings.RecordProfile
    input:
      - {name: adapter_id, type: String}
      - {name: profile_id, type: String}
      - {name: declaration_revision, type: String}
      - {name: declaration, type: "Optional<connectors.auth_bindings.ProfileDeclaration>"}
      - {name: local_static_profile, type: "Optional<connectors.auth_bindings.LocalStaticProfile>"}
    outcomes:
      # auth/profile semantics.md:125-128: the record stores its exact
      # (adapter_id, profile_id, declaration_revision) tuple.
      - name: recorded
        creates: connectors.auth_bindings.AuthProfile
        instance: profile_record_ref
        sets:
          adapter_id: input.adapter_id
          profile_id: input.profile_id
          declaration_revision: input.declaration_revision
          declaration: input.declaration
          local_static_profile: input.local_static_profile
        emits: [connectors.auth_bindings.ProfileRecorded]
        payload: {connectors.auth_bindings.ProfileRecorded: {profile_record_ref: {generated: true}}}
  - name: connectors.auth_bindings.AllocateConnection
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: instance_id, type: String}
      - {name: profile_record_ref, type: String}
      - {name: owner_scope, type: String}
      - {name: access_mode, type: connectors.auth_access.AccessMode}
      - {name: publication_fence, type: String}
    outcomes:
      # connection semantics.md:120-126: the allocated binding keeps its admitted
      # instance, profile record, owner scope, fixed access mode and the private
      # publication fence the owner allocated with it (registry/lifecycle.rs begin).
      - name: allocated
        when: decision == allow
        creates: connectors.auth_bindings.Connection
        instance: connection_ref
        sets:
          instance_id: input.instance_id
          profile_record_ref: input.profile_record_ref
          owner_scope: input.owner_scope
          access_mode: input.access_mode
          publication_fence: input.publication_fence
        emits: [connectors.auth_bindings.ConnectionAllocated]
        payload: {connectors.auth_bindings.ConnectionAllocated: {connection_ref: {generated: true}}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
  - name: connectors.auth_bindings.RevokeConnection
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: connection_ref, type: String}
    outcomes:
      - {name: revoked, when: decision == allow, moves: connectors.auth_bindings.Connection.revoke, instance: connection_ref, emits: [connectors.auth_bindings.ConnectionRevoked], payload: {connectors.auth_bindings.ConnectionRevoked: {connection_ref: input.connection_ref}}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.ConnectionStateConflict}
  - name: connectors.auth_bindings.PublishBinding
    # Names an acknowledged host metadata update, not another lifecycle or a
    # substitute for RefreshAttempt's consumed-source/publication protocol.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: connection_ref, type: String}
      - {name: publication, type: connectors.auth_bindings.BindingPublication}
    outcomes:
      # connection semantics.md:140-141 and docs/design.md:1358: publication is
      # compare-and-set on the private fence and advances it.
      - name: stale-fence
        when_subject:
          predicate: publication_fence != input.publication.expected_publication_fence
        error: connectors.auth_bindings.PublicationFenceConflict
      - name: published
        when: decision == allow
        moves: connectors.auth_bindings.Connection.publish
        instance: connection_ref
        sets:
          publication_fence: {generated: true}
        emits: [connectors.auth_bindings.BindingPublished]
        payload: {connectors.auth_bindings.BindingPublished: {connection_ref: input.connection_ref}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.ConnectionStateConflict}
    # DECIDED 2026-09-27: PublishBinding with decision allow on a Revoked Connection refuses
    # with ConnectionStateConflict, as RevokeConnection does; input guards decide first (refuse → Refused, unknown → Unavailable).
    # The host (crates/connectors-host/src/local/metadata/er.rs:2989-2994) maps no
    # Revoked row change to this command, so no code states another answer.
  - name: connectors.auth_bindings.BeginAcquisition
    # Owner refuses static_config, expired/unsupported flows and capacity before
    # creation. No business operation, public callback or material read is implied.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: instance_id, type: String}
      - {name: profile_record_ref, type: String}
      - {name: target_connection_ref, type: String}
      - {name: repair_connection_ref, type: "Optional<String>"}
      - {name: expires_at, type: Timestamp}
    outcomes:
      # acquisition semantics.md:144-147: instance, profile record, original
      # expiry and the fixed target (and optional repair) Connection.
      - name: pending
        when: decision == allow
        creates: connectors.auth_bindings.Acquisition
        instance: acquisition_ref
        sets:
          instance_id: input.instance_id
          profile_record_ref: input.profile_record_ref
          target_connection_ref: input.target_connection_ref
          repair_connection_ref: input.repair_connection_ref
          expires_at: input.expires_at
        emits: [connectors.auth_bindings.AcquisitionBegan]
        payload: {connectors.auth_bindings.AcquisitionBegan: {acquisition_ref: {generated: true}}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
  - name: connectors.auth_bindings.ConsumeAcquisition
    # Atomic consume before exchange; only original live acknowledged winner may
    # send. Observing/replaying Completing grants no exchange authorization.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: acquisition_ref, type: String}
    outcomes:
      - {name: consumed, when: decision == allow, moves: connectors.auth_bindings.Acquisition.consume, instance: acquisition_ref, emits: [connectors.auth_bindings.AcquisitionConsumed], payload: {connectors.auth_bindings.AcquisitionConsumed: {acquisition_ref: input.acquisition_ref}}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.AcquisitionStateConflict}
  - name: connectors.auth_bindings.CompleteAcquisition
    # allow requires acknowledged custody, baseline validation, current private
    # fence and non-revocation, exact owner/identity and original unexpired time.
    # Atomically publish binding, assign result ref and settle this same attempt.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: acquisition_ref, type: String}
      - {name: result_connection_ref, type: String}
      - {name: publication, type: connectors.auth_bindings.BindingPublication}
    outcomes:
      # acquisition semantics.md:149-150: Completed's result equals the fixed target.
      - name: result-mismatch
        when_subject:
          predicate: target_connection_ref != input.result_connection_ref
        error: connectors.auth_bindings.AcquisitionResultMismatch
      - name: completed
        when: decision == allow
        moves: connectors.auth_bindings.Acquisition.complete
        instance: acquisition_ref
        sets:
          result_connection_ref: input.result_connection_ref
        emits: [connectors.auth_bindings.AcquisitionCompleted]
        payload: {connectors.auth_bindings.AcquisitionCompleted: {acquisition_ref: input.acquisition_ref, result_connection_ref: input.result_connection_ref}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.AcquisitionStateConflict}
  - name: connectors.auth_bindings.RecordAcquisitionCandidate
    # The host has allocated the exact candidate and recorded its custody
    # version in the same metadata batch. It remains Completing and grants no
    # second exchange or material-use authority.
    input:
      - {name: acquisition_ref, type: String}
      - {name: candidate_custody_version_ref, type: String}
    outcomes:
      - {name: candidate-recorded, moves: connectors.auth_bindings.Acquisition.record_candidate, instance: acquisition_ref, emits: [connectors.auth_bindings.AcquisitionCandidateRecorded], payload: {connectors.auth_bindings.AcquisitionCandidateRecorded: {acquisition_ref: input.acquisition_ref, candidate_custody_version_ref: input.candidate_custody_version_ref}}}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.AcquisitionStateConflict}
  - name: connectors.auth_bindings.FailAcquisition
    # A possible publication must first be resolved at the owning record; failure
    # is not a way to overwrite a possibly committed completion. Unknown exchange
    # never allows another send; terminal correlation facts remain retained.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: acquisition_ref, type: String}
      - {name: reason, type: connectors.auth_bindings.AcquisitionFailure}
    outcomes:
      # acquisition semantics.md:161-162: the terminal record keeps its reason.
      - name: failed
        when: decision == allow
        moves: connectors.auth_bindings.Acquisition.fail
        instance: acquisition_ref
        sets:
          terminal_reason: input.reason
        emits: [connectors.auth_bindings.AcquisitionFailed]
        payload: {connectors.auth_bindings.AcquisitionFailed: {acquisition_ref: input.acquisition_ref, reason: input.reason}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.AcquisitionStateConflict}
  - name: connectors.auth_bindings.ExpireAcquisition
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: acquisition_ref, type: String}
    outcomes:
      # acquisition semantics.md:169-170: Expired carries reason `expired`.
      - name: expired
        when: decision == allow
        moves: connectors.auth_bindings.Acquisition.expire
        instance: acquisition_ref
        sets:
          terminal_reason: expired
        emits: [connectors.auth_bindings.AcquisitionExpired]
        payload: {connectors.auth_bindings.AcquisitionExpired: {acquisition_ref: input.acquisition_ref}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.AcquisitionStateConflict}
  - name: connectors.auth_bindings.RecordCustodyVersion
    # Stage the exact metadata candidate before the separately acknowledged
    # Secret Service write. Candidate grants no material use or publication.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: instance_id, type: String}
      - {name: scope_ref, type: String}
      - {name: store_version, type: String}
      - {name: credential_set, type: connectors.auth_bindings.CredentialSet}
    outcomes:
      # custody semantics.md:72-74: the exact (scope_ref, store_version) key, its
      # ServiceConfiguration and the coherent CredentialSet.
      - name: candidate
        when: decision == allow
        creates: connectors.auth_bindings.CustodyVersion
        instance: version_ref
        sets:
          instance_id: input.instance_id
          scope_ref: input.scope_ref
          store_version: input.store_version
          credential_set: input.credential_set
        emits: [connectors.auth_bindings.CustodyCandidateRecorded]
        payload: {connectors.auth_bindings.CustodyCandidateRecorded: {version_ref: {generated: true}}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
  - name: connectors.auth_bindings.AcknowledgeCustodyWrite
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: version_ref, type: String}
      - {name: acknowledged_at, type: Timestamp}
    outcomes:
      # custody semantics.md:86 and docs/local-connection-registry.md:32: the
      # acknowledgement, invalidity and retirement facts are recorded.
      - name: stored
        when: decision == allow
        moves: connectors.auth_bindings.CustodyVersion.acknowledge
        instance: version_ref
        sets:
          acknowledged_at: input.acknowledged_at
        emits: [connectors.auth_bindings.CustodyWritten]
        payload: {connectors.auth_bindings.CustodyWritten: {version_ref: input.version_ref}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.CustodyStateConflict}
  - name: connectors.auth_bindings.InvalidateCustodyVersion
    input:
      - {name: version_ref, type: String}
      - {name: reason, type: String}
    outcomes:
      - name: invalidated
        moves: connectors.auth_bindings.CustodyVersion.invalidate
        instance: version_ref
        sets:
          invalid_reason: input.reason
        emits: [connectors.auth_bindings.CustodyInvalidated]
        payload: {connectors.auth_bindings.CustodyInvalidated: {version_ref: input.version_ref, reason: input.reason}}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.CustodyStateConflict}
  - name: connectors.auth_bindings.RetireCustodyVersion
    input:
      - {name: version_ref, type: String}
      - {name: retirement_fence, type: String}
      - {name: retired_at, type: Timestamp}
      - {name: retire_not_before, type: Timestamp}
    outcomes:
      - name: retiring
        moves: connectors.auth_bindings.CustodyVersion.retire
        instance: version_ref
        sets:
          retirement_fence: input.retirement_fence
          retired_at: input.retired_at
          retire_not_before: input.retire_not_before
        emits: [connectors.auth_bindings.CustodyRetiring]
        payload: {connectors.auth_bindings.CustodyRetiring: {version_ref: input.version_ref}}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.CustodyStateConflict}
  - name: connectors.auth_bindings.AcknowledgeCustodyDeletion
    # allow requires guarded retirement, trusted retention/no-use proof and a
    # definite physical-delete acknowledgement. Unknown leaves the old state;
    # the acknowledged retirement fence still prevents reuse/publication.
    input:
      - {name: decision, type: connectors.auth_bindings.Decision}
      - {name: version_ref, type: String}
    outcomes:
      - {name: deleted, when: decision == allow, moves: connectors.auth_bindings.CustodyVersion.delete, instance: version_ref, emits: [connectors.auth_bindings.CustodyDeleted], payload: {connectors.auth_bindings.CustodyDeleted: {version_ref: input.version_ref}}}
      - {name: unavailable, when: decision == unknown, error: connectors.auth_bindings.Unavailable}
      - {name: refused, error: connectors.auth_bindings.Refused}
      - {name: wrong-state, wrong_state: true, error: connectors.auth_bindings.CustodyStateConflict}

