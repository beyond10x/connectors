domain: connectors.service_wire
summary: Shared service observation and operation metadata values; executable binding obligations remain explicit.

# Normative owner: contracts/service/compatibility.md §§4–5.
# These are values, not audit/approval/connection storage or a second attempt ledger.
# The existing effect enum and attempt identifier keep their original semantics.
types:
  - name: connectors.service_wire.Version
    kind: enum
    variants: [v1alpha1, v1alpha2]
  - name: connectors.service_wire.BaseErrorCode
    kind: enum
    variants: [invalid_input, unsupported, unauthorized, forbidden, not_found, stale_description, stale_cursor, rate_limited, unavailable, capacity, timeout, upstream_protocol, internal]
  - name: connectors.service_wire.ErrorCode
    kind: enum
    variants: [invalid_input, unsupported, unauthorized, forbidden, not_found, stale_description, stale_cursor, rate_limited, unavailable, capacity, timeout, upstream_protocol, internal, approval_required, approval_refused, approval_replayed, idempotency_conflict, outcome_unknown, not_granted, stale_authority, connection_not_ready, route_unavailable, route_refused, insufficient_scope, session_not_ready, session_lost, offer_expired, offer_rejected, lease_expired, revoked]
  - name: connectors.service_wire.CauseStage
    kind: enum
    variants: [preflight, attempt_store, approval, dispatch, response, observation, audit]
  - name: connectors.service_wire.DiagnosticCause
    kind: struct
    fields:
      - {name: code, type: connectors.service_wire.BaseErrorCode}
      - {name: stage, type: connectors.service_wire.CauseStage}
  - name: connectors.service_wire.AttemptReference
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: id, type: connectors.mutations.AttemptId}
  - name: connectors.service_wire.MutationObservation
    kind: struct
    fields:
      - {name: classification, type: connectors.mutations.EffectKnowledge}
      - {name: attempt, type: "Optional<connectors.service_wire.AttemptReference>"}
      - {name: original_request_id, type: "Optional<String>"}
      - {name: replayed, type: Boolean}
      - {name: cause, type: "Optional<connectors.service_wire.DiagnosticCause>"}
  - name: connectors.service_wire.AuditStatus
    kind: enum
    variants: [complete, incomplete, unavailable, not_required]
  - name: connectors.service_wire.SourceAudit
    kind: struct
    fields:
      - {name: instance, type: String}
      - {name: audit_ref, type: "Optional<String>"}
      - {name: audit_status, type: connectors.service_wire.AuditStatus}
  - name: connectors.service_wire.AuthAlternative
    kind: struct
    fields:
      - {name: profile, type: String}
      - {name: scopes, type: "List<String>"}
  - name: connectors.service_wire.OperationLimits
    kind: struct
    fields:
      - {name: request_bytes, type: Integer}
      - {name: result_bytes, type: Integer}
      - {name: execution_ms, type: Integer}
      - {name: provider_ms, type: Integer}
      - {name: connect_ms, type: Integer}
  # Required public operation declaration, sourced from operations/v1alpha1 §3
  # and service/compatibility §§4,7. These immutable values supply no authority
  # and select no provider implementation, transport or persistence relationship.
  - name: connectors.service_wire.IdempotencyKeySource
    kind: enum
    variants: [caller_supplied]
  - name: connectors.service_wire.OperationIdempotency
    kind: struct
    fields:
      - {name: kind, type: connectors.mutations.IdempotencyKind}
      - {name: key, type: "Optional<connectors.service_wire.IdempotencyKeySource>"}
      - {name: retention_seconds, type: "Optional<Integer>"}
    # The first keyed profile requires caller_supplied and exactly86400 seconds;
    # none/natural forbid those keyed-only members. Natural semantics require
    # the native contract's repeat proof, never an inference from this value.
  - name: connectors.service_wire.OperationMetadata
    kind: struct
    fields:
      - {name: effects, type: "List<connectors.mutations.ExecutableEffect>"}
      - {name: semantic_effects, type: "List<connectors.mutations.SemanticEffect>"}
      - {name: risk, type: connectors.artifact_provenance.Risk}
      - {name: idempotency, type: connectors.service_wire.OperationIdempotency}
      - {name: approval, type: connectors.mutations.ApprovalMode}
      - {name: requires_auth, type: "Optional<List<connectors.service_wire.AuthAlternative>>"}
      - {name: realization, type: "Optional<connectors.artifact_provenance.Realization>"}
      - {name: limits, type: connectors.service_wire.OperationLimits}
    # Binding obligations: strict closed decoding; positive exact integer limits;
    # distinct effect members; external_write iff mutation; send_external and
    # session_establishment require external_write; unresolved realization never
    # callable. A decoder cannot establish effect completeness, native repeat
    # proof, receiver support, current approval/grants or actual budget enforcement.

  # Protected receiver configuration, not a public descriptor or persisted entity.
  # Normative owner: contracts/service/local-operation-curation.md. The exact
  # executable selection and bootstrap digest bind reviewed declarations to the
  # existing adapter configuration; no new operation identity or owner is created.
  - name: connectors.service_wire.CuratedOperation
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: metadata, type: connectors.service_wire.OperationMetadata}
  - name: connectors.service_wire.AdapterOperationCuration
    kind: struct
    fields:
      - {name: adapter_alias, type: String}
      - {name: executable_selection, type: String}
      - {name: bootstrap_sha256, type: String}
      - {name: operations, type: "List<connectors.service_wire.CuratedOperation>"}
  - name: connectors.service_wire.OperationCuration
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: adapters, type: "List<connectors.service_wire.AdapterOperationCuration>"}
    # Closed decoding, exact format, bounded unique selectors, digest pin checks,
    # per-operation metadata validation and current admission execute at the owner.
    # Reading this document does not establish native effect/idempotency proof,
    # actual budget enforcement, approval, custody or permission to call a provider.

# ESS-LIMIT codec obligations (ESS 0.36 has no wire-codec construct: Optional
# projects to omission, not a required-null rule; no byte-length or canonical
# encoding predicate; no cross-record read): exact selected route/version; mandatory-null versus
# omitted fields (ESS Optional captures values, not this codec's emission rule);
# closed outer request/response and arbitrary operation-local schema payloads;
# numeric/string bounds and canonical encoding; error/status/effect combinations;
# co-presence of original attempt/request references, safe lookup disclosure and
# replay admission; actual schema/profile support and legacy projection admission.
# No ESS relation is implied by these public correlation VALUES. AttemptReference
# names an existing private attempt but neither owns it nor creates a lookup API.
# AuditRecord persistence is declared by connectors.execution_audit. SourceAudit
# deliberately retains the selected public opaque-string projection: it is a safe
# host-qualified correlation value, not an entity relation or lookup capability.
# Grant and delegated assertion persistence/ownership remain with their owners.
# ESS validates declarations/references/types. It does not execute a wire decoder,
# HTTP request, authority check, audit write or sequential conformance trace.
