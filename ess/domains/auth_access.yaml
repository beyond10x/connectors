domain: connectors.auth_access
summary: Proposed access selection, acquisition declaration and exact permission-budget values; no runtime or persistent owner.

# Normative owners: auth/profile §4.2, auth/acquisition §4.0, auth/evidence §4.4.
# These values never establish current authority or create a credential for an
# anonymous/mediated child. Existing material-bearing EvidenceSnapshot is intact.
types:
  - name: connectors.auth_access.AccessMode
    kind: enum
    variants: [credential, direct_anonymous, parent_authenticated]
  - name: connectors.auth_access.Purpose
    kind: enum
    variants: [service_account, delegated_user, app_level, inbound_verification, transport_identity, trunk_registration, anonymous, mediated_access]
  - name: connectors.auth_access.Subject
    kind: enum
    variants: [app, user, none]
  - name: connectors.auth_access.Scheme
    kind: enum
    variants: [http_bearer, http_basic, http_signing, mtls, socket_peer, exec_plugin, sip_digest, session_authority, none, parent]
  - name: connectors.auth_access.AcquisitionFlow
    kind: enum
    variants: [static_config, static_entry, oauth2_authorization_code, oauth2_client_credentials, oauth2_password, workload_identity, exec_plugin, host_issued]
  - name: connectors.auth_access.CapabilityName
    kind: enum
    variants: [http-bearer, http-basic, http-signing, http-anonymous, mtls-client-identity, socket-peer, exec-credential-plugin, sip-credential-lease, session-authority, inbound-verifier, mediated-http]
  - name: connectors.auth_access.AccessSelection
    kind: struct
    fields:
      - {name: profile, type: String}
      - {name: mode, type: connectors.auth_access.AccessMode}
      - {name: purpose, type: connectors.auth_access.Purpose}
      - {name: subject, type: connectors.auth_access.Subject}
      - {name: scheme, type: connectors.auth_access.Scheme}
      - {name: flow, type: connectors.auth_access.AcquisitionFlow}
      - {name: capability, type: connectors.auth_access.CapabilityName}
    # contracts/auth/profile/v1alpha1/semantics.md:111-116: the two non-credential
    # access modes are closed purpose/subject/scheme/flow/capability combinations.
    invariants:
      - any:
          - not: {mode: direct_anonymous}
          - all:
              - {purpose: anonymous}
              - {subject: none}
              - {scheme: none}
              - {flow: static_config}
              - {capability: http-anonymous}
      - any:
          - not: {mode: parent_authenticated}
          - all:
              - {purpose: mediated_access}
              - {subject: none}
              - {scheme: parent}
              - {flow: static_config}
              - {capability: mediated-http}
  - name: connectors.auth_access.AcquisitionDeclaration
    kind: struct
    fields:
      - {name: flow, type: connectors.auth_access.AcquisitionFlow}
      - {name: authorize_url, type: "Optional<String>"}
      - {name: token_url, type: "Optional<String>"}
      - {name: pkce, type: "Optional<String>"}
      - {name: registration_kind, type: "Optional<String>"}
      - {name: callback_binding, type: "Optional<String>"}
      - {name: grants, type: "List<String>"}
      - {name: sources, type: "List<String>"}
  - name: connectors.auth_access.PermissionTarget
    kind: struct
    fields:
      - {name: binding_ref, type: String}
      - {name: target_ref, type: String}
    # Private references to an admitted adapter binding and its exact typed
    # target. Neither is a caller grant or a public target codec. The adapter
    # owns target syntax, canonical equality and resource/protocol coordinates.
  - name: connectors.auth_access.PermissionBudget
    kind: struct
    fields:
      - {name: target_limit, type: Integer}
      - {name: call_limit, type: Integer}
      - {name: concurrency_limit, type: Integer}
      - {name: deadline, type: Timestamp}
    # contracts/auth/evidence/v1alpha1/semantics.md:146-148: at most 64 targets,
    # 64 calls and four concurrent checks; smaller ceilings down to zero are allowed.
    invariants:
      - target_limit: {gte: 0, lte: 64}
      - call_limit: {gte: 0, lte: 64}
      - concurrency_limit: {gte: 0, lte: 4}
  - name: connectors.auth_access.PermissionResult
    kind: enum
    variants: [allowed, denied, unavailable]
  - name: connectors.auth_access.PermissionObservation
    kind: struct
    fields:
      - {name: target, type: connectors.auth_access.PermissionTarget}
      - {name: result, type: connectors.auth_access.PermissionResult}
      - {name: cached, type: Boolean}
  - name: connectors.auth_access.AuthorizationResult
    kind: enum
    variants: [allowed, denied]
  - name: connectors.auth_access.AuthorizationTarget
    kind: struct
    fields:
      - {name: target, type: connectors.auth_access.PermissionTarget}
      - {name: result, type: connectors.auth_access.AuthorizationResult}
  - name: connectors.auth_access.AuthorizationCoverage
    kind: struct
    fields:
      - {name: complete, type: Boolean}
      - {name: targets, type: "List<connectors.auth_access.AuthorizationTarget>"}
    # contracts/auth/evidence/v1alpha1/semantics.md:174-176: at most 64 entries,
    # and any denial sets complete false.
    invariants:
      - targets.count <= 64
      - any:
          - {complete: false}
          - forall: {in: targets, as: t, that: {t.result: allowed}}

# Declared above: the closed non-credential access combinations (AccessSelection),
# the 64/64/4 budget ceilings (PermissionBudget) and the coverage bound and
# denial rule (AuthorizationCoverage).
# The contract gives no closed table for the credential-bearing combinations, so
# none is declared for them.
# ESS-LIMIT: required/forbidden flow fields, registration/validation and source
# adequacy, supported-versus-reserved advertisement, explicit profile selection and
# current config/route/parent-generation equality read configuration and records
# outside the value; ESS 0.36 has no cross-record read in a type invariant.
# AccessMode covers this selection
# decision, not an exhaustive classification of every future transport profile.
# Parent/connection/profile/route ownership and persistence relations remain
# with their dedicated models. Strings introduce no synthetic entity/identity.
# No provider account, child CredentialGeneration or custody record is fabricated.
# Permission target/binding equality, deduplication and canonical order, the
# 256-byte coordinate bound, shared budget reservation/consumption, current
# policy/time/dispatch fences, the permitted/denied reduction and cursor
# invalidation are not executed or proven by these schemas. ESS 0.36 has no
# distinct-members or ordering predicate over a list, no UTF-8 byte length
# (`.count` counts Unicode scalars), no cross-record or shared-counter constraint,
# and no trusted-time or dispatch-fence construct.
# Safe public coverage omits private cache/generation/route locators. Optional
# projects to omission, not null; generic schemas are not service/config codecs.
