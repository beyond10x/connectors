domain: connectors.idempotency

summary: Proposed receiver-owned keyed mutation reservations and replay retention.

# Normative owner: contracts/operations/v1alpha1/semantics.md §5.1. Values here
# are resolved by trusted host admission, never authority taken from a request.
types:
  - name: connectors.idempotency.ReservationId
    kind: newtype
    of: Uuid
  - name: connectors.idempotency.AuthorityScope
    kind: struct
    fields:
      - {name: tenant, type: "Optional<String>"}
      - {name: realm, type: "Optional<String>"}
      - {name: caller, type: String}
      - {name: executor, type: "Optional<String>"}
  - name: connectors.idempotency.OriginKind
    kind: enum
    variants: [direct, federated]
  - name: connectors.idempotency.Origin
    kind: struct
    fields:
      - {name: kind, type: connectors.idempotency.OriginKind}
      - {name: authority_ref, type: String}
  - name: connectors.idempotency.KeyNamespace
    kind: struct
    fields:
      - {name: receiver_instance, type: String}
      - {name: authority, type: connectors.idempotency.AuthorityScope}
      - {name: origin, type: connectors.idempotency.Origin}
  - name: connectors.idempotency.RouteBinding
    kind: struct
    fields:
      - {name: gateway_instance, type: String}
      - {name: route_id, type: String}
      - {name: route_revision, type: String}
  - name: connectors.idempotency.RequestFingerprint
    kind: struct
    fields:
      - {name: operation_ref, type: String}
      - {name: connection_ref, type: String}
      - {name: connection_revision, type: String}
      - {name: contract_ref, type: String}
      - {name: profile, type: String}
      - {name: descriptor_revision, type: String}
      - {name: configuration_revision, type: String}
      - {name: canonicalization_version, type: String}
      - {name: input_digest, type: String}
      - {name: route, type: "Optional<connectors.idempotency.RouteBinding>"}

entities:
  - name: connectors.idempotency.KeyReservation
    identity:
      name: reservation_id
      type: connectors.idempotency.ReservationId
    fields:
      - {name: namespace, type: connectors.idempotency.KeyNamespace}
      - {name: caller_key, type: String}
      - {name: fingerprint, type: connectors.idempotency.RequestFingerprint}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: settled_at, type: "Optional<Timestamp>"}
      - {name: replay_expires_at, type: "Optional<Timestamp>"}
    # contracts/operations/v1alpha1/semantics.md:113,162-166,185 and
    # docs/local-er-metadata.md:102: a nonempty key; the recorded canonicalization
    # (a new identifier is a specification change); a direct origin is the
    # receiver and has no route, a federated origin is the route's gateway; only
    # a settled known result (Replayable, Expired) has settlement and expiry.
    invariants:
      - caller_key != ""
      - fingerprint.canonicalization_version == "adapter-v1-canonical-json"
      - any: [namespace.origin.kind != direct, namespace.origin.authority_ref == namespace.receiver_instance]
      - any: [namespace.origin.kind != direct, {not: "defined(fingerprint.route.gateway_instance)"}]
      - any: [namespace.origin.kind != federated, "defined(fingerprint.route.gateway_instance)"]
      - any: [namespace.origin.kind != federated, namespace.origin.authority_ref == fingerprint.route.gateway_instance]
      - any: [state == Replayable, state == Expired, "missing(settled_at)"]
      - any: [state == Pending, state == Quarantined, "defined(settled_at)"]
      - any: [state == Replayable, state == Expired, "missing(replay_expires_at)"]
      - any: [state == Pending, state == Quarantined, "defined(replay_expires_at)"]
    relations:
      - name: attempt
        kind: references
        target: connectors.mutations.AttemptRecord
        cardinality: one
        via: attempt_id
    # References, not owns: expiry of the replay reservation cannot delete audit
    # evidence. Each key generation is bound to one immutable attempt identity.
    # DEFERRED: namespace authority/issuer/tenant configuration remains outside
    # this selected binding; owned by a story to be filed
    # (story:multi-tenant-principal-assignment, not yet in the store on 2026-09-27).
    # Fingerprints preserve historical Connection/route
    # coordinates as values; the attempt has the actual Connection reference.
    # Value equality is an owner predicate and grants no current use.
    lifecycle:
      initial: Pending
      states: [Pending, Replayable, Quarantined, Expired]
      terminal: [Quarantined, Expired]
      transitions:
        - {name: retain_result, from: [Pending], to: Replayable}
        - {name: quarantine, from: [Pending], to: Quarantined}
        - {name: expire, from: [Replayable], to: Expired}

errors:
  - name: connectors.idempotency.ReservationStateConflict
    fields:
      - {name: state, type: connectors.idempotency.KeyReservation.State}

commands:
  - name: connectors.idempotency.ReserveKey
    # Ledger half of atomic reserve-and-prepare; not a public API. The caller has
    # already been admitted and won the namespace/key index slot. ESS does not
    # establish that uniqueness or the cross-entity transaction.
    input:
      - {name: namespace, type: connectors.idempotency.KeyNamespace}
      - {name: caller_key, type: String}
      - {name: fingerprint, type: connectors.idempotency.RequestFingerprint}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
    fixture_inputs:
      namespace: direct-key-namespace
      fingerprint: canonical-request-fingerprint
    outcomes:
      - name: reserved
        creates: connectors.idempotency.KeyReservation
        instance: reservation_id
        emits: [connectors.idempotency.KeyReserved]
        payload:
          connectors.idempotency.KeyReserved:
            reservation_id: {generated: true}
        sets:
          namespace: input.namespace
          caller_key: input.caller_key
          fingerprint: input.fingerprint
          attempt_id: input.attempt_id
  - name: connectors.idempotency.RetainResult
    # Requires a durable Completed/Failed/Aborted attempt. The host atomically
    # fixes settled_at and replay_expires_at = settled_at + 86400s. Input values
    # below are host clock observations, not arbitrary caller retention choices.
    input:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
      - {name: settled_at, type: Timestamp}
      - {name: replay_expires_at, type: Timestamp}
    outcomes:
      - name: retained
        moves: connectors.idempotency.KeyReservation.retain_result
        instance: reservation_id
        emits: [connectors.idempotency.ResultRetained]
        payload:
          connectors.idempotency.ResultRetained:
            reservation_id: input.reservation_id
            settled_at: input.settled_at
            replay_expires_at: input.replay_expires_at
        sets:
          settled_at: input.settled_at
          replay_expires_at: input.replay_expires_at
      - name: wrong-state
        wrong_state: true
        error: connectors.idempotency.ReservationStateConflict
  - name: connectors.idempotency.QuarantineKey
    # Requires a durable Indeterminate attempt. It has no expiry or automatic
    # reconciliation transition in this first profile.
    input:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
    outcomes:
      - name: quarantined
        moves: connectors.idempotency.KeyReservation.quarantine
        instance: reservation_id
        emits: [connectors.idempotency.KeyQuarantined]
        payload:
          connectors.idempotency.KeyQuarantined:
            reservation_id: input.reservation_id
      - name: wrong-state
        wrong_state: true
        error: connectors.idempotency.ReservationStateConflict
  - name: connectors.idempotency.ExpireResult
    # Host must establish now >= replay_expires_at and CAS this generation. A
    # state-correct command alone does not prove that time or ownership fact.
    input:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
    outcomes:
      - name: expired
        moves: connectors.idempotency.KeyReservation.expire
        instance: reservation_id
        emits: [connectors.idempotency.ResultExpired]
        payload:
          connectors.idempotency.ResultExpired:
            reservation_id: input.reservation_id
      - name: wrong-state
        wrong_state: true
        error: connectors.idempotency.ReservationStateConflict

events:
  - name: connectors.idempotency.KeyReserved
    fields:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
  - name: connectors.idempotency.ResultRetained
    fields:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
      - {name: settled_at, type: Timestamp}
      - {name: replay_expires_at, type: Timestamp}
  - name: connectors.idempotency.KeyQuarantined
    fields:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
  - name: connectors.idempotency.ResultExpired
    fields:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}

views:
  - name: connectors.idempotency.ReservationStates
    source: connectors.idempotency.KeyReservation
    consistency: read_your_writes
    fields:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
      - {name: namespace, type: connectors.idempotency.KeyNamespace}
      - {name: caller_key, type: String}
      - {name: state, type: connectors.idempotency.KeyReservation.State}
  - name: connectors.idempotency.ReservationSettlements
    source: connectors.idempotency.KeyReservation
    consistency: read_your_writes
    fields:
      - {name: reservation_id, type: connectors.idempotency.ReservationId}
      - {name: namespace, type: connectors.idempotency.KeyNamespace}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
      - {name: fingerprint, type: connectors.idempotency.RequestFingerprint}
      - {name: settled_at, type: "Optional<Timestamp>"}
      - {name: replay_expires_at, type: "Optional<Timestamp>"}
      - {name: state, type: connectors.idempotency.KeyReservation.State}

# Declared above: the stored key, fingerprint, attempt and host timestamps, the
# nonempty key, the recorded canonicalization, origin/route coupling and which
# states carry settlement and expiry.
# ESS-LIMIT (ESS 0.40): replay_expires_at = settled_at + 86400 s
# (contracts/operations/v1alpha1/semantics.md:185) needs timestamp arithmetic.
# The (namespace, caller_key) index over live reservations (:164,175) needs a
# state-conditioned compound uniqueness constraint. Reserve-and-prepare as one
# responsibility (:160) needs multi-record creation, and retaining or
# quarantining on the attempt's settlement (:185) a guard on, and a transition
# coupled to, another record's state; `affects:` only sets fields on existing
# rows. The capacity refusal for new reservations (:187) needs a count across
# records, and the caller key's 256-byte bound a byte-length predicate.
# Expiry at now >= replay_expires_at needs the host's trusted interval, not a
# `now` guard (which Entity Runtime refuses anyway). Admission, namespace and
# fingerprint derivation, generation-safe eviction and result storage remain host
# obligations.

actors:
  - name: connectors.idempotency.LocalHost
    may:
      - connectors.idempotency.ExpireResult
      - connectors.idempotency.QuarantineKey
      - connectors.idempotency.ReserveKey
      - connectors.idempotency.RetainResult
