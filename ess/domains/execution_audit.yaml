domain: connectors.execution_audit
summary: Per-hop durable execution-audit anchor and one final observation; private host port, with dispatch integration and exporter pending.

# Normative owner: contracts/service/audit.md. Values are safe internal audit
# facts. The public projection remains connectors.service_wire.SourceAudit.
types:
  # Private injective tagged/length-prefixed qualification of the exact
  # (instance_id, public audit_ref) pair; never a public/global audit id.
  - name: connectors.execution_audit.AuditRecordRef
    kind: newtype
    of: String
  - name: connectors.execution_audit.AuditRef
    kind: newtype
    of: String
  - name: connectors.execution_audit.ObservationId
    kind: newtype
    of: Uuid
  - name: connectors.execution_audit.AnchorKind
    kind: enum
    variants: [admitted_execution, early_refusal]
  - name: connectors.execution_audit.Activity
    kind: enum
    variants: [describe, invoke]
  - name: connectors.execution_audit.HopRole
    kind: enum
    variants: [gateway, execution]
  - name: connectors.execution_audit.AnchorStage
    kind: enum
    variants: [authentication, decoding, admission]
  - name: connectors.execution_audit.FinalOutcome
    kind: enum
    variants: [success, refused, error, unknown]
  - name: connectors.execution_audit.FinalObservation
    kind: struct
    fields:
      - {name: observation_id, type: connectors.execution_audit.ObservationId}
      - {name: outcome, type: connectors.execution_audit.FinalOutcome}
      - {name: code, type: "Optional<String>"}
      - {name: recorded_at, type: Timestamp}
  # contracts/service/audit.md § 1: whether the admitted invocation is a read or
  # a write (its operation's host declaration includes `external_write`). Only a
  # write anchor can be linked to an attempt (LinkAnchorAttempt).
  - name: connectors.execution_audit.AnchorAccess
    kind: enum
    variants: [read, write]
  # audit.md § 2: `unavailable` is the store that fails or does not answer. It
  # creates no record and grants no dispatch, exactly as `capacity` does.
  - name: connectors.execution_audit.AnchorDecision
    kind: enum
    variants: [allow, capacity, unavailable]
  - name: connectors.execution_audit.LinkDecision
    kind: enum
    variants: [allow, unavailable]
  - name: connectors.execution_audit.AppendDecision
    kind: enum
    variants: [allow, unavailable]

entities:
  - name: connectors.execution_audit.AuditRecord
    identity:
      name: audit_record_ref
      type: connectors.execution_audit.AuditRecordRef
    fields:
      - {name: instance_id, type: String}
      - {name: audit_ref, type: connectors.execution_audit.AuditRef}
      - {name: anchor_kind, type: connectors.execution_audit.AnchorKind}
      - {name: activity, type: "Optional<connectors.execution_audit.Activity>"}
      - {name: access, type: "Optional<connectors.execution_audit.AnchorAccess>"}
      - {name: hop_role, type: connectors.execution_audit.HopRole}
      - {name: stage, type: connectors.execution_audit.AnchorStage}
      - {name: request_id, type: "Optional<String>"}
      - {name: principal_ref, type: "Optional<String>"}
      - {name: operation_id, type: "Optional<String>"}
      - {name: connection_ref, type: "Optional<String>"}
      - {name: descriptor_revision, type: "Optional<String>"}
      - {name: recorded_at, type: Timestamp}
      - {name: attempt_id, type: "Optional<connectors.mutations.AttemptId>"}
      - {name: final_observation, type: "Optional<connectors.execution_audit.FinalObservation>"}
    relations:
      - name: instance
        kind: references
        target: connectors.declarations.ServiceConfiguration
        cardinality: one
        via: instance_id
      - name: mutation_attempt
        kind: references
        target: connectors.mutations.AttemptRecord
        cardinality: one
        via: attempt_id
      - name: selected_connection
        kind: references
        target: connectors.auth_bindings.Connection
        cardinality: one
        via: connection_ref
    # contracts/service/audit.md:41-43, as the host enforces them
    # (crates/connectors-host/src/local/audit/types.rs Anchor::validate): an
    # admitted anchor is at admission with a verified principal and an activity,
    # an admitted invocation also has its operation, and a describe has neither
    # an operation nor an attempt.
    invariants:
      - any:
          - not: {anchor_kind: admitted_execution}
          - all: [{stage: admission}, defined(principal_ref), defined(activity)]
      - any:
          - not: {anchor_kind: admitted_execution}
          - not: {activity: invoke}
          - defined(operation_id)
      - any:
          - not: {activity: describe}
          - all: [missing(operation_id), missing(attempt_id)]
      # audit.md § 1: a describe admits no operation, so it is neither a read
      # nor a write of one.
      - any:
          - not: {activity: describe}
          - missing(access)
    lifecycle:
      initial: Anchored
      states: [Anchored, FinalObserved]
      terminal: [FinalObserved]
      transitions:
        - {name: append_final, from: [Anchored], to: FinalObserved}
        # audit.md § 1, Attempt link: the write's attempt, recorded after the
        # anchor (v1alpha2 semantics § 4 rule 4), is linked before dispatch.
        - {name: link_attempt, from: [Anchored], to: Anchored}

errors:
  - name: connectors.execution_audit.AuditCapacity
    fields:
      - {name: reason, type: String}
  - name: connectors.execution_audit.AppendUnavailable
    fields:
      - {name: reason, type: String}
  - name: connectors.execution_audit.AnchorUnavailable
    fields:
      - {name: reason, type: String}
  - name: connectors.execution_audit.AttemptLinkRefused
    fields:
      - {name: reason, type: String}
  - name: connectors.execution_audit.AttemptLinkConflict
    fields:
      - {name: reason, type: String}
  - name: connectors.execution_audit.AttemptLinkUnavailable
    fields:
      - {name: reason, type: String}
  - name: connectors.execution_audit.AuditStateConflict
    fields:
      - {name: state, type: connectors.execution_audit.AuditRecord.State}

commands:
  - name: connectors.execution_audit.AcknowledgeAnchor
    # Decision is produced by the trusted audit owner. Only acknowledged allow
    # creates a record; capacity and unavailable create no placeholder and grant
    # no dispatch. `access` is the admitted operation's read/write fact
    # (compatibility.md § 2.1, `mutation`: its host declaration includes
    # `external_write`); absent for describe and for anchors written before it.
    input:
      - {name: decision, type: connectors.execution_audit.AnchorDecision}
      - {name: instance_id, type: String}
      - {name: audit_ref, type: connectors.execution_audit.AuditRef}
      - {name: anchor_kind, type: connectors.execution_audit.AnchorKind}
      - {name: activity, type: "Optional<connectors.execution_audit.Activity>"}
      - {name: access, type: "Optional<connectors.execution_audit.AnchorAccess>"}
      - {name: hop_role, type: connectors.execution_audit.HopRole}
      - {name: stage, type: connectors.execution_audit.AnchorStage}
      - {name: request_id, type: "Optional<String>"}
      - {name: principal_ref, type: "Optional<String>"}
      - {name: operation_id, type: "Optional<String>"}
      - {name: connection_ref, type: "Optional<String>"}
      - {name: descriptor_revision, type: "Optional<String>"}
      - {name: recorded_at, type: Timestamp}
      - {name: attempt_id, type: "Optional<connectors.mutations.AttemptId>"}
    fixture_inputs:
      stage: admission-stage
      activity: invoke-activity
    outcomes:
      - name: anchored
        when: decision == allow
        creates: connectors.execution_audit.AuditRecord
        instance: audit_record_ref
        emits: [connectors.execution_audit.AuditAnchored]
        payload:
          connectors.execution_audit.AuditAnchored:
            audit_record_ref: {generated: true}
            instance_id: input.instance_id
            audit_ref: input.audit_ref
        # audit.md:38: the anchor's immutable facts known at the acknowledging
        # hop; an anchor carries no final observation yet.
        sets:
          instance_id: input.instance_id
          audit_ref: input.audit_ref
          anchor_kind: input.anchor_kind
          activity: input.activity
          access: input.access
          hop_role: input.hop_role
          stage: input.stage
          request_id: input.request_id
          principal_ref: input.principal_ref
          operation_id: input.operation_id
          connection_ref: input.connection_ref
          descriptor_revision: input.descriptor_revision
          recorded_at: input.recorded_at
          attempt_id: input.attempt_id
          final_observation: {cleared: true}
      # audit.md § 2: a store that fails or does not answer. No record and no
      # placeholder is created and no dispatch is granted; the HTTP host answers
      # 503 `unavailable`, `audit_status: unavailable`, `audit_ref: null`, zero
      # adapter calls (compatibility.md § 2.1, Audit anchor).
      # ESS-LIMIT: a write that was never answered may still have committed a
      # record the host never learned of (audit.md § 2, compatibility.md § 5:
      # "Lost/ambiguous acknowledgement is not proof of no record"). This outcome
      # declares the host's answer; it cannot declare that possible orphan, which
      # no response ever references.
      - name: unavailable
        when: decision == unavailable
        error: connectors.execution_audit.AnchorUnavailable
      - name: capacity
        error: connectors.execution_audit.AuditCapacity

  - name: connectors.execution_audit.LinkAnchorAttempt
    # contracts/service/audit.md § 1, Attempt link. The anchor is acknowledged
    # before the write's attempt exists (v1alpha2 semantics § 4 rule 4), so its
    # `attempt_id` cannot be set by AcknowledgeAnchor. After the attempt is
    # recorded and before dispatch, the host links it here: once per anchor,
    # only on a write anchor, only while no final observation exists. Repeating
    # the link with the same attempt sets the same value and changes nothing
    # (idempotent); another attempt is refused and the first link stays.
    input:
      - {name: decision, type: connectors.execution_audit.LinkDecision}
      - {name: audit_record_ref, type: connectors.execution_audit.AuditRecordRef}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
    outcomes:
      - name: unavailable
        when: decision == unavailable
        error: connectors.execution_audit.AttemptLinkUnavailable
      - name: read-anchor
        when_subject:
          predicate:
            not: {access: write}
        error: connectors.execution_audit.AttemptLinkRefused
      - name: linked-elsewhere
        when_subject:
          predicate:
            all: [defined(attempt_id), attempt_id != input.attempt_id]
        error: connectors.execution_audit.AttemptLinkConflict
      - name: already-linked
        when_subject:
          predicate: attempt_id == input.attempt_id
        preserves: connectors.execution_audit.AuditRecord
        instance: audit_record_ref
      - name: linked
        moves: connectors.execution_audit.AuditRecord.link_attempt
        instance: audit_record_ref
        emits: [connectors.execution_audit.AttemptLinked]
        payload:
          connectors.execution_audit.AttemptLinked:
            audit_record_ref: input.audit_record_ref
            attempt_id: input.attempt_id
        sets:
          attempt_id: input.attempt_id
      - name: wrong-state
        wrong_state: true
        error: connectors.execution_audit.AuditStateConflict

  - name: connectors.execution_audit.AppendFinalObservation
    # contracts/service/audit.md:84-94. The owner allocates observation_id before
    # the first append; `observation_id` is that id, flattened because a payload
    # cannot read `input.final_observation.observation_id`. The host fills it from
    # the same observation (metadata/er.rs `command_arguments`); the equality is in
    # the ESS-LIMIT below. Neither this transition nor recovery grants redispatch.
    input:
      - {name: decision, type: connectors.execution_audit.AppendDecision}
      - {name: audit_record_ref, type: connectors.execution_audit.AuditRecordRef}
      - {name: observation_id, type: connectors.execution_audit.ObservationId}
      - {name: final_observation, type: connectors.execution_audit.FinalObservation}
    outcomes:
      - name: recorded
        when: decision == allow
        moves: connectors.execution_audit.AuditRecord.append_final
        instance: audit_record_ref
        emits: [connectors.execution_audit.FinalObservationRecorded]
        payload:
          connectors.execution_audit.FinalObservationRecorded:
            audit_record_ref: input.audit_record_ref
            observation_id: input.observation_id
        sets:
          final_observation: input.final_observation
      - name: unavailable
        error: connectors.execution_audit.AppendUnavailable
      # audit.md:93-94: a different observation after one final exists (the same
      # id with different fields, or a different id) refuses as a conflict and
      # leaves the original unchanged. The byte-identical repeat that audit.md:91-92
      # answers with the original acknowledgement is not modelled: see ESS-LIMIT.
      - name: wrong-state
        wrong_state: true
        error: connectors.execution_audit.AuditStateConflict

events:
  - name: connectors.execution_audit.AuditAnchored
    fields:
      - {name: audit_record_ref, type: connectors.execution_audit.AuditRecordRef}
      - {name: instance_id, type: String}
      - {name: audit_ref, type: connectors.execution_audit.AuditRef}
  - name: connectors.execution_audit.AttemptLinked
    fields:
      - {name: audit_record_ref, type: connectors.execution_audit.AuditRecordRef}
      - {name: attempt_id, type: connectors.mutations.AttemptId}
  - name: connectors.execution_audit.FinalObservationRecorded
    fields:
      - {name: audit_record_ref, type: connectors.execution_audit.AuditRecordRef}
      - {name: observation_id, type: connectors.execution_audit.ObservationId}

views:
  - name: connectors.execution_audit.AuditStates
    # Internal owner recovery only; this is not a public audit lookup service.
    source: connectors.execution_audit.AuditRecord
    consistency: read_your_writes
    fields:
      - {name: audit_record_ref, type: connectors.execution_audit.AuditRecordRef}
      - {name: instance_id, type: String}
      - {name: audit_ref, type: connectors.execution_audit.AuditRef}
      - {name: state, type: connectors.execution_audit.AuditRecord.State}
      - {name: anchor_kind, type: connectors.execution_audit.AnchorKind}
      - {name: activity, type: "Optional<connectors.execution_audit.Activity>"}
      - {name: access, type: "Optional<connectors.execution_audit.AnchorAccess>"}
      - {name: hop_role, type: connectors.execution_audit.HopRole}
      - {name: stage, type: connectors.execution_audit.AnchorStage}
      - {name: request_id, type: "Optional<String>"}
      - {name: principal_ref, type: "Optional<String>"}
      - {name: operation_id, type: "Optional<String>"}
      - {name: connection_ref, type: "Optional<String>"}
      - {name: descriptor_revision, type: "Optional<String>"}
      - {name: recorded_at, type: Timestamp}
      - {name: attempt_id, type: "Optional<connectors.mutations.AttemptId>"}
      - {name: final_observation, type: "Optional<connectors.execution_audit.FinalObservation>"}

# ESS checks the declaration graph, known instance/attempt/connection references,
# lifecycle causation, the anchor co-presence invariants and the final-observation
# retry/conflict answers.
# ESS-LIMIT (checked against ESS 0.40): these are persistence/conformance obligations.
# - Byte bounds (audit.md:104-114): ESS has no UTF-8 byte-length predicate, and
#   `.count` on text counts characters. The 64-ASCII-byte `code` and the base64url
#   512-byte `audit_record_ref` are writable with `alphabet:` and `.count`, but the
#   Entity Runtime lowering refuses both (AlphabetUnsupported, TextLengthUnsupported).
#   The 4 KiB encoded aggregate has no construct at all.
# - The 100,000 records per instance (audit.md:114): no cross-record count.
# - Injective `(instance_id, audit_ref)` qualification (audit.md:17-19): no compound
#   uniqueness constraint.
# - Attempt and connection references agreeing with the anchor's instance and with
#   the attempt's connection (audit.md:52-53): the guard over another record's
#   field is `when_related:`, added in ESS 0.41 at source format ess/18. This
#   specification is ess/15, which refuses it (unsupported_format_version), and
#   the ESS 0.52 Entity Runtime lowering refuses it at any format
#   (RelatedGuardUnsupported).
# - The byte-identical repeat returning the original acknowledgement (audit.md:91-92;
#   crates/connectors-host/src/local/audit.rs `append`): a `when_subject` over
#   `final_observation.*` members selecting a `preserves:` branch validates, but
#   synthesis cannot evaluate a guard over a stored Optional struct member and then
#   refuses every outcome of the command, `recorded` included; the Entity Runtime
#   lowering additionally needs a command `response:` for that preserve.
#   `when_subject_state` cannot be combined with a subject-fact guard either.
# - `observation_id` equal to `final_observation.observation_id` is not declared.
#   ESS 0.52 synthesizes `recorded` under that `when:` guard and the Entity Runtime
#   lowering carries it. The host fills `observation_id` from the appended
#   observation itself (metadata/er.rs `command_arguments`), so no request reaching
#   the runtime can disagree. The field exists only because a payload cannot read
#   the dotted input path `input.final_observation.observation_id` directly.
# - Trusted fact derivation, durable acknowledgement, clocks, retention and dispatch
#   order: no provenance, durable-storage or trusted-time construct.
# An early_refusal cannot satisfy the execution gate; an admitted anchor alone
# still cannot dispatch. No delete transition is selected. Audit outlives
# replay/index payload cleanup, approval/nonce compaction and any other owner that
# merely references it.
#
# The HTTP host's v1alpha2 invoke (contracts/service/compatibility.md § 2.1,
# Audit anchor; audit.md § 1 Attempt link, § 2). Order per admitted
# invocation, read or write:
# AcknowledgeAnchor (`admitted_execution`, `hop_role: execution`,
# `activity: invoke`, `access` from the operation's host declaration,
# `attempt_id` absent), then for a write the attempt
# (connectors.mutations.PrepareAttempt) and LinkAnchorAttempt, then dispatch,
# then AppendFinalObservation. `capacity` and `unavailable` from
# AcknowledgeAnchor both answer HTTP 503 `unavailable`, `audit_ref: null`, no
# attempt, zero adapter calls.
# UNMAPPED: principal_ref on the HTTP host. v1alpha2 semantics § 3.1 says the
# static-bearer principal is a "receiver-configured static service identity"
# that does not change when credential bytes rotate (§ 4 rule 3); the HTTP
# host's configuration (crates/connectors-host/src/server.rs:22-28
# ServiceConfig: instance, listen, service_credential) carries no principal,
# and connectors.declarations.ServiceConfiguration (instance_id, adapter_id,
# revision, registry_epoch) carries none either. Proposed derivation, not yet
# confirmed by the owner: the fixed text `static-bearer`, qualified by the
# anchor's instance_id (one configured principal per instance, § 3.2). No
# configuration field is added: ServiceConfig is the closed reader
# `urn:connectors:config:v1:service` (crates/connectors-host/src/schema.rs:22),
# and compatibility.md § 1 gives configuration formats their own decision.
# UNMAPPED: where the HTTP host persists anchors. The HTTP host holds no store
# (server.rs:30-35 Service: adapter, credential, slots; serve() at
# server.rs:177-199 opens nothing). The only AuditRecord store is the local
# owner's metadata authority: SQLite tables projected through Entity Runtime
# over Eventlog at the owner's state path (crates/connectors-host/src/local/
# audit.rs:25-52, local/owner/mutation.rs:356-357, local/metadata.rs:896-905),
# whose execution_audits rows require a registry_instances row
# (local/metadata/audit.sql:3, local/audit.rs:290-300). This declaration
# assumes the HTTP host writes the same AuditRecord through some durable store
# that keeps audit.md § 4 (100,000 records per instance, no expiry, no audit
# deletion, capacity refused before dispatch, never evicting). Which store,
# where it is configured, and whether its instance is a recorded
# ServiceConfiguration (the `instance` relation above) are open questions for
# the owner; LinkAnchorAttempt is not accepted by local-metadata-authority
# (components.yaml) until that is answered.
# UNMAPPED: what the HTTP host does when LinkAnchorAttempt answers
# `unavailable` after the attempt is recorded and before dispatch. No contract
# says whether the write still dispatches with an unlinked anchor or is
# aborted as not_attempted. Open question for the owner.

actors:
  - name: connectors.execution_audit.LocalHost
    may:
      - connectors.execution_audit.AcknowledgeAnchor
      - connectors.execution_audit.AppendFinalObservation
  # The HTTP service host (crates/connectors-host/src/server.rs).
  - name: connectors.execution_audit.ServiceHost
    may:
      - connectors.execution_audit.AcknowledgeAnchor
      - connectors.execution_audit.LinkAnchorAttempt
      - connectors.execution_audit.AppendFinalObservation
