# **A component's command tree is exactly what it accepts, and it accepts only its own domains'
# commands.** Both halves are ESS rules, and together they decide where the `cli:` block below
# sits. `validate_command_placement` refuses a tree that places a command the component does not
# accept, and refuses an accepted command the tree places nowhere; `ESS-COMPONENT-004` refuses a
# component that accepts a command from a domain another component owns — "§9 gives a command one
# handler, and it is the component owning its domain". There is therefore no third place to write
# a filter: a surface a person types and a surface something calls are different sets only by
# being different components.
components:
  # `crates/service/src/lib.rs:3` — "Pure Connectors use cases." Every command below is one of
  # those use cases; the transports that carry them are `crates/server/src/lib.rs:3`, "Inbound
  # hosted and personal-local transport adapters for Connectors application ports".
  - component: connectors-service
    summary: Holds the connection, credential, invocation and event use cases, and the state each of them moves.
    owns:
      domains:
        - connectors.connection
        - connectors.deployment
        - connectors.event
        - connectors.runtime
    accepts:
      commands:
        - connectors.connection.AuthorizeConnection
        - connectors.connection.VerifyConnection
        - connectors.connection.ReauthorizeConnection
        - connectors.connection.RevokeConnection
        - connectors.connection.SuperviseChannel
        - connectors.connection.ReconnectChannel
        - connectors.connection.ConnectChannel
        - connectors.connection.StopChannel
        - connectors.connection.CreateConnectSession
        - connectors.connection.FinishConnectSession
        - connectors.connection.ActivateCandidate
        - connectors.connection.MaterializeObservation
        - connectors.connection.RefreshObservation
        - connectors.runtime.InvokeOperation
        - connectors.runtime.TerminateSession
        - connectors.runtime.SettleSession
    publishes:
      events:
        - connectors.connection.ConnectionAuthorized
        - connectors.connection.ConnectionBecameCallable
        - connectors.connection.ConnectionDegraded
        - connectors.connection.ConnectionReauthorized
        - connectors.connection.ConnectionRevoked
        - connectors.connection.ChannelStarting
        - connectors.connection.ChannelReconnecting
        - connectors.connection.ChannelConnected
        - connectors.connection.ChannelStopped
        - connectors.connection.ConnectSessionCreated
        - connectors.connection.ConnectSessionCompleted
        - connectors.connection.ConnectSessionExpired
        - connectors.connection.ConnectSessionFailed
        - connectors.connection.CandidateActivated
        - connectors.connection.ObservationMaterialized
        - connectors.connection.ObservationWithdrawn
        - connectors.connection.ObservationReobserved
        - connectors.runtime.SessionEstablished
        - connectors.runtime.SessionTerminating
        - connectors.runtime.SessionTerminated
    # UNMAPPED: this surface is the write half only. The read verbs of the three protocols —
    # `CandidateSearch`, `Search`, `Describe`, `ObservationSearch`, `ConnectSessionStatus`
    # (crates/protocol/src/connection.rs:35-48), `SessionStatus`, `SessionReconcile`
    # (crates/protocol/src/operation.rs:49-56), `Receive`, `Replay`
    # (crates/protocol/src/event.rs:36-39) — change no entity, and ESS models a read as a `views:`
    # declaration carrying a consistency claim (`read_your_writes` or `eventual`). Nothing in the
    # tree states that claim for any of them, so declaring one would invent it. Settled by the
    # consistency each read actually offers being written down, which the caller's contract
    # (docs/design/04-the-callers-contract.md) is where it would go.
    #
    # Neither an accepted command nor a read — `SessionSignal`
    # (crates/protocol/src/operation.rs:56) — sends DTMF into a live call. It moves no entity this
    # document declares and no command above names it, so it is in neither half of the sentence
    # before this one, and `connectors operation signal` is excused as `unmodelled` below.
    #
    # Those three parts are a partition, not three lists: every variant of the three request enums
    # cited above is in exactly one of them, and
    # `crates/connectors-cli/tests/cli_surface.rs::the_read_verb_enumeration_partitions_the_protocols_it_names`
    # is what says so. Without it these sentences are prose in a YAML comment that decides eight of
    # the kinds `UNSPECIFIED_PATHS` carries, and a verb quietly dropped from the read half would
    # move a command-line word from `read` to `unmodelled` with nothing objecting.
    # In hosted posture the caller is not deployed with the service: it presents a validated
    # Identity envelope over a wire (docs/design/01-domain-model.md:48-50, 67-70).
    reached_by: network

  # `crates/catalog-build/src/lib.rs:1` — "compile the reviewed connector declarations into the
  # catalog artifacts". It accepts no command of this specification: the catalog nouns have no
  # transition anything takes, which is the same fact their single-state lifecycles record.
  - component: catalog-build
    summary: Compiles the reviewed connector declarations into the sealed catalog a deployment serves.
    owns:
      domains:
        - connectors.catalog

  # `crates/connectors-cli` — the crate whose three ambiguous verbs
  # (.engineering/planning/story/explicit-target-never-implicit.md) the target noun exists for.
  # `crates/connectors-cli/Cargo.toml:2-3` calls it a "Thin command-line frontend for reusable
  # Connector client and runtime libraries", and `product_cli_is_a_thin_frontend`
  # (`crates/catalog-build/tests/main/architecture_fence.rs:292`) holds it to that. It is reached
  # from a command line, and it now says so.
  - component: connectors-cli
    summary: Names which deployment a command reaches, instead of inferring it from a stored login.
    owns:
      domains:
        - connectors.target
    reached_by: command_line
    # The binary is `connectors` (`crates/connectors-cli/Cargo.toml:20-22`, `[[bin]] name`), and
    # the eight words below are the whole first level of `enum Command`
    # (`crates/connectors-cli/src/lib.rs:55-94`), every one of which carries a subcommand of its
    # own: `setup` (line 58), `inspect` (line 63), `session` (line 68), `serve` (line 73),
    # `connection` (line 78), `event` (line 83), `operation` (line 88) and `admin` (line 93).
    #
    # `story:cli-first-level-groups` made it eight. Before it the first level was fifteen words in
    # one block — five groups and ten leaves — and `connectors --help` could not tell an operator
    # which of them they wanted. The four groups it added, `setup`, `inspect`, `session` and
    # `serve`, hold the moved variants verbatim; `MOVED` in `crates/connectors-cli/src/lib.rs`
    # rewrites a path a person typed before that release onto the one it moved to, so the old paths
    # keep working for one release and each says on stderr where it went.
    #
    # UNMAPPED: no command is placed under any of them, and that is a fact about this system
    # rather than an omission. This component owns `connectors.target` alone, which declares no
    # command, and the two rules at the head of this file mean it may place none of the sixteen
    # `connectors-service` accepts: the frontend *forwards* those, it does not handle them.
    # `ess/generated/clap/TARGET.md` names all sixteen as target refusals — "no component
    # declaring `reached_by: command_line` accepts this command, so no tree places it and there
    # is no word to type" — which is the difference between the accepted surface and the
    # command-line surface, written by the generator instead of asserted here.
    #
    # It is also the right answer rather than merely the permitted one. A command's typed word is
    # `naming.wire` where it has one and the qualified name's last segment otherwise, verbatim and
    # un-cased; eleven of the sixteen carry no `naming.wire`, because in this document a
    # `naming.wire` is the protocol `method` tag and nothing else (`ess/system/system.yaml`,
    # enforced by `every_declared_wire_name_is_a_method_the_protocol_accepts`,
    # `crates/catalog-build/tests/main/ess_claim_fence.rs:360`). Placing them would
    # emit `SuperviseChannel`, `FinishConnectSession` and `SettleSession` as words at a shell —
    # measured, not supposed — and each of those is an act the platform performs on its own
    # (`ess/system/domains/connection.yaml:435-439`,
    # `crates/integration-sip/src/backend/sessions.rs:148-150`),
    # not one a person asks for. Settled by a construct that lets a client declare a tree over a
    # command it forwards rather than handles; `ess specify compose` generates such clients today
    # and has no `cli:` of its own.
    #
    # UNMAPPED: the words a person really types under these eight — `list`, `search`, `activate`,
    # `materialize`, `invoke` — are absent for the same reason, and the reads among them for a
    # second one: ESS models a read as a `views:` declaration carrying a consistency claim, and
    # the note on `connectors-service` above says why this document declares none. Settled by the
    # same two things: reads gaining that claim, and a forwarded command gaining a place.
    #
    # UNMAPPED: the words a person types under this binary that neither marker above lets this
    # document declare are enumerated below, one per line, so that the set is a fact of this
    # specification rather than an allowlist private to a test file. `UNSPECIFIED_PATHS` in
    # `crates/connectors-cli/tests/cli_surface.rs` has to equal this set exactly, in both
    # directions: a command absorbed into that list without being written down here is refused,
    # and a path written here that the parser has dropped is refused too. Each carries a kind
    # over there, and each kind is one of the reasons the two markers above give — a read waiting
    # on a `views:` consistency claim, a command this frontend forwards rather than handles, a
    # process or credential lifecycle step that moves no entity of this specification, a guided
    # flow, a word that only carries other words, or an act no command of this specification
    # names. Settled by the same two things: reads gaining that claim, and a forwarded command
    # gaining a place.
    #
    # Each line below is `<path> — <kind>`, and the kind is one of `read`, `lifecycle`,
    # `forwarded`, `flow`, `grouping` or `unmodelled`. **These lines are a YAML comment, so
    # `ess specify validate` never reads them and no ESS rule constrains them**; what holds them
    # is `the_exception_list_is_the_set_the_specification_enumerates`, which requires
    # `UNSPECIFIED_PATHS` to carry exactly these paths with exactly these kinds. Thirteen of the
    # kinds are also derived from the tree and do not rest on this list at all — see
    # docs/design/19-the-cli-surface.md for which, and for why the other fourteen cannot be.
    #   unspecified-path: setup init — lifecycle
    #   unspecified-path: setup connect — flow
    #   unspecified-path: setup completions — unmodelled
    #   unspecified-path: inspect doctor — read
    #   unspecified-path: inspect providers — read
    #   unspecified-path: inspect auth — read
    #   unspecified-path: session login — lifecycle
    #   unspecified-path: session logout — lifecycle
    #   unspecified-path: serve local — lifecycle
    #   unspecified-path: serve hosted — lifecycle
    #   unspecified-path: serve mcp — lifecycle
    #   unspecified-path: admin integrations — grouping
    #   unspecified-path: admin integrations status — read
    #   unspecified-path: admin credentials — grouping
    #   unspecified-path: admin credentials set — lifecycle
    #   unspecified-path: connection candidates — read
    #   unspecified-path: connection activate — forwarded
    #   unspecified-path: connection list — read
    #   unspecified-path: connection observations — read
    #   unspecified-path: connection materialize — forwarded
    #   unspecified-path: event search — read
    #   unspecified-path: event receive — read
    #   unspecified-path: event replay — read
    #   unspecified-path: operation search — read
    #   unspecified-path: operation describe — read
    #   unspecified-path: operation signal — unmodelled
    #   unspecified-path: operation invoke — forwarded
    cli:
      binary: connectors
      groups:
        - name: setup
          summary: Write a configuration, add a provider, install shell completions.
        - name: inspect
          summary: Read what is configured, what is connected, and what cannot work.
        - name: session
          summary: Sign in to a hosted Connector deployment, and sign out of it.
        - name: serve
          summary: Run a Connector for this machine, for a hosted deployment, or over stdio.
        - name: connection
          summary: Manage durable Connections through the credential-free control socket.
        - name: event
          summary: Search or receive durable normalized data events.
        - name: operation
          summary: Search, describe, or invoke admitted Connector operations.
        - name: admin
          summary: Operate an Identity-protected hosted Connectors instance.
