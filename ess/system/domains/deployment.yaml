# The deployment side of the three layers, docs/design/01-domain-model.md:178-283. `Connection`
# belongs to this layer in the design document and is modelled in `connectors.connection`, beside
# the other nouns `crates/protocol/src/connection.rs` declares.
domain: connectors.deployment

summary: A tenant's configured enablement of a provider, and the vendor secret material backing the connections made from it.

types:

  # Proposed deployment values, design 21 (2026-09-06). Registrations remain here;
  # neither a client identifier nor a secret value becomes a catalog field.
  - name: connectors.deployment.OAuthBrowserPlacement
    kind: enum
    variants: [SameMachine, OtherMachine]

  - name: connectors.deployment.PersonalOAuthCustody
    kind: enum
    variants: [DevelopmentFile]

  - name: connectors.deployment.PersonalOAuthRegistration
    kind: struct
    fields:
      - name: auth_profile
        type: connectors.connection.AuthProfile
      - name: flow
        type: connectors.catalog.PersonalOAuthFlow
      - name: client_authentication
        type: connectors.catalog.OAuthClientAuthentication
      - name: client_id
        type: String
      - name: client_secret_ref
        type: Optional<connectors.deployment.CredentialRef>
      - name: redirect_uri
        type: Optional<String>
      - name: browser_placement
        type: connectors.deployment.OAuthBrowserPlacement
      - name: registration_use
        type: connectors.catalog.OAuthRegistrationUse
      - name: custody
        type: connectors.deployment.PersonalOAuthCustody
      - name: allowed_scopes
        type: List<connectors.deployment.Scope>
      - name: session_ttl_seconds
        type: Integer

  # Value-free evidence joined to existing Connection/credential metadata, not a new
  # credential entity or a settlement of the held multi-credential cardinality question.
  - name: connectors.deployment.OAuthCredentialEvidence
    kind: struct
    fields:
      - name: generation
        type: Integer
      - name: subject
        type: connectors.deployment.CredentialSubject
      - name: proven_scopes
        type: List<connectors.deployment.Scope>
      - name: observed_at_unix_ms
        type: Integer
      - name: expires_at_unix_ms
        type: Integer
      - name: refresh_available
        type: Boolean
      - name: observation_endpoint
        type: connectors.catalog.OAuthEndpoint

  # Private pre-egress marker, design 21 (2026-09-06). Stored beside the custody
  # journal in its existing FULL SQLite store; it is not a public protocol value.
  - name: connectors.deployment.OAuthRefreshAttempt
    kind: struct
    fields:
      - name: version
        type: Integer
      - name: connection_ref
        type: connectors.connection.ConnectionRef
      - name: binding_sha256
        type: List<Integer>
      - name: previous_generation
        type: Integer

  # UNMAPPED: marker version exactly 1, exactly 32 octets in binding_sha256, key
  # oauth.refresh.v1.<64 lowercase hex SHA256 of canonical custody Identity>,
  # bounded closed decoding and checked generation arithmetic. Runtime owns the
  # canonical identity digest and FULL confirmation before any refresh egress.
  # UNMAPPED: recovery clears this marker only after a confirmed newer same-binding
  # publication passes current authority and evidence checks. Preparing abort does
  # not prove remote rollback; unknown marker reads/writes/deletes stay unavailable.
  # These runtime obligations do not change the custody journal envelope or lifecycle.

  # UNMAPPED: secret custody, no Debug/serialization of private token material, positive
  # bounded TTL/generation/time arithmetic, exact configured URI/Host/Origin validation,
  # keyring/file routing, and production refusal for DevelopmentFile. Deployment policy
  # and runtime tests own these constraints; ESS does not establish encryption at rest.
  # UNMAPPED: a proven scope set authorizes only its exact credential generation and
  # existing Connection grant. No field above creates or broadens that grant.

  - name: connectors.deployment.IntegrationRef
    kind: newtype
    of: String

  - name: connectors.deployment.ProviderRef
    kind: newtype
    of: String

  - name: connectors.deployment.Scope
    kind: newtype
    of: String

  # `CredentialRef`, crates/connector-address/src/credential.rs:265-271. The address is the
  # identity: there is no separate opaque id anywhere in the tree.
  - name: connectors.deployment.CredentialRef
    kind: struct
    fields:
      - name: tenant
        type: String
      - name: authority
        type: String
      - name: instance
        type: Optional<String>
      - name: service
        type: String
      - name: credential
        type: String

  # docs/design/01-domain-model.md:225 — the credential subject the vendor observes.
  - name: connectors.deployment.CredentialSubject
    kind: enum
    variants: [App, User]

  # Proposed local configuration value for story:one-placement-several-credentials,
  # 2026-09-06. CatalogIntegrationConfig already declares these two axes for one credential
  # (crates/connectors-config/src/personal.rs); the story repeats them per local binding.
  # The name is a catalog credential selector, not secret material or a global entity identity.
  # This does not settle the global Credential-to-Connection cardinality below.
  - name: connectors.deployment.LocalCredentialSelection
    kind: struct
    fields:
      - name: credential
        type: String
      - name: allow_writes
        type: Boolean

entities:
  # UNMAPPED: no state enum and no drawn lifecycle
  # (docs/design/01-domain-model.md:180-191), so this is a single-state lifecycle. `Configured` is
  # the document's own word: "A tenant's configured enablement of a provider"
  # (docs/design/01-domain-model.md:182). The `enabled` field below is the closest thing to a
  # state the document names (docs/design/01-domain-model.md:183) and it is a boolean, not a
  # ladder. Settled by a state enum in `crates/protocol/src/`, or by a lifecycle drawn beside the
  # Connection one.
  # UNMAPPED: the Integration-to-Provider relation. docs/design/01-domain-model.md:189 says "an
  # integration configures a provider; it never extends one", which fixes the direction but not
  # the cardinality — nothing says whether one provider may be configured by two integrations of
  # the same tenant. Settled by the uniqueness rule the integration store enforces.
  - name: connectors.deployment.Integration

    identity:
      name: integration_ref
      type: connectors.deployment.IntegrationRef

    fields:
      # "Holds: enabled state, the deployment's OAuth registration ..., allowed scopes, settings
      # defaults, and the **destination policy** for private-host providers"
      # (docs/design/01-domain-model.md:183-187). The registration and the settings defaults are
      # value-shaped secrets and configuration and are not projected here.
      - name: enabled
        type: Boolean
      - name: allowed_scopes
        type: List<connectors.deployment.Scope>

    lifecycle:
      initial: Configured
      states: [Configured]
      terminal: [Configured]

  # UNMAPPED: no state enum and no drawn lifecycle
  # (docs/design/01-domain-model.md:249-283), so this is a single-state lifecycle. `Acquired` is
  # the document's own word: a credential is "acquired through a connect session (OAuth
  # authorization code, API key entry, …) or operator-entered"
  # (docs/design/01-domain-model.md:251-252). Settled by a state enum, or by the
  # "credential degraded" operational event at docs/design/01-domain-model.md:372 gaining a
  # credential state to report rather than a Connection one.
  # UNMAPPED: the Credential-to-Connection relation. docs/design/01-domain-model.md:274 puts
  # capability evidence "on its Connection" and :281 forbids unioning scope sets "from different
  # credentials on one Connection", so a Connection carries more than one — but nothing says how
  # many, or which one an invocation places. Settled by the credential-capability admission work
  # (docs/design/09-curation-and-credential-capability-admission.md).
  - name: connectors.deployment.Credential

    identity:
      name: credential_ref
      type: connectors.deployment.CredentialRef

    fields:
      # "every cache is bound to the credential generation that produced the evidence"
      # (docs/design/01-domain-model.md:282-283 — the sentence starts with "every" as the last
      # word of :282 and finishes on :283).
      - name: generation
        type: Integer
      # "subject, proven granted scopes, required provider installation context, observation
      # source, and freshness" (docs/design/01-domain-model.md:275-276).
      - name: subject
        type: connectors.deployment.CredentialSubject
      - name: proven_scopes
        type: List<connectors.deployment.Scope>

    lifecycle:
      initial: Acquired
      states: [Acquired]
      terminal: [Acquired]
