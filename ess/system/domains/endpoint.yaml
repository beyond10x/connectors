# The nouns `crates/protocol/src/endpoint.rs` carries together: that module's own first line
# (`crates/protocol/src/endpoint.rs:1`) calls itself the "Credential-free Endpoint and Connect
# Session protocol", and every state enum modelled here is declared in it.
domain: connectors.endpoint

summary: A configured or discovered service interface or external identity, its supervised event receivers, and temporary credential setup.

types:
  - name: connectors.endpoint.Readiness
    kind: enum
    variants: [Ready, UnknownProvider, UnsupportedProtocol, MissingCredentials, Denied, UnavailableRoute, Stale]
  - name: connectors.endpoint.Transport
    kind: enum
    variants: [Tcp, Udp, Sctp]
  - name: connectors.endpoint.Tls
    kind: enum
    variants: [Required, Disabled]
  - name: connectors.endpoint.Scheme
    kind: enum
    variants: [Http, Https]
  - name: connectors.endpoint.CredentialKind
    kind: enum
    variants: [KubernetesSecret]
  - name: connectors.endpoint.CredentialReference
    kind: struct
    fields:
      - name: kind
        type: connectors.endpoint.CredentialKind
      - name: namespace
        type: String
      - name: name
        type: String
      - name: keys
        type: Map<String, String>
  - name: connectors.endpoint.Binding
    kind: struct
    fields:
      - name: provider
        type: String
      - name: base_path
        type: Optional<String>
      - name: credential
        type: Optional<connectors.endpoint.CredentialReference>
      - name: direct_address
        type: Optional<String>
      - name: database
        type: Optional<String>
      - name: tls
        type: Optional<connectors.endpoint.Tls>
      - name: scheme
        type: Optional<connectors.endpoint.Scheme>

  - name: connectors.endpoint.DiscoveryMetadata
    kind: struct
    fields:
      - name: namespace
        type: Optional<String>
      - name: resource_kind
        type: String
      - name: resource_name
        type: String
      - name: resource_uid
        type: String
      - name: port_name
        type: Optional<String>
      - name: port
        type: Optional<Integer>
      - name: transport
        type: connectors.endpoint.Transport
      - name: interface
        type: String
      - name: readiness
        type: connectors.endpoint.Readiness
      - name: binding
        type: Optional<connectors.endpoint.Binding>

  # Endpoint v0alpha2 values from `crates/protocol/src/connection_v2.rs`, with the
  # private RemediationBinding in `crates/service/src/remediation.rs`. The existing
  # SetupSession identity/lifecycle remains; there is no durable remediation entity.
  - name: connectors.endpoint.RemediationResumeState
    kind: enum
    variants: [Pending, Ready, Consumed, Expired, Failed]

  - name: connectors.endpoint.RemediationNextAction
    kind: enum
    variants: [FreshDescriptionThenExplicitInvoke]

  # Private bounded value associated with an existing session; never an authority token.
  - name: connectors.endpoint.RemediationBinding
    kind: struct
    fields:
      - name: operation_ref
        type: connectors.runtime.OperationRef
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: auth_profile
        type: connectors.endpoint.AuthProfile
      - name: need
        type: connectors.runtime.AuthenticationNeed
      - name: canonical_input_sha256
        type: String
      - name: stable_authority_sha256
        type: String
      - name: grant_ref
        type: connectors.runtime.GrantRef
      - name: grant_revision
        type: Optional<Integer>
      - name: admission_policy_sha256
        type: String
      - name: expires_at_unix_ms
        type: Integer

  # Value-only part of a trusted control-plane response; the reused SetupSessionStatus
  # endpoint projection is intentionally not replicated as arbitrary String URL fields.
  - name: connectors.endpoint.BoundRemediationStatus
    kind: struct
    fields:
      - name: setup_session_ref
        type: connectors.endpoint.SetupSessionRef
      - name: operation_ref
        type: connectors.runtime.OperationRef
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: auth_profile
        type: connectors.endpoint.AuthProfile
      - name: need
        type: connectors.runtime.AuthenticationNeed
      - name: session_state
        type: connectors.endpoint.SetupSession.State
      - name: expires_at_unix_ms
        type: Integer
      - name: resume_state
        type: connectors.endpoint.RemediationResumeState

  - name: connectors.endpoint.RemediationAcknowledgement
    kind: struct
    fields:
      - name: setup_session_ref
        type: connectors.endpoint.SetupSessionRef
      - name: operation_ref
        type: connectors.runtime.OperationRef
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
      - name: next_action
        type: connectors.endpoint.RemediationNextAction

  # Rust session/custody binding owner: `crates/integration-catalog/src/oauth_remediation.rs`,
  # exercised by `crates/integration-catalog/src/oauth_remediation_tests.rs` and the actual
  # local transport in `crates/connectors-runtime/tests/personal_oauth.rs`. The status-only
  # policy check does not grant acquisition, publication or acknowledgement after expiry.
  # UNMAPPED: existing session state plus a one-time acknowledgement bit derives resume
  # state; these enum variants add no SetupSession lifecycle transition. Completion,
  # acknowledgement and request races need Rust tests, not invented ESS causation.
  # UNMAPPED: exact authenticated owner/realm/binding/profile and current Grant checks;
  # one-integration completion; descriptor/evidence freshness; expiry and capacity bounds;
  # no saved raw inputs, token material or ambient authority; trusted-only endpoint access.
  # UNMAPPED: v1 can select only one unambiguous configured owner/integration/profile
  # binding. v2 explicit target selection is a distinct migration, not label authority.
  # UNMAPPED: RemediationAdmission and RemediationAuthority are process-local Rust
  # admission capabilities, not serializable domain records or dispatch proofs. Their
  # actual policy owner must admit and recheck operation plus management authority;
  # an exported digest or these typed values cannot represent that executable capability.


  # Proposed transient value vocabulary, design 21 (2026-09-06). Existing SetupSession
  # identity, Pending/Completed/Expired/Failed lifecycle and Endpoint wire are reused.
  - name: connectors.endpoint.OAuthInstructionKind
    kind: enum
    variants: [BrowserAuthorization, DeviceAuthorization]

  - name: connectors.endpoint.PersonalOAuthSessionPolicy
    kind: struct
    fields:
      - name: flow
        type: connectors.catalog.PersonalOAuthFlow
      - name: browser_placement
        type: connectors.deployment.OAuthBrowserPlacement
      - name: instruction_kind
        type: connectors.endpoint.OAuthInstructionKind

  # Safe internal classifications, not new protocol error codes or model-tool payloads.
  - name: connectors.endpoint.OAuthCompletionRefusal
    kind: enum
    variants: [FlowNotAdmitted, BrowserPlacementMismatch, PortInUse, StateMismatch, HostMismatch, OriginRefused, MalformedCallback, PkceBindingMismatch, CodeExchangeRefused, DeviceDenied, DeviceExpired, CustodyUnavailable]

  # UNMAPPED: one-shot state consumption, bounded callback/device work, expiry versus
  # durable commit-decision linearization, recovery, task/listener cancellation and
  # terminal instruction removal. Existing lifecycle owners must enforce these in Rust.
  # UNMAPPED: trusted outer-control URL access versus model/inner-tool redaction and
  # remediation only for an already resolved/admitted stable Endpoint. No new wire
  # field, endpoint, durable session entity, or unknown-Endpoint creation is asserted.

  # Every identity below is an opaque `String` reference in the protocol; the wire names are the
  # field names of the value-free summaries in `crates/protocol/src/endpoint.rs`.
  - name: connectors.endpoint.EndpointRef
    kind: newtype
    of: String

  - name: connectors.endpoint.IntegrationRef
    kind: newtype
    of: String

  - name: connectors.endpoint.Label
    kind: newtype
    of: String

  # crates/protocol/src/endpoint.rs:123-128.
  - name: connectors.endpoint.EndpointScope
    kind: enum
    variants: [Tenant, Principal]

  # crates/protocol/src/endpoint.rs:131-135.
  - name: connectors.endpoint.EndpointActor
    kind: enum
    variants: [App, User]

  # crates/protocol/src/endpoint.rs:138-143. `Platform` is wire id `b10x` (line 140).
  - name: connectors.endpoint.EndpointInitiator
    kind: enum
    variants: [Platform, Provider]

  # crates/protocol/src/endpoint.rs:156-160.
  - name: connectors.endpoint.RouteAdapter
    kind: enum
    variants: [GrafanaDatasourceProxyV1, KubernetesServiceProxyV1]

  - name: connectors.endpoint.EventReceiverRef
    kind: newtype
    of: String

  - name: connectors.endpoint.BindingRef
    kind: newtype
    of: String

  - name: connectors.endpoint.EventName
    kind: newtype
    of: String

  - name: connectors.endpoint.SetupSessionRef
    kind: newtype
    of: String

  # crates/protocol/src/endpoint.rs:99-101: it selects a credential purpose, never a credential.
  - name: connectors.endpoint.AuthProfile
    kind: newtype
    of: String

  - name: connectors.endpoint.CandidateRef
    kind: newtype
    of: String

  - name: connectors.endpoint.ObservationRef
    kind: newtype
    of: String

  - name: connectors.endpoint.DiscoveryRef
    kind: newtype
    of: String

  - name: connectors.endpoint.ProviderRef
    kind: newtype
    of: String

  - name: connectors.endpoint.Title
    kind: newtype
    of: String

  # Opaque content digest of the evidence a candidate or observation was read from
  # (crates/protocol/src/endpoint.rs:234, 250).
  - name: connectors.endpoint.EvidenceDigest
    kind: newtype
    of: String

entities:
  # States: crates/protocol/src/endpoint.rs:112-117 (`EndpointState`).
  # Transitions: docs/design/01-domain-model.md:198-201, the only drawn lifecycle in the tree.
  # Fields: `EndpointSummary`, crates/protocol/src/endpoint.rs:186-200.
  # UNMAPPED: `route` (crates/protocol/src/endpoint.rs:167-174) is `direct` or
  # `via_endpoint(parent Endpoint, resource binding, adapter)`, so a mediated Endpoint
  # references a parent Endpoint. The cardinality of that relation is not stated anywhere:
  # docs/design/01-domain-model.md:235-241 says every Endpoint has one immutable route but does
  # not say how many children one parent may carry. Settled by the storage or reconciliation code
  # that indexes children by parent; `crates/integration-monitoring/src/backend.rs:1689-1695`
  # walks `ChildEndpoint` records but does not bound them.
  - name: connectors.endpoint.Endpoint

    identity:
      name: endpoint_ref
      type: connectors.endpoint.EndpointRef

    fields:
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: label
        type: connectors.endpoint.Label
      - name: initiation
        type: List<connectors.endpoint.EndpointInitiator>
      - name: scope
        type: Optional<connectors.endpoint.EndpointScope>
      - name: actor
        type: Optional<connectors.endpoint.EndpointActor>
      # crates/protocol/src/endpoint.rs:198-199. The provider-declared acquisition profile the
      # Endpoint was made under; it selects a credential purpose, never a credential
      # (crates/protocol/src/endpoint.rs:99-101). Same value as
      # `connectors.catalog.SetupProfileSummary.auth_profile`
      # (crates/protocol/src/catalog.rs:101).
      - name: auth_profile
        type: Optional<connectors.endpoint.AuthProfile>

      # Source provenance is optional for configured endpoints and single-valued for discovered ones.
      - name: source_ref
        type: Optional<connectors.endpoint.EndpointRef>
      - name: discovery
        type: Optional<connectors.endpoint.DiscoveryMetadata>

    relations:
      - name: discovery_source
        kind: references
        target: connectors.endpoint.Endpoint
        cardinality: one
        via: source_ref

    lifecycle:
      initial: Created
      states: [Created, Authorized, Callable, Degraded, Revoked]
      terminal: [Revoked]
      transitions:
        - name: authorize
          from: [Created]
          to: Authorized
        - name: verify
          from: [Authorized]
          to: Callable
        - name: degrade
          from: [Callable]
          to: Degraded
        - name: reauthorize
          from: [Degraded]
          to: Authorized
        - name: revoke
          from: [Degraded]
          to: Revoked

  # States: crates/protocol/src/endpoint.rs:147-151 (`EventReceiverState`).
  # Transitions read from the supervisor that performs them,
  # `crates/integration-slack/src/backend/connection_runtime.rs`: `Starting` on
  # `start_supervisor` (line 704), `Reconnecting` at each loop head (line 730), `Connected` once
  # the socket is open (line 801), `Stopped` when the loop breaks (line 746).
  # The protocol declares `ChannelSummary` twice, and the two projections differ. Both are read:
  # Fields: `ChannelSummary`, crates/protocol/src/endpoint.rs:177-182.
  # Fields: `ChannelSummary`, crates/protocol/src/event.rs:77-83.
  # The endpoint.rs projection omits `endpoint_ref` because it is nested inside
  # `EndpointDescription` (crates/protocol/src/endpoint.rs:204-208), where the Endpoint is
  # already named; the event.rs projection carries `pub endpoint_ref: String`
  # (crates/protocol/src/event.rs:76) and it is not optional. So the EventReceiver-to-Endpoint
  # direction is cited and single-valued, and is modelled as a required field below.
  # UNMAPPED: the *other* direction. A EventReceiver's key is `(Endpoint, source_scope)` and not
  # Endpoint alone (docs/design/01-domain-model.md:359-364), so a Endpoint may carry more
  # than one EventReceiver and nothing states how many. Settled by the substrate ingestion work that
  # mints `source_scope`, which is where the partition is decided.
  - name: connectors.endpoint.EventReceiver

    identity:
      name: event_receiver_ref
      type: connectors.endpoint.EventReceiverRef

    fields:
      # crates/protocol/src/event.rs:76-77.
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: binding_ref
        type: connectors.endpoint.BindingRef
      - name: events
        type: List<connectors.endpoint.EventName>

    lifecycle:
      initial: Starting
      states: [Starting, Connected, Reconnecting, Stopped]
      terminal: [Stopped]
      transitions:
        - name: supervise
          from: [Starting, Connected]
          to: Reconnecting
        - name: attach
          from: [Reconnecting]
          to: Connected
        - name: stop
          from: [Starting, Connected, Reconnecting]
          to: Stopped

  # States: crates/protocol/src/endpoint.rs:259-263 (`ConnectSessionState`).
  # Two registries perform these moves, not one, and the transitions below are the union of what
  # both do:
  #   `crates/service/src/connect_session.rs` — `reserve_endpoints` creates `Pending` at312;
  #   `finish` at358 maps `Completed` at372, `Expired` at377 and `Failed` at378. It requires
  #   `Pending` and no unresolved completion at367. `fail_pending` at388 applies the same guard
  #   at391 before assigning `Failed` at396. Guarded completion resolves through the same owner.
  #   `crates/integration-catalog/src/hosted.rs` — `Expired` at388 (guarded on `Pending` at387)
  #   and `Completed` at771, through `complete_hosted_session` at729 and the runtime registry.
  # `complete_hosted_session` guards on `Pending` before it releases the session lock and re-checks
  # that state after credential verification and custody have awaited, immediately before writing
  # `Completed`. A concurrent expiry therefore remains terminal instead of being overwritten.
  # The hosted registry does not assign `ConnectSessionState::Failed`; that state is assigned
  # by the service lifecycle's `finish` and `fail_pending` over its own map. These citations
  # were refreshed against integrated source9c6ce892 after the private custody lifecycle moved
  # the earlier service line anchors; no transition or lifecycle identity changed.
  # Fields: `ConnectSessionStatus`, crates/protocol/src/endpoint.rs:272-284.
  - name: connectors.endpoint.SetupSession

    identity:
      name: setup_session_ref
      type: connectors.endpoint.SetupSessionRef

    fields:
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: expires_at_unix_ms
        type: Integer
      - name: completion_endpoint
        type: Optional<String>
      - name: browser_completion_url
        type: Optional<String>
      # The one relation the protocol states, and it states its cardinality too: a finished
      # session names at most one Endpoint (crates/protocol/src/endpoint.rs:282-283,
      # docs/design/01-domain-model.md:98-99).
      - name: endpoint_ref
        type: Optional<connectors.endpoint.EndpointRef>

    lifecycle:
      initial: Pending
      states: [Pending, Completed, Expired, Failed]
      terminal: [Completed, Expired, Failed]
      transitions:
        - name: complete
          from: [Pending]
          to: Completed
        - name: expire
          from: [Pending]
          to: Expired
        - name: fail
          from: [Pending]
          to: Failed

  # States: crates/protocol/src/endpoint.rs:221-223 (`EndpointCandidateState`).
  # Transition read from the code that performs it: `Detected` on discovery
  # (crates/integration-kubernetes/src/local.rs:1143), `Activated` once the candidate has a
  # Endpoint (crates/integration-kubernetes/src/local.rs:254-260), which
  # `EndpointRequest::CandidateActivate` (crates/protocol/src/endpoint.rs:38-39) asks for.
  # The protocol enforces the pairing at crates/protocol/src/endpoint.rs:495-496: `Detected`
  # exactly when `endpoint_ref` is absent, `Activated` exactly when it is present.
  # Fields: `EndpointCandidateSummary`, crates/protocol/src/endpoint.rs:229-237.
  - name: connectors.endpoint.EndpointCandidate

    identity:
      name: candidate_ref
      type: connectors.endpoint.CandidateRef

    fields:
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: title
        type: connectors.endpoint.Title
      - name: evidence_sha256
        type: connectors.endpoint.EvidenceDigest
      - name: endpoint_ref
        type: Optional<connectors.endpoint.EndpointRef>

    lifecycle:
      initial: Detected
      states: [Detected, Activated]
      terminal: [Activated]
      transitions:
        - name: activate
          from: [Detected]
          to: Activated

  # States: crates/protocol/src/endpoint.rs:212-216 (`DiscoveryObservationState`).
  # Transitions read from the code that performs each one:
  #   `Observed`   — crates/integration-kubernetes/src/local_services.rs:266,
  #                  crates/integration-monitoring/src/backend.rs:1581 (`active: true`);
  #   `materialize`— crates/integration-kubernetes/src/local.rs:662, asked for by
  #                  `EndpointRequest::Materialize` (crates/protocol/src/endpoint.rs:44-45);
  #   `withdraw`   — crates/integration-monitoring/src/backend.rs:1551 and 1367
  #                  (`observation.active = false`);
  #   `reobserve`  — crates/integration-monitoring/src/backend.rs:1567
  #                  (`observation.active = true` on a re-seen observation).
  # UNMAPPED: `Unsupported` (crates/protocol/src/endpoint.rs:214) is absent here because
  # nothing moves to it. crates/integration-monitoring/src/backend.rs:1666-1669 derives it from
  # the *absence* of `target_provider`, so it classifies a newly observed resource rather than
  # naming a move out of `Observed`, and a lifecycle declares one `initial`. Settled by a code
  # site that performs the change the way crates/integration-kubernetes/src/local.rs:662 performs
  # `Materialized` — that is, by the observation state becoming stored rather than derived.
  # Fields: `DiscoveryObservationSummary`, crates/protocol/src/endpoint.rs:242-255.
  - name: connectors.endpoint.DiscoveryObservation

    identity:
      name: observation_ref
      type: connectors.endpoint.ObservationRef

    fields:
      - name: discovery_ref
        type: connectors.endpoint.DiscoveryRef
      - name: source_endpoint_ref
        type: connectors.endpoint.EndpointRef
      - name: observed_type
        type: String
      - name: title
        type: connectors.endpoint.Title
      - name: evidence_generation
        type: Integer
      - name: evidence_sha256
        type: connectors.endpoint.EvidenceDigest
      - name: target_provider_ref
        type: Optional<connectors.endpoint.ProviderRef>
      - name: endpoint_ref
        type: Optional<connectors.endpoint.EndpointRef>

    lifecycle:
      initial: Observed
      states: [Observed, Materialized, Withdrawn]
      transitions:
        - name: materialize
          from: [Observed]
          to: Materialized
        - name: withdraw
          from: [Observed, Materialized]
          to: Withdrawn
        - name: reobserve
          from: [Withdrawn]
          to: Observed
        # The state is derived, not stored, and `observation_summary`
        # (crates/integration-monitoring/src/backend.rs:1661-1670) tests `!active` first, then
        # `endpoint_ref.is_some()` -> `Materialized`, and only then
        # `target_provider.is_some()` -> `Observed`. The re-activating branch
        # (crates/integration-monitoring/src/backend.rs:1563-1570) sets `active = true` and never
        # clears `endpoint_ref`, so a withdrawn observation that had been materialized comes
        # back as `Materialized`, not as `Observed`. That is a fourth move and it is declared.
        - name: rematerialize
          from: [Withdrawn]
          to: Materialized

commands:
  # The four verbs the drawing names (docs/design/01-domain-model.md:199-201) become four commands.
  # UNMAPPED: the command names are this document's. docs/design/01-domain-model.md:198-201 draws
  # the transition verbs and names no caller-facing command for any of them, and no variant of
  # `EndpointRequest` (crates/protocol/src/endpoint.rs:35-48) performs one. Settled by the CLI
  # and RPC surface work (`story:cli-surface-contract`), which decides what a caller actually says.
  - name: connectors.endpoint.AuthorizeEndpoint
    input:
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
    outcomes:
      - name: authorized
        moves: connectors.endpoint.Endpoint.authorize
        instance: endpoint_ref
        emits: [connectors.endpoint.EndpointAuthorized]
        payload:
          connectors.endpoint.EndpointAuthorized:
            endpoint_ref: input.endpoint_ref
        summary: The connection holds vendor credential material (docs/design/01-domain-model.md:199).

  - name: connectors.endpoint.VerifyEndpoint
    input:
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
    outcomes:
      - name: callable
        moves: connectors.endpoint.Endpoint.verify
        instance: endpoint_ref
        emits: [connectors.endpoint.EndpointBecameCallable]
        payload:
          connectors.endpoint.EndpointBecameCallable:
            endpoint_ref: input.endpoint_ref
        summary: Verification succeeded and the connection is callable (docs/design/01-domain-model.md:199).
      # UNMAPPED: docs/design/01-domain-model.md:200 labels the callable-to-degraded arrow with a
      # cause ("credential expiry / revocation upstream"), not a verb, and names nothing that
      # observes it. The verb `degrade` and its attachment to this command are this document's.
      # Settled by the code that assigns `EndpointState::Degraded`: today the only assignment in
      # the tree derives it from a channel state
      # (`crates/integration-slack/src/backend/connection_runtime.rs:35`) rather than performing a
      # move, so there is nothing yet that a command could be named after.
      - name: degraded
        external: the provider reports the credential expired or was revoked upstream
        moves: connectors.endpoint.Endpoint.degrade
        instance: endpoint_ref
        emits: [connectors.endpoint.EndpointDegraded]
        payload:
          connectors.endpoint.EndpointDegraded:
            endpoint_ref: input.endpoint_ref
        summary: The credential expired or was revoked upstream (docs/design/01-domain-model.md:200).

  - name: connectors.endpoint.ReauthorizeEndpoint
    input:
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
    outcomes:
      - name: reauthorized
        moves: connectors.endpoint.Endpoint.reauthorize
        instance: endpoint_ref
        emits: [connectors.endpoint.EndpointReauthorized]
        payload:
          connectors.endpoint.EndpointReauthorized:
            endpoint_ref: input.endpoint_ref
        summary: Repaired in place; the connection id is unchanged (docs/design/01-domain-model.md:201, 204-206).

  - name: connectors.endpoint.RevokeEndpoint
    input:
      - name: endpoint_ref
        type: connectors.endpoint.EndpointRef
    outcomes:
      - name: revoked
        moves: connectors.endpoint.Endpoint.revoke
        instance: endpoint_ref
        emits: [connectors.endpoint.EndpointRevoked]
        payload:
          connectors.endpoint.EndpointRevoked:
            endpoint_ref: input.endpoint_ref
        summary: The connection is withdrawn and is no longer callable (docs/design/01-domain-model.md:201).

  # The four supervisor steps that perform the EventReceiver moves.
  # UNMAPPED: none of these four is a caller-facing command. The channel lifecycle is
  # "owned by the platform" (docs/design/01-domain-model.md:357) and no `EndpointRequest`
  # variant (crates/protocol/src/endpoint.rs:35-48) names one; the names below are taken from
  # the functions that perform the moves. Settled by a surface that lets an operator supervise a
  # channel, if one is ever declared.
  - name: connectors.endpoint.SuperviseEventReceiver
    input:
      - name: binding_ref
        type: connectors.endpoint.BindingRef
    outcomes:
      - name: starting
        creates: connectors.endpoint.EventReceiver
        instance: event_receiver_ref
        emits: [connectors.endpoint.EventReceiverStarting]
        payload:
          connectors.endpoint.EventReceiverStarting:
            binding_ref: input.binding_ref
        summary: The supervisor is registered and the channel is Starting (crates/integration-slack/src/backend/connection_runtime.rs:702-704).

  - name: connectors.endpoint.ReconnectEventReceiver
    input:
      - name: event_receiver_ref
        type: connectors.endpoint.EventReceiverRef
    outcomes:
      - name: reconnecting
        moves: connectors.endpoint.EventReceiver.supervise
        instance: event_receiver_ref
        emits: [connectors.endpoint.EventReceiverReconnecting]
        payload:
          connectors.endpoint.EventReceiverReconnecting:
            event_receiver_ref: input.event_receiver_ref
        summary: The supervisor loop is about to open a socket (crates/integration-slack/src/backend/connection_runtime.rs:726-730).

  - name: connectors.endpoint.ConnectEventReceiver
    input:
      - name: event_receiver_ref
        type: connectors.endpoint.EventReceiverRef
    outcomes:
      - name: connected
        moves: connectors.endpoint.EventReceiver.attach
        instance: event_receiver_ref
        emits: [connectors.endpoint.EventReceiverConnected]
        payload:
          connectors.endpoint.EventReceiverConnected:
            event_receiver_ref: input.event_receiver_ref
        summary: The socket is open and events flow (crates/integration-slack/src/backend/connection_runtime.rs:793-801).

  - name: connectors.endpoint.StopEventReceiver
    input:
      - name: event_receiver_ref
        type: connectors.endpoint.EventReceiverRef
    outcomes:
      - name: stopped
        moves: connectors.endpoint.EventReceiver.stop
        instance: event_receiver_ref
        emits: [connectors.endpoint.EventReceiverStopped]
        payload:
          connectors.endpoint.EventReceiverStopped:
            event_receiver_ref: input.event_receiver_ref
        summary: Shutdown was observed and the supervisor left its loop (crates/integration-slack/src/backend/connection_runtime.rs:732-746).

  # crates/protocol/src/endpoint.rs:46 (`EndpointRequest::ConnectSessionCreate`) and its
  # request shape at crates/protocol/src/endpoint.rs:96-102.
  - name: connectors.endpoint.CreateSetupSession
    naming:
      wire: connect_session_create
    input:
      - name: integration_ref
        type: connectors.endpoint.IntegrationRef
      - name: label
        type: connectors.endpoint.Label
      - name: auth_profile
        type: Optional<connectors.endpoint.AuthProfile>
    outcomes:
      - name: pending
        creates: connectors.endpoint.SetupSession
        instance: setup_session_ref
        emits: [connectors.endpoint.SetupSessionCreated]
        payload:
          connectors.endpoint.SetupSessionCreated:
            integration_ref: input.integration_ref
        summary: A single-purpose acquisition session is open (crates/service/src/connect_session.rs:308-322).
      - name: at-capacity
        external: the bounded pending set is already at `maximum_pending`
        error: connectors.endpoint.SetupSessionCapacity
        summary: The bounded pending set is full and nothing was created (crates/service/src/connect_session.rs:299-306).

  # `finish` at crates/service/src/connect_session.rs:358-384 applies terminal moves after
  # checking Pending and unresolved completion. `resolve_completion` (lines 190-221) delegates
  # to it after the custody decision; `fail_pending` (lines 388-399) selects the same fail state
  # only when no completion decision remains unresolved.
  # UNMAPPED: the command name is this document's. No `EndpointRequest` variant
  # (crates/protocol/src/endpoint.rs:35-48) finishes a session; the caller-visible surface is
  # `SetupSessionStatus` (line 47), which reads and does not move. Settled by the completion
  # endpoint's own contract, which docs/design/01-domain-model.md:95-96 says is called once.
  - name: connectors.endpoint.FinishSetupSession
    input:
      - name: setup_session_ref
        type: connectors.endpoint.SetupSessionRef
    outcomes:
      - name: completed
        moves: connectors.endpoint.SetupSession.complete
        instance: setup_session_ref
        emits: [connectors.endpoint.SetupSessionCompleted]
        payload:
          connectors.endpoint.SetupSessionCompleted:
            setup_session_ref: input.setup_session_ref
        summary: The vendor credential was acquired and the terminal event names the connection id, nothing else (docs/design/01-domain-model.md:98-99).
      - name: expired
        external: the session outlived its `expires_at_unix_ms`
        moves: connectors.endpoint.SetupSession.expire
        instance: setup_session_ref
        emits: [connectors.endpoint.SetupSessionExpired]
        payload:
          connectors.endpoint.SetupSessionExpired:
            setup_session_ref: input.setup_session_ref
        summary: The session expired without acquiring anything (crates/service/src/connect_session.rs:377).
      - name: failed
        external: the acquisition attempt failed, or the process shut down with the session still pending
        moves: connectors.endpoint.SetupSession.fail
        instance: setup_session_ref
        emits: [connectors.endpoint.SetupSessionFailed]
        payload:
          connectors.endpoint.SetupSessionFailed:
            setup_session_ref: input.setup_session_ref
        summary: The session failed (crates/service/src/connect_session.rs:378, 388-399).
      - name: not-pending
        wrong_state: true
        error: connectors.endpoint.SetupSessionNotPending
        summary: The session is already terminal and nothing moved (crates/service/src/connect_session.rs:367-368).

  # crates/protocol/src/endpoint.rs:38-39 (`EndpointRequest::CandidateActivate`) and its
  # request shape at crates/protocol/src/endpoint.rs:60-64.
  - name: connectors.endpoint.ActivateCandidate
    # Internal source activation; the predecessor candidate_activate RPC is retired.
    input:
      - name: candidate_ref
        type: connectors.endpoint.CandidateRef
      - name: label
        type: connectors.endpoint.Label
    outcomes:
      - name: activated
        moves: connectors.endpoint.EndpointCandidate.activate
        instance: candidate_ref
        emits: [connectors.endpoint.CandidateActivated]
        payload:
          connectors.endpoint.CandidateActivated:
            candidate_ref: input.candidate_ref
        summary: The candidate now has its direct Endpoint (crates/integration-kubernetes/src/local.rs:254-260).
      # crates/integration-kubernetes/src/local.rs:281-285: an unknown candidate_ref is
      # `connection_not_found`, which is `EndpointErrorCode::NotFound`
      # (crates/protocol/src/endpoint.rs:314).
      - name: not-found
        external: no candidate is stored under this reference
        error: connectors.endpoint.CandidateNotFound
        summary: No such candidate, so nothing was activated (crates/integration-kubernetes/src/local.rs:281-285).
      # UNMAPPED: there is deliberately no wrong-state branch here. Activating an
      # already-activated candidate is not refused: crates/integration-kubernetes/src/local.rs:289-299
      # returns the Endpoint the earlier activation produced, so the call is idempotent and
      # `Activated` is not a state this command refuses from. Declaring `wrong_state` would make a
      # consumer generate a test for a refusal the tree does not perform. Settled by that path
      # refusing, if idempotence is ever traded for a conflict.

  # crates/protocol/src/endpoint.rs:44-45 (`EndpointRequest::Materialize`) and its request
  # shape at crates/protocol/src/endpoint.rs:89-92.
  - name: connectors.endpoint.MaterializeObservation
    # Internal Grafana endpoint resolution; the predecessor materialize RPC is retired.
    input:
      - name: observation_ref
        type: connectors.endpoint.ObservationRef
    outcomes:
      - name: materialized
        moves: connectors.endpoint.DiscoveryObservation.materialize
        instance: observation_ref
        emits: [connectors.endpoint.ObservationMaterialized]
        payload:
          connectors.endpoint.ObservationMaterialized:
            observation_ref: input.observation_ref
        summary: The observation now has its mediated Endpoint (crates/integration-kubernetes/src/local.rs:658-668).
      # `fn materialize` (crates/integration-monitoring/src/backend.rs:1245) refuses in seven
      # places. This is the private Grafana normalization path behind endpoint resolution.
      # The public predecessor materialize request is rejected at both server transports.
      - name: not-found
        external: no observation is stored under this reference
        error: connectors.endpoint.ObservationNotFound
        summary: No such observation, so nothing was materialized (crates/integration-monitoring/src/backend.rs:1247-1251).
      - name: no-longer-current
        external: the observation was deactivated by a later refresh pass
        error: connectors.endpoint.ObservationNoLongerCurrent
        summary: The observation is no longer current, so nothing was materialized (crates/integration-monitoring/src/backend.rs:1253-1257).
      - name: not-granted
        external: the observed type has no target Provider contract, or that Provider has no independent Connector Grant
        error: connectors.endpoint.MaterializationNotGranted
        summary: Nothing admits a mediated Endpoint for this observation (crates/integration-monitoring/src/backend.rs:1276-1292).
      - name: unavailable
        external: durable inventory storage refused the new child projection
        error: connectors.endpoint.MaterializationUnavailable
        summary: The previous inventory is restored before refusal (crates/integration-monitoring/src/backend.rs:1314-1316).
      # UNMAPPED: existing-child validation returns without a lifecycle move. Missing child
      # state refuses at crates/integration-monitoring/src/backend.rs:1263, and changed discovery
      # evidence refuses at crates/integration-monitoring/src/backend.rs:1265. Neither is a
      # materialization transition; both remain explicit Rust validation obligations.
      # UNMAPPED: `wrong_state` is deliberately not declared, because it would claim a refusal in
      # every state `materialize` does not run from, and `Materialized` is not one: the branch
      # above returns the existing child. Settled by that path refusing, or by a construct that
      # says "refuses from this state" rather than "from every other".

  # One refresh pass over one observation. The pass
  # (crates/integration-monitoring/src/backend.rs:1546-1589) deactivates every observation of a
  # source and then re-activates the ones it sees again, so per observation it was seen
  # (line 1567) or it was not (line 1551) — and a re-seen one lands in one of two states,
  # because the branch that re-activates it leaves `endpoint_ref` as it found it and the
  # derivation at crates/integration-monitoring/src/backend.rs:1664-1667 reads that before it
  # reads `target_provider`.
  # UNMAPPED: the refresh has no `EndpointRequest` variant of its own —
  # crates/protocol/src/endpoint.rs:42-43 says the stored read is the protocol surface and that
  # "an active provider refresh remains an admitted operation", elsewhere. Settled by naming that
  # catalog Operation, which is `connectors.catalog.Operation` and not a command of this domain.
  - name: connectors.endpoint.RefreshObservation
    input:
      - name: observation_ref
        type: connectors.endpoint.ObservationRef
    outcomes:
      - name: reobserved
        moves: connectors.endpoint.DiscoveryObservation.reobserve
        instance: observation_ref
        emits: [connectors.endpoint.ObservationReobserved]
        payload:
          connectors.endpoint.ObservationReobserved:
            observation_ref: input.observation_ref
        summary: The refresh saw the resource again and it carries no connection, so it is Observed (crates/integration-monitoring/src/backend.rs:1562-1569, 1666-1667).
      - name: rematerialized
        external: the re-seen observation still carries the `endpoint_ref` a materialization set
        moves: connectors.endpoint.DiscoveryObservation.rematerialize
        instance: observation_ref
        emits: [connectors.endpoint.ObservationReobserved]
        payload:
          connectors.endpoint.ObservationReobserved:
            observation_ref: input.observation_ref
        summary: The refresh saw the resource again and its connection reference survived withdrawal, so it derives as Materialized (crates/integration-monitoring/src/backend.rs:1563-1570, 1664-1665).
      - name: withdrawn
        external: the refresh pass no longer sees the resource this observation was read from
        moves: connectors.endpoint.DiscoveryObservation.withdraw
        instance: observation_ref
        emits: [connectors.endpoint.ObservationWithdrawn]
        payload:
          connectors.endpoint.ObservationWithdrawn:
            observation_ref: input.observation_ref
        summary: The observation is no longer active (crates/integration-monitoring/src/backend.rs:1551, 1367).

errors:
  # Private inventory persistence refusal at crates/integration-monitoring/src/backend.rs:1314-1316.
  - name: connectors.endpoint.MaterializationUnavailable
    summary: Inventory persistence failed and the previous state was restored.

  # `ConnectSessionLifecycleError::Capacity`, crates/service/src/connect_session.rs:29-30.
  - name: connectors.endpoint.SetupSessionCapacity
    summary: Too many connect sessions are pending, so no new one was created.

  # `ConnectSessionLifecycleError::NotPending`, crates/service/src/connect_session.rs:35-36.
  - name: connectors.endpoint.SetupSessionNotPending
    summary: The connect session is no longer pending, so nothing moved.
    fields:
      - name: state
        type: connectors.endpoint.SetupSession.State

  # `connection_not_found`, which is `EndpointErrorCode::NotFound`
  # (crates/protocol/src/endpoint.rs:314), raised at
  # crates/integration-monitoring/src/backend.rs:1184-1188.
  - name: connectors.endpoint.ObservationNotFound
    summary: No discovery observation is stored under this reference, so nothing was materialized.

  # `EndpointErrorCode::NotGranted` (crates/protocol/src/endpoint.rs:315), raised at
  # crates/integration-monitoring/src/backend.rs:1213-1218 and :1223-1229. One error for both,
  # because the refusal never names the axis that refused
  # (docs/design/01-domain-model.md:299-300).
  - name: connectors.endpoint.MaterializationNotGranted
    summary: Nothing admits a mediated Endpoint for this observation.

  # `EndpointErrorCode::Conflict` with the message "discovery observation is no longer
  # current", crates/integration-monitoring/src/backend.rs:1189-1194.
  - name: connectors.endpoint.ObservationNoLongerCurrent
    summary: The discovery observation is no longer current, so nothing was materialized.

  # `connection_not_found`, which is `EndpointErrorCode::NotFound`
  # (crates/protocol/src/endpoint.rs:314), raised at
  # crates/integration-kubernetes/src/local.rs:281-285.
  - name: connectors.endpoint.CandidateNotFound
    summary: No candidate is stored under this reference, so nothing was activated.

