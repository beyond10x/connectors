name: Rust gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check required system tools
        run: for tool in gzip sha256sum sqlite3 jq; do command -v "$tool"; done
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version
          cargo fmt --version
          cargo clippy --version
      - name: Install the pinned ess release
        working-directory: ${{ runner.temp }}
        run: |
          version="$(jq -r .ess "$GITHUB_WORKSPACE/crates/connectors-spec/toolchain.json")"
          archive="ess-$version-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/beyond10x/ess/releases/download/$version"
          curl -fsSLO "$base/$archive"
          curl -fsSL -o ess-SHA256SUMS "$base/SHA256SUMS"
          grep " $archive\$" ess-SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          echo "$PWD/ess-$version-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Install the pinned aep release
        working-directory: ${{ runner.temp }}
        run: |
          version="$(jq -r .aep "$GITHUB_WORKSPACE/crates/connectors-build/aep-toolchain.json")"
          archive="aep-$version-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/beyond10x/aep/releases/download/$version"
          curl -fsSLO "$base/$archive"
          curl -fsSL -o aep-SHA256SUMS "$base/SHA256SUMS"
          grep " $archive\$" aep-SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          echo "$PWD/aep-$version-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Permit unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the repository gate
        run: cargo run --locked -p connectors-build -- gate
      - name: Run the ignored tests a built catalog provider suffices for
        run: cargo run --locked -p connectors-build -- ignored --required --only-prerequisite provider
      - name: Report disk use
        if: always()
        run: |
          df -h /
          du -sh target || true

  journeys:
    name: ignored CLI journeys
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      options: --privileged
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm base-devel git curl jq sqlite rustup cmake pkgconf openssl \
            dbus gcr gcr-4 dconf glib2 libcap-ng libgcrypt systemd-libs p11-kit
          for tool in gzip sha256sum sqlite3 jq /usr/bin/dbus-daemon; do command -v "$tool"; done
      - name: Install the qualified GNOME Keyring 50.0-1
        working-directory: ${{ runner.temp }}
        run: |
          archive="gnome-keyring-1%3A50.0-1-x86_64.pkg.tar.zst"
          curl -fsSLo gnome-keyring.pkg.tar.zst "https://archive.archlinux.org/packages/g/gnome-keyring/$archive"
          echo "96c5f9dfd143103781ba78be1ee28e3a756e454adeb8a1a097ac34f7f5faed08  gnome-keyring.pkg.tar.zst" | sha256sum -c -
          bsdtar -xOf gnome-keyring.pkg.tar.zst usr/bin/gnome-keyring-daemon > gnome-keyring-daemon
          install -m 0755 gnome-keyring-daemon /usr/bin/gnome-keyring-daemon
          echo "b9a71f6b4c4bfaf1759a99036b7b3ab6cf98b2b479c0c2a24f02f5f2ca53958b  /usr/bin/gnome-keyring-daemon" | sha256sum -c -
          gnome-keyring-daemon --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Permit unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Back the journeys directory with ext4
        run: |
          truncate -s 4G /journeys.img
          mkfs.ext4 -q /journeys.img
          install -d -m 700 /journeys
          mount -o loop /journeys.img /journeys
          chmod 700 /journeys
          kind="$(stat -f -c %t /journeys)"
          test "$kind" = ef53 || { echo "/journeys is filesystem type 0x$kind, not ext4"; exit 1; }
      - name: Run the ignored CLI journeys
        run: |
          install -d -m 700 /journeys
          cargo run --locked -p connectors-build -- ignored --required --only-prerequisite provider,cli,custody --tmpdir /journeys
      - name: Name each journey that did not pass
        if: always()
        run: |
          test -f .local/ignored-suites.json || exit 0
          jq -r '.result.outcomes[] | select(.selected and .status != "passed") | "\(.status)\t\(.name)\t\(.reasons | join("; "))"' .local/ignored-suites.json
          shown=0
          for log in .local/ignored-suites.logs/*.log; do
            [ -f "$log" ] || continue
            grep -q '^test result: ok. 1 passed' "$log" && continue
            echo "::group::$log"
            tail -n 60 "$log"
            echo "::endgroup::"
            shown=$((shown + 1))
            [ "$shown" -lt 5 ] || break
          done
      - name: Keep the journeys report and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ignored-journeys
          path: |
            .local/ignored-suites.json
            .local/ignored-suites.logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
