name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Check repository governance
        run: |
          python3 scripts/check-links.py
          python3 scripts/check-stories.py
      # Metadata fence tests run offline; prefetching makes their failure about the repository.
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --locked
          cargo fetch --manifest-path crates/driver-sip/Cargo.toml --locked
      - name: Build
        run: |
          cargo build --workspace --locked
          cargo build --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --locked
          cargo build --manifest-path crates/driver-sip/Cargo.toml --locked
      - name: Validate every JSON document and schema
        run: |
          cargo test --locked -p catalog-build --test main json_governance::
      - name: Test
        run: |
          cargo test --workspace --locked --no-fail-fast
          cargo test --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --locked
          cargo test --manifest-path crates/driver-sip/Cargo.toml --locked
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path crates/driver-sip/Cargo.toml --all-targets --locked -- -D warnings
      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --all --check
          cargo fmt --manifest-path crates/driver-sip/Cargo.toml --all --check
      - name: Verify catalog lock inputs and artifacts
        run: cargo run --locked --offline -p catalog-cli -- check
      - name: Rebuild canonical catalogue
        run: cargo run --locked -p catalog-cli -- build
      - name: Prove rebuild wrote nothing
        run: git diff --exit-code
      - name: Reject generated drift
        run: cargo run --locked -p catalog-cli -- diff

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install declared MSRV
        run: rustup toolchain install 1.88.0 --profile minimal
      # Tests invoke locked offline metadata, so the registry must be populated first.
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --locked
          cargo fetch --manifest-path crates/driver-sip/Cargo.toml --locked
      - name: Build on declared MSRV
        run: |
          cargo build --workspace --locked
          cargo build --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --locked
          cargo build --manifest-path crates/driver-sip/Cargo.toml --locked
      - name: Test on declared MSRV
        run: |
          cargo test --workspace --locked --no-fail-fast
          cargo test --manifest-path crates/rtvbp-voice-endpoint/Cargo.toml --locked
          cargo test --manifest-path crates/driver-sip/Cargo.toml --locked
