name: macOS host

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-host-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: host and CLI on macos-latest
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          rustc --version
      - name: Lint the host and the CLI
        shell: bash
        run: cargo clippy --locked -p connectors-host -p connectors --all-targets -- -D warnings
      # The CLI's help tests run the catalog provider built beside `connectors`
      # (apps/connectors/tests/vocabulary_text.rs); a package-scoped test
      # build does not build it.
      - name: Build the catalog provider
        shell: bash
        run: cargo build --locked -p connectors-catalog-provider
      - name: Test the host and the CLI
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked --no-fail-fast -p connectors-host -p connectors

  programs:
    name: provider programs on macos-latest
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROGRAMS: connectors-grafana connectors-prometheus connectors-loki connectors-kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          rustc --version
      - name: Install the pinned ess release
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          version="$(jq -r .ess "$GITHUB_WORKSPACE/crates/connectors-spec/toolchain.json")"
          archive="ess-$version-aarch64-apple-darwin.tar.gz"
          base="https://github.com/beyond10x/ess/releases/download/$version"
          curl -fsSLO "$base/$archive"
          curl -fsSL -o ess-SHA256SUMS "$base/SHA256SUMS"
          grep " $archive\$" ess-SHA256SUMS | shasum -a 256 -c -
          tar -xzf "$archive"
          echo "$PWD/ess-$version-aarch64-apple-darwin" >> "$GITHUB_PATH"
      - name: Lint the programs
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for program in $PROGRAMS; do packages+=(-p "$program"); done
          cargo clippy --locked "${packages[@]}" --all-targets -- -D warnings
      - name: Build the CLI and the catalog provider
        shell: bash
        run: cargo build --locked -p connectors -p connectors-catalog-provider
      - name: Each program names its version
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for program in $PROGRAMS; do packages+=(-p "$program"); done
          cargo build --locked "${packages[@]}"
          for program in $PROGRAMS; do "target/debug/${program}" --version; done
      # Each keychain step records the local time span of its run, so that the
      # step after a failure shows the unified log of exactly that span.
      - name: The Grafana CLI journey on the login keychain
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          export CONNECTORS_TEST_CLI="$GITHUB_WORKSPACE/target/debug/connectors"
          log="$RUNNER_TEMP/grafana-cli-journey.log"
          cargo test --locked -p connectors-grafana --test local_runtime --no-run
          date -v-1S '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/span-journey-start"
          cargo test --locked -p connectors-grafana --test local_runtime -- --exact \
            cli_journey::grafana_cli_connects_with_a_service_account_token_and_lists_datasources_with_the_login_keychain \
            --nocapture 2>&1 | tee "$log" || true
          date -v+1S '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/span-journey-end"
          grep -q 'test result: ok. 1 passed' "$log"
      - name: Login keychain writes from a launch copy, left on disk and removed after start
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/launch-copy.log"
          cargo test --locked -p connectors-custody --lib --no-run
          date -v-1S '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/span-launch-copy-start"
          cargo test --locked -p connectors-custody --lib -- --exact \
            tests::macos_login_keychain_writes_from_a_launch_copy_left_on_disk_and_removed_after_start \
            --include-ignored --nocapture 2>&1 | tee "$log" || true
          date -v+1S '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/span-launch-copy-end"
          grep -q 'test result: ok. 1 passed' "$log"
      - name: Test the programs
        if: ${{ !cancelled() && steps.versions.outcome == 'success' }}
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          export CONNECTORS_TEST_CLI="$GITHUB_WORKSPACE/target/debug/connectors"
          packages=()
          for program in $PROGRAMS; do packages+=(-p "$program"); done
          cargo test --locked --no-fail-fast "${packages[@]}" -- --skip \
            cli_journey::grafana_cli_connects_with_a_service_account_token_and_lists_datasources_with_the_login_keychain
      - name: Keychain state and unified log of the keychain steps after a failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          security list-keychains
          security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" < /dev/null 2>&1
          echo "show-keychain-info exit $?"
          for span in journey launch-copy; do
            [ -f "$RUNNER_TEMP/span-$span-start" ] || continue
            start="$(cat "$RUNNER_TEMP/span-$span-start")"
            end="$(cat "$RUNNER_TEMP/span-$span-end" 2>/dev/null || date '+%Y-%m-%d %H:%M:%S')"
            echo "::group::$span, $start to $end: processes named image (the owner and every launch copy), securityd, the custody lines and the launch copies"
            log show --style compact --info --debug --start "$start" --end "$end" \
              --predicate 'process == "image" OR process == "securityd" OR eventMessage BEGINSWITH "connectors custody:" OR eventMessage CONTAINS "connectors-image."' \
              | head -n 4000
            echo "::endgroup::"
            echo "custody lines of $span:"
            log show --style compact --start "$start" --end "$end" \
              --predicate 'eventMessage BEGINSWITH "connectors custody:"'
          done

  release-start:
    name: release-built providers start through the host on macos-latest
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISHED_VERSION: 0.65.0
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target "$TARGET"
          rustup default 1.98.1
          rustc --version
          sw_vers
      - name: Build the release CLI and catalog provider
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET" -p connectors -p connectors-catalog-provider
          echo "BUILT=$GITHUB_WORKSPACE/target/$TARGET/release" >> "$GITHUB_ENV"
      - name: Fetch the published release archive
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/published"
          mkdir -p "$work"
          archive="connectors-$PUBLISHED_VERSION-$TARGET.tar.gz"
          base="https://github.com/beyond10x/connectors/releases/download/v$PUBLISHED_VERSION"
          curl -fsSL -o "$work/$archive" "$base/$archive"
          curl -fsSL -o "$work/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$work" && grep " $archive\$" SHA256SUMS | shasum -a 256 -c -)
          tar -xzf "$work/$archive" -C "$work"
          cli="$(find "$work" -type f -name connectors -perm -u+x | head -n 1)"
          test -n "$cli"
          echo "PUBLISHED=$(dirname "$cli")" >> "$GITHUB_ENV"
      - name: Signatures and attributes
        shell: bash
        run: |
          for dir in "$PUBLISHED" "$BUILT"; do
            program="$dir/connectors-catalog-provider"
            codesign -dv "$program" 2>&1 | grep -E 'Identifier|Format|flags|Signature'
            codesign -v "$program" && echo "codesign -v ok: $program"
            xattr -l "$program"
          done
      - name: A copy started directly, made as cp and as the host makes it
        shell: bash
        run: |
          set +e
          status=0
          for dir in "$PUBLISHED" "$BUILT"; do
            for method in cp write; do
              for round in 1 2; do
                directory="$(mktemp -d /tmp/connectors-image.XXXXXXXX)"
                if [ "$method" = cp ]; then
                  cp "$dir/connectors-catalog-provider" "$directory/image"
                else
                  cat "$dir/connectors-catalog-provider" > "$directory/image"
                fi
                chmod 500 "$directory/image"
                "$directory/image" --version
                code=$?
                echo "copy-start $dir $method round $round exit $code"
                [ "$code" -eq 0 ] || status=1
                rm -rf "$directory"
              done
            done
          done
          exit "$status"
      - name: The host starts the catalog provider twice
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          status=0
          for dir in "$PUBLISHED" "$BUILT"; do
            root="$(mktemp -d "$RUNNER_TEMP/host-start.XXXXXXXX")"
            run() {
              env -i HOME="$root" PATH=/usr/bin:/bin "$dir/connectors" --output json \
                --config "$root/config/config.toml" --state-dir "$root/state" "$@" < /dev/null 2>&1
            }
            out="$(run setup init)"
            echo "host-init $dir exit $?: $out"
            for round in 1 2; do
              out="$(run connections connect gitlab/probe --profile gitlab.pat --endpoint https://gitlab.example.org)"
              code=$?
              echo "host-start $dir round $round exit $code: $out"
              printf '%s' "$out" | grep -Eq '"stage": *"protected_entry"' || status=1
            done
          done
          exit "$status"
      - name: Kernel and policy log of the starts
        if: ${{ always() }}
        shell: bash
        run: |
          log show --last 30m --style compact --predicate 'sender == "AppleMobileFileIntegrity" OR process == "amfid" OR process == "syspolicyd" OR eventMessage CONTAINS[c] "code signing" OR eventMessage CONTAINS[c] "connectors-image" OR eventMessage CONTAINS[c] "connectors-catalog-provider"' | tail -n 200
