name: macOS host

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-host-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: host and CLI on macos-latest
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          rustc --version
      - name: Lint the host and the CLI
        shell: bash
        run: cargo clippy --locked -p connectors-host -p connectors --all-targets -- -D warnings
      # The CLI's help tests run the catalog provider built beside `connectors`
      # (apps/connectors/tests/vocabulary_text.rs); a package-scoped test
      # build does not build it.
      - name: Build the catalog provider
        shell: bash
        run: cargo build --locked -p connectors-catalog-provider
      - name: Test the host and the CLI
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked --no-fail-fast -p connectors-host -p connectors
