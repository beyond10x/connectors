name: Windows host

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-host-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: host and CLI on windows-latest
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
          rustc --version
      - name: Build the workspace
        shell: bash
        run: cargo build --locked --workspace --all-targets
      - name: Lint the host and the CLI
        shell: bash
        run: cargo clippy --locked -p connectors-host -p connectors --all-targets -- -D warnings
      # The admission refuses a directory, or an ancestor, that another trustee
      # may write (filesystem/windows.rs, `trusted_ancestor`). Recorded so a
      # refusal of the build or temporary directory can be read from the log.
      - name: Show the access lists of the build and temporary directories
        shell: pwsh
        continue-on-error: true
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $drive = Split-Path -Qualifier $workspace
          foreach ($p in @("$drive\", (Split-Path (Split-Path $workspace)), (Split-Path $workspace), $workspace, "$workspace\target\debug\deps", $env:RUNNER_TEMP, $env:TMP)) { icacls $p }
          whoami /user /groups
      - name: Test the host and the CLI
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked --no-fail-fast -p connectors-host -p connectors
      - name: The MCP stdio server's launch contract and lease timers
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cargo test --locked -p connectors --test mcp_stdio_launch 2>&1 | tee "$RUNNER_TEMP/mcp-launch.log"
          grep -q 'test result: ok. 2 passed' "$RUNNER_TEMP/mcp-launch.log"
          cargo test --locked -p connectors-host --lib suspend_timer_tests 2>&1 | tee "$RUNNER_TEMP/mcp-timers.log"
          grep -q 'test result: ok. 4 passed' "$RUNNER_TEMP/mcp-timers.log"
          cargo test --locked -p connectors --bin connectors mcp:: 2>&1 | tee "$RUNNER_TEMP/mcp-unit.log"
          grep -Eq 'test result: ok. [1-9][0-9]* passed' "$RUNNER_TEMP/mcp-unit.log"
          cargo test --locked -p connectors --bin connectors mcp::console::threaded 2>&1 | tee "$RUNNER_TEMP/mcp-console.log"
          grep -q 'test result: ok. 3 passed' "$RUNNER_TEMP/mcp-console.log"
      - name: The MCP stdio server serves a session on the platform's own custody
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cargo test --locked -p connectors --test mcp_stdio_serves -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/mcp-serves.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/mcp-serves.log"
