name: Chrome OAuth loopback

on:
  pull_request:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome OAuth loopback tests on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Show the browser
        run: google-chrome-stable --version
      - name: Run the Chrome OAuth loopback tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked -p connectors-host --lib oauth_adversary_tests::chrome -- --ignored --test-threads=1
