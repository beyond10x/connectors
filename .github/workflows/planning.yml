name: Planning store

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: planning validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned aep release
        run: |
          version="$(jq -r .aep repository/crates/connectors-build/aep-toolchain.json)"
          archive="aep-$version-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/beyond10x/aep/releases/download/$version"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/SHA256SUMS"
          grep " $archive\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          echo "$PWD/aep-$version-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Validate the planning store
        working-directory: repository
        run: aep plan artifact validate
