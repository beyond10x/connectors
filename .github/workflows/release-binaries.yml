# Attaches pre-built `connectors`, `connectors-catalog-provider` and the Grafana, Prometheus, Loki
# and Kubernetes program binaries for Linux and macOS
# to the GitHub Release of every `v<version>` tag, with a SHA256SUMS file. No Windows binary is
# built. The build job's `BINARIES` is the one list of packaged binaries; every step builds,
# checks, signs and packages each of them, and the repository gate (`connectors-build
# release-binaries`) refuses a guide that runs an installed binary this list leaves out.
#
# The release page itself is created by the bot after the tag push (AGENTS.md, "Cutting a
# release", step 7). This workflow never creates or edits a release page or its notes: its
# publish job waits for the page of the tag to exist, then uploads the archives and SHA256SUMS,
# and refuses rather than replace an asset already on the page.
#
# The image job puts the two Linux archives' binaries into the multi-arch OCI image
# `ghcr.io/beyond10x/connectors:<version>` (deploy/images/connectors/Dockerfile), and refuses a
# version the registry already holds.
#
# A pull request that changes this file or the image runs provenance, the four builds and the
# image build against the workspace version and publishes nothing. A manual dispatch backfills an
# existing annotated tag.
#
# Every third-party action is pinned by commit; the publish and image jobs hold write authority.
name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (v<version>) to backfill
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release-binaries.yml
      - deploy/images/**

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  provenance:
    name: Verify provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
      - id: release
        name: Tag, workspace version, changelog and checkout agree
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "connectors") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$EVENT" = pull_request ]; then
            echo "Pull request run: no tag provenance; building workspace version $version, publishing nothing." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(git cat-file -t "refs/tags/${TAG}")" = tag
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG}^{commit}")"
            test "${TAG#v}" = "$version"
            grep -Eq "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.provenance.outputs.version }}
      # Each name is both a workspace package and the binary it builds.
      BINARIES: connectors connectors-catalog-provider connectors-grafana connectors-prometheus connectors-loki connectors-kubernetes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target "$TARGET"
          rustup default 1.98.1
          rustc --version
      - name: Build the release binaries
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for binary in $BINARIES; do packages+=(-p "$binary"); done
          cargo build --locked --release "${packages[@]}" --target "$TARGET"
      - name: Each binary names the version
        shell: bash
        run: |
          set -euo pipefail
          for binary in $BINARIES; do
            test "$("target/${TARGET}/release/${binary}" --version)" = "${binary} ${VERSION}"
          done

      - name: Signing secrets
        id: secrets
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$MACOS_SIGNING_CERT_P12_BASE64" ] && [ -n "$MACOS_SIGNING_CERT_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "Signing skipped: MACOS_SIGNING_CERT_P12_BASE64, MACOS_SIGNING_CERT_PASSWORD and APPLE_TEAM_ID are not all set on this repository." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "Notarization skipped: APPLE_API_KEY_P8, APPLE_API_ISSUER_ID and APPLE_API_KEY_ID are not all set on this repository." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sign with the Developer ID certificate
        if: ${{ runner.os == 'macOS' && steps.secrets.outputs.sign == 'true' }}
        shell: bash
        env:
          MACOS_SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v team="($APPLE_TEAM_ID)" 'index($0, team) {print $2; exit}')
          test -n "$identity"
          for binary in $BINARIES; do
            path="target/${TARGET}/release/${binary}"
            codesign --force --options runtime --timestamp --sign "$identity" "$path"
            codesign --verify --strict --verbose=2 "$path"
            codesign --display --verbose=2 "$path" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          done
          rm -f "$RUNNER_TEMP/signing.p12"
      - name: Notarize
        if: ${{ runner.os == 'macOS' && steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.notarize == 'true' }}
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
          mkdir "$RUNNER_TEMP/notarize"
          for binary in $BINARIES; do
            cp "target/${TARGET}/release/${binary}" "$RUNNER_TEMP/notarize/"
          done
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/connectors.zip"
          xcrun notarytool submit "$RUNNER_TEMP/connectors.zip" --key "$RUNNER_TEMP/api-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          rm -f "$RUNNER_TEMP/api-key.p8"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="connectors-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp README.md CHANGELOG.md "dist/${name}/"
          for binary in $BINARIES; do
            cp "target/${TARGET}/release/${binary}" "dist/${name}/"
          done
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -r "dist/${name}"
          test -s "dist/${name}.tar.gz"
          tar -tzf "dist/${name}.tar.gz" | tee "$RUNNER_TEMP/contents"
          for binary in $BINARIES; do
            grep -Fxq "${name}/${binary}" "$RUNNER_TEMP/contents"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload binaries to the release page
    if: ${{ github.event_name != 'pull_request' }}
    needs: [provenance, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.provenance.outputs.tag }}
      VERSION: ${{ needs.provenance.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the checksum manifest
        working-directory: dist
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -s "connectors-${VERSION}-${target}.tar.gz"
          done
          test "$(ls | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Wait for the release page of the tag
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
              echo "Release page for $TAG found after $attempt check(s)."
              exit 0
            fi
            sleep 30
          done
          echo "No release page for $TAG after 30 minutes; nothing uploaded. Create the page and re-run this job." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload the archives and SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          conflict=0
          for file in *.tar.gz SHA256SUMS; do
            if printf '%s\n' "$existing" | grep -Fxq "$file"; then
              echo "Asset $file is already on the release page of $TAG; refusing to replace it." | tee -a "$GITHUB_STEP_SUMMARY"
              conflict=1
            fi
          done
          test "$conflict" -eq 0
          gh release upload "$TAG" *.tar.gz SHA256SUMS
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: Build the container image, and push it on a release
    needs: [provenance, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/beyond10x/connectors
      PUSH: ${{ github.event_name != 'pull_request' }}
      TAG: ${{ needs.provenance.outputs.tag }}
      VERSION: ${{ needs.provenance.outputs.version }}
      COMMIT: ${{ needs.provenance.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.provenance.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-unknown-linux-gnu"
          path: dist
          merge-multiple: true
      - name: Stage the Linux binaries by architecture
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/image"
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"
            name="connectors-${VERSION}-${pair#*:}"
            tar -C "$RUNNER_TEMP" -xzf "dist/${name}.tar.gz"
            mkdir -p "$context/linux-$arch"
            find "$RUNNER_TEMP/$name" -maxdepth 1 -type f -perm -u+x -exec cp {} "$context/linux-$arch/" \;
            test -x "$context/linux-$arch/connectors"
            test -x "$context/linux-$arch/connectors-catalog-provider"
          done
          diff <(ls "$context/linux-amd64") <(ls "$context/linux-arm64")
          ls -l "$context"/linux-*
          echo "CONTEXT=$context" >> "$GITHUB_ENV"
      - name: Refuse a version the registry already holds
        if: ${{ env.PUSH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          answer=$(gh api --paginate /orgs/beyond10x/packages/container/connectors/versions \
            --jq '.[].metadata.container.tags[]' 2>&1) && status=0 || status=$?
          if [ "$status" -ne 0 ]; then
            case "$answer" in
              *"HTTP 404"*) echo "$IMAGE has no version yet"; exit 0 ;;
            esac
            echo "$answer"
            echo "::error::the registry did not say whether $IMAGE:$VERSION exists"
            exit 1
          fi
          if printf '%s\n' "$answer" | grep -Fqx "$VERSION"; then
            echo "::error::$IMAGE:$VERSION exists; a release never replaces a published image"
            exit 1
          fi
          echo "$IMAGE:$VERSION is not in the registry yet"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the linux/amd64 image for the start check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: deploy/images/connectors/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE_SHA=${{ env.COMMIT }}
          tags: connectors:candidate
          load: true
          push: false
      - name: Each binary in the image names the version, as the image user
        run: |
          set -euo pipefail
          test "$(docker image inspect connectors:candidate --format '{{.Config.User}}')" = 65532:65532
          test "$(docker run --rm connectors:candidate --version)" = "connectors-catalog-provider ${VERSION}"
          for path in "$CONTEXT"/linux-amd64/*; do
            binary="$(basename "$path")"
            test "$(docker run --rm --entrypoint "/usr/local/bin/${binary}" connectors:candidate --version)" = "${binary} ${VERSION}"
          done
      - name: Log in to ghcr.io
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build linux/amd64 and linux/arm64, and push on a release
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: deploy/images/connectors/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE_SHA=${{ env.COMMIT }}
          tags: ${{ env.PUSH == 'true' && format('{0}:{1}', env.IMAGE, env.VERSION) || 'connectors:candidate' }}
          push: ${{ env.PUSH == 'true' }}
      - name: The pushed image and its digest
        if: ${{ env.PUSH == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee "$RUNNER_TEMP/inspect" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(awk '/^Digest:/ {print $2; exit}' "$RUNNER_TEMP/inspect")" = "$DIGEST"
          grep -Fq 'Platform:  linux/amd64' "$RUNNER_TEMP/inspect"
          grep -Fq 'Platform:  linux/arm64' "$RUNNER_TEMP/inspect"
          echo "$IMAGE:$VERSION@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
