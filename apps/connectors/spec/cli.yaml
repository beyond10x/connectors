# Authored presentation over the shared CLI value model.
# Generated package is a contract fixture; production handlers remain separate.
format: ess-cli/1
binary: connectors
about: Local integration access through explicitly configured connector instances. After an upgrade, `connectors setup owner-stop` stops the owner an older binary started
globals: {config: config, state: state-dir, output: output}
callables:
  approval-policy-status:
    target: {kind: local, owner: connectors.cli, action: approval-policy-status}
    input: connectors.cli.ApprovalPolicyStatusInput
    result: connectors.cli.ApprovalPolicyResult
    errors: {failure: connectors.cli.Failure}
  approval-policy-set:
    target: {kind: local, owner: connectors.cli, action: approval-policy-set}
    input: connectors.cli.ApprovalPolicySetInput
    result: connectors.cli.ApprovalPolicyResult
    errors: {failure: connectors.cli.Failure}
  approval-prepare:
    target: {kind: local, owner: connectors.cli, action: approval-prepare}
    input: connectors.cli.ApprovalPrepareInput
    result: connectors.cli.ApprovalPrepareResult
    errors: {failure: connectors.cli.Failure}
  approval-issue:
    target: {kind: local, owner: connectors.cli, action: approval-issue}
    input: connectors.cli.ApprovalIssueInput
    result: connectors.cli.ApprovalIssueResult
    errors: {failure: connectors.cli.Failure}
  approval-clock-check:
    target: {kind: local, owner: connectors.cli, action: approval-clock-check}
    input: connectors.cli.ApprovalClockCheckInput
    result: connectors.cli.ApprovalClockCheckResult
    errors: {failure: connectors.cli.Failure}
  approval-keys-status:
    target: {kind: local, owner: connectors.cli, action: approval-keys-status}
    input: connectors.cli.ApprovalKeyStatusInput
    result: connectors.cli.ApprovalKeysResult
    errors: {failure: connectors.cli.Failure}
  approval-keys-init:
    target: {kind: local, owner: connectors.cli, action: approval-keys-init}
    input: connectors.cli.ApprovalKeyInitInput
    result: connectors.cli.ApprovalKeysResult
    errors: {failure: connectors.cli.Failure}
  approval-keys-rotate:
    target: {kind: local, owner: connectors.cli, action: approval-keys-rotate}
    input: connectors.cli.ApprovalKeyRotateInput
    result: connectors.cli.ApprovalKeysResult
    errors: {failure: connectors.cli.Failure}
  approval-keys-recover:
    target: {kind: local, owner: connectors.cli, action: approval-keys-recover}
    input: connectors.cli.ApprovalKeyRecoverInput
    result: connectors.cli.ApprovalKeysResult
    errors: {failure: connectors.cli.Failure}
  approval-keys-revoke:
    target: {kind: local, owner: connectors.cli, action: approval-keys-revoke}
    input: connectors.cli.ApprovalKeyRevokeInput
    result: connectors.cli.ApprovalKeysResult
    errors: {failure: connectors.cli.Failure}
  approval-keys-retire:
    target: {kind: local, owner: connectors.cli, action: approval-keys-retire}
    input: connectors.cli.ApprovalKeyRetireInput
    result: connectors.cli.ApprovalKeysResult
    errors: {failure: connectors.cli.Failure}
  setup-init:
    target: {kind: local, owner: connectors.cli, action: setup-init}
    input: null
    result: connectors.cli.SetupInitResult
    errors: {failure: connectors.cli.Failure}
  setup-check:
    target: {kind: local, owner: connectors.cli, action: setup-check}
    input: null
    result: connectors.cli.SetupCheckResult
    errors: {failure: connectors.cli.Failure}
  setup-checkpoints-enable:
    target: {kind: local, owner: connectors.cli, action: setup-checkpoints-enable}
    input: connectors.cli.SetupCheckpointsEnableInput
    result: connectors.cli.SetupCheckpointsEnableResult
    errors: {failure: connectors.cli.Failure}
  setup-owner-stop:
    target: {kind: local, owner: connectors.cli, action: setup-owner-stop}
    input: null
    result: connectors.cli.SetupOwnerStopResult
    errors: {failure: connectors.cli.Failure}
  setup-migrate:
    target: {kind: local, owner: connectors.cli, action: setup-migrate}
    input: connectors.cli.SetupMigrateInput
    result: connectors.cli.SetupMigrateResult
    errors: {failure: connectors.cli.Failure}
  connectors-list:
    target: {kind: local, owner: connectors.cli, action: connectors-list}
    input: null
    result: connectors.cli.ConnectorListResult
    errors: {failure: connectors.cli.Failure}
  definitions-install:
    target: {kind: local, owner: connectors.cli, action: definitions-install}
    input: connectors.cli.DefinitionsInstallInput
    result: connectors.cli.DefinitionsInstallResult
    errors: {failure: connectors.cli.Failure}
  adapters-list:
    target: {kind: local, owner: connectors.cli, action: adapters-list}
    input: connectors.cli.AdapterListInput
    result: connectors.cli.AdapterListResult
    errors: {failure: connectors.cli.Failure}
  adapters-describe:
    target: {kind: local, owner: connectors.cli, action: adapters-describe}
    input: connectors.cli.AdapterDescribeInput
    result: connectors.cli.AdapterDescribeResult
    errors: {failure: connectors.cli.Failure}
  adapters-status:
    target: {kind: local, owner: connectors.cli, action: adapters-status}
    input: connectors.cli.AdapterStatusInput
    result: connectors.cli.AdapterStatusResult
    errors: {failure: connectors.cli.Failure}
  adapters-stop:
    target: {kind: local, owner: connectors.cli, action: adapters-stop}
    input: connectors.cli.AdapterStopInput
    result: connectors.cli.AdapterStopResult
    errors: {failure: connectors.cli.Failure}
  connections-list:
    target: {kind: local, owner: connectors.cli, action: connections-list}
    input: connectors.cli.ConnectionListInput
    result: connectors.cli.ConnectionListResult
    errors: {failure: connectors.cli.Failure}
  connections-describe:
    target: {kind: local, owner: connectors.cli, action: connections-describe}
    input: connectors.cli.ConnectionDescribeInput
    result: connectors.cli.ConnectionDescribeResult
    errors: {failure: connectors.cli.Failure}
  connections-connect:
    target: {kind: local, owner: connectors.cli, action: connections-connect}
    input: connectors.cli.ConnectionConnectInput
    result: connectors.cli.ConnectionConnectResult
    errors: {failure: connectors.cli.Failure}
  connections-reconnect:
    target: {kind: local, owner: connectors.cli, action: connections-reconnect}
    input: connectors.cli.ConnectionReconnectInput
    result: connectors.cli.ConnectionReconnectResult
    errors: {failure: connectors.cli.Failure}
  connections-status:
    target: {kind: local, owner: connectors.cli, action: connections-status}
    input: connectors.cli.ConnectionStatusInput
    result: connectors.cli.ConnectionStatusResult
    errors: {failure: connectors.cli.Failure}
  connections-revalidate:
    target: {kind: local, owner: connectors.cli, action: connections-revalidate}
    input: connectors.cli.ConnectionRevalidateInput
    result: connectors.cli.ConnectionRevalidateResult
    errors: {failure: connectors.cli.Failure}
  connections-launch:
    target: {kind: local, owner: connectors.cli, action: connections-launch}
    input: connectors.cli.ConnectionLaunchInput
    result: connectors.cli.ConnectionLaunchResult
    errors: {failure: connectors.cli.Failure}
  connections-token:
    target: {kind: local, owner: connectors.cli, action: connections-token}
    input: connectors.cli.ConnectionTokenInput
    result: connectors.cli.ConnectionTokenResult
    errors: {failure: connectors.cli.Failure}
  connections-revoke:
    target: {kind: local, owner: connectors.cli, action: connections-revoke}
    input: connectors.cli.ConnectionRevokeInput
    result: connectors.cli.ConnectionRevokeResult
    errors: {failure: connectors.cli.Failure}
  operations-list:
    target: {kind: local, owner: connectors.cli, action: operations-list}
    input: connectors.cli.OperationListInput
    result: connectors.cli.OperationListResult
    errors: {failure: connectors.cli.Failure}
  operations-describe:
    target: {kind: local, owner: connectors.cli, action: operations-describe}
    input: connectors.cli.OperationDescribeInput
    result: connectors.cli.OperationDescribeResult
    errors: {failure: connectors.cli.Failure}
  invoke:
    target: {kind: dynamic, owner: connectors.cli, operation_field: operation, schema_field: schema, payload_field: input}
    input: connectors.cli.InvokeInput
    result: connectors.cli.InvokeResult
    errors: {failure: connectors.cli.Failure}
commands:
  - path: [approvals, policy-status]
    aliases: []
    callable: approval-policy-status
    about: Inspect retained local write policy without starting services
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
  - path: [approvals, policy-set]
    aliases: []
    callable: approval-policy-set
    about: Publish the exact permitted write-operation set under revision control
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      # ess-cli/1 document carriers require all three sources. The production
      # handler acquires this file-only input through its bounded document reader.
      - field: input_file
        source: {kind: option, long: input-file}
  - path: [approvals, prepare]
    aliases: []
    callable: approval-prepare
    about: Resolve the exact approval subject without provider or credential access
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: operation
        source: {kind: option, long: operation}
      - field: schema
        source: {kind: option, long: schema}
      - field: revision
        source: {kind: option, long: revision}
      - field: input
        source: {kind: document, inline: input-json, file: input-file, stdin: input-stdin}
  - path: [approvals, issue]
    aliases: []
    callable: approval-issue
    about: Approve the exact reconstructed subject and publish a new protected proof file
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: operation
        source: {kind: option, long: operation}
      - field: schema
        source: {kind: option, long: schema}
      - field: revision
        source: {kind: option, long: revision}
      - field: input
        source: {kind: document, inline: input-json, file: input-file, stdin: input-stdin}
      - field: approve_subject
        source: {kind: option, long: approve-subject}
      - field: proof_output
        source: {kind: option, long: proof-output}
  - path: [approvals, clock-check]
    aliases: []
    callable: approval-clock-check
    about: Check the configured authenticated clock without starting services
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
  - path: [approvals, key-status]
    aliases: []
    callable: approval-keys-status
    about: Observe public key metadata without starting services or reading secrets
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
  - path: [approvals, key-init]
    aliases: []
    callable: approval-keys-init
    about: Create a new approval-signing key in protected local custody
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
  - path: [approvals, key-rotate]
    aliases: []
    callable: approval-keys-rotate
    about: Publish a replacement for the exact current approval-signing key
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      - field: expected_key
        source: {kind: option, long: expected-key}
  - path: [approvals, key-recover]
    aliases: []
    callable: approval-keys-recover
    about: Confirm and publish an exact staged approval-signing key
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      - field: candidate
        source: {kind: option, long: candidate}
  - path: [approvals, key-revoke]
    aliases: []
    callable: approval-keys-revoke
    about: Revoke the current key and cancel its pending replacement
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      - field: expected_key
        source: {kind: option, long: expected-key}
  - path: [approvals, key-retire]
    aliases: []
    callable: approval-keys-retire
    about: Delete exact noncurrent signing material while retaining public history
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      - field: key
        source: {kind: option, long: key}
  - path: [setup, init]
    aliases: []
    callable: setup-init
    about: Create private local configuration without starting services
    arguments: []
  - path: [setup, check]
    aliases: []
    callable: setup-check
    about: Check local configuration and prerequisites without authentication
    arguments: []
  - path: [setup, checkpoints-enable]
    aliases: []
    callable: setup-checkpoints-enable
    about: Enable durable open checkpoints on the existing store; one-way, connectors 0.32.0 and earlier can no longer open it
    arguments:
      - field: confirm
        source: {kind: option, long: confirm}
  - path: [setup, owner-stop]
    aliases: []
    callable: setup-owner-stop
    about: Stop this state directory's running owner, of any build, within 30 seconds; run it after an upgrade when a command answers next_action stop_owner
    arguments: []
  - path: [setup, migrate]
    aliases: []
    callable: setup-migrate
    about: Rewrite each entry of the legacy configuration format that maps to a shipped connector as that connector's instance, keeping its instance id, revision and selection; --mode dry-run (or --dry-run) prints the new file, --mode apply (or --apply) writes it and keeps the old one as config.toml.before-migrate-TIMESTAMP (UTC)
    arguments:
      - field: mode
        source: {kind: option, long: mode}
  - path: [list]
    aliases: []
    callable: connectors-list
    about: List every connector this build ships, with its auth profiles and the instances the configuration names; needs no configuration and starts no process
    arguments: []
  - path: [definitions, install]
    aliases: []
    callable: definitions-install
    about: Fetch the connectors-definitions release TAG from SOURCE (an https repository URL or a local directory), check every file against its index.json, and record it in definitions.lock and a read-only cache; grants nothing and starts no process
    arguments:
      - field: source
        source: {kind: option, long: source}
      - field: tag
        source: {kind: option, long: tag}
  - path: [instances, list]
    aliases: [[adapters, list]]
    callable: adapters-list
    about: List configured instances; `adapters list` is its deprecated name
    arguments:
      - field: limit
        source: {kind: option, long: limit}
      - field: cursor
        source: {kind: option, long: cursor}
  - path: [instances, describe]
    aliases: [[adapters, describe]]
    callable: adapters-describe
    about: Inspect one configured instance and its cached descriptor; `adapters describe` is its deprecated name
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
  - path: [instances, status]
    aliases: [[adapters, status]]
    callable: adapters-status
    about: Observe the lifecycle owner of the process that serves one instance; `adapters status` is its deprecated name
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
  - path: [instances, stop]
    aliases: [[adapters, stop]]
    callable: adapters-stop
    about: Stop only the exact owned incarnation of the process that serves one instance; `adapters stop` is its deprecated name
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      - field: host_incarnation
        source: {kind: option, long: host-incarnation}
      - field: child_incarnation
        source: {kind: option, long: child-incarnation}
  - path: [connections, list]
    aliases: []
    callable: connections-list
    about: List safe connection metadata
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: limit
        source: {kind: option, long: limit}
      - field: cursor
        source: {kind: option, long: cursor}
  - path: [connections, describe]
    aliases: []
    callable: connections-describe
    about: Inspect safe metadata for one connection
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
  - path: [connections, connect]
    aliases: []
    callable: connections-connect
    about: Begin admitted local protected credential acquisition on <connector>/<instance>; --endpoint first writes that instance's endpoint into the configuration
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: profile
        source: {kind: option, long: profile}
      - field: device
        source: {kind: option, long: device}
      - field: credential_document
        source: {kind: protected, file: credential-file, stdin: credential-stdin, hidden_tty: credential-prompt}
      - field: target
        source: {kind: positional, index: 1}
      - field: endpoint
        source: {kind: option, long: endpoint}
  - path: [connections, reconnect]
    aliases: [[connections, repair]]
    callable: connections-reconnect
    about: Publish a new credential on the exact connection without changing its identity; `connections repair` is its deprecated name
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
      - field: device
        source: {kind: option, long: device}
      - field: credential_document
        source: {kind: protected, file: credential-file, stdin: credential-stdin, hidden_tty: credential-prompt}
  - path: [connections, status]
    aliases: []
    callable: connections-status
    about: Observe exactly one connection or acquisition
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: acquisition
        source: {kind: option, long: acquisition}
  - path: [connections, revalidate]
    aliases: []
    callable: connections-revalidate
    about: Revalidate the saved credential without re-entry
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
  - path: [connections, launch]
    aliases: []
    callable: connections-launch
    about: Run a pinned consumer with one connection's credential on descriptor 3
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: consumer
        source: {kind: option, long: consumer}
      - field: args
        source: {kind: option, long: args}
  - path: [connections, token]
    aliases: []
    callable: connections-token
    about: Issue a current access token of one OAuth2 connection, printed only with --reveal
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: reveal
        source: {kind: option, long: reveal}
  - path: [connections, revoke]
    aliases: []
    callable: connections-revoke
    about: Commit terminal local revocation under the current fence
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: expected_revision
        source: {kind: option, long: expected-revision}
  - path: [operations, list]
    aliases: []
    callable: operations-list
    about: List operations from selected cached metadata
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: family
        source: {kind: option, long: family}
      - field: limit
        source: {kind: option, long: limit}
      - field: cursor
        source: {kind: option, long: cursor}
  - path: [operations, describe]
    aliases: []
    callable: operations-describe
    about: Inspect an operation and its exact schema identity
    arguments:
      - field: adapter
        source: {kind: option, long: adapter}
      - field: connector
        source: {kind: option, long: connector}
      - field: instance
        source: {kind: option, long: instance}
      - field: connection
        source: {kind: option, long: connection}
      - field: operation
        source: {kind: option, long: operation}
  - path: [invoke]
    aliases: []
    callable: invoke
    about: Invoke one operation of a connector's instance; the instance, connection, schema and revision default to the only ones that fit
    arguments:
      - field: target
        source: {kind: positional, index: 1}
      - field: operation
        source: {kind: positional, index: 2}
      - field: connection
        source: {kind: option, long: connection}
      - field: schema
        source: {kind: option, long: schema}
      - field: revision
        source: {kind: option, long: revision}
      - field: input
        source: {kind: document, inline: input-json, file: input-file, stdin: input-stdin}
      - field: approval_file
        source: {kind: option, long: approval-file}
      - field: idempotency_key
        source: {kind: option, long: idempotency-key}
      - field: definition
        source: {kind: option, long: definition}
      - field: definitions_root
        source: {kind: option, long: definitions-root}
      - field: credential_file
        source: {kind: option, long: credential-file}
      - field: describe
        source: {kind: option, long: describe}
      - field: fields
        source: {kind: option, long: fields}
      - field: each
        source: {kind: option, long: each}
      - field: walk
        source: {kind: option, long: walk}
      - field: max_pages
        source: {kind: option, long: max-pages}
      - field: out
        source: {kind: option, long: out}
