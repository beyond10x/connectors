type: ess-scenario/1
domain: connectors.sessions
scenario: expired-decision-does-not-latch
summary: 'Independent review counterexample: recognized expiry leaves Ready, allowing
  a subsequent stale allow observation to renew.'
arrange:
- instance: session
  entity: connectors.sessions.Session
timeline:
- at: '2026-09-08T12:00:00Z'
  command: connectors.sessions.OfferSession
  input:
    binding:
      instance_ref: media-host
      connection_ref: trunk-a
      admitted_revision: revision-a
      authority_ref: authority-a
    profile: outbound
    placement: local
    streams:
    - audio
  outcome: offered
  events:
  - event: connectors.sessions.SessionOffered
  capture:
    instance: session
    event: connectors.sessions.SessionOffered
    field: session_id
- at: '2026-09-08T12:00:01Z'
  command: connectors.sessions.AcceptOffer
  input:
    session_id:
      $instance: session
  outcome: accepted
  events:
  - event: connectors.sessions.OfferAccepted
- at: '2026-09-08T12:00:02Z'
  command: connectors.sessions.EstablishReady
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-08T12:00:02Z'
      effective_expiry: '2026-09-08T12:00:04Z'
      sequence: 1
  outcome: ready
  events:
  - event: connectors.sessions.SessionReady
- at: '2026-09-08T12:00:04Z'
  command: connectors.sessions.PermitData
  input:
    session_id:
      $instance: session
    decision: expired
    direction: output
  outcome: authority-refused
  error:
    name: connectors.sessions.DataAuthorityRefused
    fields:
      decision: expired
  no_events:
  - connectors.sessions.DataPermitted
  - connectors.sessions.ClosingBegun
- at: '2026-09-08T12:00:05Z'
  command: connectors.sessions.RenewDataLease
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-08T12:00:05Z'
      effective_expiry: '2026-09-08T12:00:07Z'
      sequence: 2
  outcome: renewed
  events:
  - event: connectors.sessions.DataLeaseRenewed
assert:
- view: connectors.sessions.SessionStates
  contains:
    session_id:
      $instance: session
    state: Ready
