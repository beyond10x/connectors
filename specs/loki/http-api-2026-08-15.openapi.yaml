openapi: 3.1.0
info:
  title: Loki HTTP API curated query surface (B10x-authored)
  version: "2026-08-15"
  description: Repository-authored source specification for the exact read-only Loki operation B10x ships.
x-b10x-origin: repository-authored
x-b10x-coverage: exact shipped Loki range-query surface
servers:
  - url: https://loki.example
paths:
  /loki/api/v1/query_range:
    get:
      operationId: query_range
      summary: Query LogQL streams or metrics over a bounded caller-selected time range
      x-b10x-source-reference: https://grafana.com/docs/loki/latest/reference/loki-http-api/#query-logs-within-a-range-of-time
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 16384}
        - name: start
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: end
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 64}
        - name: limit
          in: query
          required: true
          schema: {type: integer, minimum: 1, maximum: 5000}
        - name: direction
          in: query
          required: true
          schema: {type: string, enum: [forward, backward]}
      responses:
        "200":
          description: Loki query response with streams or metric data and query statistics.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: {type: string}
                  data: {type: object}
                additionalProperties: true
