version = 1

# Grafana publishes complete Swagger/OpenAPI documents from each running instance rather than one
# stable, version-independent download that can represent every self-hosted deployment. This small
# repository-authored document therefore covers only the exact reviewed surface below. Each
# operation carries its official reference in the YAML.

[[spec]]
path = "specs/grafana/http-api-2026-08-14.openapi.yaml"
origin = "repository-authored"
authored_at = "2026-08-14"
reviewed_at = "2026-08-14"
sha256 = "14c46194403f8831e0e80562fedb28685a3d803f980d9da9a230b9f0e0d35c35"
coverage = "exact-shipped-surface"
purpose = "Authoritative source for the two Grafana 12+ dashboard reads and the two data-source reads shipped by providers/grafana.toml. The data-source query body is intentionally bounded to 20 read queries while preserving plugin-specific query fields."
references = [
  "https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/",
  "https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/authentication/",
  "https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/dashboard/",
  "https://grafana.com/docs/grafana/latest/developer-resources/api-reference/http-api/api-legacy/data_source/",
]
