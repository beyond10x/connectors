components:
  messages:
    planner_entity_created:
      name: planner_entity_created
      payload:
        additionalProperties: false
        properties:
          cursor:
            minLength: 1
            type: string
          data:
            $schema: https://json-schema.org/draft/2020-12/schema
            title: AnyValue
          id:
            type: string
          key:
            const: entity.created
          module:
            const: planner
          occurred_at:
            format: date-time
            type: string
          protocol:
            const: b10x.module-event.v1
          schema_version:
            const: 1
        required:
        - protocol
        - id
        - module
        - key
        - schema_version
        - occurred_at
        - cursor
        - data
