# Target Provider contract for Loki semantics. A mediated Connection may route every call through
# Grafana; this declaration does not imply direct backend reachability or credentials.
id = "loki"
vendor = "Grafana Loki"
authority = "com.grafana.loki.api"
base_url = "{origin}"
description = "Query Loki logs with bounded native LogQL range semantics, directly or through a mediated Connection"
verify = "loki-query-range"

[spec]
path = "specs/loki/http-api-2026-08-15.openapi.yaml"
upstream_version = "Loki HTTP API"
fetched_at = "2026-08-15T00:00:00Z"
sha256 = "77e769512509c9b6d8d21c08a6d576bbafbde0e4cbfde8da33abc196bfc49ee7"

[[services]]
name = "default"
tags = ["observability", "infrastructure"]
audiences = ["sre", "developer", "security-engineer"]

[[patch.operations]]
select = "query_range"
rename = "loki-query-range"
direction = "read"
risk = "low"
idempotency = "idempotent"
effects = ["read", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["private_network"]

[[config]]
name = "origin"
service = "default"
label = "Loki origin"
help = "Required only for a direct Connection. A Grafana-mediated Connection resolves no direct origin"
format = "origin"
required = true
approval = "operator"
docs_url = "https://grafana.com/docs/loki/latest/reference/loki-http-api/"
binds = "endpoint.origin"
