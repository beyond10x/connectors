# Slack Web API, Admin API and Events API.
#
# `scripts/vendor-slack-spec.py` pins Slack's live hosted Swagger 2 document, scrubs it, and derives
# the two exact OpenAPI 3 projections below. The complete source remains vendored for drift review;
# only the eight operations named here enter the catalog, and every one explicitly states whether
# it is projected to an agent. Slack currently publishes no maintained Events AsyncAPI document, so
# the third source is a repository-authored exact two-message AsyncAPI projection grounded in the
# current official event references. Its origin is recorded in `specs/slack.provenance.toml`.

id = "slack"
vendor = "Slack"
authority = "com.slack.api"
api_version = "v1"
base_url = "https://slack.com"
description = "Slack messaging as the installed Zwirn bot or as a consenting user, inbound events, and a curated read-only Enterprise Admin surface"
default_auth = [{ credentials = ["slack.bot_token"] }]
verify = "slack-users-info"

[[services]]
name = "default"
legacy = true
tags = ["messaging"]
audiences = ["developer", "support-agent", "project-manager", "sales-rep"]

[[services]]
name = "admin"
description = "Curated read-only Enterprise organization administration"
tags = ["identity", "messaging"]
audiences = ["sre", "security-engineer"]

[[services]]
name = "login"
description = "Slack OAuth v2 authorization and token endpoints. The host uses this service only while creating or refreshing a Connection"
base_url = "https://slack.com"

[[spec]]
service = "default"
path = "specs/slack/web-api-selected-1.7.0-2026-08-15.openapi.json"
source_url = "https://api.slack.com/specs/openapi/v2/slack_web.json"
upstream_version = "1.7.0"
fetched_at = "2026-08-15T00:00:00Z"
sha256 = "951705a5eee2911ff60ccc3a7a613fb7c96dbcfe554463829d288bb8951cafba"

[[spec]]
service = "admin"
path = "specs/slack/admin-api-selected-1.7.0-2026-08-15.openapi.json"
source_url = "https://api.slack.com/specs/openapi/v2/slack_web.json"
upstream_version = "1.7.0"
fetched_at = "2026-08-15T00:00:00Z"
sha256 = "cdf527e2ee12c99869faf00748d8f3ae044f8e137783bdfefd1c9e0f11ffda1b"

[[spec]]
kind = "asyncapi"
service = "default"
path = "specs/slack/events-selected-2026-08-15.asyncapi.yaml"
upstream_version = "2026-08-15"
fetched_at = "2026-08-15T00:00:00Z"
sha256 = "9a967daeabf79901ce5df35244d8e25647b0b8a1026372b001b61d2ea5c49052"

# Credential purposes are deliberately not interchangeable. An `xapp` app token opens Socket
# Mode; it cannot call messaging methods. An admin token is a user-subject OAuth token obtained by
# an Enterprise Org Admin/Owner through an org-wide installation; the dedicated purpose and
# `admin.*` scope requirements prevent an ordinary delegated user token from substituting for it.

[[auth]]
name = "slack.bot_token"
scheme = "bearer"
subject = "app"
description = "Workspace bot token for either the deployment-owned organization app or one principal-owned companion app. Calls are attributed to that exact bot"

[auth.oauth2]
endpoint = "login"
authorize_path = "/oauth/v2/authorize"
token_path = "/api/oauth.v2.access"
scopes = ["app_mentions:read", "channels:history", "chat:write", "reactions:write", "users:read"]
scope_separator = "comma"
grants = ["authorization_code", "refresh_token"]

[[auth]]
name = "slack.user_token"
scheme = "bearer"
subject = "user"
description = "Delegated OAuth token for the consenting Slack member. Zwirn may invoke an admitted operation through this principal-owned Connection, and Slack attributes it to that user"

# Slack's user-centric OAuth flow is intentionally separate from app installation. It returns the
# user access token at the standard top-level `access_token`, so one Connection receives exactly one
# credential and there is no hidden bot-token side effect to assign to a different owner.
[auth.oauth2]
endpoint = "login"
authorize_path = "/oauth/v2_user/authorize"
token_path = "/api/oauth.v2.user.access"
scopes = ["channels:read", "channels:history", "groups:read", "groups:history", "im:read", "im:history", "mpim:read", "mpim:history", "users:read", "users:read.email", "chat:write", "reactions:write"]
scope_separator = "comma"
scope_response_pointer = "/authed_user/scope"
grants = ["authorization_code", "refresh_token"]

[[auth]]
name = "slack.admin_token"
scheme = "bearer"
entry = "connect_session"
subject = "user"
description = "Enterprise organization user OAuth token obtained through an org-wide Admin/Owner installation with reviewed admin scopes"

[[auth]]
name = "slack.app_token"
scheme = "bearer"
entry = "connect_session"
subject = "app"
description = "Slack app-level token used only to open Socket Mode with connections:write"

[[auth]]
name = "slack.signing_secret"
scheme = "signing"
entry = "connect_session"
subject = "app"
description = "Slack app signing secret used only to verify inbound Events API requests"

# Agent curation: exactly four ordinary Web API operations. The live document contains 170 paths;
# source presence grants nothing. Scope claims are reviewed overlays rather than copied blindly from
# Swagger because parts of Slack's Swagger scope vocabulary retain legacy spellings.

[[patch.operations]]
service = "default"
select = "chat_postMessage"
rename = "slack-chat-post-message"
description = "Post a text message to a Slack channel. Slack can return HTTP 200 with `ok: false`; inspect `ok` before treating the message as sent"
direction = "write"
risk = "high"
idempotency = "non_idempotent"
effects = ["write", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
expose = true
auth = [
  { credentials = ["slack.bot_token"], scopes = { "slack.bot_token" = [["chat:write"]] } },
  { credentials = ["slack.user_token"], scopes = { "slack.user_token" = [["chat:write"]] } },
]
omit.body = ["as_user", "attachments", "blocks", "icon_emoji", "icon_url", "link_names", "mrkdwn", "parse", "reply_broadcast", "unfurl_links", "unfurl_media", "username"]
error_envelope = { message_pointer = "/error" }

[[patch.operations.params]]
name = "text"
position = "body"
required = true
description = "Message text in Slack mrkdwn syntax"
schema = { type = "string", minLength = 1 }

[[patch.operations.params]]
name = "channel"
position = "body"
required = true
description = "Channel id to post to"
schema = { type = "string", minLength = 1 }

[[patch.operations]]
service = "default"
select = "conversations_history"
rename = "slack-conversations-history"
description = "Read a bounded page of recent public-channel messages, newest first. Inspect `ok` because Slack reports API failures inside HTTP 200 responses"
direction = "read"
risk = "low"
idempotency = "idempotent"
effects = ["read", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
expose = true
auth = [
  { credentials = ["slack.bot_token"], scopes = { "slack.bot_token" = [["channels:history"]] } },
  { credentials = ["slack.user_token"], scopes = { "slack.user_token" = [["channels:history"]] } },
]
omit.query = ["inclusive"]
pagination = { cursor = { cursor_param = "cursor", next_cursor_pointer = "/response_metadata/next_cursor", max_pages = 10 } }
error_envelope = { message_pointer = "/error" }

[[patch.operations.params]]
name = "channel"
position = "query"
required = true
schema = { type = "string", minLength = 1 }

[[patch.operations.params]]
name = "latest"
position = "query"
schema = { type = "string" }

[[patch.operations.params]]
name = "oldest"
position = "query"
schema = { type = "string" }

[[patch.operations.params]]
name = "limit"
position = "query"
schema = { type = "integer", minimum = 1, maximum = 999, default = 100 }

[[patch.operations]]
service = "default"
select = "users_info"
rename = "slack-users-info"
description = "Look up one Slack user by id. Profile email is available only when the token separately carries users:read.email"
direction = "read"
risk = "low"
idempotency = "idempotent"
effects = ["read", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
expose = true
auth = [
  { credentials = ["slack.bot_token"], scopes = { "slack.bot_token" = [["users:read"]] } },
  { credentials = ["slack.user_token"], scopes = { "slack.user_token" = [["users:read"]] } },
]
error_envelope = { message_pointer = "/error" }

[[patch.operations]]
service = "default"
select = "reactions_add"
rename = "slack-reactions-add"
description = "Add an emoji reaction to a message, visible to channel members. Inspect `ok` because Slack reports API failures inside HTTP 200 responses"
direction = "write"
risk = "medium"
idempotency = "non_idempotent"
effects = ["write", "network"]
interaction_shape = "unary"
protocol_driver = "http_v1"
placement_requirement = "connectors_deployment"
implementation_form = "built_in"
required_capabilities = ["public_network"]
expose = true
auth = [
  { credentials = ["slack.bot_token"], scopes = { "slack.bot_token" = [["reactions:write"]] } },
  { credentials = ["slack.user_token"], scopes = { "slack.user_token" = [["reactions:write"]] } },
]
error_envelope = { message_pointer = "/error" }

