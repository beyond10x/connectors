# Events are selected from the authored AsyncAPI source, not restated inline. The stable local name
# `message.channels` distinguishes the public-channel subscription from Slack's coarse wire value
# `message`; `when.channel_type` completes that narrowing.

[[patch.events]]
service = "default"
select = "app_mention"
group = "Messages"
auth = [{ credentials = ["slack.bot_token"], scopes = { "slack.bot_token" = [["app_mentions:read"]] } }]

[[patch.events]]
service = "default"
select = "message_channels"
rename = "message.channels"
wire_value = "message"
description = "A human message was posted in a public channel the app is a member of; bot and subtype messages are loop-guarded by the channel runtime"
default = false
group = "Messages"
when = { channel_type = { const = "channel" } }
auth = [{ credentials = ["slack.bot_token"], scopes = { "slack.bot_token" = [["channels:history"]] } }]

[[channels]]
name = "socket"
service = "default"
transport = "socket"
description = "Socket Mode: an outbound, app-token-authenticated WebSocket carries Events API envelopes without a public callback URL"
auth = [{ credentials = ["slack.app_token"], scopes = { "slack.app_token" = [["connections:write"]] } }]
events = ["app_mention", "message.channels"]
discriminator = { source = "body", name = "event.type" }
delivery_id = { source = "body", name = "event_id" }

[channels.payload]
text = "event.text"
user = "event.user"
channel = "event.channel"
thread = "event.thread_ts"
conversation = "event.thread_ts"

[channels.reply]
operation = "slack-chat-post-message"
result = "text"

[channels.reply.bind]
channel = "channel"
thread_ts = "thread"

[channels.setup]
docs_url = "https://docs.slack.dev/apis/events-api/using-socket-mode/"
steps = [
  "Create or open the Slack app for this installation",
  "Enable Socket Mode and create an app-level token with connections:write",
  "Add app_mentions:read and, when selected, channels:history to Bot Token Scopes",
  "Subscribe to app_mention and, when selected, message.channels",
  "Install or reinstall the app, then add it to every channel it should observe",
  "Choose Add Slack and enter each requested credential in the protected prompt",
]

[[channels]]
name = "events-api"
service = "default"
transport = "webhook"
description = "Events API webhook: Slack posts signed event_callback envelopes to the Connector-owned callback"
events = ["app_mention", "message.channels"]
discriminator = { source = "body", name = "event.type" }
delivery_id = { source = "body", name = "event_id" }

[channels.verification.hmac]
algorithm = "sha256"
encoding = "hex"
header = "X-Slack-Signature"
prefix = "v0="
signed = "v0:{timestamp}:{body}"
timestamp = { source = "header", name = "X-Slack-Request-Timestamp" }
secret = "slack.signing_secret"
tolerance = "5m"

[channels.payload]
text = "event.text"
user = "event.user"
channel = "event.channel"
thread = "event.thread_ts"
conversation = "event.thread_ts"

[channels.reply]
operation = "slack-chat-post-message"
result = "text"

[channels.reply.bind]
channel = "channel"
thread_ts = "thread"

[channels.setup]
docs_url = "https://docs.slack.dev/apis/events-api/"
steps = [
  "Enable Event Subscriptions for the Slack app",
  "Paste the Connector-owned Request URL and complete Slack's URL verification",
  "Subscribe to the selected bot events and grant their Bot Token Scopes",
  "Enter the signing secret in the protected completion flow",
  "Install or reinstall the app so subscription and scope changes take effect",
]

# One Slack app registration backs both OAuth Connection choices. These are operator-level slots:
# the end user sees Slack's consent screen but never sees or supplies the product's client secret.

[[config]]
name = "oauth_client_id"
service = "default"
label = "Slack application client id"
help = "The client id of the Slack app users install or authorize. Supplied once by the deployment operator, not by an end user"
format = "text"
required = false
docs_url = "https://docs.slack.dev/authentication/installing-with-oauth/"
binds = "oauth.client_id"

[[config]]
name = "oauth_redirect_uri"
service = "default"
label = "Slack OAuth redirect URI"
help = "The exact callback URI served by this deployment and registered under the Slack app's OAuth & Permissions settings"
example = "https://connectors.example/api/oauth/callback"
format = "url"
required = false
docs_url = "https://docs.slack.dev/authentication/installing-with-oauth/"
binds = "oauth.redirect_uri"

[[config]]
name = "oauth_client_secret"
service = "default"
label = "Slack application client secret"
help = "The Slack app's client secret. Supplied once by the deployment operator and never exposed to the person authorizing a Connection"
format = "token"
secret = true
required = false
docs_url = "https://docs.slack.dev/authentication/installing-with-oauth/"
binds = "oauth.client_secret"
