# B10x-owned native Connector capabilities.
#
# Unlike a vendor API Provider, this Provider describes operations implemented by Connectors
# itself. `sip-dial` terminates native SIP through the closed built-in driver; an Asterisk,
# carrier, SBC, or other PBX is only a Connection-owned peer selected behind the opaque target
# alias. The caller never selects the peer implementation, SIP URI, host, port, credentials, or
# network aperture.

id = "b10x"
vendor = "B10x"

# This is the permanent public Provider authority. `io.b10x` was already the identity
# projected by Zwirn for B10x-owned Connector capabilities; publishing a second spelling
# would create two credential/address namespaces for one owner. It must never be repointed.
authority = "io.b10x"

# The current catalog IR requires a non-empty provider base URL even when every operation uses a
# native request form. `sip_v1` lowering emits no endpoint and never reads this origin at runtime;
# this is the stable B10x origin, not a SIP peer or an HTTP execution target.
base_url = "https://b10x.io"
description = "B10x-owned Connector capabilities implemented by closed built-in protocol drivers"

[[services]]
name = "default"
tags = ["telephony"]
# Published before named services existed; it keeps its elided address so the native driver members
# above retain their identifiers while named siblings are added.
legacy = true

# B10x's Ontology module. Its durable owner identity remains `b10x/ontology` while the
# source now lives in the `b10x/modules` collection. The Connection resolves the deployment;
# no origin or persistence adapter crosses this boundary.
[[services]]
name = "knowledge"
tags = ["knowledge-base"]
description = "Ontology branches, claims, schemas, proposals, packs, snapshots, and explanations"

# Work's durable owner identity remains `b10x/work` while its implementation lives beside
# Ontology in `b10x/modules`. The deployment resolves the private module origin; no HTTP
# destination, performer identity, Agent core, or storage adapter is selectable by the caller.
[[services]]
name = "tasks"
tags = ["project-management"]
description = "Requests, tasks, optimistic status updates, and ordered Work events"

# Planner owns durable product and engineering plans. Repository Markdown is a projection of this
# database-backed owner, and callers never select a database, filesystem path, or private origin.
[[services]]
name = "planning"
tags = ["project-management"]
description = "Projects, typed planning entities, searchable boards, lifecycle gates, repository synchronization, and ordered planning events"

[[services]]
name = "workspaces"
tags = ["developer-tools"]
description = "Logical workspaces, Substrate-backed checkouts, digest-bound files, and bounded execution"

[[services]]
name = "collaboration"
tags = ["messaging"]
description = "Product-neutral conversation rooms and their current workspace attachments"

