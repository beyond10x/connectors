domain: connectors_kubernetes.mutations
summary: Kubernetes-owned conditional Deployment restart preparation values.

# Normative owner: adapters/kubernetes/contracts/mutations/v1alpha1/semantics.md, deployment.rollout_restart.
types:
  - name: connectors_kubernetes.mutations.DeploymentRestartTarget
    kind: struct
    fields:
      - {name: instance_ref, type: String}
      - {name: connection_ref, type: String}
      - {name: namespace, type: String}
      - {name: name, type: String}
      - {name: uid, type: String}
      - {name: resource_version, type: String}
    # The selected built-in Deployment conditional binding requires canonical
    # positive ASCII decimal resource_version in 1..18446744073709551615: at most 20
    # digits and no leading zero, which also rejects zero.
    invariants:
      - resource_version.count: {gte: 1, lte: 20}
      - not: {resource_version: {starts_with: "0"}}
    # DEFERRED: the digits-only rule is expressible in ESS 0.36 (a String type with alphabet "0123456789") but
    # synthesis refuses a type invariant no view holds (ESS-SYNTH-013); story:identity-views-for-witnessing owns it. ESS-LIMIT: the 18446744073709551615 overflow bound and alias rejection need a numeric-text predicate, which ESS 0.36
    # does not have. Reject before key inspection or dispatch and copy accepted bytes
    # unchanged. This provider-specific predicate must not be generalized to other
    # Kubernetes API bindings.
  - name: connectors_kubernetes.mutations.PreparedDeploymentRestart
    kind: struct
    fields:
      - {name: target, type: connectors_kubernetes.mutations.DeploymentRestartTarget}
      - {name: restart_marker, type: String}
    # Private candidate preparation. Marker is a once-generated host epoch-ms
    # decimal annotation, not caller input, provider UID, authority or host key.
    # ESS-LIMIT: trusted source qualification, exact provider preconditions,
    # marker generation/fixity, immutable body associated with the winning attempt,
    # validated patch-accepted proof, no-effect evidence and F02 replay admission.
    # ESS 0.36 has no evidence-provenance, trusted-time, byte-fixity or cross-record
    # construct.
    # No provider-resource entity, lifecycle or persistent ownership is introduced.
