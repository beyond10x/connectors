domain: connectors_kubernetes.exec_credentials
summary: Kubernetes-owned exec credential plugin binding, its kubeconfig selection, the credential lifetime it observes and the refusals of one plugin run.

# Normative owner: adapters/kubernetes/contracts/reads/v1alpha1/semantics.md,
# "Exec-plugin credentials", under decision-blocker:kubernetes-exec-credential-plugin
# (option b, decided 2026-10-15) inside the bounded pinned-binary process family of
# decision-blocker:helm-execution-family. A plugin is an operator-installed executable
# this adapter runs and never owns; an ExecCredential is its one-shot answer, held in
# memory only. Nothing here is an entity with a lifecycle this system advances.
types:
  - name: connectors_kubernetes.exec_credentials.ExecPluginAdmission
    kind: enum
    variants: [off, pinned]
    # Whether the local binding offers the kubernetes.exec_plugin profile. off is the
    # default and the only value a configuration that does not name exec_plugin has:
    # no plugin runs, the profile is not offered and validating it is unsupported.
    # pinned is set only by an exec_plugin binding (ExecPluginBinding) in the local
    # native configuration, together with the kubeconfig it reads; the federated
    # service configuration cannot set it. There is no value that runs whatever the
    # kubeconfig names (option c of the decision is refused).
  - name: connectors_kubernetes.exec_credentials.ExecPluginBinding
    kind: struct
    fields:
      - {name: path, type: String}
      - {name: sha256, type: String}
      - {name: user, type: String}
      - {name: env, type: "List<String>"}
      - {name: home, type: "Optional<String>"}
      - {name: timeout_ms, type: Integer}
    invariants:
      - path.count: {gte: 2, lte: 4096}
      - sha256.count: {gte: 64, lte: 64}
      - user.count: {gte: 1, lte: 256}
      - env.count: {lte: 32}
      - any:
          - missing(home)
          - home.count: {gte: 2, lte: 4096}
      - timeout_ms: {gte: 1, lte: 60000}
    # The per-connection pin. path is the absolute path of the plugin executable and
    # sha256 the lowercase hex digest of its bytes; both are verified before every run,
    # and a mismatch refuses (digest_mismatch) before any process starts. path is
    # resolved once per run: the file is opened without following a final symbolic
    # link, checked and hashed through that open descriptor, and that same descriptor
    # is executed, so the bytes that run are the bytes of the inode that was hashed and
    # a file swapped in at path between check and start is never run. user names
    # the kubeconfig users entry whose exec block supplies the arguments
    # (ExecPluginSelection). env is the allow-list of environment variable names the
    # plugin may receive, each [A-Za-z_][A-Za-z0-9_]*, distinct, and neither HOME nor
    # KUBERNETES_EXEC_INFO. home, when present, is the absolute directory the plugin
    # receives as HOME and as its working directory, which is how it finds files such
    # as the AWS profile files; absent, the plugin has no HOME and runs in /.
    # timeout_ms bounds one run (10000 when omitted). The whole binding enters the
    # effective configuration as one digest, so changing any part of it changes the
    # configuration revision the host admitted.
  - name: connectors_kubernetes.exec_credentials.ExecPluginSelection
    kind: struct
    fields:
      - {name: api_version, type: connectors_kubernetes.exec_credentials.ExecCredentialApiVersion}
      - {name: command, type: String}
      - {name: args, type: "List<String>"}
      - {name: env_names, type: "List<String>"}
    invariants:
      - command.count: {gte: 1, lte: 4096}
      - args.count: {lte: 64}
      - env_names.count: {lte: 32}
    # What the configured kubeconfig's users[user].user.exec says, read when the plugin
    # runs, as data. command must equal the binding's path, or be a bare file name equal
    # to the path's file name: the kubeconfig cannot select another executable. args are
    # passed as the argument vector, never through a shell. env_names are the names of
    # the exec block's env entries; each must be on the binding's allow-list, and a name
    # outside it refuses (kubeconfig_mismatch) rather than being silently dropped.
    # interactiveMode Always refuses, since the plugin runs with no terminal and stdin
    # closed. provideClusterInfo is not honoured: KUBERNETES_EXEC_INFO carries the
    # apiVersion, kind and spec.interactive false only.
  - name: connectors_kubernetes.exec_credentials.ExecCredentialApiVersion
    kind: enum
    variants: [client_authentication_v1, client_authentication_v1beta1]
    # client.authentication.k8s.io/v1 and client.authentication.k8s.io/v1beta1, the
    # two ExecCredential versions the kubeconfig may request. The plugin's answer must
    # carry the version the kubeconfig requested.
  - name: connectors_kubernetes.exec_credentials.ExecCredentialLifetime
    kind: struct
    fields:
      - {name: expires_at_ms, type: "Optional<Integer>"}
    # The one fact of an accepted ExecCredential that outlives the run besides the
    # token itself: status.expirationTimestamp (RFC 3339) as Unix milliseconds. The
    # token is held in adapter memory, zeroized on drop, and reused for every admitted
    # operation of the adapter process while now is before expires_at_ms; at or after
    # it, the next admitted operation runs the plugin again. Absent expirationTimestamp
    # means the token is used for the one operation that ran the plugin and is not
    # reused. The token is deliberately not a field: it is never written to disk,
    # never part of a configuration, a description, a log or an error, and never a
    # value this model types.
  - name: connectors_kubernetes.exec_credentials.ExecPluginRefusal
    kind: enum
    variants: [digest_mismatch, plugin_unavailable, kubeconfig_mismatch, timeout, output_too_large, malformed_credential, plugin_failed]
    # The native refusals of one run, and the private-protocol failure each maps to.
    # digest_mismatch: the plugin's bytes do not hash to sha256; no process starts
    # (invalid_configuration). plugin_unavailable: the path cannot be opened as a
    # regular file (a symbolic link as its final component included), the file is
    # writable by group or others, carries the set-user-ID or set-group-ID bit, or is
    # owned by a user other than root and the adapter's own, or the open descriptor
    # cannot be executed (invalid_configuration).
    # kubeconfig_mismatch: the kubeconfig is unreadable, has no exec block for user,
    # names another command, requests an unknown apiVersion, interactiveMode Always or
    # an env name outside the allow-list (invalid_configuration). timeout: the run did
    # not finish within timeout_ms; its whole process group is killed (timeout).
    # output_too_large: stdout exceeded 65536 bytes; the process group is killed
    # (protocol). malformed_credential: stdout is not an ExecCredential of the
    # requested apiVersion with a token of 1 to 8192 printable ASCII bytes and, if
    # present, a valid RFC 3339 expirationTimestamp (protocol). plugin_failed: the
    # plugin exited non-zero (unavailable). stderr is discarded and never reported.

# ESS-LIMIT: process execution itself is an effect ESS does not express: the digest
# over file bytes, the empty starting environment, the process group kill at the
# deadline, the stdout byte bound, the RFC 3339 grammar and the in-memory-only custody
# of the token. The local composition enforces each, and adapters/kubernetes/tests
# holds one test per property.
