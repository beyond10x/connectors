[package]
name = "connectors-kubernetes"
description = "Kubernetes adapter: resource inventory, endpoint and host discovery, and Helm release reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:connectors-host", "dep:clap", "dep:tokio"]

[[bin]]
name = "connectors-kubernetes"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
connectors-core.workspace = true
connectors-contracts.workspace = true
connectors-sdk.workspace = true
base64.workspace = true
flate2.workspace = true
hex.workspace = true
sha2.workspace = true
connectors-host = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
zeroize.workspace = true
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
connectors-client.workspace = true
reqwest.workspace = true
axum.workspace = true
tempfile.workspace = true
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The exec fixture answers the WebSocket upgrade with the same framing library
# the host uses; it never stands in for the host side under test.
tokio-tungstenite.workspace = true
futures-util.workspace = true
