domain: connectors_docker.mutations
summary: Docker-owned exact container lifecycle intent values.

# Normative owner: adapters/docker/contracts/mutations/v1alpha1/semantics.md §4.1.
types:
  - name: connectors_docker.mutations.ContainerLifecycleAction
    kind: enum
    variants: [start, stop, restart]
  - name: connectors_docker.mutations.ContainerLifecycleIntent
    kind: struct
    fields:
      - {name: instance_ref, type: String}
      - {name: connection_ref, type: String}
      - {name: container_selector, type: String}
      - {name: expected_container_id, type: String}
      - {name: action, type: connectors_docker.mutations.ContainerLifecycleAction}
      - {name: stop_signal, type: "Optional<String>"}
      - {name: stop_timeout_seconds, type: "Optional<Integer>"}
    # Private resolved intent, not a public lifecycle input or provider entity.
    # adapters/docker/contracts/mutations/v1alpha1/semantics.md:15: start omits the
    # stop options; stop/restart carry the fixed admitted signal (nonempty, at most
    # 32 bytes, so at most 32 characters) and a 0..10 second wait.
    invariants:
      - any:
          - not: {action: start}
          - all: [missing(stop_signal), missing(stop_timeout_seconds)]
      - any:
          - {action: start}
          - all: [defined(stop_signal), defined(stop_timeout_seconds)]
      - any:
          - missing(stop_timeout_seconds)
          - stop_timeout_seconds: {gte: 0, lte: 10}
      - any:
          - missing(stop_signal)
          - stop_signal.count: {gte: 1, lte: 32}
    # ESS-LIMIT: daemon binding/identity, full-ID and exact-name constraints,
    # allowlist proof, the ASCII daemon-supported signal vocabulary and original
    # remaining-budget checks read the admitted daemon and configuration; ESS 0.36
    # has no cross-record read in a type invariant, no vocabulary predicate (a character set is expressible with alphabet) and no
    # trusted-time budget construct.
