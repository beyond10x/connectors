[package]
name = "connectors-catalog-provider"
description = "The catalog provider: one verified bundle, a declarative selection of its operations, and one engine that binds, sends and classifies them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:connectors-host", "dep:clap", "dep:tokio"]

[[bin]]
name = "connectors-catalog-provider"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
connectors-core.workspace = true
connectors-sdk.workspace = true
connectors-catalog = { path = "../../crates/connectors-catalog" }
connectors-host = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
base64.workspace = true
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sha2.workspace = true
httpdate = "1.0.3"

[dev-dependencies]
entity-core.workspace = true
entity-eventlog.workspace = true
entity-store.workspace = true
eventlog-core.workspace = true
time.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled"] }
libc = "0.2"
ring = "0.17"
tokio.workspace = true
tempfile.workspace = true
hex.workspace = true
connectors-host.workspace = true
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
