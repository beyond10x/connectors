[package]
name = "connectors-gitlab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:connectors-host", "dep:clap", "dep:tokio"]

[[bin]]
name = "connectors-gitlab"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
gitlab-types = { path = "generated/rust/crates/gitlab-types" }
gitlab_writes-types = { path = "generated/write-rust/crates/gitlab_writes-types" }
connectors-core.workspace = true
connectors-contracts.workspace = true
connectors-sdk.workspace = true
connectors-host = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
time = { version = "0.3", features = ["parsing", "macros"] }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
ring = "0.17"
sha2.workspace = true
hex.workspace = true
rcgen = "0.14"
tokio-rustls = { version="0.26", default-features=false, features=["ring", "tls12"] }
connectors-client.workspace = true
axum.workspace = true
tempfile.workspace = true
