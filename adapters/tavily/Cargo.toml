[package]
name = "connectors-tavily"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:connectors-host", "dep:clap", "dep:tokio"]

[[bin]]
name = "connectors-tavily"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
connectors-core.workspace = true
connectors-contracts.workspace = true
connectors-sdk.workspace = true
connectors-host = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
connectors-host.workspace = true
tokio.workspace = true
