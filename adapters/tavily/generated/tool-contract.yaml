  summary: Search the web for one query; each result is a website with its URL, title, description and, on request, its content.
  guidance: 'max_results is required (1 to 20). content is snippet unless asked: none drops it, full asks for the page text. complete is false and truncation names the cause when fewer results came back than asked, the answer passed 3 MiB or a content was cut at 128 KiB.'
