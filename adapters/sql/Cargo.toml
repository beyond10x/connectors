[package]
name = "connectors-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:connectors-host", "dep:clap"]

[[bin]]
name = "connectors-sql"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
connectors-core.workspace = true
connectors-contracts.workspace = true
connectors-sdk.workspace = true
connectors-host = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
tokio.workspace = true
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
futures-util.workspace = true
bytes = "1"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
connectors-client.workspace = true
tempfile.workspace = true
