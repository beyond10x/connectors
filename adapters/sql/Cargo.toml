[package]
name = "connectors-sql"
description = "SQL adapter (PostgreSQL and MySQL): bounded read-only queries and catalogue reads (databases, tables, columns and keys, indexes)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:connectors-host", "dep:clap"]

[[bin]]
name = "connectors-sql"
path = "src/main.rs"
required-features = ["service"]

[dependencies]
connectors-core.workspace = true
connectors-contracts.workspace = true
connectors-sdk.workspace = true
connectors-host = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
clap = { workspace = true, optional = true }
tokio.workspace = true
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
futures-util.workspace = true
bytes = "1"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64.workspace = true
# MySQL wire binding: rustls on ring only, the Rust flate2 backend, no native-tls/OpenSSL
# and no second async runtime.
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }

[dev-dependencies]
sha2.workspace = true
hex.workspace = true
rcgen = "0.14"
connectors-client.workspace = true
tempfile.workspace = true
connectors-spec = { path = "../../crates/connectors-spec" }
jsonschema.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
