# Owner: story:mcp-inbound-local-binding — the inbound local MCP binding, ../semantics.md §3.5.
# Behaviour: connection and session loss (transport drop)
# Outcome: transport-drop-loses-the-session
# Transition: connectors.sessions.Session.continuity_lost (Ready → Lost)
#
# Compiled supervisor decisions, not an executed trace, and not an MCP message: the
# pinned toolchain "compiles obligations but does NOT execute a sequential trace"
# (ess/domains/sessions.yaml, closing note). Whole-second acts express causal order.
#
# One instance_ref, one connection_ref, one authority_ref, in every trace of this story:
# the single principal contracts/cli/v1alpha1/semantics.md §1 admits. A second value of
# any of them is decision-blocker:mcp-caller-connection-assignment, not this trace.
type: ess-scenario/1
domain: connectors.sessions
scenario: transport-drop-loses-the-session
summary: 'A stdio connection that drops without a graceful close loses the session; nothing afterwards revives it and no in-flight request is resumed or replayed.'
arrange:
- instance: session
  entity: connectors.sessions.Session
timeline:
- at: '2026-09-12T12:00:00Z'
  command: connectors.sessions.OfferSession
  input:
    binding:
      instance_ref: connectors-local
      connection_ref: local-owner
      admitted_revision: config-revision-a
      authority_ref: local-owner-uid
    profile: inbound_offer
    placement: local
    streams:
    - stdio
  outcome: offered
  events:
  - event: connectors.sessions.SessionOffered
  capture:
    instance: session
    event: connectors.sessions.SessionOffered
    field: session_id
- at: '2026-09-12T12:00:01Z'
  command: connectors.sessions.AcceptOffer
  input:
    session_id:
      $instance: session
  outcome: accepted
  events:
  - event: connectors.sessions.OfferAccepted
- at: '2026-09-12T12:00:02Z'
  command: connectors.sessions.EstablishReady
  input:
    session_id:
      $instance: session
    decision: allow
    # Lifetime 2,000 ms: the ceiling contracts/sessions/v1alpha1/semantics.md §4.1 sets on
    # the effective deadline of a data lease, which ess/domains/sessions.yaml repeats as
    # "lease lifetime <= 2000 ms including uncertainty".
    lease:
      issued_at: '2026-09-12T12:00:02Z'
      effective_expiry: '2026-09-12T12:00:04Z'
      sequence: 1
  outcome: ready
  events:
  - event: connectors.sessions.SessionReady
# The pipe breaks mid-exchange: no closed stdin, no EOF handshake, no terminal from the
# caller. The outcome of anything in flight is unknown, which is what Lost records.
- at: '2026-09-12T12:00:03Z'
  command: connectors.sessions.LoseContinuity
  input:
    session_id:
      $instance: session
  outcome: lost
  events:
  - event: connectors.sessions.ContinuityLost
# Nothing resumes a lost stdio connection: in-flight requests "are simply lost"
# (mcp-2026-07-28-basic-transports-stdio.mdx:111-115) and no subscription state survives
# (mcp-2026-07-28-basic-patterns-subscriptions.mdx:159-161).
- at: '2026-09-12T12:00:04Z'
  command: connectors.sessions.PermitData
  input:
    session_id:
      $instance: session
    decision: allow
    direction: output
  outcome: wrong-state
  error:
    name: connectors.sessions.StateConflict
    fields:
      state: Lost
  no_events:
  - connectors.sessions.DataPermitted
  - connectors.sessions.DataLeaseRenewed
  - connectors.sessions.ClosingBegun
  - connectors.sessions.SessionReady
- at: '2026-09-12T12:00:05Z'
  command: connectors.sessions.RenewDataLease
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-12T12:00:05Z'
      effective_expiry: '2026-09-12T12:00:07Z'
      sequence: 2
  outcome: wrong-state
  error:
    name: connectors.sessions.StateConflict
    fields:
      state: Lost
  no_events:
  - connectors.sessions.DataPermitted
  - connectors.sessions.DataLeaseRenewed
  - connectors.sessions.ClosingBegun
  - connectors.sessions.SessionReady
assert:
- view: connectors.sessions.SessionStates
  contains:
    session_id:
      $instance: session
    state: Lost
