# Owner: story:mcp-inbound-local-binding — the inbound local MCP binding, ../semantics.md §3.3.
# Behaviour: progress (lease renewal)
# Outcome: renewed-lease-keeps-a-long-request-ready
# Transition: connectors.sessions.Session.renew (Ready → Ready)
#
# The other route of the same behaviour is progress-stops-at-the-result.yaml, where the
# request finishes inside the lease that admitted it. This one is the request that does
# not: it stays Ready only because the supervisor renews, and the row exists because a
# reader implementing from the enumeration alone would otherwise implement no renewal and
# kill every request that outlives one lease.
#
# Compiled supervisor decisions, not an executed trace, and not an MCP message: the
# pinned toolchain "compiles obligations but does NOT execute a sequential trace"
# (ess/domains/sessions.yaml, closing note). Whole-second acts express causal order.
#
# One instance_ref, one connection_ref, one authority_ref, in every trace of this story:
# the single principal contracts/cli/v1alpha1/semantics.md §1 admits. A second value of
# any of them is decision-blocker:mcp-caller-connection-assignment, not this trace.
type: ess-scenario/1
domain: connectors.sessions
scenario: renewed-lease-keeps-a-long-request-ready
summary: 'A request that outlives the lease admitting it stays Ready only because the supervisor renews before the effective deadline, under its own serialized authority and on no peer message.'
arrange:
- instance: session
  entity: connectors.sessions.Session
timeline:
- at: '2026-09-12T12:00:00Z'
  command: connectors.sessions.OfferSession
  input:
    binding:
      instance_ref: connectors-local
      connection_ref: local-owner
      admitted_revision: config-revision-a
      authority_ref: local-owner-uid
    profile: inbound_offer
    placement: local
    streams:
    - stdio
  outcome: offered
  events:
  - event: connectors.sessions.SessionOffered
  capture:
    instance: session
    event: connectors.sessions.SessionOffered
    field: session_id
- at: '2026-09-12T12:00:01Z'
  command: connectors.sessions.AcceptOffer
  input:
    session_id:
      $instance: session
  outcome: accepted
  events:
  - event: connectors.sessions.OfferAccepted
- at: '2026-09-12T12:00:02Z'
  command: connectors.sessions.EstablishReady
  input:
    session_id:
      $instance: session
    decision: allow
    # Lifetime 2,000 ms: the ceiling contracts/sessions/v1alpha1/semantics.md §4.1 sets on
    # the effective deadline of a data lease, which ess/domains/sessions.yaml repeats as
    # "lease lifetime <= 2000 ms including uncertainty".
    lease:
      issued_at: '2026-09-12T12:00:02Z'
      effective_expiry: '2026-09-12T12:00:04Z'
      sequence: 1
  outcome: ready
  events:
  - event: connectors.sessions.SessionReady
# The request is still running as lease 1 approaches its deadline. The supervisor renews
# strictly before that deadline — 12:00:03, not 12:00:04 — "under the same serialized
# authority check as revocation" and never past an earlier deadline
# (contracts/sessions/v1alpha1/semantics.md §4.1). Nothing the caller sent causes this act:
# a progress notification is outbound data, not a lease input. A renewal arriving at or
# after the expiry could not reopen the session, and the sequence advances, because §4.1
# rejects reordered or replayed authority.
- at: '2026-09-12T12:00:03Z'
  command: connectors.sessions.RenewDataLease
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-12T12:00:03Z'
      effective_expiry: '2026-09-12T12:00:05Z'
      sequence: 2
  outcome: renewed
  events:
  - event: connectors.sessions.DataLeaseRenewed
  no_events:
  - connectors.sessions.ClosingBegun
  - connectors.sessions.DataAuthorityTerminated
  - connectors.sessions.ContinuityLost
# The response goes out under lease 2, strictly inside its window. Had the supervisor not
# renewed, this act could not have been admitted at all: the lease would have expired at
# 12:00:04, which the model records as the terminal lease_expired with no grace after it,
# and the outcome of the request would be unknown.
- at: '2026-09-12T12:00:04Z'
  command: connectors.sessions.PermitData
  input:
    session_id:
      $instance: session
    decision: allow
    direction: output
  outcome: permitted
  events:
  - event: connectors.sessions.DataPermitted
  no_events:
  - connectors.sessions.ClosingBegun
  - connectors.sessions.DataAuthorityTerminated
  - connectors.sessions.ContinuityLost
assert:
- view: connectors.sessions.SessionStates
  contains:
    session_id:
      $instance: session
    state: Ready
