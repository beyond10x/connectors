# Owner: story:mcp-inbound-local-binding — the inbound local MCP binding, ../semantics.md §3.6.
# Behaviour: version and capability mismatch (per-request refusal)
# Outcome: capability-refusal-keeps-the-session-ready
# Transition: connectors.sessions.Session.permit_data (Ready → Ready)
#
# The other route of the same behaviour, the legacy initialize that denies readiness, is
# unsupported-version-denies-readiness.yaml. Both exist because the document describes
# both: on the primary revision a version or capability mismatch is one request's refusal
# and closes nothing, and a table row that named only the connection-level denial left a
# reader implementing this route with nothing that fails.
#
# Compiled supervisor decisions, not an executed trace, and not an MCP message: the
# pinned toolchain "compiles obligations but does NOT execute a sequential trace"
# (ess/domains/sessions.yaml, closing note). Whole-second acts express causal order.
#
# One instance_ref, one connection_ref, one authority_ref, in every trace of this story:
# the single principal contracts/cli/v1alpha1/semantics.md §1 admits. A second value of
# any of them is decision-blocker:mcp-caller-connection-assignment, not this trace.
type: ess-scenario/1
domain: connectors.sessions
scenario: capability-refusal-keeps-the-session-ready
summary: 'A request needing a capability the caller did not declare is refused on the same channel; the connection keeps carrying traffic and the session stays Ready.'
arrange:
- instance: session
  entity: connectors.sessions.Session
timeline:
- at: '2026-09-12T12:00:00Z'
  command: connectors.sessions.OfferSession
  input:
    binding:
      instance_ref: connectors-local
      connection_ref: local-owner
      admitted_revision: config-revision-a
      authority_ref: local-owner-uid
    profile: inbound_offer
    placement: local
    streams:
    - stdio
  outcome: offered
  events:
  - event: connectors.sessions.SessionOffered
  capture:
    instance: session
    event: connectors.sessions.SessionOffered
    field: session_id
- at: '2026-09-12T12:00:01Z'
  command: connectors.sessions.AcceptOffer
  input:
    session_id:
      $instance: session
  outcome: accepted
  events:
  - event: connectors.sessions.OfferAccepted
- at: '2026-09-12T12:00:02Z'
  command: connectors.sessions.EstablishReady
  input:
    session_id:
      $instance: session
    decision: allow
    # Lifetime 2,000 ms: the ceiling contracts/sessions/v1alpha1/semantics.md §4.1 sets on
    # the effective deadline of a data lease, which ess/domains/sessions.yaml repeats as
    # "lease lifetime <= 2000 ms including uncertainty".
    lease:
      issued_at: '2026-09-12T12:00:02Z'
      effective_expiry: '2026-09-12T12:00:04Z'
      sequence: 1
  outcome: ready
  events:
  - event: connectors.sessions.SessionReady
# The refusal itself: MissingRequiredClientCapabilityError, -32021, naming what was missing
# in data.requiredCapabilities (mcp-2026-07-28-basic-index.mdx:387-392). It is written to
# the same shared channel as any other reply, so it is outbound data on a Ready session and
# the supervisor's decision is permit_data — no denial, and no terminal.
- at: '2026-09-12T12:00:03Z'
  command: connectors.sessions.PermitData
  input:
    session_id:
      $instance: session
    decision: allow
    direction: output
  outcome: permitted
  events:
  - event: connectors.sessions.DataPermitted
  no_events:
  - connectors.sessions.ClosingBegun
  - connectors.sessions.DataAuthorityTerminated
  - connectors.sessions.ContinuityLost
# An unrelated request already in flight on the same connection is answered normally: the
# refusal was scoped to one request, because version and capabilities are per-request facts
# on this revision (mcp-2026-07-28-basic-versioning.mdx:12-13).
- at: '2026-09-12T12:00:04Z'
  command: connectors.sessions.PermitData
  input:
    session_id:
      $instance: session
    decision: allow
    direction: output
  outcome: permitted
  events:
  - event: connectors.sessions.DataPermitted
  no_events:
  - connectors.sessions.ClosingBegun
  - connectors.sessions.DataAuthorityTerminated
  - connectors.sessions.ContinuityLost
assert:
- view: connectors.sessions.SessionStates
  contains:
    session_id:
      $instance: session
    state: Ready
