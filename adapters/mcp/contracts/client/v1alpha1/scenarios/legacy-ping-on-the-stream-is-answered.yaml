type: mcp-outbound-lifecycle/1
story: story:mcp-outbound-connection-lifecycle
document: adapters/mcp/contracts/client/v1alpha1/semantics.md
state: state:streaming
outcome: mcp.outbound.legacy-ping-answered
wire_code: n/a
summary: The one server request this revision makes the client answer is answered, and
  a server request of any other kind is a different outcome, not a second half of this
  one.
given:
  - A binding configured for the interoperability revision (2025-11-25), where the server
    MAY send JSON-RPC requests on the response stream before the response
    (mcp-2025-11-25-basic-transports.mdx:121-123).
  - A client that declared no client capability at the handshake, because the selection
    matrix refuses `roots`, `sampling` and `elicitation`.
when:
  - A `ping` request arrives on the stream opened by this client's own request
    (mcp-2025-11-25-basic-utilities-ping.mdx:19-27).
then:
  - An empty result goes back promptly, as a JSON-RPC response in the body of its own
    POST, carrying nothing else (mcp-2025-11-25-basic-utilities-ping.mdx:31-39).
  - The client's own request keeps whatever outcome its own answer produces; answering a
    server is not an answer to it.
never:
  - A server request that is not `ping` reaches this outcome; it is
    `mcp.outbound.legacy-server-request-refused`, which carries a code and names whose
    act it reports.
  - A `ping` is silently dropped, leaving the server waiting for an answer this revision
    says it may expect.
  - The same arrival is answered under the primary revision (2026-07-28), which defines no
    channel for it and refuses it as `mcp.outbound.framing-refused`.
