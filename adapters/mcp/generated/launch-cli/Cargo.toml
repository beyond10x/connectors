[package]
name = "connectors-mcp-launch-cli-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "cli_contract"

[[bin]]
name = "connectors-mcp-launch"
path = "src/main.rs"

[workspace]

[dependencies]
clap = { version = "4", features = ["string"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
rustix = { version = "1", features = ["fs", "process"] }
