domain: connectors_atlassian.documents
summary: Atlassian-owned native document representation and membership vocabulary.

# Normative owner: the native documents profile's semantics.md §§2–7 and the adapter
# design §6.1, both removed and in history at commit 6498a881c. These are private
# selection values.
types:
  - name: connectors_atlassian.documents.DocumentRepresentation
    kind: enum
    # Public spellings: the removed documents profile, semantics.md:12-13 (commit 6498a881c).
    variants:
      - {name: confluence_storage, wire: confluence.storage}
      - {name: jira_fields_v2, wire: jira.fields.v2}
  - name: connectors_atlassian.documents.DocumentScopeKind
    kind: enum
    variants: [confluence_space, jira_project]
  - name: connectors_atlassian.documents.CqlSearchSelection
    kind: struct
    fields:
      - {name: cql, type: String}
      - {name: limit, type: Integer}
      - {name: max_body_bytes, type: Integer}
    # The removed documents profile, semantics.md:190 (commit 6498a881c): limit 1–100.
    invariants:
      - limit: {gte: 1, lte: 100}
  # The Confluence Cloud REST API a catalog read is served from, by the catalog provider id its
  # bundle is built under (docs/catalog-confluence.md). REST v2 is compiled from Atlassian's
  # pinned v2 document (adapters/atlassian/upstream/confluence/); REST v1 from the source
  # document this repository writes itself from Atlassian's public v1 reference pages
  # (adapters/atlassian/contracts/confluence-rest-v1/), because the v1 document declares no
  # licence and is not vendored.
  - name: connectors_atlassian.documents.ConfluenceRestApi
    kind: enum
    variants:
      - {name: rest_v1, wire: confluence-v1}
      - {name: rest_v2, wire: confluence}
  # The reads served under REST v1: the ids of adapters/catalog/providers/confluence-v1/
  # operations.json, each `effect: read`. An id that also exists under REST v2 means the same
  # read there, so a caller's id is the same whichever API serves it; `spaces.list`, `space.get`
  # and `content.search` (CQL search) exist under REST v1 only.
  - name: connectors_atlassian.documents.ConfluenceV1Read
    kind: enum
    variants:
      - {name: content_search, wire: content.search}
      - {name: page_comments, wire: page.comments}
      - {name: page_get, wire: page.get}
      - {name: pages_changed, wire: pages.changed}
      - {name: space_get, wire: space.get}
      - {name: space_pages, wire: space.pages}
      - {name: spaces_list, wire: spaces.list}
  # The reads served under REST v2: the ids of adapters/catalog/providers/confluence/
  # operations.json, each `effect: read`.
  - name: connectors_atlassian.documents.ConfluenceV2Read
    kind: enum
    variants:
      - {name: page_comments, wire: page.comments}
      - {name: page_get, wire: page.get}
      - {name: pages_changed, wire: pages.changed}
      - {name: space_pages, wire: space.pages}

# The public spelling (confluence.storage versus jira.fields.v2) is declared as
# the representation variants' wire names above.
# ESS-LIMIT: profile compatibility, full native payload schemas, scoped collection
# predicates, current canonical identity/membership, query grammar, the 8 KiB CQL
# bound and byte accounting. ESS 0.36 has no cross-record read in a type
# invariant, no grammar/parser construct and no UTF-8 byte-length predicate.
# The removed shared DocumentReadSelection (commit 6498a881c) carried an opaque identifier;
# this vocabulary does not advertise implemented codecs or new declaration fields.
# ESS-LIMIT: the structural CQL grammar and original-span/scope rewriting in
# the removed profile's cql.md (commit 6498a881c), provider field/function interpretation,
# continuation lineage, bounded state and aggregate source/page-result accounting.
# ESS 0.36 has no grammar/rewriting construct and no cross-record accounting.
