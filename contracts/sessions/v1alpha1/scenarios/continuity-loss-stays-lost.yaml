# Compiled supervisor decisions, not executed clocks, media, queues or devices.
# Whole-second acts express causal order; lease/gate observations are trusted inputs.
# Deadline enforcement and first-terminal assignment remain in ../verification.md.
type: ess-scenario/1
domain: connectors.sessions
scenario: continuity-loss-stays-lost
summary: 'F06: restart/loss does not create a replacement lease or synthesize a successful close.'
arrange:
- instance: session
  entity: connectors.sessions.Session
timeline:
- at: '2026-09-08T12:00:00Z'
  command: connectors.sessions.OfferSession
  input:
    binding:
      instance_ref: media-host
      connection_ref: trunk-a
      admitted_revision: revision-a
      authority_ref: authority-a
    profile: outbound
    placement: relay
    streams:
    - audio
  outcome: offered
  events:
  - event: connectors.sessions.SessionOffered
  capture:
    instance: session
    event: connectors.sessions.SessionOffered
    field: session_id
- at: '2026-09-08T12:00:01Z'
  command: connectors.sessions.AcceptOffer
  input:
    session_id:
      $instance: session
  outcome: accepted
  events:
  - event: connectors.sessions.OfferAccepted
- at: '2026-09-08T12:00:02Z'
  command: connectors.sessions.EstablishReady
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-08T12:00:02Z'
      effective_expiry: '2026-09-08T12:00:04Z'
      sequence: 1
  outcome: ready
  events:
  - event: connectors.sessions.SessionReady
- at: '2026-09-08T12:00:03Z'
  command: connectors.sessions.LoseContinuity
  input:
    session_id:
      $instance: session
  outcome: lost
  events:
  - event: connectors.sessions.ContinuityLost
- at: '2026-09-08T12:00:04Z'
  command: connectors.sessions.RenewDataLease
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-08T12:00:04Z'
      effective_expiry: '2026-09-08T12:00:06Z'
      sequence: 2
  outcome: wrong-state
  error:
    name: connectors.sessions.StateConflict
    fields:
      state: Lost
  no_events:
  - connectors.sessions.DataPermitted
  - connectors.sessions.DataLeaseRenewed
  - connectors.sessions.ClosingBegun
  - connectors.sessions.SessionReady
- at: '2026-09-08T12:00:05Z'
  command: connectors.sessions.PermitData
  input:
    session_id:
      $instance: session
    decision: allow
    direction: output
  outcome: wrong-state
  error:
    name: connectors.sessions.StateConflict
    fields:
      state: Lost
  no_events:
  - connectors.sessions.DataPermitted
  - connectors.sessions.DataLeaseRenewed
  - connectors.sessions.ClosingBegun
  - connectors.sessions.SessionReady
assert:
- view: connectors.sessions.SessionStates
  contains:
    session_id:
      $instance: session
    state: Lost
