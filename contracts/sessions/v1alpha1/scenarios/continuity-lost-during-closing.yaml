# Independent-review counterexample repaired: Closing can lose continuity.
# ESS author/synthesize does not execute this trace. See ../verification.md.
type: ess-scenario/1
domain: connectors.sessions
scenario: continuity-lost-during-closing
summary: 'Review B: actual owner/continuity loss during teardown becomes Lost while preserving the first
  terminal.'
arrange:
- instance: session
  entity: connectors.sessions.Session
timeline:
- at: '2026-09-08T12:00:00Z'
  command: connectors.sessions.OfferSession
  input:
    binding:
      instance_ref: media-host
      connection_ref: trunk-a
      admitted_revision: revision-a
      authority_ref: authority-a
    profile: outbound
    placement: local
    streams:
    - audio
  outcome: offered
  events:
  - event: connectors.sessions.SessionOffered
  capture:
    instance: session
    event: connectors.sessions.SessionOffered
    field: session_id
- at: '2026-09-08T12:00:01Z'
  command: connectors.sessions.AcceptOffer
  input:
    session_id:
      $instance: session
  outcome: accepted
  events:
  - event: connectors.sessions.OfferAccepted
- at: '2026-09-08T12:00:02Z'
  command: connectors.sessions.EstablishReady
  input:
    session_id:
      $instance: session
    decision: allow
    lease:
      issued_at: '2026-09-08T12:00:02Z'
      effective_expiry: '2026-09-08T12:00:04Z'
      sequence: 1
  outcome: ready
  events:
  - event: connectors.sessions.SessionReady
- at: '2026-09-08T12:00:03Z'
  command: connectors.sessions.BeginClose
  input:
    session_id:
      $instance: session
    terminal:
      reason: remote_hangup
      by: adapter
      accepted_at: '2026-09-08T12:00:03Z'
    cutoff_due_at: '2026-09-08T12:00:04Z'
    teardown_due_at: '2026-09-08T12:00:08Z'
  outcome: closing
  events:
  - event: connectors.sessions.ClosingBegun
- at: '2026-09-08T12:00:04Z'
  command: connectors.sessions.LoseContinuity
  input:
    session_id:
      $instance: session
  outcome: lost
  events:
  - event: connectors.sessions.ContinuityLost
- at: '2026-09-08T12:00:05Z'
  command: connectors.sessions.FinishTeardown
  input:
    session_id:
      $instance: session
    decision: released
    peer_shutdown: unconfirmed
  outcome: wrong-state
  error:
    name: connectors.sessions.StateConflict
    fields:
      state: Lost
  no_events:
  - connectors.sessions.LocalResourcesReleased
assert:
- view: connectors.sessions.SessionStates
  contains:
    session_id:
      $instance: session
    state: Lost
