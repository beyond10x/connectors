# A container holds more unseen items than one page's limit: two items share an instant, the
# first read returns one, then a new item arrives and the returned one changes, so three changes
# wait behind the kept watermark and each resumed read is bounded to one. Reading page by page
# with each returned watermark returns all three. A binding whose watermark passes an item no
# page returned (the last one the provider answered rather than the last one the page carried)
# loses it. See ../semantics.md, Watermarks and delivery.
type: ess-scenario/1
domain: connectors.feed
scenario: more-unseen-than-limit
summary: Page-by-page resumed reads bounded by limit return every waiting change, and the watermark never passes one.
timeline:
- at: '2026-10-06T09:00:00Z'
  command: connectors.feed.AddContainer
  input:
    container_id: team-room
    connection_ref: workspace-a
    name: Team room
    kind: channel
    visibility: public
  outcome: added
  events:
  - event: connectors.feed.ContainerAdded
- at: '2026-10-06T09:00:01Z'
  command: connectors.feed.AddItem
  input:
    item_id: item-1
    container_id: team-room
    revision: r1
    created_at: '2026-10-06T09:00:01Z'
  outcome: added
  events:
  - event: connectors.feed.ItemAdded
- at: '2026-10-06T09:00:02Z'
  command: connectors.feed.AddItem
  input:
    item_id: item-2
    container_id: team-room
    revision: r1
    created_at: '2026-10-06T09:00:01Z'
  outcome: added
  events:
  - event: connectors.feed.ItemAdded
- at: '2026-10-06T09:00:03Z'
  command: connectors.feed.ReadItems
  input:
    container_id: team-room
    limit: 1
  outcome: read
- at: '2026-10-06T09:00:04Z'
  command: connectors.feed.AddItem
  input:
    item_id: item-3
    container_id: team-room
    revision: r1
    created_at: '2026-10-06T09:00:04Z'
  outcome: added
  events:
  - event: connectors.feed.ItemAdded
- at: '2026-10-06T09:00:05Z'
  command: connectors.feed.ReviseItem
  input:
    item_id: item-1
    revision: r2
    updated_at: '2026-10-06T09:00:05Z'
  outcome: revised
  events:
  - event: connectors.feed.ItemRevised
    payload:
      revision: r2
- at: '2026-10-06T09:00:06Z'
  command: connectors.feed.ReadItems
  input:
    container_id: team-room
    watermark: w-kept
    limit: 1
  outcome: read
- at: '2026-10-06T09:00:07Z'
  command: connectors.feed.ReadItems
  input:
    container_id: team-room
    watermark: w-kept
    limit: 1
  outcome: read
- at: '2026-10-06T09:00:08Z'
  command: connectors.feed.ReadItems
  input:
    container_id: team-room
    watermark: w-kept
    limit: 1
  outcome: read
assert:
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  contains:
    item_id: item-2
    container_id: team-room
    revision: r1
    state: Present
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  contains:
    item_id: item-3
    container_id: team-room
    revision: r1
    state: Present
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  contains:
    item_id: item-1
    container_id: team-room
    revision: r2
    state: Present
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  excludes:
    item_id: item-1
    revision: r1
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  counts:
    at_least: 3
    at_most: 3
