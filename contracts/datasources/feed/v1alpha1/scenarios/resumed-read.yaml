# A resumed read returns the item changed since the first read under a new revision,
# and the item added since. The watermark is opaque and the model cannot carry the
# value a read returned into the next read, so `w-after-first-read` stands for it;
# the resume rule itself is a binding obligation. See ../semantics.md, Revisions and
# Watermarks and delivery.
type: ess-scenario/1
domain: connectors.feed
scenario: resumed-read
summary: A resumed read returns a changed item under a new revision and a new item.
timeline:
- at: '2026-10-06T09:00:00Z'
  command: connectors.feed.AddContainer
  input:
    container_id: team-room
    connection_ref: workspace-a
    name: Team room
    kind: channel
    visibility: public
  outcome: added
  events:
  - event: connectors.feed.ContainerAdded
- at: '2026-10-06T09:00:01Z'
  command: connectors.feed.AddItem
  input:
    item_id: item-1
    container_id: team-room
    revision: r1
    created_at: '2026-10-06T09:00:01Z'
  outcome: added
  events:
  - event: connectors.feed.ItemAdded
- at: '2026-10-06T09:00:02Z'
  command: connectors.feed.ReadItems
  input:
    container_id: team-room
    limit: 10
  outcome: read
- at: '2026-10-06T09:00:03Z'
  command: connectors.feed.ReviseItem
  input:
    item_id: item-1
    revision: r2
    updated_at: '2026-10-06T09:00:03Z'
  outcome: revised
  events:
  - event: connectors.feed.ItemRevised
    payload:
      revision: r2
- at: '2026-10-06T09:00:04Z'
  command: connectors.feed.AddItem
  input:
    item_id: item-3
    container_id: team-room
    revision: r1
    created_at: '2026-10-06T09:00:04Z'
  outcome: added
  events:
  - event: connectors.feed.ItemAdded
- at: '2026-10-06T09:00:05Z'
  command: connectors.feed.ReadItems
  input:
    container_id: team-room
    watermark: w-after-first-read
    limit: 10
  outcome: read
assert:
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  contains:
    item_id: item-1
    container_id: team-room
    revision: r2
    state: Present
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  excludes:
    item_id: item-1
    revision: r1
- view: connectors.feed.ContainerItems
  params:
    container_id: team-room
  contains:
    item_id: item-3
    container_id: team-room
    revision: r1
    state: Present
