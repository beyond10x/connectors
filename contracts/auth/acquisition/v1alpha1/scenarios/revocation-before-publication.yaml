# Ledger expectations only: trusted decisions stand for the atomic host checks.
# ESS compiles these assertions; it does not execute concurrency, clock or I/O.
type: ess-scenario/1
domain: connectors.refresh
scenario: revocation-before-publication
summary: 'F04: the trusted publication transaction observes revocation, refuses and discards the candidate.'
arrange:
- instance: refresh
  entity: connectors.refresh.RefreshAttempt
timeline:
- command: connectors.refresh.ReserveRefresh
  input:
    decision: allow
    source_generation_id: 10000000-0000-4000-8000-000000000001
    owner: replica-a
    ownership_token: 20000000-0000-4000-8000-000000000001
    expected_binding_revision: binding-1
  outcome: reserved
  events:
  - event: connectors.refresh.RefreshReserved
  capture:
    instance: refresh
    event: connectors.refresh.RefreshReserved
    field: attempt_id
  at: '2026-09-08T10:00:00Z'
- command: connectors.refresh.AuthorizeExchange
  input:
    decision: allow
    attempt_id:
      $instance: refresh
    owner: replica-a
    ownership_token: 20000000-0000-4000-8000-000000000001
  outcome: authorized
  events:
  - event: connectors.refresh.ExchangeAuthorized
  at: '2026-09-08T10:00:01Z'
- command: connectors.refresh.StoreResponse
  input:
    decision: allow
    attempt_id:
      $instance: refresh
    owner: replica-a
    ownership_token: 20000000-0000-4000-8000-000000000001
    candidate_generation_id: 10000000-0000-4000-8000-000000000002
  outcome: stored
  events:
  - event: connectors.refresh.RefreshResponseStored
  at: '2026-09-08T10:00:02Z'
- command: connectors.refresh.PublishRefresh
  input:
    decision: publication_refused
    attempt_id:
      $instance: refresh
    owner: replica-a
    ownership_token: 20000000-0000-4000-8000-000000000001
    candidate_generation_id: 10000000-0000-4000-8000-000000000002
  outcome: publication-refused
  error:
    name: connectors.refresh.PublicationRefused
    fields:
      reason: revoked
  no_events:
  - connectors.refresh.RefreshPublished
  at: '2026-09-08T10:00:03Z'
- command: connectors.refresh.DiscardCandidate
  input:
    attempt_id:
      $instance: refresh
  outcome: discarded
  events:
  - event: connectors.refresh.RefreshCandidateDiscarded
  at: '2026-09-08T10:00:04Z'
- command: connectors.refresh.ReserveRefresh
  input:
    decision: source_unavailable
    source_generation_id: 10000000-0000-4000-8000-000000000001
    owner: replica-b
    ownership_token: 20000000-0000-4000-8000-000000000002
    expected_binding_revision: binding-1
  outcome: source-unavailable
  error:
    name: connectors.refresh.SourceUnavailable
    fields:
      reason: revoked
  no_events:
  - connectors.refresh.RefreshReserved
  at: '2026-09-08T10:00:05Z'
assert:
- view: connectors.refresh.RefreshStates
  contains:
    attempt_id:
      $instance: refresh
    state: Discarded
