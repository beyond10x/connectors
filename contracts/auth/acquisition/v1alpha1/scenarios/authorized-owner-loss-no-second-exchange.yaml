type: ess-scenario/1
domain: connectors.refresh
scenario: authorized-owner-loss-no-second-exchange
summary: "F04: owner loss after authorization cannot authorize another rotating-token exchange."

# Compilation checks ledger expectations, not a crashed process or network send.
arrange:
  - {instance: refresh, entity: connectors.refresh.RefreshAttempt}
timeline:
  - at: 2026-09-08T10:00:00Z
    command: connectors.refresh.ReserveRefresh
    input:
      decision: allow
      source_generation_id: 10000000-0000-4000-8000-000000000001
      owner: replica-a
      ownership_token: 20000000-0000-4000-8000-000000000001
      expected_binding_revision: binding-1
    outcome: reserved
    events:
      - {event: connectors.refresh.RefreshReserved}
    capture: {instance: refresh, event: connectors.refresh.RefreshReserved, field: attempt_id}
  - at: 2026-09-08T10:00:01Z
    command: connectors.refresh.AuthorizeExchange
    input:
      decision: allow
      attempt_id: {$instance: refresh}
      owner: replica-a
      ownership_token: 20000000-0000-4000-8000-000000000001
    outcome: authorized
    events:
      - {event: connectors.refresh.ExchangeAuthorized}
  - at: 2026-09-08T10:00:02Z
    command: connectors.refresh.QuarantineRefresh
    input: {attempt_id: {$instance: refresh}}
    outcome: uncertain
    events:
      - {event: connectors.refresh.RefreshUncertain}
  - at: 2026-09-08T10:00:03Z
    command: connectors.refresh.AuthorizeExchange
    input:
      decision: allow
      attempt_id: {$instance: refresh}
      owner: replica-b
      ownership_token: 20000000-0000-4000-8000-000000000002
    outcome: wrong-state
    error:
      name: connectors.refresh.RefreshStateConflict
      fields: {state: Uncertain}
    no_events: [connectors.refresh.ExchangeAuthorized]
  - at: 2026-09-08T10:00:04Z
    command: connectors.refresh.ReserveRefresh
    input:
      decision: source_unavailable
      source_generation_id: 10000000-0000-4000-8000-000000000001
      owner: replica-b
      ownership_token: 20000000-0000-4000-8000-000000000002
      expected_binding_revision: binding-1
    outcome: source-unavailable
    error:
      name: connectors.refresh.SourceUnavailable
      fields: {reason: exchange_already_authorized}
    no_events: [connectors.refresh.RefreshReserved]
assert:
  - view: connectors.refresh.RefreshStates
    contains: {attempt_id: {$instance: refresh}, state: Uncertain}
