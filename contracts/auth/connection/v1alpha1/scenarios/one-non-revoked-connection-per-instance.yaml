# Ledger expectations only: the trusted owner's read of the instance's Live or
# Stale connection, inside the allocating transaction, is the
# held_connection_ref input. See ess/domains/auth_bindings.yaml
# AllocateConnection.
type: ess-scenario/1
domain: connectors.auth_bindings
scenario: one-non-revoked-connection-per-instance
summary: 'An instance holding a Live or Stale connection refuses a second allocation; once that connection is revoked, a new one is allocated.'
arrange:
- instance: first
  entity: connectors.auth_bindings.Connection
- instance: second
  entity: connectors.auth_bindings.Connection
timeline:
- at: '2026-10-16T10:00:00Z'
  command: connectors.auth_bindings.AllocateConnection
  input:
    decision: allow
    instance_id: gmail.private
    profile_record_ref: catalog/google.oauth/r1
    owner_scope: local
    access_mode: credential
    publication_fence: fence-1
  outcome: allocated
  events:
  - event: connectors.auth_bindings.ConnectionAllocated
  capture:
    instance: first
    event: connectors.auth_bindings.ConnectionAllocated
    field: connection_ref
- at: '2026-10-16T10:00:01Z'
  command: connectors.auth_bindings.AllocateConnection
  input:
    decision: allow
    instance_id: gmail.private
    profile_record_ref: catalog/google.oauth/r1
    owner_scope: local
    access_mode: credential
    publication_fence: fence-2
    held_connection_ref:
      $instance: first
  outcome: instance-connected
  error:
    name: connectors.auth_bindings.InstanceConnected
  no_events:
  - connectors.auth_bindings.ConnectionAllocated
- at: '2026-10-16T10:00:02Z'
  command: connectors.auth_bindings.MarkConnectionStale
  input:
    connection_ref:
      $instance: first
  outcome: marked-stale
  events:
  - event: connectors.auth_bindings.ConnectionMarkedStale
- at: '2026-10-16T10:00:03Z'
  command: connectors.auth_bindings.AllocateConnection
  input:
    decision: allow
    instance_id: gmail.private
    profile_record_ref: catalog/google.oauth/r1
    owner_scope: local
    access_mode: credential
    publication_fence: fence-3
    held_connection_ref:
      $instance: first
  outcome: instance-connected
  error:
    name: connectors.auth_bindings.InstanceConnected
  no_events:
  - connectors.auth_bindings.ConnectionAllocated
- at: '2026-10-16T10:00:04Z'
  command: connectors.auth_bindings.RevokeConnection
  input:
    decision: allow
    connection_ref:
      $instance: first
  outcome: revoked
  events:
  - event: connectors.auth_bindings.ConnectionRevoked
- at: '2026-10-16T10:00:05Z'
  command: connectors.auth_bindings.AllocateConnection
  input:
    decision: allow
    instance_id: gmail.private
    profile_record_ref: catalog/google.oauth/r1
    owner_scope: local
    access_mode: credential
    publication_fence: fence-4
  outcome: allocated
  events:
  - event: connectors.auth_bindings.ConnectionAllocated
  capture:
    instance: second
    event: connectors.auth_bindings.ConnectionAllocated
    field: connection_ref
assert:
- view: connectors.auth_bindings.Connections
  contains:
    connection_ref:
      $instance: first
    instance_id: gmail.private
    state: Revoked
- view: connectors.auth_bindings.Connections
  contains:
    connection_ref:
      $instance: second
    instance_id: gmail.private
    state: Live
- view: connectors.auth_bindings.Connections
  counts: {at_most: 2}
