# Compiled ledger expectations only; clock, authority and atomic-index guarantees
# require host tests in ../idempotency-verification.md.
type: ess-scenario/1
domain: connectors.idempotency
scenario: idempotency-aborted-result
summary: 'F02: a proved Aborted attempt retains its not-attempted result without reopening dispatch.'
arrange:
- instance: first-attempt
  entity: connectors.mutations.AttemptRecord
- instance: first-reservation
  entity: connectors.idempotency.KeyReservation
timeline:
- at: '2026-09-08T09:00:00Z'
  command: connectors.mutations.PrepareAttempt
  input:
    instance_id: test-instance
    request_id: idempotency-aborted-result-first
    operation_id: jira.issue.create
    connection_ref: test-connection
    input_digest: test-digest
    approval_mode: not_required
    approval_ref: null
    idempotency_key: create-1
  outcome: prepared
  events:
  - event: connectors.mutations.AttemptPrepared
  capture:
    instance: first-attempt
    event: connectors.mutations.AttemptPrepared
    field: attempt_id
- at: '2026-09-08T09:00:01Z'
  command: connectors.idempotency.ReserveKey
  input:
    namespace:
      receiver_instance: test-instance
      authority:
        tenant: tenant-a
        realm: null
        caller: alice
        executor: alice
      origin:
        kind: direct
        authority_ref: test-instance
    caller_key: create-1
    fingerprint:
      operation_ref: test-instance/jira.issue.create
      connection_ref: test-connection
      connection_revision: connection-r1
      contract_ref: operations/v1alpha1
      profile: mutation
      descriptor_revision: descriptor-r1
      configuration_revision: config-r1
      route: null
      canonicalization_version: adapter-v1-canonical-json
      input_digest: test-digest
    attempt_id:
      $instance: first-attempt
  outcome: reserved
  events:
  - event: connectors.idempotency.KeyReserved
  capture:
    instance: first-reservation
    event: connectors.idempotency.KeyReserved
    field: reservation_id
- at: '2026-09-08T09:00:02Z'
  command: connectors.mutations.AbortPrepared
  input:
    attempt_id:
      $instance: first-attempt
  outcome: aborted
  events:
  - event: connectors.mutations.AttemptAborted
- at: '2026-09-08T09:00:03Z'
  command: connectors.idempotency.RetainResult
  input:
    reservation_id:
      $instance: first-reservation
    settled_at: '2026-09-08T09:00:02Z'
    replay_expires_at: '2026-09-09T09:00:02Z'
  outcome: retained
  events:
  - event: connectors.idempotency.ResultRetained
assert:
- view: connectors.idempotency.ReservationStates
  contains:
    reservation_id:
      $instance: first-reservation
    namespace:
      receiver_instance: test-instance
      authority:
        tenant: tenant-a
        realm: null
        caller: alice
        executor: alice
      origin:
        kind: direct
        authority_ref: test-instance
    caller_key: create-1
    state: Replayable
- view: connectors.mutations.AttemptStates
  contains:
    attempt_id:
      $instance: first-attempt
    state: Aborted
