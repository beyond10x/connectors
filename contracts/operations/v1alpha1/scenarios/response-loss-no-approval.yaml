type: ess-scenario/1
domain: connectors.mutations
scenario: response-loss-no-approval
summary: "F01: response loss remains unknown when there was no approval to spend."

# These are ledger command expectations. The named crash/deadline/provider event
# is not injected by ESS authoring; the host obligation is in ../verification.md.
arrange:
  - instance: attempt
    entity: connectors.mutations.AttemptRecord

timeline:
  - at: 2026-09-08T09:00:00Z
    command: connectors.mutations.PrepareAttempt
    input:
      instance_id: test-instance
      request_id: response-loss-no-approval
      operation_id: issue.create
      connection_ref: test-connection
      input_digest: test-digest
      approval_mode: not_required
      approval_ref: null
      idempotency_key: null
      request_fingerprint:
        operation_ref: '["connectors.operation/v1","test-instance","test-adapter","issue.create"]'
        connection_ref: test-connection
        connection_revision: connection-r1
        contract_ref: operations/v1alpha1
        profile: mutation
        descriptor_revision: descriptor-r1
        configuration_revision: config-r1
        canonicalization_version: adapter-v1-canonical-json
        input_digest: test-digest
        route: null
      owner_nonce: 8098cc79-4e2b-522d-80ff-4495309845b3
      publication_fence: 5fb7c2fc-0e11-5590-a795-57d97d866df7
    outcome: prepared
    events:
      - event: connectors.mutations.AttemptPrepared
        payload: {approval_mode: not_required}
    capture: {instance: attempt, event: connectors.mutations.AttemptPrepared, field: attempt_id}

  - at: 2026-09-08T09:00:01Z
    command: connectors.mutations.OpenDispatch
    input:
      attempt_id: {$instance: attempt}
    outcome: opened
    events:
      - event: connectors.mutations.DispatchOpened

  - at: 2026-09-08T09:00:02Z
    command: connectors.mutations.RecordUncertainty
    input:
      attempt_id: {$instance: attempt}
      terminal_result_json: '{"kind":"failure","error":{"code":"outcome_unknown"}}'
    outcome: indeterminate
    events:
      - event: connectors.mutations.AttemptIndeterminate

assert:
  - view: connectors.mutations.AttemptStates
    contains:
      attempt_id: {$instance: attempt}
      approval_mode: not_required
      state: Indeterminate
